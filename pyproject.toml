[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raptor"
version = "0.1.0"
description = "RAPTOR: TSC1/TSC2 variant curation pipeline (KB schema & provenance ledger, PRD-03)."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "bioutils>=0.6.0",
    "pysam>=0.22",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "hypothesis>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "requires_reference: tests requiring real SeqRepo/chr16 reference data (e.g. AC3 genomic)",
    "requires_uta: tests requiring UTA transcript projection DB (e.g. AC3 c./p.)",
    "blocked_ac1: BLOCKED: AC1 accuracy tests waiting for oracle pre-registered thresholds"
]
