go_no_go:
  pacbio_fastq_download: NO_GO
  reason: >-
    The immutable V1 archive already carries a one-to-one hgvs_p to hgvs_c and
    genomic-coordinate crosswalk for the frozen score variants. The two PacBio
    FASTQ files are never downloaded, imported or referenced by this slice.

