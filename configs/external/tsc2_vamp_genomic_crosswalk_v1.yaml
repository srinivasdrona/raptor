archive_table_contract:
  delimiter: tab
  required_columns:
    - ID
    - Gene
    - Chrom
    - STRAND
    - hg38_start
    - hg38_end
    - ref_allele
    - alt_allele
    - hgvs_c
    - hgvs_p
    - Ref_seq_transcript_ID
    - Ensembl_transcript_ID
  required_values:
    Gene: TSC2
    Chrom: '16'
    Ref_seq_transcript_ID: NM_000548.5
    Ensembl_transcript_ID: ENST00000219476.9

score_table_contract:
  header: [variant, score, standard_error, rep1, rep2, rep3, functional_class]

rate_limits_retries:
  min_interval_seconds: 1.0
  timeout_seconds:
    connect: 10
    read: 120
  retry_policy:
    retryable_http: [408, 429, 500, 502, 503, 504]
    non_retryable_http: [400, 401, 403, 404, 422]
    max_attempts_per_request: 4
    backoff_base_seconds: 2.0
    backoff_cap_seconds: 60.0

outputs:
  external_bundle:
    environment_variable: RAPTOR_TSC2_VAMP_CROSSWALK_ROOT
    default_root: ~/raptor-data/external/tsc2-vamp-crosswalk
    run_name: tsc2-vamp-genomic-crosswalk-2026-09-12
    bundle_id: tsc2-vamp-genomic-crosswalk-2026-09-12
    manifest_filename: bundle_manifest.json
    artifacts:
      raw_archive:
        artifact_id: raw-archive
        relative_path: raw/FowlerLab-TSC2_analysis-V1.zip
      crosswalk_jsonl:
        artifact_id: crosswalk-jsonl
        relative_path: crosswalk/igvf_vamp_seq_genomic_crosswalk.jsonl
        schema: raptor.external.vamp_genomic_crosswalk_row.v1
  committed_summary:
    path: data/census/tsc2_vamp_genomic_crosswalk_2026-09-12.json
    schema: raptor.external.vamp_genomic_crosswalk_summary.v1
    boundaries:
      clinical_use: forbidden
      evidence_strength_use: forbidden

expected_pilot:
  total_score_rows: 9253
  archive_crosswalk_rows: 9107
  status_counts:
    CROSSWALK_SPDI_VERIFIED: 9050
    SOURCE_COORDINATE_CDNA_LENGTH_MISMATCH: 57
    SOURCE_COORDINATE_REFERENCE_MISMATCH: 0
