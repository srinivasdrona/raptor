# PRD-04 Task A production candidate-direction policy (FR5). Loaded by
# `raptor.packet.config.load_candidate_direction_policy`; strict schema --
# exactly these eight top-level keys, no more, no less.
#
# Decision D (policy-blocker join of A+B+C): `criterion_strength_points` is
# now populated over the derived candidate_set = eval automatable_criteria
# (post-lineage-correction) minus deferred BS2 (B) minus FORBIDDEN_CRITERIA
# minus unruled-transitive requires_heldout_mask criteria (PS1/PM1/PM5/PP2/
# BP1) -- i.e. {PVS1, PM2, PM4, BA1, BS1, BP3, BP7}. PP3/BP4 were removed
# 2026-07 (docs/DECISIONS.md#adr-0012-pp3bp4-disabled-manual-policy): the
# approved disabled/manual policy (configs/eval/bp4pp3_predictor_policy.json,
# docs/project/specs/pp3bp4-disabled-manual-policy.yaml, decision D13) defers
# PP3/BP4 in the BIAS lineage (configs/eval/bias_lineage.yaml), so they leave
# eval automatable_criteria and therefore this derived candidate_set;
# candidate-direction scoring must not use disabled criteria.
# resolve_packet_policy_disposition (src/raptor/packet/model.py) maps their
# deferred/deferred lineage disposition to DEFERRED (manual context, never
# scored) with no packet source-code change. TSC1/TSC2 MANE .5 / SPDI scope
# (C) and NTHL1 exclusion are enforced upstream (ingest/scorer), not by an
# extra schema key here.
#
# The policy is still UNAPPROVED: no candidate-direction review
# recommendation may be released before expert sign-off. An unapproved
# policy always resolves to `candidate_direction=null`,
# `null_reason=production_policy_unapproved`, and `ReviewState.POLICY_BLOCKED`
# (never a silent classification, never the eval-only Tavtigian combiner) --
# pinning the contents is safe precisely because the approval gate is off.
# `candidate_lp_min`/`candidate_lb_max` stay null: a future approved policy
# must derive and pin them independently from the eval Tavtigian cutoffs;
# this task does not invent them.
