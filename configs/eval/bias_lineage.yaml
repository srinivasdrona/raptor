# PRD-08 Task C / ADR-0009 — BIAS criterion lineage policy (bias-lineage slot 2).
#
# Single machine-readable source of truth for: (a) which of the 28 canonical
# ACMG-2015 codes the pinned BIAS-3.0.0 engine can actually emit a non-zero
# score for ("can_fire", statically derived from the `get_*` classifier
# bodies — never from census incidence or RAPTOR's own included/automatable
# config), (b) the 9 codes that are BIAS-internal stubs and can never fire
# from BIAS's own evaluators ("structurally_forbidden"), (c) the data-lineage
# classification + validation/production disposition of every can-fire
# criterion, and (d) the version-pinned ClinVar-marker vocabulary used only
# as an ADVISORY corroboration signal (`detection_source`), never as lineage
# or disposition authority.
#
# ARM'S-LENGTH BOUNDARY (ADR-0007, non-negotiable): this file carries only
# lineage FACTS and source CITATIONS (file · symbol · lines) about the
# pinned BIAS-2015 (AGPL) source at commit `ade13f206f3e2c2efe3ec92715d974645fc8da8f`.
# It never copies BIAS source text, never imports `bias_2015`, and never
# opens a label/benchmark/held-out file. The census
# (`data/census/tsc_vus_clinvar_2026-07-07_stats.json`) is incidence
# ANNOTATION ONLY and is not read by this file or its loader.

bias_version: "3.0.0"
bias_commit: "ade13f206f3e2c2efe3ec92715d974645fc8da8f"

# Exhaustive, fail-closed taxonomy of data-lineage classes (§0.6). Any
# `lineage_class` value outside this enum must raise at load time.
lineage_classes:
  - label_independent_population
  - label_independent_reference_or_predictor
  - same_variant_clinvar
  - cross_variant_clinvar
  - aggregate_clinvar
  - literature_unvalidated
  - manual_or_external_input
  - unknown

# Exhaustive, fail-closed disposition enum (§1.1). `deferred` always
# requires a named `decision_dependency` on the owning record (§1.2).
dispositions:
  - allowed
  - requires_heldout_mask
  - forbidden
  - deferred

# All 28 canonical ACMG-2015 rationale slots BIAS always emits (§0.1).
all_criteria:
  - PVS1
  - PS1
  - PS2
  - PS3
  - PS4
  - PM1
  - PM2
  - PM3
  - PM4
  - PM5
  - PM6
  - PP1
  - PP2
  - PP3
  - PP4
  - PP5
  - BA1
  - BS1
  - BS2
  - BS3
  - BS4
  - BP1
  - BP2
  - BP3
  - BP4
  - BP5
  - BP6
  - BP7

# Criteria whose BIAS-3.0.0 evaluator can return a non-zero score (§0.2) --
# the static can-fire oracle. 19 codes. NOT RAPTOR's registry, NOT the
# census fired-set (13); those are reconciled against this, never used to
# derive it.
can_fire:
  - PVS1
  - PS1
  - PS3
  - PS4
  - PM1
  - PM2
  - PM4
  - PM5
  - PP2
  - PP3
  - PP5
  - BA1
  - BS1
  - BS2
  - BP1
  - BP3
  - BP4
  - BP6
  - BP7

# BIAS-internal stubs (§0.3): the `get_*` evaluator body unconditionally
# returns `(0, "")`. These 9 codes can never fire from BIAS's own internal
# evaluators; a non-zero firing can only arrive via the external
# supplemental-call injection path, which is fail-closed (never a no-op).
structurally_forbidden:
  - criterion: PS2
    reason: "BIAS-internal stub -- get_ps2 unconditionally returns (0, ''); only a supplemental external call could ever set it, which is fail-closed, not silently impossible."
    bias_anchor: "pathogenic_classifiers.get_ps2 (L198)"
  - criterion: PM3
    reason: "BIAS-internal stub -- get_pm3 unconditionally returns (0, '')."
    bias_anchor: "pathogenic_classifiers.get_pm3 (L501)"
  - criterion: PM6
    reason: "BIAS-internal stub -- get_pm6 unconditionally returns (0, '')."
    bias_anchor: "pathogenic_classifiers.get_pm6 (L689)"
  - criterion: PP1
    reason: "BIAS-internal stub -- get_pp1 unconditionally returns (0, '')."
    bias_anchor: "pathogenic_classifiers.get_pp1 (L759)"
  - criterion: PP4
    reason: "BIAS-internal stub -- get_pp4 unconditionally returns (0, '')."
    bias_anchor: "pathogenic_classifiers.get_pp4 (L968)"
  - criterion: BS3
    reason: "BIAS-internal stub -- get_bs3 unconditionally returns (0, ''); phantom in RAPTOR's pre-correction included_criteria/acmg_criteria registry (D2)."
    bias_anchor: "benign_classifiers.get_bs3 (L178)"
  - criterion: BS4
    reason: "BIAS-internal stub -- get_bs4 unconditionally returns (0, ''); phantom in RAPTOR's pre-correction included_criteria/acmg_criteria registry (D2)."
    bias_anchor: "benign_classifiers.get_bs4 (L189)"
  - criterion: BP2
    reason: "BIAS-internal stub -- get_bp2 unconditionally returns (0, '')."
    bias_anchor: "benign_classifiers.get_bp2 (L270)"
  - criterion: BP5
    reason: "BIAS-internal stub -- get_bp5 unconditionally returns (0, '')."
    bias_anchor: "benign_classifiers.get_bp5 (L518)"

# Version-pinned (bias_version 3.0.0) ClinVar-marker vocabulary -- the
# SINGLE source of truth (there is no separate `clinvar_markers.yaml`).
# Case-insensitive, bounded literal phrases only -- no regex/wildcard.
# `detection_source` (lineage_audit.py) is ADVISORY: a match here can only
# raise suspicion, never clear a statically-suspect criterion (BP1 has no
# marker and still blocks via the transitive_suspect net).
markers:
  - "clinvar"
  - "vcv"
  - "clinvar pathogenic rate"
  - "clinvar benign rate"
  - "independent clinvar submitters"

# Fail-closed net: every can-fire criterion whose lineage_class is
# cross_variant_clinvar or aggregate_clinvar (derived; must match the
# records below exactly, or the registry check raises `transitive_set_drift`).
# Includes BP1 -- its rationale text carries no ClinVar marker, so only
# this static net (not marker-scanning) catches it (D3).
transitive_suspect:
  - PS1
  - PM5
  - PM1
  - PP2
  - BP1

# No Oracle-authorized exceptions yet. Must never contain a wildcard.
oracle_allowed: []

# One record per can-fire criterion (exactly the 19 of `can_fire`).
records:
  PVS1:
    lineage_class: label_independent_reference_or_predictor
    source_dependencies:
      direct: ["gnomAD LOEUF", "VEP/Nirvana consequence", "ABSplice PVS1_PP3_BP4_BP7_splice_dict"]
      transitive: []
    bias_anchors: ["pathogenic_classifiers.get_pvs (L6-114)"]
    data_artifacts: ["find_lof_genes.py"]
    validation_disposition: allowed
    production_disposition: allowed
    rationale_markers: []
    notes: "Null-variant / LOF prediction -- gnomAD constraint + consequence + splice predictor, no ClinVar dependency."
    decision_dependency: ""
  PS1:
    lineage_class: cross_variant_clinvar
    source_dependencies:
      direct: []
      transitive: ["PS1_gene_mut_to_data (ClinVar Nirvana JSON)"]
    bias_anchors: ["pathogenic_classifiers.get_ps1 (L146-196)"]
    data_artifacts: ["generate_pathogenic_aa_list.py"]
    validation_disposition: requires_heldout_mask
    production_disposition: allowed
    rationale_markers: []
    notes: "Same amino-acid change previously reported pathogenic -- comparator built from ClinVar; rationale phrasing may lack a literal marker token (AA-change phrasing)."
    decision_dependency: ""
  PS3:
    lineage_class: literature_unvalidated
    source_dependencies:
      direct: ["AVADA full-text ML extraction (~50% precision noted in source)"]
      transitive: []
    bias_anchors: ["pathogenic_classifiers.get_ps3 (L213-268)"]
    data_artifacts: ["extract_from_avada_track.py"]
    validation_disposition: deferred
    production_disposition: deferred
    rationale_markers: []
