# PRD-06 sec 10.2 — v1 eval-harness config for TSC2 (v1 scope). This is
# POLICY + PINS for the eval-only implied-direction combiner and the gate --
# it does not compute ACMG criteria (that's PRD-01/BIAS-2015) and it does
# not set pass/fail targets (those are Oracle pre-registered, GP-3).
#
# `oracle_thresholds` below is INTENTIONALLY EMPTY. Per GP-9/H13 no target
# is invented in advance -- until the Oracle pre-registers thresholds here,
# `raptor.eval.gate.decide_gate` MUST return `UNVERIFIED`, never `PASS`
# (AC5). This is by design, not an omission (PRD-06 sec 7/dependencies).

# FR3: which of the scorer's automatable criteria feed the eval-only
# implied-direction combiner (`combine.implied_direction`). Mirrors the
# automatable set from `configs/acmg/tsc.yaml` (`included_criteria`), minus
# PP5/BP6/PS4 (R-A2 direct-copy circularity: criteria derived from a variant's
# OWN ClinVar assertion must not feed a combiner graded against ClinVar-derived
# labels). PS4 excluded per Oracle decision (BIAS-3.0.0 derives it from ClinVar
# submitter counts when no GWAS data exists). Transitive-ClinVar criteria
# (PS1/PM5/PM1/PP2/BP1) remain scored here pending the full-held-out audit
# ruling, but are `requires_heldout_mask` in the bias-lineage validation
# policy (configs/eval/bias_lineage.yaml) -- the lineage audit
# (raptor.eval.lineage_audit) fail-closed-blocks any run that scores them
# against the ClinVar-labelled benchmark. BS3/BS4 (bias-lineage audit D2)
# were REMOVED -- BIAS-3.0.0 internal stubs that can never fire (phantom
# automation); PS3/BS2 (the can-fire criteria the scorer's `acmg_criteria`
# registry now carries) stay NOT automated -- both are `deferred` in the
# lineage policy (PS3: assay-validity review; BS2: decision_dependency
# `bs2-policy`).
automatable_criteria:
  - PVS1
  - PS1
  - PM1
  - PM2
  - PM4
  - PM5
  - PP2
  - PP3
  - BA1
  - BS1
  - BP1
  - BP3
  - BP4
  - BP7

# Tavtigian-2018 point system (an INDEPENDENT published rule set, not
# self-derived -- AC1 tests reproduce it exactly, sec 10.5).
tavtigian_points:
  supporting: 1
  moderate: 2
  strong: 4
  very_strong: 8
  stand_alone: 8

# Tavtigian-2018 category cutoffs on the signed point sum (`confirm` vs the
# published paper before a real-corpus run, sec 9; pinned here as config,
# not code, so the doer/checker never hardcode a value).
tavtigian_cutoffs:
  pathogenic_min: 10        # points >= 10 -> Pathogenic
  likely_pathogenic_min: 6  # 6 <= points < 10 -> Likely Pathogenic
  vus_min: 0                # 0 <= points <= vus_max -> VUS / no_call
  vus_max: 5
  likely_benign_max: -1     # benign_max < points <= -1 -> Likely Benign
  benign_max: -7            # points <= -7 -> Benign

# FR5/EVAL_PLAN sec 2: a stratum's per-truth-class held-out count below this
# is reported descriptive-only + CI, never gating. Set to the CORRECTED
# EVAL_RUBRIC power floor -- 0.90 precision at a 95% CI lower bound
# (exact Clopper-Pearson, `scipy.stats.beta.ppf`) needs >=36 zero-error
# held-out calls (LB(35,35)=0.899968 < 0.90 <= LB(36,36)=0.902606). Below
# this a stratum reads UNDERPOWERED (FR5).
min_count_per_class: 36

# FR2: deterministic no-leakage split. Pinned seed + fraction (R-A11).
# holdout=0.7: RAPTOR Tier-1/2 is a DETERMINISTIC rule engine (it learns nothing
# from the benchmark), so a large held-out does not starve any training -- the
# 30% reserve is only a development/sanity set. 0.7 puts ~51 known pathogenic
# missense in held-out (>=36), powering the 0.90 missense bar (EVAL_RUBRIC §3a).
split:
  seed: 20260701
  holdout_fraction: 0.7

# FR6/AC5/GP-9/H13: pre-registered BLIND to held-out results (no BIAS/Nirvana
# scores exist yet -- Track B is not run), by the domain owner (@dronasrinivas)
# per EVAL_RUBRIC §3/§5. Gate-fidelity (Arm C, BREAKING nested-schema
# migration): `oracle_thresholds` is now `{confidence, strata: {name: {precision,
# recall, gating, directions}}}` -- the flat `{precision, recall}` map is
# removed; the gate now compares the 95% Clopper-Pearson LOWER bound (never the
# point estimate) against these values. VALUE-PRESERVING migration -- neither
# stratum's pinned precision/recall changed:
#   missense (binding, both directions):
#     precision >= 0.90  -> ACMG/AMP PP3/BP4-grade correctness, both directions
#                           (Richards 2015; Pejaver 2022 calibrated evidence).
#     recall    >= 0.85  -> clinical sensitivity floor (InterVar/CardioClassifier
#                           missense sensitivity band).
#   truncating (secondary, hard-gated, pathogenic direction only -- benign n=1
#   is report-only and never gates): precision/recall >= 0.95 (IARC); already
#   >=210 held-out and not the binding constraint.
# These values are LOCKED once merged; changing them post-hoc breaks
# pre-registration (R-A2) -- `load_config` rejects any per-stratum value that
# differs from the pinned value below.
oracle_thresholds:
  confidence: 0.95
  strata:
    missense:
      precision: 0.90
      recall: 0.85
      gating: true
      directions: [pathogenic, benign]
    truncating:
      precision: 0.95
      recall: 0.95
      gating: true
      directions: [pathogenic]

# v2 scope-specific authorization gate (NEW, additive, preregistered BEFORE
# the corrected rerun, blind to it -- R-A2; docs/DECISIONS.md ADR-0011,
# docs/reference/scope-authorization-preregistration-2026-07.md). Separate
# REPORTING was already preregistered above (strata + directions +
# thresholds); this block adds the separate AUTHORIZATION rule the v1 gate
# lacked (v1 `decide_gate` hardcodes `_GATING_STRATUM="missense"` as the
# sole binding stratum for `vus_authorized`). It changes NO threshold value
# and authorizes NO clinical action, VUS worklist, or ClinVar submission.
# `full_spectrum.requires` is semantics-locked (anti-cherry-pick, R-A2) --
# `load_config` rejects any deviation from this exact pinned set. This
# block is NEVER applied to relabel the 2026-07-13 v1 run
# (data/census/tsc_masked_holdout_gate_2026-07-13.json stays schema v1).
scope_authorization:
  schema_version: 2
  # Mandatory, separate, non-blank disclaimer (kept OUT of the exact
  # governance statements below, which stay verbatim -- never merged).
  research_use_disclaimer: "Research-evidence validation only; this authorizes no clinical classification, VUS worklist, or ClinVar submission."
  full_spectrum:
    # Full-spectrum VUS authorization requires EVERY scope below to be VALIDATED.
    requires: ["missense:pathogenic", "missense:benign", "truncating:pathogenic"]
  research_scopes:
    truncating_pathogenic_research_scope_validated:
      requires: ["truncating:pathogenic"]
  governance_statements:
    FULL_SPECTRUM: "All pre-registered research scopes are validated for research-evidence use only; this authorizes no clinical classification, VUS worklist, or ClinVar submission."
    TRUNCATING_PATHOGENIC_ONLY: "Full-spectrum VUS automation is not authorized. Evidence supports only the validated truncating-pathogenic scope; missense remains unvalidated."
    NONE_VALIDATED: "Full-spectrum VUS automation is not authorized; no pre-registered research scope is currently validated."

# FR1/GP-9: the labels snapshot this benchmark is frozen against (R-A11).
# Pinned ClinVar variant_summary.txt.gz snapshot:
#   date   : 2026-07-07 (NCBI weekly release)
#   md5    : bd3720834b62733a6a1c81d7e1eef941  (NCBI-published, verified on download)
#   sha256 : 5fe4fe10783391d01dc414dc5583a3e63487b67f8cd3c8429d59227cd5f4f37f
# The benchmark-freeze script (scripts/build_tsc_benchmark.py) verifies the raw
