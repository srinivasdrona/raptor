# Immutable evidence that the masked held-out run occurred, independent of
# whether the 58.7-GB x64 bundle exists today.
historical_run_attestation:
  claim: >-
    The masked BIAS held-out run occurred and its outputs are immutable
    evidence currently present on ARM. Policy-only reuse relies on this
    evidence, not on the 58.7-GB x64 bundle still existing today.
  proven_by:
    - 'RETURN_MANIFEST.sha256.txt (5efdccdc...) lists every return-file hash'
    - 'ARM copies match those listed hashes byte-for-byte (skip_list bb418c11, BP1 274ab0ce, PM1 ce9ee18d, PP2 43f6002d, PS1/PM5 f17b19e6, masked-paths 6c05b8c3, bias TSV 7eece438, report e5351a42)'
    - 'provenance.json vcf_hash 4dcba7c8 and manifest_hash 9e588cdf are internally consistent'
  hashes:
    input_vcf_sha256: '4dcba7c882b65838cedf8ce0ad56e0f7764df34b247ab412aac144d4027c622d'
    provenance_sha256: '63f1881287f1e3aa0b36ca14e1a7329ef2bcacc7b9674c2489f5e1d4352a6ac8'
    provenance_manifest_hash: '9e588cdf8ebaea2e3793e0ea74721ab5283b57c2abf045dbf3070cb6e81ec9e4'
    provenance_vcf_hash: '4dcba7c882b65838cedf8ce0ad56e0f7764df34b247ab412aac144d4027c622d'
    return_manifest_sha256: '5efdccdc57f7d2bdf774486dfbde106ab173bf87412c6db103aaba9958d9ac91'
    scoring_report_sha256: 'e5351a42e3120083d21d6b82775a38aee2a5d9bcf8586da08b3b239f24c35b3c'
    bias_tsv_sha256: '7eece438a880e0c6a591df62e231bc93848eeb42277a2f4360983914298fc512'
    heldout_nirvana_json_sha256: '315e601cc9ede55c07c4a59de796c2be5cf0f2827e441101ceea236390675d13'
  independent_of: current_x64_reannotation_readiness

# Required only for the X64_REANNOTATE route. Contains only reannotation
# proof requirements and requirement-id references — no historical hashes.
current_x64_reannotation_readiness:
  required_only_for: X64_REANNOTATE
  status: UNVERIFIED
  x64_requirement_ids:
    - heldout_nirvana_json
    - nirvana_data_root
    - bias_data_root
    - nirvana_full_manifest
    - nirvana_updates_manifest
    - bias_data_manifest
  presence_proof_when_needed:
    - recompute file-by-file SHA256 over nirvana-data\GRCh38, SupplementaryAnnotation\GRCh38 and bias-hg38-data; diff vs the three frozen CHECKSUMS manifests
    - spot-verify anchors (Nirvana.dat, Both.transcripts.ndb, gnomAD_4.0.nsa, ClinVar_hg38_2026-02.nsa, AlphaMissense_hg38.nirvana.nsa)
    - verify archives (Nirvana, .NET runtime) and the BIAS commit
    - confirm footprint approx 58,690,294,121 bytes and free disk on the worker
    - confirm the annotator header re-emits dataVersion 91.27.66 / schema 6 / all 28 sources
  boundary_rule: do not download or rebuild the 58.7-GB bundle on ARM64.

pp3_bp4_suppression_prerequisite:
  id: PP3_BP4_SUPPRESSION_CONTRACT_REQUIRED
  finding: >-
    The existing runner has no implemented PP3/BP4 disabled/manual
    suppression path. It hard-forbids {PP5, BP6, PS4} at config-load and
    combine time, and the masked run only added a PM1 batch-scope skip;
    non-approved policy is hard-blocked. Reuse of the disabled/manual TSV
    cannot be declared safe today.
  evidence:
    - 'src/raptor/eval/config.py:187 FORBIDDEN_CRITERIA = {PP5, BP6, PS4}'
    - 'src/raptor/eval/config.py:197 VALID_CRITERIA = 28 canonical ACMG codes; config-load + combine validation'
    - 'masked run evaluation_skip_list = {PM1, PS4, PP5, BP6} = forbidden set + PM1 batch waiver'
  requirement: >-
    The downstream resolve-pp3-bp4-activation / rerun task must implement and
    test an explicit PP3/BP4 suppression contract (disabled/manual applied as
    a downstream policy recompute) before any reuse of the immutable TSV.
  until_then: BLOCKED_POLICY_IMPLEMENTATION

reuse_vs_reannotate:
  principle: >-
    Comparison reruns preserve the historical bundle. Policy-only reuse is
    allowed only when no upstream evidence-generation input changed AND a
    tested PP3/BP4 suppression contract exists. Neither route is selected
    here.
  reuse_path:
    name: POLICY_ONLY_REUSE
    relies_on: historical_run_attestation
    input_preconditions_all_required:
      - 'input VCF == 4dcba7c8... (frozen)'
      - 'masked required-paths == 6c05b8c3... ; skip_list == bb418c11...'
      - 'masked resources unchanged (PS1/PM5 f17b19e6, PP2 43f6002d, BP1 274ab0ce, PM1 ce9ee18d)'
      - 'Nirvana 3.18.1 / data 91.27.66 / schema 6 and BIAS 3.0.0 @ ade13f2 unchanged'
      - 'PP3/BP4 outcome in {disabled, manual} and adds no new scoring input'
    policy_precondition: PP3_BP4_SUPPRESSION_CONTRACT_REQUIRED is implemented and tested
    current_route: BLOCKED_POLICY_IMPLEMENTATION
  reannotate_path:
    name: X64_REANNOTATE
    relies_on: current_x64_reannotation_readiness
    trigger_any:
      - input VCF/ID-set differs from the frozen 2,577-row set
      - any of the 28 data-source versions changes (any forbidden upgrade applied)
      - BIAS version/commit or bias data bundle changes
      - masked required-paths JSON or skip-list changes
      - PP3/BP4 activation needs a structured input absent from the held-out JSON
      - a structured recompute is needed but the held-out Nirvana JSON is unverifiable
  decision_table:
    - {upstream_inputs: unchanged, pp3_bp4: disabled_or_manual, suppression_contract: absent, route: BLOCKED_POLICY_IMPLEMENTATION}
    - {upstream_inputs: unchanged, pp3_bp4: disabled_or_manual, suppression_contract: implemented_tested, route: POLICY_ONLY_REUSE}
    - {upstream_inputs: unchanged, pp3_bp4: activate, new_scoring_input: true, route: X64_REANNOTATE}
    - {upstream_inputs: changed, pp3_bp4: any, route: X64_REANNOTATE}
    - {upstream_inputs: unknown_or_unverifiable, pp3_bp4: any, route: BLOCKED_DATA_until_x64_verifies}

licensing:
  model: fail_closed
  historical_execution_observed: true
  channels:
    local_execution_status: pending_permitted_use_review
    raw_public_redistribution: false
    raw_cloud_egress: false
  downstream_use_rule: >-
    Raw predictor scores (REVEL, AlphaMissense) must not be used by any
    downstream policy or runner beyond the existing historical artifacts
    unless an owner permitted-use record clears them; local status remains
    pending_permitted_use_review until then.
  cloud_egress_rule: >-
    REVEL and AlphaMissense raw scores must not enter any cloud egress
    (including Anthropic prompts) while local status is
    pending_permitted_use_review; default is deny.
  per_source:
    revel:
      local_status: pending_permitted_use_review
      raw_public_redistribution: false
      raw_cloud_egress: false
    alphamissense:
      local_status: pending_permitted_use_review
      raw_public_redistribution: false
      raw_cloud_egress: false
      licence_version: confirm_pending

deferred_upgrades:
  out_of_scope_until_a_separate_approved_refresh:
