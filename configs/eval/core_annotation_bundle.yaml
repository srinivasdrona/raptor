# RAPTOR core annotation bundle — canonical runtime manifest.
#
# This is the Sonnet-authored machine-readable manifest implementing the
# planner spec docs/project/specs/core-annotation-bundle.yaml (rev 5,
# commit f9276b4). It is distinct from the planner spec: it carries its own
# schema id and its own artifact status, and it is closed (no keys outside
# the set below).
#
# Purpose: pin the EXACT deployed Nirvana 3.18.1 / BIAS 3.0.0 annotation
# bundle used for the masked held-out rerun as immutable historical evidence.
# This manifest does not download, refresh, re-annotate or activate anything;
# it records what was deployed and what is verified present on ARM today.

