smallest_pin_handoff:
  next_task_id: sources-pin-core-annotation-bundle
  rule: The next task pins ONE annotation bundle and only the fields needed to decide/operate the primary
    policy. No integration of all 16 tools.
  priority:
  - Exact REVEL field/release required by the current shadow policy (CP-21).
  - Other eligible candidate fields already present in the same licensed bundle.
  - Transcript/provenance/dependence columns.
  explicit_non_requirements:
  - mutpred2_integration
  - evolutionary_action_integration
  - all_16_score_acquisition
  related_track: Splice tier hands off to sources-add-splice-track.
  invariant: The comprehensive matrix stays at 16 calibrated rows even when the pinned bundle implements
    a smaller score subset.
