# pp3bp4-predictor-matrix/1
# Canonical machine matrix for the bounded PP3/BP4 predictor decision support (Sonnet Slot 3).
# Sole machine source of truth for the comprehensive 16+bias_composite decision matrix.
# Does not change configs/eval/pp3bp4_source_register.yaml, configs/eval/predictor_training_manifests.yaml,
# or configs/eval/pp3bp4_candidate_policy.json (all remain byte-identical / REVEL shadow-policy scoped).
# REVEL remains the sole advance_shadow candidate; this file advances no other predictor.
# tool_kind pinned by candidate_identity.tool_kind_map; field CPs/source_ids follow field_cp_semantics
# (rev 4): CP-20 only for the six training-overlap tools; CP-21 only for REVEL's own release pin;
# licences/non-REVEL pins/standalone acquisitions carry empty source_ids with a naming CP.

schema: pp3bp4-predictor-matrix/1
version: 1
source_map:
  pejaver_2022:
    citation: Pejaver V, Byrne AB, Feng BJ, et al. Calibration of computational tools for missense variant
      pathogenicity classification and ClinGen recommendations for PP3/BP4 criteria. AJHG 2022;109:2163-2177.
    doi: 10.1016/j.ajhg.2022.10.013
    pmid: '36413997'
    pmc: PMC9748256
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9748256/
    loci:
      methods: 13-tool calibrated set; higher-is-pathogenic direction transforms for FATHMM and SIFT;
        dbNSFP score acquisition; training-overlap exclusions; REVEL/BayesDel named as meta-predictors.
      table_2: Calibrated PP3/BP4 score intervals; the REVEL row is the only fully-verified multi-level
        interval set.
      supplement: 'Supplementary materials: exact independently-generated tool versions; the calibrated
        PhyloP column; the evaluated PrimateAI release; and the dbNSFP release/columns used for dbNSFP-obtained
        tools (resolves CP-9/CP-14/CP-15/CP-23).'
  bergquist_2025:
    citation: Bergquist T, Pejaver V, et al. Calibration of additional computational tools expands ClinGen
      recommendation options for variant classification with PP3/BP4 criteria. Genetics in Medicine 2025.
    doi: 10.1016/j.gim.2025.101402
    pmid: '40084623'
    preprint_doi: 10.1101/2024.09.17.611902
    pmc: confirm_pending (CP-8)
    url: https://www.biorxiv.org/content/10.1101/2024.09.17.611902v1
    loci:
      table_1: AlphaMissense, ESM1b, VARITY_R calibration conclusions; exact numeric intervals remain
        confirm_pending until Table 1 is read directly (CP-5/CP-6/CP-7).
      methods_data_availability: 'Methods and Data Availability: exact evaluated releases for AlphaMissense
        (CP-10), ESM1b (CP-22), and VARITY_R (CP-11).'
  stenton_2024:
    citation: Stenton SL, Pejaver V, Harrison SM, et al. Assessment of the evidence yield for the calibrated
      PP3/BP4 computational recommendations. Genetics in Medicine 2024.
    pmid: '39030733'
    pmc: PMC11560577
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11560577/
    loci:
      box_1: One preselected predictor, no cherry-picking, established thresholds; combined PP3+PM1 capped
        at Strong.
  richards_2015:
    citation: Richards S, Aziz N, Bale S, et al. Standards and guidelines for the interpretation of sequence
      variants (ACMG/AMP). Genetics in Medicine 2015.
    doi: 10.1038/gim.2015.30
    pmid: '25741868'
    pmc: PMC4544753
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4544753/
    loci:
      pp3_bp4: PP3/BP4 computational-evidence criteria; correlated-tool (apply once per variant) rule.
  tavtigian_2018:
    citation: Tavtigian SV, et al. Modeling the ACMG/AMP variant classification guidelines as a Bayesian
      classification framework. Genetics in Medicine 2018.
    doi: 10.1038/gim.2017.210
    url: https://doi.org/10.1038/gim.2017.210
    loci:
      model: Bayesian evidence-strength ladder (supporting/moderate/strong/very-strong).
  dbnsfp_v4:
    citation: Liu X, Li C, Mou C, Dong Y, Tu Y. dbNSFP v4. Genome Medicine 2020;12:103.
    url: https://sites.google.com/site/jpopgen/dbNSFP
    loci:
      distribution_metadata: 'Official dbNSFP distribution page (https://sites.google.com/site/jpopgen/dbNSFP):
        per-release download/file listing, the release column/field inventory (README/''column description''),
        and the academic-vs-commercial licence-separated branches. Used only to locate candidate score
        fields, their availability, and licence terms; it does not pin a release. The exact RAPTOR release
        remains confirm_pending (CP-21).'
    role: 'Distribution/availability reference only (not a calibration source). The exact RAPTOR-pinned
      release/column/licence branch remain confirm_pending: current_release_pin (CP-21), availability
      (CP-12/CP-13/CP-25), licences (CP-16..CP-19/CP-24).'
confirm_pending_register:
  CP-1: BayesDel-noAF intervals -> pejaver_2022 table_2
  CP-2: MutPred2 intervals -> pejaver_2022 table_2
  CP-3: VEST4 intervals -> pejaver_2022 table_2
  CP-4: Intervals/maxima for CADD, EA, FATHMM, GERP++, MPC, PhyloP, PolyPhen-2 HumVar, PrimateAI, SIFT
    -> pejaver_2022 table_2
  CP-5: AlphaMissense intervals -> bergquist_2025 table_1
  CP-6: ESM1b intervals -> bergquist_2025 table_1
  CP-7: VARITY_R intervals -> bergquist_2025 table_1
  CP-8: Bergquist 2025 PMCID -> PubMed/PMC
  CP-9: Exact independently-generated tool versions Pejaver evaluated (BayesDel-noAF, CADD, EA, MutPred2,
    PolyPhen-2 HumVar) -> pejaver_2022 supplement
  CP-10: AlphaMissense release evaluated by Bergquist -> bergquist_2025 methods_data_availability
  CP-11: VARITY_R release evaluated by Bergquist -> bergquist_2025 methods_data_availability
  CP-12: ESM1b availability in the selected dbNSFP branch -> selected dbNSFP release README (dbnsfp_v4
    distribution_metadata)
  CP-13: VARITY_R availability in the selected dbNSFP branch -> selected dbNSFP release README (dbnsfp_v4
    distribution_metadata)
  CP-14: Exact PhyloP column calibrated by Pejaver -> pejaver_2022 supplement
  CP-15: Exact PrimateAI release evaluated by Pejaver -> pejaver_2022 supplement
  CP-16: Official MPC licence -> official MPC distribution source
  CP-17: Official GERP++ licence -> official GERP++ distribution source
  CP-18: Official PhyloP/PHAST licence -> official PHAST distribution source
  CP-19: Official Evolutionary Action licence -> official EA distribution source
  CP-20: Training overlap vs the TSC benchmark -- APPLIES ONLY to CADD, EA, MPC, PhyloP, GERP++, PrimateAI
    -> verified training manifests + leakage audit. No other candidate may carry CP-20.
  CP-21: REVEL/dbNSFP release to pin for RAPTOR -- APPLIES ONLY to REVEL current_release_pin_status ->
    sources-pin-core-annotation-bundle. Must NOT ground any licence, implementation cost, non-REVEL acquisition,
    or any other candidate's release.
  CP-22: Exact ESM1b evaluated release -> bergquist_2025 methods_data_availability (dedicated release
    CP; NOT the ESM1b interval CP-6)
  CP-23: Exact dbNSFP release/columns Pejaver evaluated for dbNSFP-obtained tools (REVEL, FATHMM, GERP++,
    MPC, SIFT, VEST4) -> pejaver_2022 supplement/methods
  CP-24: Official licence for candidates not covered by CP-16..CP-19 (REVEL, BayesDel-noAF, MutPred2,
    VEST4, AlphaMissense, ESM1b, VARITY_R, CADD, FATHMM, PolyPhen-2 HumVar, PrimateAI, SIFT) -> each tool's
    official distribution/terms; never upgraded to verified
  CP-25: Availability of dbNSFP-bundled candidate scores in the selected dbNSFP release/branch (bundled
    route) -> selected dbNSFP release README/column inventory (dbnsfp_v4 distribution_metadata)
  CP-26: Standalone MutPred2 score acquisition (separately generated; NOT dbNSFP-bundled) -> official
    MutPred2 distribution
  CP-27: Standalone Evolutionary Action score acquisition (separately generated; NOT dbNSFP-bundled) ->
    official Evolutionary Action distribution
  CP-28: Annotation-bundle RAPTOR release pin for NON-REVEL calibrated candidates -> sources-pin-core-annotation-bundle
    (distinct from CP-21)
