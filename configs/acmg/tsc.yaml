# PRD-01 sec 10.3 — v1 ACMG scorer policy + pins for TSC2 (v1 scope; TSC1 is
# a fast-follow, sec 10.6). This is POLICY + PINS, not re-derived ACMG
# thresholds (ADR-0007/0008): BIAS-2015 owns the thresholds; this file only
# says which of BIAS's fired criteria RAPTOR emits as KB evidence and how
# BIAS's strength ints normalize into RAPTOR's KB vocabulary.
#
# Pins marked `confirm` below are not yet locked against a real BIAS-2015
# release/data snapshot (sec 9) -- they do not block the offline build
# (sec 10.6), but MUST be confirmed before a real-corpus run (GP-9).

bias_version: "confirm-pending-bias-release"   # confirm: pin the exact BIAS-2015 release RAPTOR wraps
bias_data_version: "confirm-pending-bias-data" # confirm: pin BIAS's own reference-data snapshot version

# FR7/AC7: which of BIAS's automatable criteria (of the 19-of-28, sec 1)
# RAPTOR actually emits as KB evidence. Default = all automatable EXCEPT
# PP5/BP6/PS4 (R-A2 circularity policy, sec 10.3): all are ClinVar-classification
# -derived, and the frozen benchmark (EVAL_PLAN sec 2) uses ClinVar-derived
# labels -- emitting them as evidence risks grading against an answer key
# RAPTOR partly copied. `parse.py` still parses PP5/BP6 faithfully (the
# oracle fixture expects that); only this policy list decides emission.
included_criteria:
  - PVS1
  - PS1
  - PM1
  - PM2
  - PM4
  - PM5
  - PP2
  - BA1
  - BS1
  - BP1
  - BP3
  - BP7
  # PP3/BP4 removed 2026-07 (docs/DECISIONS.md#adr-0012-pp3bp4-disabled-manual-policy):
  # the approved disabled/manual policy (configs/eval/bp4pp3_predictor_policy.json,
  # docs/project/specs/pp3bp4-disabled-manual-policy.yaml) suppresses automated
  # PP3/BP4 emission pending a future activation decision
  # (decision_dependency `bp4pp3-predictor-policy`). Vocabulary is retained --
  # both codes stay in `acmg_criteria` below -- only automation is disabled;
  # see configs/eval/bias_lineage.yaml (validation/production_disposition ->
  # deferred) for the data-lineage side of this change.
  # Deliberately NOT included by default: PP5, BP6, PS4 (R-A2 direct-copy
  # circularity -- all derive from the variant's OWN ClinVar assertion; PS4
  # via BIAS-3.0.0's ClinVar-submitter fallback). Oracle decision 2026-07.
  # BS3/BS4 (bias-lineage audit D2) were REMOVED -- they are BIAS-3.0.0
  # internal stubs (`get_bs3`/`get_bs4` unconditionally return `(0, "")`,
  # configs/eval/bias_lineage.yaml::structurally_forbidden) and can never
  # fire; they were phantom automation. PS3/BS2 (the can-fire criteria the
  # registry below now carries instead) remain NOT included -- both are
  # `deferred` in the lineage policy (PS3: assay-validity review; BS2:
  # decision_dependency `bs2-policy`).

# BIAS fired-strength-int -> RAPTOR KB strength vocab (PRD-01 sec 10.3).
# This is the generic BIAS<->RAPTOR strength-int convention (1..5), not a
# per-criterion or per-variant mapping.
strength_map:
  "1": supporting
  "2": moderate
  "3": strong
  "4": very_strong
  "5": stand_alone

# Generic ACMG rule vocabulary (criterion -> direction + allowed KB
# strengths): registers `evidence_kinds` at `run_scorer` setup (FR9/AC7).
# The registry equals the pinned BIAS-3.0.0 static can-fire set EXACTLY
# (configs/eval/bias_lineage.yaml::can_fire, 19 codes) -- registry presence
# is NOT inclusion. PS3/BS2 (bias-lineage audit D1/D2 correction) replace
# the phantom BS3/BS4 stub entries (BIAS-internal stubs that can never
# fire) so this registry stops omitting two real can-fire criteria while
# stopping claiming two BIAS can never emit; neither PS3 nor BS2 is added
# to `included_criteria` above -- both stay `deferred` in the lineage
# policy (PS3: assay-validity review; BS2: decision_dependency `bs2-policy`).
acmg_criteria:
  PVS1: {direction: pathogenic, strength_vocab: [very_strong, strong, moderate, supporting]}
  PS1:  {direction: pathogenic, strength_vocab: [strong]}
  PS3:  {direction: pathogenic, strength_vocab: [strong, moderate, supporting]}
  PS4:  {direction: pathogenic, strength_vocab: [strong, moderate, supporting]}
  PM1:  {direction: pathogenic, strength_vocab: [moderate, supporting]}
  PM2:  {direction: pathogenic, strength_vocab: [moderate, supporting]}
  PM4:  {direction: pathogenic, strength_vocab: [moderate]}
  PM5:  {direction: pathogenic, strength_vocab: [strong, moderate]}
  PP2:  {direction: pathogenic, strength_vocab: [supporting]}
  PP3:  {direction: pathogenic, strength_vocab: [strong, moderate, supporting]}
  PP5:  {direction: pathogenic, strength_vocab: [strong, moderate, supporting]}
  BA1:  {direction: benign, strength_vocab: [stand_alone]}
  BS1:  {direction: benign, strength_vocab: [strong, moderate]}
  BS2:  {direction: benign, strength_vocab: [strong, moderate]}
  BP1:  {direction: benign, strength_vocab: [supporting]}
  BP3:  {direction: benign, strength_vocab: [supporting]}
  BP4:  {direction: benign, strength_vocab: [supporting]}
  BP6:  {direction: benign, strength_vocab: [stand_alone, strong, moderate, supporting]}
  BP7:  {direction: benign, strength_vocab: [supporting]}

# FR8/R-A3 edge-case routing predicates (the "edge_cases.yaml" policy keys,
# sec 10.3) -- each overrides a BIAS auto-score with a manual-review
# routing (never a silent auto-score, AC5). Implemented generically in
# `policy.check_edge_cases`, gated purely by these flags + the record's own
# fields (never a fixture-specific literal).
edge_cases:
  pvs1_terminal_exon: true
  non_mane_transcript: true
  splice_region: true
  mosaicism: true

# v1 scope: TSC1 + TSC2 (policy-blocker C: TSC1 added to scorer scope,
# reconciled against BIAS's raw .4 emission via canonical genomic SPDI --
# see transcript_reconcile.reconcile_transcript_identity /
# policy.check_edge_cases's non_mane_transcript refinement).
genes:
  TSC1: NM_000368.5   # confirm .version against the locked MANE Select release (matches configs/ingest/tsc.yaml)
  TSC2: NM_000548.5   # confirm .version against the locked MANE Select release (matches configs/ingest/tsc.yaml)

# R-B2/AC7: every predictor field RAPTOR's evidence provenance touches is
# tagged to the ARCHITECTURE sec 8 licensing matrix (single source of
# truth) -- this is the per-field tag, not a re-statement of the matrix.
licensing:
  revel: non-commercial
  cadd: non-commercial
  splice_ai: non-commercial
  alpha_missense: non-commercial
  gnomad: open
