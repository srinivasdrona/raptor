registrar_role: independent protocol planner (blinded to candidate discovery output)
registration_class: post_discovery_pre_selection
is_preregistration: false
first_selection_run_executed: false
registration_class_note: >-
  Candidate discovery ran BEFORE this protocol was written. This is a post-discovery,
  pre-selection registered protocol and must never be described as a preregistration.
  The protocol names no candidate, reports no candidate count and states no result.
citation_rule: >-
  Citable only as a completed governance/method milestone -- never as a scientific
  result, validation, or evidence about any variant. Non-clinical, research use only.
selection_seed: raptor-atlas-phase2-panel-v1
seed_derivation: fixed_literal_no_derived_inputs
seed_note: >-
  Fixed literal recorded at freeze time, before any selection. Derived from nothing --
  not the universe, not candidate identities, not any observed result, and not a hash of
  the protocol document (which would be circular). Draw key is
  sha256(selection_seed + "|" + spdi_canonical), lowercase hex, ascending.
panel_size_rule:
  minimum: 5
  maximum: 10
  target_expression: clamp(K + 2, 5, 10)
  target_expression_note: >-
    K = number of strata that are non-empty by primary_stratum among eligible records.
  attempt_schedule: >-
    Outer loop over constraint levels L0..R7 (strictest first), inner loop over fixed
    attempt sizes n = N_target down to 5. All caps are functions of the attempt size n;
    no constraint references the outcome size. N_selected is defined only after a valid
    solution exists (protocol section 17.3).
search_parameters:
  search_scope: full_eligible_universe
  stratum_shortlist_size: null
  shortlist_removed_in: 1.0.2
  search_node_budget: 5000000
  budget_semantics: resource_guard_only
  completeness_note: >-
    Deterministic depth-first exhaustive search with sound (hereditary-only) pruning over the
    FULL eligible universe; acceptance is not greedy-order dependent. The v1.0.1 per-stratum
    shortlist was removed because a cutoff must never be able to trigger relaxation or an
    infeasible verdict. A budget-exhausted attempt yields UNDETERMINED and terminates the run
    with UNDETERMINED_SEARCH_INCOMPLETE; it never produces relaxation and never produces
    INFEASIBLE_PANEL. Any future candidate-subset optimization requires a machine-checked
    exchange-equivalence proof recorded in the run.
sampling_strata:
  - S1
  - S2
  - S3
  - S4
  - S5
  - S6
stratum_precedence_and_processing_order:
  - S6
  - S4
  - S5
  - S2
  - S3
  - S1
stratum_order_note: >-
  One declared order (Omega) serves BOTH as primary_stratum precedence over
  all_matched_strata and as the phase/allocation processing order. Strata are derived by
  machine-executable predicates over declared observation primitives and are recomputed
  by the executor; a disagreement with declared values fails closed. No subjective
  primary assignment exists anywhere in the protocol.
taxonomy_governance:
  functional_strata_govern: selection_coverage
  spec_strata_govern: compatibility_coverage_and_reporting
  spec_strata_source: >-
    docs/project/specs/mechanism-atlas-starter.yaml panel_selection_contract.required_strata
  spec_strata:
    - known_pathogenic
    - known_benign
    - conflicting
    - vus_with_functional_evidence
    - vus_without_functional_evidence
  spec_amendment_made: false
  contradiction_regime:
    external_label: report_only_discordance
    recomputed_from_locked_observations: universe_contract_breach
  crosswalk_note: >-
    The two axes are orthogonal and independently declared; neither is derived from the
    other, so a classification label can never determine a functional stratum. Contradictory
    label/stratum combinations are report-only when spec_stratum came from an external
    classification source (which may simply be stale relative to newly found observations)
    and fail closed only when spec_stratum was deterministically recomputed from the same
    locked observations. Discordance is always flagged, counted and reported, never silently
    relabelled or corrected. The starter spec is unchanged and stays binding via constraint
    C5; no test or document pins a conflicting reading.
metadata_evidence_firewall: >-
  Sampling strata, spec strata, ClinVar classifications, computational scores, reported
  outcome buckets, support class, access status and licence family are selection metadata
  only. They never become mechanism evidence, never satisfy grounding and never replace an
  exact span (protocol section 9.1; enforced by promotion Gate 7 and the static leakage
  scanner).
