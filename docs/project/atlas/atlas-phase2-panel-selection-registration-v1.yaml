      - lock_content_hash (own non-circular content hash)
    optional_fields:
      - predecessor_lock_ref (lock_version / path / note) -- lineage only, never authority to
        edit, delete or re-hash a superseded lock
    note: >-
      The executor resolves the lock from universe_lock.active.path, never from a hardcoded
      path. The candidate data itself lives under the external uncommitted content root; the
      lock record is tracked regardless so the commitment is durable. Selection consumes and
      verifies this record (precondition V5, checks K1-K6) and fails closed on absence,
      corruption, mismatch, duplication, future-dating or an incomplete/unreconcilable
      lock_protocol_version_delta.
  lock_status: locked
  lock_status_note: >-
    universe_version 2 (evidence-enriched) was locked at 2026-08-03T10:23:40Z under protocol
