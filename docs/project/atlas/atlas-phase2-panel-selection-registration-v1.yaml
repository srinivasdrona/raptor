    schema: atlas.candidate_universe_lock.v1
    content_hash_algorithm: atlas.universe_lock_content_hash.v1
    self_hash_field: lock_content_hash
    tracked_in_repository: true
    candidate_free: true
    status: locked
    created_when: >-
      immediately after normalization completes and before any selection attempt; exactly one
      lock record per universe_version
    required_fields:
      - universe_content_hash
      - raw_inventory content_hash / record_count / normalized_byte_length / captured_at
      - normalization_ledger hash / row_count
      - discovery_set_commitment hash / count / committed_at
      - pack_binding pack_id / pack_version / pack_content_hash
      - protocol_version / protocol_doc_hash / registration_content_hash in force at lock time
