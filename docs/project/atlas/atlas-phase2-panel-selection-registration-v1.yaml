    dropped. Conservation checks U1-U7 -- including full executor replay of normalization and
    pack identity admission from every raw row -- fail closed.
identity_map_contract:
  required_before_selection: true
  purpose: >-
    The RP1-RP7 replay is only meaningful if the mapping from a raw identity string to a
    canonical identity is independently derived rather than copied from the universe. The
    executor therefore performs that replay through a verified offline raw identity map built
    from immutable, hash-pinned official public reference responses, committed before selection
    under the same "lock next door" discipline as the universe lock.
  build_authority: docs/project/specs/atlas-raw-identity-mapper-v1.yaml
  loader: raptor.atlas.identity_map.load_identity_map
  loader_properties:
    offline: true
    network_access: false
    environment_reads_in_core: false
    repair_path: none
  active:
    path: configs/atlas/panels/tsc2/atlas-phase2-raw-identity-map-lock-v4.yaml
    schema: atlas.raw_identity_map_lock.v2
    map_schema: atlas.raw_identity_map.v2
    lock_id: atlas-raw-identity-map-lock-tsc2
    lock_version: '4'
    map_id: atlas-raw-identity-map-tsc2
    map_version: '4'
    created_at: '2026-08-05T05:56:56Z'
    lock_content_hash: 85bc2b10e65bd8140a775537204f3c7c7048cd5444d7057fbea9501b7cd4b104
    map_content_hash: 3adbf3484de28607fa3c133b2bebc4a9d7926b4c2d5b3863b0634507c599cd26
    map_record_count: 35
    raw_inventory_content_hash: fee39ffa9c826b6e0ccb85ad583b09c2f81794036b115d91a91eab521365befb
    raw_inventory_record_count: 35
    response_bundle_hash: fbedf2aae5aa26936807f2d8f26389a18a861fc884b461fdd8ebaf6b7e9f96bc
    response_file_count: 88
    response_byte_count: 904564
    acquisition_tool_sha256: 7c0593954f249e136a8690cd580f8bcdc40ebec1108a23f03626451bfd67251e
    pack_binding:
      pack_id: tsc2
      pack_version: 1.0.0-phase1
      pack_content_hash: 1294478c6d112f91e5719ee345d2b5be1925567ec4f4abdff50b0e092ff08927
    reference_binding:
      provider: NCBI/NLM
      database: clinvar+clinicaltables
      assembly: GRCh38
      transcript: NM_000548.5
      protein: NP_000539.2
      protein_derivation: >-
        uniquely derived from the complete, page-verified official reference response set --
        never asserted in the pack, never defaulted, never inferred from a codon table
      protein_reference_total_count: 6428
      protein_reference_page_size: 500
      protein_reference_page_count: 13
  map_storage:
    tracked_in_repository: false
    location: external_content_root
    reason: >-
      The map manifest and the official response bundle carry candidate identities, so they stay
      under the external uncommitted content root. Their paths are supplied explicitly as run
      arguments; core reads no environment variable and no default path. Only the candidate-free
      lock is tracked, which is what makes the commitment durable.
  lock_storage:
    tracked_in_repository: true
    candidate_free: true
    status: locked
  protocol_independence:
    subject_to_K5: false
    carries_protocol_version: false
    rationale: >-
      The identity map and its lock were built under the protocol-independent mapper spec and
      deliberately record no selection-protocol version or digest. They are verified against
      their own self-hashes, the live raw inventory, the official response bundle, the
      acquisition tool and the bound pack -- never against this document's version. A selection
      protocol amendment therefore never invalidates a map lock, and no lock_protocol_version
      delta is defined or required for it.
  superseded:
    - map_version: '1-3'
      disposition: >-
        Earlier map versions and their locks, where they exist, remain tracked and unmodified for
        audit. Only map_version 4 named in identity_map_contract.active is admissible; binding a
        stale map version is an IDENTITY_MAP_MISMATCH, not a fallback.
  checks:
    IM1: >-
      The active map lock resolved from identity_map_contract.active.path exists, declares
      map_version / lock_version 4, and its recomputed lock_content_hash equals both its stored
      value and the mirror above; otherwise IDENTITY_MAP_LOCK_MISSING /
      IDENTITY_MAP_LOCK_CORRUPT and terminate
    IM2: >-
      The external map manifest self-verifies against map_content_hash and every lock<->map
      binding agrees (map_id, map_version, map_content_hash, map_record_count,
      raw_inventory_content_hash, raw_inventory_record_count, response_bundle_hash,
      response_file_count, response_byte_count, acquisition_tool_sha256); otherwise
      IDENTITY_MAP_MISMATCH and terminate
    IM3: >-
      Response-bundle hash, file count and byte count recomputed from the response root equal the
      declared values; every per-record and per-reference-page response digest recomputed from
      disk equals its declared digest; the acquisition-tool digest is recomputed from the pinned
      tool file; otherwise IDENTITY_MAP_MISMATCH and terminate
    IM4: >-
      The map pack_binding equals the live pack hash (V4) and the universe lock pack_binding; the
      reference_binding names exactly the pinned assembly and MANE-Select transcript of the bound
      pack and a protein accession uniquely derived from the complete page-verified official
      response set; otherwise IDENTITY_MAP_MISMATCH / PACK_DRIFT and terminate
    IM5: >-
      map_record_count equals raw_inventory.record_count, the map's raw-inventory binding equals
      the live raw-inventory digest and row count, and the map records are in bijection with the
      raw rows with character-identical raw_identity_string and source-reported consequence hint;
      otherwise IDENTITY_MAP_MISMATCH and terminate
    IM6: >-
      The active universe lock's identity_map_binding names exactly this map_id, map_version,
      lock_id, lock_version, map_content_hash, lock_content_hash, response_bundle_hash and
      map_record_count; otherwise IDENTITY_MAP_MISMATCH and terminate
  replay_binding: >-
    U7 / RP1-RP7 are executed through this verified mapper and no other. The executor derives no
    identity from a built-in codon table, a translated reference sequence, residue-offset
    arithmetic between isoforms, or the universe's own declared fields, and accepts no injected
    mapper object in place of loading and verifying the locked map.
  fault_is_never_a_candidate_property: >-
    An absent, stale, corrupt or version-mismatched map is IDENTITY_MAP_UNVERIFIED; a raw row the
    verified mapper cannot answer for is REPLAY_MAPPER_UNAVAILABLE. Neither is ever recorded as
    identity_state unresolved (X1), as out_of_scope, or as an eligibility failure, and neither
    ever produces a partial run result. An unresolved identity is a conclusion the verified
    mapper reached from official evidence; a missing mapper is a tool failure that stops the run.
  versioning: >-
    Exactly one lock record per map_version, written once and never rewritten. A corrected map
    requires a map_version bump, a new lock record, retention of the superseded lock, and --
    because the universe lock binds the map (IM6) -- a universe_version bump with a new universe
    lock and a full deterministic re-run.
lock_protocol_version_delta_contract:
  required_in_every_run: true
  waives_nothing: >-
    A delta records an administrative version difference only. It never waives K2 (lock
    self-hash / registration mirror), K3 (universe, raw-inventory, ledger and discovery-set
    content), K4 (pack binding) or K6 (per-universe_version uniqueness and non-future
    created_at), and never changes a rule, seed, predicate, constraint, ladder step or search
    algorithm.
  fields:
    lock_protocol_version: copied verbatim from the active lock record
    lock_protocol_doc_hash: copied verbatim from the active lock record
    lock_registration_content_hash: copied verbatim from the active lock record
    current_protocol_version: this registration's protocol_version
    current_protocol_doc_hash: the digest verified in V1
    current_registration_content_hash: the digest recomputed and verified in V2
    differs: >-
      boolean; true iff any of the three lock values differs from its current counterpart
    reconciled_via_amendment_log_versions: >-
      ordered list of amendment_log versions traversed from the lock's protocol version to the
      current one; empty list iff differs is false. The chain must be COMPLETE and gap-free in
      ascending order -- every amendment_log version strictly greater than the lock's
      protocol_version and less than or equal to the current protocol_version must appear.
      Skipping an intermediate version is UNIVERSE_LOCK_DELTA_INCOMPLETE and terminates the run.
  admissibility: >-
    admissible only if the lock's (protocol_version, protocol_doc_hash,
    registration_content_hash) triple equals the current values or appears in amendment_log as
    an entry's own version/digests or as an entry's supersedes_digests, AND the lock is not an
    invalid-binding lock (protocol section 4.6.2); otherwise UNIVERSE_LOCK_PROTOCOL_UNKNOWN and
    terminate. A missing, partial or free-text delta is UNIVERSE_LOCK_DELTA_INCOMPLETE and
    terminates the run. Digests recorded only as rejected_draft_digests are audit history and are
    never admissible.
  expected_delta_for_active_lock:
    lock_protocol_version: 1.0.3
    lock_protocol_doc_hash: df9b9a33a4343968c20993feaab6622d129118152cd0c90452936c4b5f81cfc0
    lock_registration_content_hash: d79486b3b74f81d87a3d25c10bd1f0eea31ada562a940d632f4a29ef8574b7b2
    current_protocol_version: 1.0.4
    differs: true
    reconciled_via_amendment_log_versions:
      - 1.0.4
    chain_note: >-
      Exactly one step. Lock v4 records the bindings that were genuinely in force at its
      created_at (1.0.3), so the complete gap-free ascending chain of amendment_log versions
      strictly greater than 1.0.3 and less than or equal to 1.0.4 is [1.0.4] alone. 1.0.2 is NOT
      part of the active chain: it belongs to the superseded lock v3 lineage, and lock v3 is an
      invalid-binding record that may never appear as a traversed step.
    note: >-
      current_protocol_doc_hash and current_registration_content_hash are intentionally not
      pre-stated here: the executor must recompute them in V1/V2 from the live files rather than
      copy an asserted value, and embedding this registration's own digest inside itself would
      be circular.
executor_preconditions:
  V1: protocol_doc_hash recomputed and matched
  V2: registration_content_hash recomputed and matched (self-verification)
  V3: selection_seed matched
  V4: >-
    live atlas.pack_content_hash.v1 equals ALL THREE of
    pack_binding_observed_at_freeze.pack_content_hash, the locked universe pack_binding, and the
    universe lock record pack_binding; otherwise PACK_DRIFT and terminate
  V5: >-
    universe lock record resolved from candidate_universe_contract.universe_lock.active.path,
    present, self-verifying against both its own lock_content_hash and the active mirror above,
    and binding the live universe, raw inventory, normalization ledger and discovery-set
    commitment (K1-K6, including the mandatory lock_protocol_version_delta of K5); otherwise
    UNIVERSE_LOCK_MISSING / _CORRUPT / _MISMATCH / _INVALID / _PROTOCOL_UNKNOWN /
    _DELTA_INCOMPLETE and terminate
  V6: >-
    universe conservation checks U1-U7 pass, including the mandatory normalization/admission
    replay RP1-RP7 recomputed from the raw inventory THROUGH the V7-verified identity map
    (custodian outcomes are never trusted, and no other mapping mechanism is admissible)
  V7: >-
    identity map lock resolved from identity_map_contract.active.path, present, self-verifying
    against both its own lock_content_hash and the active mirror above, and binding the external
    map manifest, the official response bundle, the acquisition tool, the live raw inventory,
    the live pack and the universe lock identity_map_binding (IM1-IM6); otherwise
    IDENTITY_MAP_LOCK_MISSING / IDENTITY_MAP_LOCK_CORRUPT / IDENTITY_MAP_MISMATCH /
    IDENTITY_MAP_UNVERIFIED and terminate with no run result
  execution_order:
    - V1
    - V2
    - V3
    - V4
    - V5
    - V7
    - V6
  execution_order_note: >-
    The ids are stable names, not an ordering. V7 necessarily precedes V6 because the RP1-RP7
    replay is performed through the mapper that V7 verifies; a replay run against an unverified
    mapper would prove nothing. The executor short-circuits on the first failure.
relaxation_ladder:
  - R1 C5 spec-taxonomy coverage becomes report-only
  - R2 P2 minimum established source groups 3 -> 2
  - R3 P1 sole-support cap ceil(n/2) -> ceil(2n/3)
  - R4 D1 minimum assay kinds 3 -> 2
  - R5 P3 single-high-throughput cap 2 -> 3
  - R6 D2 minimum model systems 2 -> 1
  - R7 P2 minimum established source groups -> 1 (terminal)
relaxation_gate: >-
  A level may be left for the next only when every attempt at that level terminated
  INFEASIBLE_COMPLETE over the full eligible universe. Any UNDETERMINED attempt terminates the
  run with UNDETERMINED_SEARCH_INCOMPLETE instead: a resource limit is never evidence that the
  literature is inadequate, and never licenses relaxation or INFEASIBLE_PANEL.
never_relaxed:
  - eligibility rules E1-E8
  - metadata/evidence firewall
  - coverage C1, C2, C4
  - anti-proxy access rule
  - duplicate/same-codon/same-residue rules
  - unknown-lineage pooling
  - relaxation or infeasibility on an undetermined (budget-exhausted) attempt
