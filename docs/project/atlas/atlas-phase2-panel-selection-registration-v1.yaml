# RAPTOR Mechanism Atlas -- Phase 2 contrast-panel selection: freeze/registration record.
#
# Companion to docs/project/atlas/ATLAS_PHASE2_PANEL_SELECTION_PROTOCOL.md. A document
# cannot contain its own digest, so the protocol's canonical digest is recorded here.
#
# Hashes (both lowercase SHA-256 hex, recompute commands in protocol section 20):
#   protocol_doc_hash          -- atlas.protocol_doc_hash.v1 over the protocol markdown:
#                                 UTF-8 text normalized by atlas.text_norm.v1
#                                 (CRLF/CR -> LF, Unicode NFC, no case-fold, no whitespace
#                                 collapse), re-encoded UTF-8, sha256, lowercase hex.
#   registration_content_hash  -- atlas.registration_content_hash.v1 over THIS file:
#                                 yaml.safe_load, strip ONLY the top-level
#                                 registration_content_hash key, canonical JSON
#                                 (sort_keys=True, separators=(",",":"), ensure_ascii=False),
#                                 sha256, lowercase hex. Every timestamp below is a quoted
#                                 string so the payload serializes without type coercion.
#                                 The executor MUST recompute and verify this digest
#                                 (precondition V2) and record it in every run.
#
schema: atlas.panel_selection_registration.v1
registration_id: atlas-phase2-panel-selection
protocol_version: 1.0.2
protocol_path: docs/project/atlas/ATLAS_PHASE2_PANEL_SELECTION_PROTOCOL.md
protocol_doc_hash_algorithm: atlas.protocol_doc_hash.v1
protocol_doc_hash: 685319b54d52183f44e6f98605b0a6d00a1348b8fc055c69b54d334872385efc
registration_content_hash_algorithm: atlas.registration_content_hash.v1
registration_content_hash: 82261ab52ade28f35db35cfe569a6bbcb70b8bac24c46159352d40ce03bbe37e
frozen_at: '2026-08-02T23:41:07+05:30'
frozen_at_utc: '2026-08-02T18:11:07Z'
registrar_role: independent protocol planner (blinded to candidate discovery output)
registration_class: post_discovery_pre_selection
is_preregistration: false
first_selection_run_executed: false
registration_class_note: >-
  Candidate discovery ran BEFORE this protocol was written. This is a post-discovery,
  pre-selection registered protocol and must never be described as a preregistration.
  The protocol names no candidate, reports no candidate count and states no result.
citation_rule: >-
  Citable only as a completed governance/method milestone -- never as a scientific
  result, validation, or evidence about any variant. Non-clinical, research use only.
selection_seed: raptor-atlas-phase2-panel-v1
seed_derivation: fixed_literal_no_derived_inputs
seed_note: >-
  Fixed literal recorded at freeze time, before any selection. Derived from nothing --
  not the universe, not candidate identities, not any observed result, and not a hash of
  the protocol document (which would be circular). Draw key is
  sha256(selection_seed + "|" + spdi_canonical), lowercase hex, ascending.
panel_size_rule:
  minimum: 5
  maximum: 10
  target_expression: clamp(K + 2, 5, 10)
  target_expression_note: >-
    K = number of strata that are non-empty by primary_stratum among eligible records.
  attempt_schedule: >-
    Outer loop over constraint levels L0..R7 (strictest first), inner loop over fixed
    attempt sizes n = N_target down to 5. All caps are functions of the attempt size n;
    no constraint references the outcome size. N_selected is defined only after a valid
    solution exists (protocol section 17.3).
search_parameters:
  search_scope: full_eligible_universe
  stratum_shortlist_size: null
  shortlist_removed_in: 1.0.2
  search_node_budget: 5000000
  budget_semantics: resource_guard_only
  completeness_note: >-
    Deterministic depth-first exhaustive search with sound (hereditary-only) pruning over the
    FULL eligible universe; acceptance is not greedy-order dependent. The v1.0.1 per-stratum
    shortlist was removed because a cutoff must never be able to trigger relaxation or an
    infeasible verdict. A budget-exhausted attempt yields UNDETERMINED and terminates the run
    with UNDETERMINED_SEARCH_INCOMPLETE; it never produces relaxation and never produces
    INFEASIBLE_PANEL. Any future candidate-subset optimization requires a machine-checked
    exchange-equivalence proof recorded in the run.
sampling_strata:
  - S1
  - S2
  - S3
  - S4
  - S5
  - S6
stratum_precedence_and_processing_order:
  - S6
  - S4
  - S5
  - S2
  - S3
  - S1
stratum_order_note: >-
  One declared order (Omega) serves BOTH as primary_stratum precedence over
  all_matched_strata and as the phase/allocation processing order. Strata are derived by
  machine-executable predicates over declared observation primitives and are recomputed
  by the executor; a disagreement with declared values fails closed. No subjective
  primary assignment exists anywhere in the protocol.
taxonomy_governance:
  functional_strata_govern: selection_coverage
  spec_strata_govern: compatibility_coverage_and_reporting
  spec_strata_source: >-
    docs/project/specs/mechanism-atlas-starter.yaml panel_selection_contract.required_strata
  spec_strata:
    - known_pathogenic
    - known_benign
    - conflicting
    - vus_with_functional_evidence
    - vus_without_functional_evidence
  spec_amendment_made: false
  contradiction_regime:
    external_label: report_only_discordance
    recomputed_from_locked_observations: universe_contract_breach
  crosswalk_note: >-
    The two axes are orthogonal and independently declared; neither is derived from the
    other, so a classification label can never determine a functional stratum. Contradictory
    label/stratum combinations are report-only when spec_stratum came from an external
    classification source (which may simply be stale relative to newly found observations)
    and fail closed only when spec_stratum was deterministically recomputed from the same
    locked observations. Discordance is always flagged, counted and reported, never silently
    relabelled or corrected. The starter spec is unchanged and stays binding via constraint
    C5; no test or document pins a conflicting reading.
metadata_evidence_firewall: >-
  Sampling strata, spec strata, ClinVar classifications, computational scores, reported
  outcome buckets, support class, access status and licence family are selection metadata
  only. They never become mechanism evidence, never satisfy grounding and never replace an
  exact span (protocol section 9.1; enforced by promotion Gate 7 and the static leakage
  scanner).
candidate_universe_contract:
  raw_inventory_path: configs/atlas/panels/tsc2/discovery_inventory.raw.yaml
  raw_inventory_hash_algorithm: atlas.raw_inventory_hash.v1
  normalized_universe_path: configs/atlas/panels/tsc2/candidate_universe.yaml
  schema: atlas.candidate_universe.v1
  content_hash_algorithm: atlas.candidate_universe_content_hash.v1
  normalization_ledger_hash_algorithm: atlas.normalization_ledger_hash.v1
  discovery_set_commitment_algorithm: atlas.discovery_set_commitment.v1
  lineage_collapse_algorithm: atlas.source_lineage_collapse.v1
  universe_lock:
    required_before_selection: true
    path: configs/atlas/panels/tsc2/atlas-phase2-candidate-universe-lock-v1.yaml
    schema: atlas.candidate_universe_lock.v1
    content_hash_algorithm: atlas.universe_lock_content_hash.v1
    self_hash_field: lock_content_hash
    tracked_in_repository: true
    candidate_free: true
    status: not_yet_created
    created_when: >-
      immediately after normalization completes and before any selection attempt; exactly one
      lock record per universe_version
    required_fields:
      - universe_content_hash
      - raw_inventory content_hash / record_count / normalized_byte_length / captured_at
      - normalization_ledger hash / row_count
      - discovery_set_commitment hash / count / committed_at
      - pack_binding pack_id / pack_version / pack_content_hash
      - protocol_version / protocol_doc_hash / registration_content_hash in force at lock time
      - universe_id / universe_version / created_at / created_by_role / storage_location
      - lock_content_hash (own non-circular content hash)
    note: >-
      Declared here as a forward requirement only. Candidate-derived digests are intentionally
      absent because the universe-lock task follows protocol freeze and no candidate artifact
      was inspected at freeze time. The candidate data itself may live under the external
      uncommitted content root; the lock record must be tracked regardless so the commitment is
      durable. Selection consumes and verifies this record (precondition V5, checks K1-K6) and
      fails closed on absence, corruption, mismatch or duplication.
  lock_status: not_yet_locked
  lock_status_note: >-
    Universe, raw-inventory, ledger and discovery-set digests are recorded in the universe lock
    record when the universe is locked, and re-verified plus copied into every selection run
    record; they are intentionally absent here.
  completeness_binding: >-
    The normalized universe must bind back to an immutable raw discovery inventory via a
    hash/count pin, a total normalization ledger (one row per raw row), and a pre-selection
    discovery-set commitment over the sorted distinct canonical identity keys. Unresolved
    identities are carried as surrogate-keyed records with exclusion X1 and are never
    dropped. Conservation checks U1-U7 -- including full executor replay of normalization and
    pack identity admission from every raw row -- fail closed.
executor_preconditions:
  V1: protocol_doc_hash recomputed and matched
  V2: registration_content_hash recomputed and matched (self-verification)
  V3: selection_seed matched
  V4: >-
    live atlas.pack_content_hash.v1 equals ALL THREE of
    pack_binding_observed_at_freeze.pack_content_hash, the locked universe pack_binding, and the
    universe lock record pack_binding; otherwise PACK_DRIFT and terminate
  V5: >-
    universe lock record present, self-verifying, and binding the live universe, raw inventory,
    normalization ledger and discovery-set commitment (K1-K6); otherwise UNIVERSE_LOCK_MISSING /
    _CORRUPT / _MISMATCH / _INVALID and terminate
  V6: >-
    universe conservation checks U1-U7 pass, including the mandatory normalization/admission
    replay RP1-RP7 recomputed from the raw inventory (custodian outcomes are never trusted)
relaxation_ladder:
  - R1 C5 spec-taxonomy coverage becomes report-only
  - R2 P2 minimum established source groups 3 -> 2
  - R3 P1 sole-support cap ceil(n/2) -> ceil(2n/3)
  - R4 D1 minimum assay kinds 3 -> 2
  - R5 P3 single-high-throughput cap 2 -> 3
  - R6 D2 minimum model systems 2 -> 1
  - R7 P2 minimum established source groups -> 1 (terminal)
relaxation_gate: >-
  A level may be left for the next only when every attempt at that level terminated
  INFEASIBLE_COMPLETE over the full eligible universe. Any UNDETERMINED attempt terminates the
  run with UNDETERMINED_SEARCH_INCOMPLETE instead: a resource limit is never evidence that the
  literature is inadequate, and never licenses relaxation or INFEASIBLE_PANEL.
never_relaxed:
  - eligibility rules E1-E8
  - metadata/evidence firewall
  - coverage C1, C2, C4
  - anti-proxy access rule
  - duplicate/same-codon/same-residue rules
  - unknown-lineage pooling
  - relaxation or infeasibility on an undetermined (budget-exhausted) attempt
run_record_path_pattern: data/atlas/tsc2_phase2_panel_selection_run_<YYYY-MM-DD>.json
pack_binding_observed_at_freeze:
  pack_id: tsc2
  pack_version: 1.0.0-phase1
  pack_content_hash: 1294478c6d112f91e5719ee345d2b5be1925567ec4f4abdff50b0e092ff08927
  binding: hard_selection_input
  note: >-
    BINDING (v1.0.1): selection fails closed with PACK_DRIFT unless the live TSC2 pack
    hash equals this snapshot AND the locked universe pack binding AND the universe lock
    record pack binding (v1.0.2 adds the third comparison). The verified live hash is recorded
    in the run output. A legitimate pack change requires a registration amendment (new version,
    new digests) before selection may run.
amendment_log:
  - version: 1.0.0
    timestamp: '2026-08-02T21:46:16+05:30'
    reason: >-
      Initial registration of the Phase 2 contrast-panel selection protocol, frozen before
      any candidate was selected and after candidate discovery had already occurred.
    known_candidate_level_results_at_amendment: false
    pre_first_run_correction: false
  - version: 1.0.1
    timestamp: '2026-08-02T22:34:43+05:30'
    reason: >-
      Pre-first-run correction of six adversarial-review findings, made before any
      selection run has ever executed, so no computed panel can be affected: (1) bound the
      universe to the complete raw discovery inventory via a hash/count pin, a total
      normalization ledger and a pre-selection discovery-set commitment, with fail-closed
      surrogate keys for unresolved identities, and replaced the declared single stratum
      with machine-executable multi-stratum predicates plus deterministic Omega precedence;
      (2) replaced opaque source-group trust with normalized provenance fields and a
      deterministic lineage-collapse contract that the executor recomputes, pooling unknown
      lineage conservatively; (3) made the pack content hash a hard, fail-closed selection
      input; (4) removed all constraints defined in terms of the unknown outcome size and
      replaced greedy selection with a fixed-size attempt schedule plus a complete,
      deterministic backtracking search with sound pruning, a declared shortlist and a
      declared node budget; (5) added fail-closed recomputation of this registration
      digest as executor precondition V2, recorded in every run; (6) added an explicit
      taxonomy-governance statement and fail-closed compatibility crosswalk so the starter
      spec's five required_strata stay binding as compatibility coverage C5 while the six
      functional strata govern selection coverage -- no spec amendment was required.
    known_candidate_level_results_at_amendment: false
    pre_first_run_correction: true
    supersedes_digests:
      protocol_doc_hash: 3491cb82865831ad4d7505daedd1ea1a794a1b187880f8eb5d069e1de38e3dce
      registration_content_hash: 7dadb1dcd44230dc7e3bd4916ab84138e12eabc92f74ded878fbb4b3b84a1214
      note: >-
        v1.0.0 digests, retained so the pre-correction registration state stays auditable.
        No selection run ever executed under v1.0.0, so no panel depends on them.
  - version: 1.0.2
    timestamp: '2026-08-02T23:41:07+05:30'
    reason: >-
      Second pre-first-run correction, made before any selection run has ever executed, of four
      further adversarial-review findings: (1) added a mandatory, tracked, candidate-free
      pre-selection universe lock record (atlas.candidate_universe_lock.v1) that pins the
      universe, raw-inventory, normalization-ledger and discovery-set digests plus counts and
      the pack binding with its own non-circular self-hash, created immediately after
      normalization and verified fail-closed by the executor as precondition V5 (K1-K6), so a
      custodian can no longer rewrite the universe and its self-hash before the first run;
      (2) made executor replay of normalization and pack identity admission from every raw
      inventory row mandatory (U7, RP1-RP7), covering normalization outcome, universe key,
      identity state, canonical SPDI/transcript fields, recomputed scope/consequence decisions,
      exclusion codes and ledger bijection, with unresolved rows required to be confirmed
      genuinely unresolved; (3) removed the per-stratum shortlist so the deterministic search
      runs over the full eligible universe, and redefined budget exhaustion as
      UNDETERMINED_SEARCH_INCOMPLETE which can never license relaxation or INFEASIBLE_PANEL
      (relaxation now requires every attempt at a level to be proved INFEASIBLE_COMPLETE; any
      future subset optimization needs a machine-checked exchange-equivalence proof);
      (4) made stale external classification labels report-only in the taxonomy crosswalk --
      contradictory spec-stratum/functional-stratum cells abort only when spec_stratum was
      deterministically recomputed from the same locked observations, otherwise they are
      recorded as stale_label_discordant and never silently relabelled.
    known_candidate_level_results_at_amendment: false
    pre_first_run_correction: true
    supersedes_digests:
