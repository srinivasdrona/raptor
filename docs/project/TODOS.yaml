- id: atlas-phase2-panel-protocol-freeze
  title: Freezing the Atlas Phase 2 panel-selection protocol
  description: 'Track: MECHANISM-ATLAS / PHASE-2 / GOVERNANCE. Register and freeze
    docs/project/atlas/ATLAS_PHASE2_PANEL_SELECTION_PROTOCOL.md before any contrast-panel
    member is chosen, with the freeze timestamp, version, seed literal and protocol digest
    recorded in the adjacent
    docs/project/atlas/atlas-phase2-panel-selection-registration-v1.yaml. Because candidate
    discovery already ran, label this honestly as a post-discovery, pre-selection registered
    protocol, never a preregistration. The protocol must name no candidate, report no
    candidate count and state no functional result; it fixes the locked universe handoff
    contract, identity normalization, eligibility/exclusion, the 5-10 panel-size rule,
    coverage of the six frozen strata (strong signal, partial/intermediate, null/benign-like,
    conflicting-across-assays, context-dependent, evidence-poor/abstention), assay/model
    diversity, source-concentration caps with a fail-closed relaxation ladder, single
    high-throughput dataset limits, the abstention control, duplicate/same-codon/same-residue
    handling, seeded deterministic ordering and tie-breaking, empty-stratum and infeasibility
    handling, the full inclusion/exclusion audit and the no-outcome-dependent-replacement
    rule. Sampling labels (including ClinVar classification, computational scores and open
    access status) define strata only and never become mechanism evidence. Version 1.0.1 is a
    pre-first-run correction of six adversarial-review findings: discovery-set commitment plus
    normalization ledger binding the universe to the immutable raw inventory, machine-executable
    multi-stratum predicates with declared precedence, recomputed source-lineage collapse with
    conservative unknown pooling, fail-closed pack-hash and registration-digest preconditions,
    a fixed-size deterministic complete search replacing the circular greedy sizing, and an
    explicit taxonomy crosswalk that keeps the starter-spec strata binding as compatibility
    coverage without amending the spec. Version 1.0.2 adds a mandatory tracked candidate-free
    pre-selection universe lock record, mandatory executor replay of normalization and pack
    identity admission from every raw inventory row, deterministic search over the full eligible
    universe with budget exhaustion reported as undetermined rather than relaxed or infeasible,
    and report-only handling of stale external classification labels in the crosswalk. Citable
    only as a completed governance milestone, never as a scientific result.'
  status: done
  depends_on: []
  created: '2026-08-02'
- id: atlas-phase2-candidate-universe-lock
  title: Normalizing and locking the Atlas Phase 2 candidate universe
  description: 'Track: MECHANISM-ATLAS / PHASE-2. Capture the complete discovery output as an
    immutable raw inventory, then normalize every discovered TSC2 missense candidate to
    canonical GRCh38 SPDI plus pinned MANE-Select transcript HGVS, collapse exact duplicates,
    and emit the locked universe at configs/atlas/panels/tsc2/candidate_universe.yaml (schema
    atlas.candidate_universe.v1). The universe must bind back to the raw inventory through its
    hash and row count, a total normalization ledger with one row per raw row, and a
    pre-selection discovery-set commitment (count plus hash over the sorted distinct canonical
    identity keys); unresolved identities are carried as surrogate-keyed records with their
    exclusion code and are never dropped. Carry only primitive selection metadata -- per
    observation reported outcome bucket with attributable basis, assay kind, model system,
    context keys, throughput class, normalized source identifiers, dataset accession, version
    linkage, program/lab/protocol lineage keys, access status, licence family and span
    verifiability -- plus the classification-derived spec stratum and its derivation mode, so the
    executor can replay normalization and recompute strata, lineage groups and support class
    deterministically. No ranking, recommendation, effect size, aggregated verdict or mechanism
    narrative. Record access-blocked and evidence-absent candidates as distinct states so open
    access never becomes a proxy for positive findings. Immediately after normalization and
    before any selection attempt, publish the tracked, candidate-free lock record at
    configs/atlas/panels/tsc2/atlas-phase2-candidate-universe-lock-v1.yaml (schema
    atlas.candidate_universe_lock.v1) pinning the universe, raw-inventory, ledger and
    discovery-set hashes plus counts, the pack binding and the protocol digests in force, with
    its own non-circular content hash; candidate data may stay under the external uncommitted
    content root but the lock record must be tracked. Exactly one lock record per
    universe_version; corrections require a version bump, a recorded reason, a new lock record
    and a full deterministic re-run. Completed 2026-08-02: raw inventory 35 rows (content_hash
    fee39ffa9c826b6e0ccb85ad583b09c2f81794036b115d91a91eab521365befb), normalization ledger 35
    rows (hash 7c1e94938980199d7048f80c3a2f98058883cdb9de918e99fbbca2f707f6c834), discovery-set
    commitment count 35 (hash 0e33cebb4521b5ce94f592c73a508ee9cec0741cb5f1fa3c4de615a0de552c49),
    universe_content_hash 22b08a99fe56ac5c07798a27b7fc3abf9b6fa60985c99ad8ed4e3250f30e094b,
    lock_content_hash fcceb1a8cc09b07378a6882c82a0f7199d4afb54d9d6782135297f3a0ee0178c at
    configs/atlas/panels/tsc2/atlas-phase2-candidate-universe-lock-v1.yaml; 28 resolved plus 7
    unresolved(X1) plus 1 X3 anchor-residue exclusion, all hashes independently re-verified in a
    fresh process against the on-disk artifacts and the live pack hash. This v1 artifact is the
    complete identity-custody lock, but its observation arrays are empty and it is not yet
    selection-ready; evidence enrichment and a versioned v2 re-lock are tracked separately.'
  status: done
  depends_on:
