- id: atlas-phase2-citation-resolver
  title: Building the minimal Atlas primary-source resolver
  description: 'Track: MECHANISM-ATLAS / PHASE-2. Per docs/project/specs/atlas-citation-resolver-v1.yaml
    and ADR-0016, build a deterministic, offline, fail-closed citation resolver
    (src/raptor/atlas/citation.py) enforcing ADR-0015 grounding. Scope: canonicalize PMID/PMCID/DOI/ACCESSION
    identifiers (DOI lowercased, trailing-punctuation/percent/internal-whitespace rejected; ACCESSION
    provider-qualified <namespace>:<opaque>, namespace lowercased, opaque case-preserved); load and
    self-hash-verify (atlas.citation_catalog_content_hash.v1, mirroring
    atlas.pack_content_hash.v1) a versioned local catalog at configs/atlas/catalogs/<catalog_id>/catalog.yaml
    (committed tsc2 template metadata-only, sources: []; load_catalog accepts str|os.PathLike for
    path_or_catalog_id and content_root, classifying a str stat-independently as a repo-root catalog id
    or an explicit path, os.PathLike always explicit); resolve identifiers for grounding only when
    role==direct_evidence_leaf AND source_type in {PRIMARY-LIT,DATASET} AND permitted_use==grounding_and_quote
    AND verification==verified AND >=1 identifier AND verified raw content (load is structural-only; a
    non-grounding row loads for context but fails resolve-for-grounding); recompute raw and extracted-text sha256/byte-length from disk under an
    explicit external content root (reject absolute/drive/.. paths and symlink/junction escape; never trust
    catalog-declared hashes); verify an exact_quote at a text-char:<start>:<end> locator against extracted
    UTF-8 text normalized by atlas.text_norm.v1 (CRLF/CR to LF, NFC, no case-fold, no whitespace collapse),
    with no fuzzy matching. Add frozen types CitationIdentifier/CatalogSource/ContentVerification/
    ResolvedCitation/VerifiedSpan and a runtime_checkable CitationResolver protocol (resolve, verify_span)
    in model.py; retype PromotionContext.citation_resolver from Callable to that protocol; candidate bib
    carries raw scheme-less payloads (pmid digits, pmcid PMC+digits, doi bare 10. payload, accession
    <namespace>:<opaque>); rewrite Gate 3 to construct prefixed identifiers by concatenation (rejecting an
    already-prefixed/URL/whitespace bib value structurally with AtlasSchemaError before the resolver, and
    rejecting bare-boolean resolvers) into a per-candidate resolved-source map with all supplied bib aliases
    resolving to the same source, and Gate 4 to verify each
    linked claim exact span, preserving the eight-gate order/short-circuit and the named-human Gate 8 after
    deterministic verification; add a static assert_no_network_imports guard. Typed errors under a new
    AtlasCatalogError family distinguish catalog schema/hash/path, identifier resolution, content drift and
    span mismatch, and are raised only by the resolver; promotion Gate 3/4 translate them into the existing
    AtlasProvenanceError/AtlasSchemaError (via from exc) and the network guard raises AtlasLeakageError. Out of scope: any network fetch, a source-acquisition/refresh adapter, PDF/HTML/XML
    parsing, fuzzy matching, dataset row/key locators, a source-registry platform, Discovery comparison.
    Internal handoffs and derived summaries may seed queries but never ground claims and are never a catalog
    grounding leaf. Acceptance: RED tests authored by Gemini (new tests/atlas/test_citation_resolver.py plus
    repaired tests/atlas/test_discovery_candidate_import.py and tests/atlas/test_hashing_import_guards.py)
    covering catalog load/hash, normalize, resolve, content drift, exact span and adversarial
    traversal/symlink/duplicate-alias/hash-drift/CRLF/Unicode/duplicate-quote/offset/span-mismatch/source-role/
    promotion-gate-order cases; Sonnet implements only the authorized files; fixtures fully synthetic (no real
    PMID/PMCID/DOI, no real quote, no R611Q content); Phase-1 hashing/profile/identity/pack/export behavior and
    the full tests/atlas suite stay green; GPT-5.4 checker CLEAN. Does not block Aug-2 application packaging.
    Completed and merged at dc8826b: offline catalog resolver, exact lowercase self-hash,
    fail-closed path/content verification, strict PMID/PMCID/DOI/ACCESSION normalization,
    text-char exact-span binding, Gate 3/4 integration, static no-network guard and 64 passing
    Atlas tests.'
  status: done
  depends_on:
  - build-mechanism-atlas-starter
  created: '2026-07-27'
