  created: '2026-08-02'
- id: atlas-phase2-candidate-universe-enrichment
  title: Enriching and re-locking the Atlas candidate universe
  description: 'Track: MECHANISM-ATLAS / PHASE-2. Starting from the immutable 35-row
    identity-custody universe v1, populate every attributable functional observation needed by
    the frozen selection protocol: reported outcome bucket, assay kind, model/context,
    throughput class, normalized source identifiers, dataset/version/program/lab/protocol
    lineage, access/licence state, span verifiability and attributable bucket basis. Preserve
    explicit evidence-absent, access-blocked and unresolved states; never infer mechanism from
    classifications, predictors, residue proximity or availability. Do not rank or select.
    Publish a versioned external candidate_universe v2 plus a new tracked candidate-free lock
    record; retain v1 and its lock unchanged for audit. Corrections require a version bump and
    full hash/conservation/replay verification. Completed 2026-08-03: external v2 universe
    published at D:\AIProjects\raptor-data\atlas\tsc2-phase2-panel-v2\candidate_universe.yaml
    (universe_content_hash
    eba2708fb09f58dd1b237c33feedc70241a1a312cbb62380167e12c9a70c3c7e); raw inventory and
    normalization ledger remain byte/hash-identical to v1 (35 raw rows, 35 ledger rows, 35
    records; 28 resolved plus 7 unresolved identities; 31 missense plus 4 non-missense hints,
