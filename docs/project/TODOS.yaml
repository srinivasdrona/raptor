- id: define-variant-mechanism-atlas
  title: Defining RAPTOR Mechanism Atlas
  description: 'Scope a literature-only TSC1/TSC2 mechanism evidence atlas covering known,
    benign, pathogenic, conflicting, and VUS variants. Model observed evidence across DNA
    change, RNA/splicing/transcript effects, protein abundance/stability/complex function,
    mTORC1 signaling, cell/tissue effects, and clinical manifestations. Preserve source provenance,
    assay/model context, contradictions, uncertainty, penetrance, mosaicism, tissue specificity,
    and unknown links; never claim deterministic phenotype or perform new experiments. Start
    with a bounded pilot and keep implementation behind completion of current production-parity
    correction work. Begin with a prior-art inventory of the Dutch/European Nellist and Hoogeveen-Westerveld
    functional-assay program and related TSC1/TSC2 studies; identify what is already synthesized
    versus what remains fragmented across papers, assays, databases, tissues, and phenotypes.
    Initial scope is TSC2 only. Keep clinical classification and mechanism synthesis as separate
    outputs; mechanisms may be multi-label and context-dependent. Rescue links require direct
    published evidence and cannot become treatment recommendations. Cross-disease or TSC1
    expansion requires a successful bounded TSC2 pilot and is not immediate scope. Architectural
    decision: build inside RAPTOR as a strict internal module named RAPTOR Mechanism Atlas,
    not an ad hoc folder. Require its own schema/contracts, tests/fixtures, explicit canonical-ID
    inputs and mechanism-profile outputs, bidirectional import/leakage guards from scoring
    logic, independent validation criteria, and a documented extraction seam. Extract to a
    separate repository only after reuse is demonstrated by another gene and/or another consumer.
    Durable starting artifact: docs/project/atlas/MECHANISM_ATLAS_HANDOFF.md. Treat that handoff
    as preliminary discussion, not authority: re-verify every R611Q pathogenicity, zygosity,
    molecular-mechanism, assay and rescue statement against primary evidence; unresolved claims
    remain hypotheses/unknowns and cannot become treatment recommendations. Definition and
    portability contract completed 2026-07-23 at merge 9709ec6: ADR-0014 separates a
    condition-agnostic core from the versioned TSC2 disease pack while preserving the
    TSC2-only product and pilot scope.'
  status: done
  depends_on:
  - rerun-masked-gate
  created: '2026-07-13'
