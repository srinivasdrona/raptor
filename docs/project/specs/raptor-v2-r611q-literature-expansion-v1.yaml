article_index:
  schema: raptor.external.r611q_literature_article.v1
  one_row_per: new PMID lead
  exact_fields:
    - schema
    - pmid
    - discovery_sources
    - pubmed_status
    - pmcid
    - doi
    - title
    - publication_date
    - publication_date_precision
    - abstract
    - europe_pmc_status
    - is_open_access
    - licence
    - fulltext_status
    - fulltext_artifact_id
  invariants:
    - exactly 69 unique PMID rows sorted numerically
    - discovery_sources is a non-empty ordered subset of [litvar2, clinvar]
    - unresolved PubMed rows retain null bibliographic fields explicitly
    - fulltext_artifact_id is non-null only when fulltext_status is ACQUIRED_CC_BY
    - no evidence claim, pathogenicity assertion or classification is present

output:
  external_bundle:
    environment_variable: RAPTOR_R611Q_LITERATURE_ROOT
    default_root: ~/raptor-data/external/r611q-literature
    run_name: r611q-literature-expansion-2026-09-15
    bundle_id: r611q-literature-expansion-2026-09-15
    create_only: true
    artifacts:
      - raw/litvar2-publications.json
      - raw/clinvar-esearch.json
      - raw/clinvar-pubmed-links.json
      - raw/pubmed-efetch.xml
      - raw/europepmc-core.json
      - normalized/article-index.jsonl
      - fulltext/{pmcid}.xml
      - bundle_manifest.json
  committed_summary:
    path: data/census/r611q_literature_expansion_2026-09-15.json
    contains:
      - baseline and source-response hashes
      - lead, record, abstract, PMCID, DOI and licence counts
      - full-text candidate/acquisition counts and hashes
      - unresolved source counts
      - explicit non-clinical boundaries
    excludes:
      - article title or abstract text
      - PMID, PMCID, DOI or per-article identity
      - full text or extracted spans
      - evidence claims or classifications

implementation:
  package: src/raptor/external/r611q_literature/
  operator: scripts/fetch_r611q_literature_expansion.py
  config: configs/external/r611q_literature_expansion_v1.yaml
  tests: tests/external/test_r611q_literature_expansion.py
  reuse:
    - raptor.external.tsc2_sources endpoint/transport validation patterns
    - raptor.external.tsc2_sources.pubmed partial-date parsing
    - raptor.external.tsc2_sources.pmc JATS PMCID/licence parsing
    - raptor.external.tsc2_sources.bundle create-only publication primitive

delivery_checks:
  - exact endpoint and redirect identity for every request
  - raw response bytes are preserved and hashed before parsing
  - baseline, LitVar2 and ClinVar PMID sets are deduplicated deterministically
  - PubMed missing records are explicit rather than silently dropped
  - PMID, PMCID and DOI are crosswalked from article-level metadata, never array position
  - only exact CC BY records are eligible for full-text download
  - every downloaded JATS licence is independently checked
  - all output is external/create-only and the manifest is written last
  - the committed summary is aggregate-only
  - live source counts are recorded; the planning reference is diagnostic only,
    and source additions/removals never fail publication when structural and
    arithmetic checks pass
  - source_response_hashes exactly equal the hashes of all RAW_RESPONSE artifacts
  - fulltext_artifact_hashes exactly equal the sorted hashes of all FULLTEXT_XML artifacts
  - caller rate-limit overrides are finite and may only increase configured minimum intervals

boundaries:
  discovery_indices_are_not_evidence: true
  claim_promotion: forbidden
  clinical_use: forbidden
  evidence_strength_use: forbidden
  ps3_bs3_use: forbidden
  score_use: forbidden

follow_on:
  - measure new exact-span and variant-level evidence yield from the expanded corpus
  - expand to the historical $TSC2$ PubMed/Gene union only if the bounded slice produces useful primary-source yield
