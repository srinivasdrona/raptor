schema: raptor.project.spec.v1
spec_id: raptor-v2-r611q-literature-expansion-v1
spec_version: 1.0.2
status: APPROVED_BUILD
created_at: '2026-09-15'
owner: human-terminal-authority
branch: feature/raptor-v2-r611q-literature-expansion-v1
stacked_on:
  branch: feature/raptor-v2-missense-sources-v1
  commit: 4b319058d6f40ab68a62de36eea4322d25266032

objective: >-
  Increase the lawful primary-literature coverage available for the $TSC2$
  $R611Q$ Atlas anchor. Union LitVar2 and ClinVar citation leads, subtract the
  existing discovery shelf, acquire the new PubMed records and abstracts,
  enrich article identities and licences through Europe PMC, and download
  JATS full text only for articles explicitly reported as CC BY.

non_goals:
  - score transformation, calibration or threshold selection
  - $PS3$/$BS3$ or any other ACMG evidence assignment
  - claim extraction, Atlas claim promotion or Gate 8 adjudication
  - clinical classification, public worklist or ClinVar submission
  - full historical $TSC2$ literature retrieval
  - bulk acquisition of all LitVar2 $TSC2$ gene results
  - download of CC BY-NC, CC BY-NC-ND, CC BY-NC-SA or licence-absent full text

variant:
  gene: TSC2
  rsid: rs28934872
  spdi: NC_000016.10:2070570:G:A
  hgvs_c: NM_000548.5:c.1832G>A
  hgvs_p: NP_000539.2:p.Arg611Gln
  litvar_id: litvar@rs28934872##
  clinvar_uid: '12397'

baseline:
  environment_variable: RAPTOR_R611Q_BASELINE_MANIFEST
  schema: rescuescreen.r611q.discovery_shelf_sources.v1
  sha256: 8dd13997581fc06998edd0bc73042ae1e8a059bbd2d0dccef4656da1166d1468
  byte_length: 26297
  expected:
    pmid_publications: 31
    doi_only_publications: 2
  rule: >-
    The baseline is read only to identify already-known publication IDs.
    Existing cards, text and source records are never modified by this slice.

sources:
  litvar2_publications:
    role: variant_publication_discovery
    endpoint: >-
      https://www.ncbi.nlm.nih.gov/research/litvar2-api/variant/get/litvar%40rs28934872%23%23/publications?format=json
    expected:
      pmids: 51
      pmcids: 48
    note: >-
      PMID and PMCID arrays are independent sets and must never be zipped by
      index. LitVar2 is a discovery index, not primary evidence.

  clinvar_uid_search:
    role: variant_record_resolution
    endpoint: >-
      https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=clinvar&term=rs28934872&retmode=json&retmax=20&tool=raptor
    expected_uid: '12397'

  clinvar_pubmed_links:
    role: citation_discovery
    endpoint: >-
      https://eutils.ncbi.nlm.nih.gov/entrez/eutils/elink.fcgi?dbfrom=clinvar&db=pubmed&id=12397&linkname=clinvar_pubmed&retmode=json&tool=raptor
    expected_pmids: 50
    note: ClinVar citations are discovery leads and never substitute for the cited paper.

  pubmed:
    role: bibliographic_metadata_and_abstracts
    endpoint: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi
    request:
      method: GET
      db: pubmed
      rettype: abstract
      retmode: xml
      tool: raptor
      id_source: derived_new_pmid_union
    batch_size: 200
    bounded_slice_rule: >-
      The derived new-PMID set must fit in one batch for this slice. The raw
      PubMed artifact records the exact derived EFetch requested and final URLs;
      synthetic "batched" URL placeholders are forbidden.

  europe_pmc:
    role: article_identity_access_and_licence_enrichment
    endpoint: https://www.ebi.ac.uk/europepmc/webservices/rest/search
    request:
      query_source: derived_new_pmid_union
      resultType: core
      pageSize: 1000
      format: json

  fulltext:
    role: explicitly_licensed_primary_text
    endpoint_template: >-
      https://www.ebi.ac.uk/europepmc/webservices/rest/{pmcid}/fullTextXML
    allowed_metadata_licences: [CC BY]
    required_jats_licence: CC BY
    rule: >-
      Fetch only PMCID records whose Europe PMC core metadata reports exactly
      CC BY. The JATS document must identify the expected PMCID and contain an
      explicit attribution-only Creative Commons licence declaration without
      NC, ND or SA restrictions.

