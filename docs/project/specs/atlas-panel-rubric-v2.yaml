supersedes_scope: >-
  Interpretation policy only. This rubric supersedes NOTHING in the frozen
  selection protocol's executable behaviour, NOTHING in ADR-0017's preserved
  formal result or product separation, and NOTHING in ADR-0013's prospective
  lock. It changes how an already-produced machine result may be DESCRIBED,
  never what the machine did or what it produced.

contract: >-
  Add a versioned, scarcity-aware, post-hoc interpretation layer without
  editing or replacing the original machine result. Report machine outcome and
  contextual outcome side by side, on independent axes, with an explicit claim
  ceiling and an explicit prospective/post-hoc state. Select no panel, approve
  no panel, fabricate no human decision, and never let scarcity raise a claim.

authority:
  - docs/project/atlas/ATLAS_PHASE2_PANEL_SELECTION_PROTOCOL.md
  - docs/project/atlas/atlas-phase2-panel-selection-registration-v1.yaml
  - configs/atlas/panels/tsc2/atlas-phase2-candidate-universe-lock-v4.yaml
