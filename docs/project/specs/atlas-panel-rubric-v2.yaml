# RAPTOR Atlas panel RUBRIC v2 -- versioned interpretation rubric.
#
# This file is a RUBRIC. It contains NO code, NO tests, NO candidate identity,
# NO candidate count, NO functional result, NO selection, NO classification and
# NO human approval. It does not execute, re-execute, re-run, re-sign, re-hash,
# edit, reinterpret in place or supersede any run record.
#
# It defines (a) a GENERAL versioned-rubric change mechanism for RAPTOR
# adjudication rubrics, and (b) a FIRST context profile for rare-disease
# specialist literature, applied post hoc to the audited 2026-08-06
# INFEASIBLE_PANEL result.
#
# The machine result is immutable. This rubric ADDS a contextual layer beside
# it. It never replaces, weakens or overwrites it. Scarcity LOWERS claim
# ceilings; it never strengthens evidence.
#
# Authority order for BEHAVIOUR (this rubric is subordinate to all of them):
#   1. docs/project/atlas/ATLAS_PHASE2_PANEL_SELECTION_PROTOCOL.md  (v1.0.4, frozen)
#   2. docs/project/atlas/atlas-phase2-panel-selection-registration-v1.yaml
#   3. configs/atlas/panels/tsc2/atlas-phase2-candidate-universe-lock-v4.yaml
#   4. configs/atlas/panels/tsc2/atlas-phase2-raw-identity-map-lock-v4.yaml
#   5. docs/DECISIONS.md (ADR-0013/0014/0015/0016/0017/0019) and
#      docs/project/specs/atlas-panel-products-v1.yaml
# Where this rubric and the frozen protocol appear to differ, the protocol
# governs and this rubric is defective. Existing code is NOT behaviour
# authority. This rubric is NOT executable and gates nothing today.

