# RAPTOR corrected ADR-0012 expert-review packets — Opus planner contract (rev 1).
#
# Purpose: an implementation-ready, hash-bound, DRY plan to regenerate the
# internal TSC candidate-evidence review packets for the `clinvar_2026-07-07`
# VUS run under the APPROVED ADR-0012 disabled/manual PP3/BP4 policy and the
# CURRENT (disabled_manual) census — building the COMPLETE 164-packet candidate
# universe (157 candidate_LP_review + 7 candidate_LB_review selection strata),
# a deterministic queue/index and aggregate manifest, first-pass blinded views,
# explicit unresolved/manual exclusion counts, and a preregistered eight-case
# Discovery evaluation sample — while preserving the historical 30-pattern
# calibration-batch path byte-for-byte.
#
# This file is the planner PLAN ONLY. It performs NO implementation, NO tests,
# NO code/config/data edits, NO packet generation, NO gate/scope-gate/policy
# change, NO x64 run, NO new annotation, and writes NO packet/queue/manifest
# artifact. It names the exact downstream implementation scope, input/output
# schemas and hash contracts, the reuse-vs-extend architecture decision, the
# Gemini RED/unit/integration matrix, the Sonnet file boundaries, the GPT-5.4
# anti-trace-cribbing/privacy/policy probes, the deterministic CLI + output
# boundary, the migration/backout + Discovery handoff, and the Beat-4 self-audit.
#
# Schema: raptor-corrected-review-packets-planning-v1 (planner). The emitted
# packet artifacts use the PRD-04 CandidateEvidencePacket schema and are DOER
# RUNTIME OUTPUTS written OUTSIDE Git to the external RAPTOR data root; only a
# non-identifying aggregate manifest + the preregistered sample commitment are
# in-repo, and NEITHER is written by this planner commit.

