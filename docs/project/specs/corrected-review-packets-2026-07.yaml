      - tests/packet/test_corrected_universe_conservation.py
      - tests/packet/test_corrected_discovery_sample.py
      - tests/packet/test_corrected_real_data_integration.py
    count: 4
    ordering: Gemini authors + RED-verifies these before Sonnet implements.
  preservation_scope_do_not_touch:
    - data/census/tsc_calibration_batch_2026-07-11.json (frozen historical 1,571-universe calibration)
    - data/census/tsc_bias_lineage_audit_2026-07-10.json (historical pre-ADR-0012 static audit)
    - data/census/** other stats/gate/audits (read-only, hash-bound)
    - configs/** (all policy/config; read-only, hash-bound)
    - src/raptor/census/strata.py and src/raptor/packet/{build,queue,render,model,hashing,direction,decisions,state}.py (reused; only build/model minimally extended for the D12 evidence-absent packet, behavior-preserving for existing callers)
    - scripts/build_tsc_calibration_batch.py and tests/packet/test_tsc_calibration_batch.py (reused by import; behavior + tests unchanged)
    - src/raptor/eval/gate.py, src/raptor/eval/scope_gate.py (authoritative gates)
    - the external raptor-data inputs (arm's-length, read-only)
  branch_counts: {planner: 1, sonnet: 4, gemini: 4, total_branch: 9}

# --------------------------------------------------------------------------
# 9. Gemini RED / unit / integration test matrix
# --------------------------------------------------------------------------

test_matrix:
  principles:
    - A test that merely loads a written packet/manifest and asserts its recorded
      values is VACUOUS and forbidden.
    - Synthetic unit tests exercise the algorithm; the real-data check recomputes
      from raw inputs through the reused seams.
  unit_universe:
    - 'G-CP1 full universe == every manifest identity -> exactly one packet (6,618) across four strata (157 LP + 7 LB + 6,424 unresolved + 30 manual); an input permutation re-renders byte-identically.'
    - 'G-CP2 every packet has candidate_direction=null, null_reason=production_policy_unapproved, review_state=POLICY_BLOCKED, in every stratum.'
    - 'G-CP3 the eval LP/LB (and unresolved/manual) stratum appears ONLY in pattern_ref.census_selection_stratum, NEVER in candidate_direction (AC4).'
    - 'G-CP4 FIRST_PASS projection strips the whole external_comparators envelope AND candidate direction/signed points/policy id/census direction labels; per-stratum queues + the candidate-priority queue consume only FIRST_PASS.'
    - 'G-CP5 the candidate-priority queue has exactly 164 entries (157 LP + 7 LB); the per-stratum summary records 6,424 + 30 excluded-from-priority; 164 + 6,454 == 6,618.'
    - 'G-CP6 every fired PP3/BP4 renders with lineage disposition deferred bound to the current d2312… config; ZERO scored PP3/BP4; no candidate-direction point.'
    - 'G-CP7 a zero-fired-criteria row produces a deterministic evidence-absent packet (empty scored set + MissingEvidence), conserving 6,618 (D12).'
    - 'G-CP8 manual_review stratum == the 30 NTHL1 rows == census annotation_manual_review; no double-count (D11).'
  unit_conservation:
    - 'G-CP9 current-policy conservation reads the disabled_manual schema (raptor_current_policy_internal_direction 157/7/6,424/30, candidate_pattern_compression 7/2, source_hashes, run_integrity) and fails closed on drift; it does NOT read worker/run_integrity.input_vcf_sha256 and does NOT assert 238/1,333.'
    - 'G-CP10 identity/row/exact-join/source-hash invariants (6,618/6,618/one-to-one/3fff/0a55/7f99) conserved before any write; all counts derived, no expected-count literal in production code.'
  unit_hash_semantics:
    - 'G-CP11 the four subordinate configs verify by RAW on-disk byte SHA-256 against the approved-policy pins (1ba8066a/ea4ff684/d2312b2c/778882c5); the predictor policy ARTIFACT verifies by LF blob (85e9e92f); committed data artifacts verify by LF blob; a raw-vs-LF mismatch or a drifted config fails closed.'
  unit_provenance:
    - 'G-CP12 git-provenance helper resolves the FULL 40-hex HEAD on a clean tree; fails closed (raises, no output) on a dirty tree or an abbreviated/unresolvable commit.'
  unit_discovery_sample:
    - 'G-CP13 eight-case sample is 2/2/2/2 across LP/LB/unresolved/manual from the full packet universe, deterministic (SPDI-sorted first-two per stratum), reproduces identically, committed as packet hashes with NO raw identity.'
  unit_output_boundary:
    - 'G-CP14 full artifacts write ONLY under a NEW external run directory; any in-repo path is refused; an existing run directory (or any historical artifact name) is never overwritten; publication is atomic; canonical LF bytes.'
  integration_real_data:
    cases:
      - 'G-CP15 opt-in (env-gated RAPTOR_PACKET_REAL_DATA=1) run over the immutable manifest + BIAS TSV + provenance + current configs asserts the binding oracles: 6,618 identities/rows -> 6,618 packets across four strata (157/7/6,424/30); candidate-priority queue 164; excluded-from-priority 6,454; 7/2 patterns; raw PP3 2,226 / BP4 3,696 / union 5,474 / scored 0; all-strata point distribution summing to 6,618 (0 band==149); every packet null/POLICY_BLOCKED; the deterministic eight-case sample. Writes only under a throwaway external temp root; never reads a written artifact as its own oracle; skipped cleanly when inputs/env absent.'
    mandatory: >-
      G-CP15 is a REQUIRED selector case (F4). Exact invocation (PowerShell):
      $env:RAPTOR_PACKET_REAL_DATA="1"; python -m pytest tests/packet/test_corrected_real_data_integration.py -q

# --------------------------------------------------------------------------
# 10. Sonnet implementation contract
# --------------------------------------------------------------------------

sonnet_contract:
  must:
    - Build a packet for EVERY VUS (6,618) across four strata by reusing
      build_candidate_universe + build_full_vus_universe + the packet path; emit
      per-stratum queues, the 164 candidate-priority queue, the stratum summary,
      and the preregistered eight-case sample.
    - Derive every count from inputs; keep production code free of benchmark
      labels and expected-count literals.
    - Verify the approved policy artifact by LF blob + the four subordinate/packet
      configs by RAW on-disk byte SHA-256 + immutable input hashes before
      processing; fail closed on drift; run current-policy conservation before any
      write.
    - Keep every packet candidate_direction=null / POLICY_BLOCKED; carry the
      stratum ONLY in pattern_ref; deliver reviewers ONLY the FIRST_PASS
      projection; bind PP3/BP4 lineage to the current d2312… config as deferred.
    - Write full artifacts ONLY under a NEW external run directory, atomically,
      no-overwrite; resolve full-40-hex code_commit and fail closed on a dirty tree.
  must_not:
    - Generate any packet/queue/manifest artifact in the planner step, or write
      full packet artifacts into Git.
    - Reuse assert_source_of_record_conservation's historical direction assertions
      (238/1,333) or its worker/run_integrity.input_vcf_sha256 reads.
    - Change scripts/build_tsc_calibration_batch.py behavior or its tests; edit
      gate.py, scope_gate.py, any config, or any census/audit/calibration data file.
    - Overwrite, regenerate, or rename the frozen 2026-07-11 calibration artifact,
      or claim the current config reproduces it byte-identically.
    - Embed the 2026-07-10 (743a…) audit as current provenance, or mix raw-byte
      and LF-blob pins.
    - Serialize any stratum into candidate_direction, reveal AAVC (or its
      direction) in FIRST_PASS, or let PP3/BP4 become a scored call.
    - Tune, round, or "fix" the disappointing disabled-mode counts.

# --------------------------------------------------------------------------
# 11. GPT-5.4 checker probes (anti-trace-cribbing + privacy + policy)
# --------------------------------------------------------------------------

gpt_probes:
  probes:
    - 'P1 trace_cribbing — no expected-count literal (6618/164/157/7/6424/30/6454/238/1333/1571/2226/3696/5474/7/2/8) in src/raptor/packet/ or scripts/build_corrected_review_packets.py; counts derived; spec/historical/gate never scoring inputs.'
    - 'P2 all_vus_coverage — a packet exists for every VUS (6,618) across four strata; unresolved/manual are packeted (not dropped); 164 is only the candidate-priority queue.'
    - 'P3 direction_leakage — no packet serializes any stratum into candidate_direction; every packet is null / production_policy_unapproved / POLICY_BLOCKED.'
    - 'P4 first_pass_blinding — the FIRST_PASS projection and every queue carry no candidate direction, signed points, policy id, census direction label, or AAVC comparator.'
    - 'P5 hash_semantics — subordinate/packet configs verified by RAW on-disk byte SHA-256 against the approved-policy pins; predictor policy artifact + committed data artifacts by LF blob; no raw-vs-LF mixing; fails closed on drift.'
    - 'P6 stale_audit — the 2026-07-10 (743a…) audit is NOT embedded as current; packet lineage binds to the current d2312… config; current firing/incidence derived directly.'
    - 'P7 historical_frozen — the 2026-07-11 1,571-universe artifact is never overwritten/regenerated/renamed and no current-config byte-repro is claimed; the calibration script + tests are unchanged.'
    - 'P8 pp3bp4_deferred — both PP3 and BP4 render as deferred, scored 0, no candidate-direction point; both counted in suppression.'
    - 'P9 provenance_fail_closed — full 40-hex code_commit on a clean tree; a dirty/abbreviated/unresolvable commit fails closed before any write.'
    - 'P10 output_boundary — full artifacts only under a NEW external run directory, atomic + no-overwrite; identity never committed in-repo; only non-identifying aggregates + packet-hash sample commitments may be (later) committed.'
    - 'P11 manual_mapping — stratum manual_review == census annotation_manual_review == 30 NTHL1; no double-count.'
    - 'P12 evidence_absent — zero-fired rows produce deterministic evidence-absent packets so the universe conserves 6,618.'
  posture: >-
    The measured result may be scientifically disappointing and must not be
    tuned; the checker verifies faithfulness, not favorable numbers.

# --------------------------------------------------------------------------
# 12. Deterministic CLI + output boundary
# --------------------------------------------------------------------------

cli_and_output_boundary:
  cli:
    args: [--manifest, --bias-tsv, --provenance, --census-stats, --packet-config,
           --selection-config, --render-config, --narrative-catalog, --comparator-config,
           --scorer-config, --eval-config, --predictor-policy, --output-root,
           --run-name, --aavc-comparator, --dry-run, --summary]
    determinism: >-
      Canonical bytes: UTF-8, sort_keys=True, LF-only on every platform, exactly
      one terminal newline, explicit byte encode + binary write (never
      Path.write_text / text-mode LF->CRLF). code_commit is the FULL 40-hex
      `git rev-parse HEAD`; a dirty tree or abbreviated/unresolvable commit fails
      closed. Packet/queue ordering is by packet_id.
  output_boundary:
    accept: >-
      A NEW run-scoped directory UNDER the external RAPTOR data root (outside the
      repository tree), created atomically and only when it does not already
      exist, with a name distinct from every historical artifact.
    refuse:
      - any path inside the repository tree (packets/queues/first-pass/manifest never enter Git)
      - overwriting ANY existing run directory or artifact, or reusing a historical artifact name
      - any non-canonical/text-mode write
    enforcement: check-before-write; conservation + hash verification precede any bytes.
  dry_run: proves the full verify + conservation + universe + sample path runs and summarizes WITHOUT writing.

# --------------------------------------------------------------------------
# 13. Migration / backout + Discovery handoff
# --------------------------------------------------------------------------

migration_and_backout:
  migration:
    - Land planner spec (this commit) -> Gemini RED tests -> Sonnet
      corrected-universe module + CLI + provenance helper (+ minimal
      evidence-absent build/model extension) -> GPT-5.4 checker probes ->
      orchestrator runs the real 6,618-row build to a NEW external run directory
      and freezes the non-identifying aggregate + the preregistered eight-case
      sample. The frozen 2026-07-11 artifact and the calibration script/tests are
      untouched throughout.
  backout:
    - Revert the corrected module/CLI/helper (+ the minimal build/model
      extension); the calibration script, its tests, configs, census, gates,
      audits, and the frozen historical artifact were never behavior-changed, and
      no in-repo data artifact was written, so no data backout is needed.
  discovery_handoff:
    - This track generates NO packets in the planner step and authorizes NO
      classification, worklist, submission, or clinical claim.
    - The Discovery eight-case comparison starts ONLY from the frozen sample
      after the checker returns CLEAN; it is an ecosystem experiment, gated by the
      negative masked gate (vus_authorized=false, BLOCKED_POLICY) and expert
      sign-off — never authorized by this packet run.

