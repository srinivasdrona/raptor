# --------------------------------------------------------------------------
# 1. Binding decisions (ADR-0012 + PRD-04 + certified negative gate)
# --------------------------------------------------------------------------

binding_decisions:
  adr_0012:
    reference: 'docs/DECISIONS.md#adr-0012--pp3bp4-automated-emission-disabled-for-the-current-masked-rerun'
    status: approved
    mode: disabled_manual
    invariants:
      - PP3/BP4 are absent from production `included_criteria`, evaluation
        `automatable_criteria`, and packet candidate-direction points; every
        automated PP3/BP4 call is suppressed and reported (ZERO scored calls).
      - PP3/BP4 remain in the ACMG vocabulary and BIAS can-fire lineage with
        `deferred` dispositions for manual review (never deleted).
      - Approval authorizes only the disabled/manual evidence mode. It does NOT
        authorize a VUS classification, research scope, clinical claim, public
        worklist, or ClinVar submission.
  prd_04:
    reference: docs/prd/PRD-04-candidate-evidence-packet.md
    invariants:
      - Packet facts are assembled deterministically from an injected
        `PacketInput` (BIAS rows + census strata + approved configs); NO LLM/KB/
        benchmark/label file is reachable from packet generation (FR-d falsifier).
      - The production candidate-direction policy is UNAPPROVED, so every packet
        keeps `candidate_direction=null`, `null_reason=production_policy_unapproved`,
        and review state `POLICY_BLOCKED` (§4.5 T2). Direction-null packets stay
        first-pass EVIDENCE-reviewable via the direction-blinded FIRST_PASS view.
      - The eval-only candidate LP/LB selection stratum is carried ONLY as
        `pattern_ref.census_selection_stratum`; it MUST NEVER be serialized into
        the production `candidate_direction` field (FR5/FR16, AC4).
      - The redact_for_first_pass(packet) projection strips the entire
        external_comparators envelope AND candidate_direction/signed points/policy id/census direction
        labels; queue + reviewer delivery consume ONLY the FIRST_PASS projection
        (FR14.1, AC4/AC17/AC20).
      - The four named packet hashes (§4.2 packet/core/envelope + decision-log)
        are deterministic; a state/reviewer action never mutates a prior hash.
      - AAVC is a reveal-only disagreement comparator (`external_comparators`),
        excluded from `evidence_core_hash` and the FIRST_PASS view; it NEVER
        enters criteria, the combiner, or grounding (FR27, AC17).
  certified_masked_gate_is_negative:
    record: data/census/tsc_masked_holdout_gate_disabled_manual_2026-07-21.json
    sha256: 7c55cd4e3059713d1d53886d8893a3819153375b62ce9d37187d731132c6a77f
    sha256_provenance: committed_git_lf_blob
    sha256_windows_crlf_checkout_do_not_pin: e914f65231c8004b1c7a96d2fe80bd49bac591433112699ff91cc5b027e55207
    hash_rule: >-
      Committed data-artifact identity is the canonical Git/LF blob SHA-256
      (7c55…), NOT the Windows autocrlf CRLF checkout SHA-256 (e914…). The CRLF
      hash is a local-filesystem artifact and must never be pinned.
    legacy_v1_gate: FAIL
    full_spectrum_status: BLOCKED_POLICY
    vus_authorized: false
    tiered_v3: post_hoc_only_full_spectrum_not_authorized
    note: >-
      This masked-holdout gate is a DIFFERENT corpus (2,577 masked held-out
      rows) from the 6,618-VUS packet universe. It gates external readiness; the
      packet run is an internal, non-authoritative evidence assembly and does
      not depend on the gate's suppression numbers.
  authority_boundary:
    statement: >-
      A packet organizes INTERNAL, eval-only review evidence. No packet or queue
      is an external worklist, a classification, an expert decision, a ClinVar
      submission, or a clinical claim. Candidate LP/LB directions are
      non-authoritative selection metadata only; AAVC is a reveal-only
      comparator, never a label or criterion source.

# --------------------------------------------------------------------------
# 2. Decision ledger + rejected alternatives (smallest DRY architecture)
# --------------------------------------------------------------------------

decision_ledger:
  D1_reuse_existing_seams_verbatim:
    decision: >-
      Reuse, unchanged, the already-extracted packet-free census seam
      (raptor.census.strata: ManifestEntry, StratumEntry, STRENGTH_MAP,
      load_manifest, reproduce_census_strata, _split_consequence_terms,
      _variant_class_for) and the PRD-04 packet path
      (raptor.packet.build.build_packet, raptor.packet.queue.build_queue_index,
      raptor.packet.render.render_markdown, raptor.packet.model.redact_for_first_pass
      / PacketView.FIRST_PASS). scripts/build_tsc_calibration_batch.py already
      assembles the COMPLETE LP+LB universe in build_candidate_universe(); the
      corrected run reuses that function verbatim.
    rationale: >-
      The complete-universe assembly, deterministic packet hashing, first-pass
      blinding, and queue index already exist and are test-covered. The only
      gaps are (a) a current-policy conservation guard, (b) a complete-universe
      writer, (c) fail-closed full-commit provenance, and (d) the preregistered
      Discovery sampler. Reusing the seams is the smallest DRY change.
  D2_current_policy_conservation_not_historical:
    decision: >-
      Add a current-policy conservation guard that reads the DISABLED_MANUAL
      census schema (raptor_current_policy_internal_direction 157 LP / 7 LB,
      candidate_pattern_compression 7/2 exact-strength patterns, source_hashes
      {input_vcf, bias_tsv, manifest}, run_integrity {bias_rows, unique_raw_keys,
      exact_join}). It conserves the policy-invariant identity/row/one-to-one
      join/source-hash invariants (6,618 manifest identities, 6,618 BIAS rows,
      exact vcf_key<->SPDI join) AND the CURRENT-policy direction/pattern counts
      (157/7/7/2). It MUST NOT reuse assert_source_of_record_conservation, which
      reads the HISTORICAL schema keys (census_stats["worker"]["bias"],
      census_stats["run_integrity"]["input_vcf_sha256"]) and asserts the
      PP3/BP4-ACTIVE totals (238 LP / 1,333 LB / 20 / 10) that do not exist in
      the disabled_manual census and would KeyError or falsely fail.
    rationale: >-
      slot-2/slot-3: replace historical direction/pattern conservation with
      current-policy conservation while keeping the old calibration path
      reproducible. The disabled_manual census legitimately carries different
      totals and a different schema (no `worker` block); a separate guard keeps
      the shared, calibration-critical guard untouched.
  D3_derive_facts_never_crib:
    decision: >-
      Production code derives every packet fact from the immutable inputs +
      approved configs + reproduced strata. It contains NO expected-count literal
      (164/157/7/6424/30/238/1333/2226/3696/5474/7/2/8) and never reads this
      spec, the historical stats, or the masked gate as a scoring/fact input.
      The disabled_manual census is read ONLY to conserve counts (fail-closed),
      never to author packet contents.
    rationale: STRATEGY anti-trace-cribbing; slot-2 "LLMs may not add evidence".
  D4_complete_universe_plus_calibration_reproducible:
    decision: >-
      Add a NEW complete-universe writer that emits ALL 164 universe packets
      (OPERATOR JSON), their FIRST_PASS blinded JSON+Markdown views, a
      deterministic reviewer queue/index over the FIRST_PASS projection, an
      aggregate manifest, and explicit unresolved/manual exclusion counts —
      sorted by packet_id, byte-deterministic. The existing calibration-batch
      writer (write_outputs, which emits ONLY the 30-pattern
      select_calibration_batch selection) is left behavior-preserving so the
      historical calibration reproduction stays byte-identical.
    rationale: >-
      slot-2 "distinguish the complete candidate universe from a
      calibration/sample batch"; slot-3 "keep the old calibration path
      reproducible". Complete-universe output != selected calibration batch.
  D5_fail_closed_full_commit_provenance:
    decision: >-
      The corrected run resolves code provenance to the FULL fixed-width 40-hex
      `git rev-parse HEAD` and FAILS CLOSED (raises, no output) when the tree is
      dirty or the commit is unresolvable/abbreviated. It replaces the legacy
      _resolve_code_commit() "unknown"/`--short` behavior for the corrected path
      only, via a shared git-provenance helper with an explicit require_clean +
      require_full_40hex mode. The legacy calibration path keeps its short/legacy
      resolver so its recorded provenance bytes are unchanged.
    rationale: >-
      slot-3: "the corrected packet run must fail closed on a
      dirty/unresolvable full 40-hex commit"; harden artifact code provenance
      before generating new artifacts.
  D6_deferred_pp3bp4_lineage_packet_parity:
    decision: >-
      Bind the CURRENT deferred PP3/BP4 lineage (configs/eval/bias_lineage.yaml
      -> deferred) and packet candidate-direction policy
      (configs/packet/candidate_direction.yaml) via the approved predictor
      policy's recorded canonical hashes; every fired PP3/BP4 BIAS criterion
      renders in the packet with lineage disposition `deferred` (manual review),
      never a scored automated call, and never a `candidate_direction` point.
    rationale: >-
      slot-3: "current PP3/BP4 deferred lineage and packet policy parity";
      PRD-04 FR4.1 fail-loud disposition precedence.
  D7_current_lineage_audit_provenance:
    decision: >-
      The corrected run's aggregate manifest embeds the CURRENT lineage-audit
      artifact (data/census/tsc_bias_lineage_audit_2026-07-10.json) and the
      current predictor-leakage audit (data/census/tsc_predictor_leakage_audit_2026-07.json),
      hash-pinned by canonical Git/LF blob, in place of any older static audit
      artifact.
    rationale: slot-3 "current lineage audit provenance versus older static audit artifacts".
  D8_external_output_boundary_atomic_no_overwrite:
    decision: >-
      Full packet/queue/first-pass/manifest artifacts are written ONLY under the
      external RAPTOR data root (outside the repository tree), with canonical
      bytes, no-overwrite, and atomic publication (write to a temp sibling +
      atomic rename; refuse if the target run directory already exists). Only a
      NON-IDENTIFYING aggregate manifest record and the preregistered sample
      COMMITMENT (hashes only) may be committed in-repo, and ONLY if explicitly
      scoped in a later commit — never by this planner commit.
    rationale: slot-2/slot-3 external-root output boundary + canonical/atomic publication.
  D9_preregistered_eight_case_discovery_sample:
    decision: >-
      Deterministically preregister an eight-case Discovery evaluation sample
      (2 candidate_LP_review, 2 candidate_LB_review, 2 no_deterministic_resolution,
      2 annotation_manual_review) BEFORE any auditor result, with exact
      stratification and hashes. LP/LB cases reference their OPERATOR packet ids +
      packet hashes; unresolved/manual cases (which have NO packet) reference a
      salted commitment hash of their canonical SPDI stratum entry. The sample is
      an ecosystem experiment handoff, NOT packet authorization and NOT a
      worklist.
    rationale: slot-3 required output 5 + Discovery eight-case handoff.

rejected_alternatives:
  - id: R1_reuse_historical_conservation
    option: Reuse assert_source_of_record_conservation for the corrected run.
    rejected_because: >-
      It reads census_stats["worker"][...] and run_integrity["input_vcf_sha256"]
      (absent from the disabled_manual census) and asserts PP3/BP4-ACTIVE totals
      (238/1,333/20/10); it would KeyError or falsely fail (or invite an edit to
      a shared, calibration-critical guard).
  - id: R2_overwrite_calibration_writer
    option: Change write_outputs to emit the full universe.
    rejected_because: >-
      Destroys the byte-identical historical 30-pattern calibration reproduction;
      the complete universe is a distinct output, not a redefinition.
  - id: R3_generate_packets_in_planner
    option: Emit packet/queue artifacts in this planner step.
    rejected_because: slot-3 "Do not generate artifacts in the planner step."
  - id: R4_emit_packets_into_repo
    option: Write full packet artifacts under docs/ or data/ in-repo.
    rejected_because: >-
      slot-2/slot-3: full packet artifacts stay OUTSIDE Git; only non-identifying
      aggregates may be committed if explicitly scoped.
  - id: R5_short_or_unknown_commit
    option: Keep _resolve_code_commit()'s `--short`/"unknown" provenance.
    rejected_because: >-
      slot-3 requires fail-closed full 40-hex provenance on a clean tree before
      generating new artifacts.
  - id: R6_serialize_selection_into_direction
    option: Write the eval LP/LB stratum into candidate_direction to "show" a call.
    rejected_because: >-
      PRD-04 FR5/FR16 AC4: eval-only selection metadata must never enter the
      production candidate-direction field; policy is unapproved -> null/POLICY_BLOCKED.
  - id: R7_reveal_aavc_in_first_pass
    option: Include the AAVC comparator (or its direction) in the FIRST_PASS view.
    rejected_because: >-
      PRD-04 FR14.1/FR27: first-pass reviewers are blinded to BOTH machine
      directions; AAVC is reveal-only and stripped by redact_for_first_pass.

