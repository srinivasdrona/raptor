# --------------------------------------------------------------------------
# 7. Complete-universe outputs + eight-case Discovery sample
# --------------------------------------------------------------------------

outputs:
  complete_universe:
    location: external RAPTOR data root run directory (outside the repo tree)
    artifacts:
      - name: operator_packets
        content: >-
          All 164 CandidateEvidencePacket OPERATOR JSONs (candidate_direction=null,
          null_reason=production_policy_unapproved, review_state=POLICY_BLOCKED),
          canonical bytes, one file per packet_id, sorted by packet_id.
      - name: first_pass_blinded_views
        content: >-
          FIRST_PASS JSON (redact_for_first_pass projection) + FIRST_PASS
          Markdown (render_markdown view=FIRST_PASS) for all 164 packets;
          strips the entire external_comparators envelope AND candidate direction/
          signed points/policy id/census direction labels (FR14.1).
      - name: reviewer_queue_index
        content: >-
          Deterministic queue/index (CSV + JSONL) built by build_queue_index over
          the FIRST_PASS projection ONLY; ordered by packet_id. This is an
          internal review queue, NOT an external worklist.
      - name: aggregate_manifest
        content: >-
          Source/config hashes, full-40-hex code_commit, run pins, the
          current-policy conservation record (164 universe / 157 LP / 7 LB / 7+2
          patterns / 6,424 unresolved / 30 manual excluded), coverage summary,
          embedded current lineage + predictor-leakage audit hashes, pinned
          limitations, and the preregistered sample commitment (below).
      - name: exclusion_report
        content: >-
          Explicit non-identifying exclusion counts: 6,424 no_deterministic_resolution
          + 30 annotation_manual_review (= 6,454) recorded as aggregate counts
          with NO per-variant identity.
    determinism: >-
      All artifacts are byte-deterministic (canonical UTF-8, sorted keys, LF-only,
      one terminal newline) and packet ordering is by packet_id, so any
      input-sequence permutation re-renders byte-identically.
  in_repo_commit_scope:
    planner_commit: NONE beyond this spec file.
    later_optional: >-
      If a subsequent commit is explicitly scoped, ONLY a non-identifying
      aggregate record and the preregistered sample commitment (hashes only) may
      be committed under data/. Full packets/queues/first-pass views NEVER enter
      Git.

eight_case_discovery_sample:
  purpose: >-
    A preregistered, deterministic eight-case Discovery evaluation sample for the
    ecosystem experiment (Gemini vs Sonnet auditor comparison). It is NOT packet
    authorization, NOT a classification, and NOT an external worklist.
  stratification:
    candidate_LP_review: 2
    candidate_LB_review: 2
    no_deterministic_resolution: 2
    annotation_manual_review: 2
    total: 8
  selection_rule: >-
    Deterministic and preregistered BEFORE any auditor result: within each
    stratum, sort the stratum's members by canonical SPDI (byte order) and take
    the first two. LP/LB members map to their OPERATOR packet_id; unresolved and
    manual members (which have NO packet) map to their canonical SPDI stratum
    entry only.
  commitment:
    lp_lb_cases: reference {packet_id, packet_hash, evidence_core_hash} — no raw SPDI in-repo.
    unresolved_manual_cases: reference a salted commitment sha256 over the canonical SPDI + stratum; the salt is recorded in the aggregate manifest so selection is verifiable-but-blinded.
    recorded_in: the aggregate manifest's `preregistered_discovery_sample` block, frozen before auditor results.
  boundary: >-
    An ecosystem experiment handoff only. Discovery comparison starts ONLY from
    this frozen eight-case sample after the checker returns CLEAN and the
    orchestrator runs the real 6,618-row build.

# --------------------------------------------------------------------------
# 8. Implementation + preservation file scopes
# --------------------------------------------------------------------------

implementation_scope:
  planner_commit_this_track:
    files: [docs/project/specs/corrected-review-packets-2026-07.yaml]
    count: 1
  sonnet_doer:
    files:
      - path: scripts/build_corrected_review_packets.py
        action: >-
          create the corrected complete-universe CLI: verify approved policy
          status/mode + config hashes; verify immutable input hashes; reproduce
          strata via raptor.census.strata; build the full 164-packet universe via
          the reused build_candidate_universe; run the NEW current-policy
          conservation guard (157/7/7/2 + identity/row/join/source-hash) BEFORE
          any write; write ALL 164 OPERATOR packets + FIRST_PASS JSON+Markdown +
          deterministic queue + aggregate manifest + exclusion report + the
          preregistered eight-case sample to the EXTERNAL data root, atomically,
          no-overwrite; resolve full-40-hex fail-closed clean code_commit.
      - path: src/raptor/packet/corrected_universe.py
        action: >-
          create the pure current-policy conservation guard
          (conserve_current_policy: 6,618 identities/rows, exact one-to-one join,
          source_hashes, 157 LP / 7 LB / 7+2 patterns from the disabled_manual
          census schema) and the deterministic eight-case Discovery sampler
          (stratified, SPDI-sorted, salted commitment). No expected-count literal;
          imports only raptor.census + raptor.packet.
      - path: src/raptor/packet/git_provenance.py
        action: >-
          create a shared git-provenance helper with a require_clean +
          require_full_40hex mode that fails closed on a dirty/unresolvable/
          abbreviated commit; the corrected CLI uses this mode.
      - path: scripts/build_tsc_calibration_batch.py
        action: >-
          MINIMAL refactor ONLY to route its existing short/legacy provenance
          through the shared helper's legacy mode (behavior byte-preserving); no
          change to its conservation, universe, selection, or writers.
      - path: docs/reference/corrected-review-packets-runbook.md
        action: document the corrected CLI, external output boundary, and non-authoritative boundary (documentation only).
    count: 5
    generated_runtime_output_not_hand_authored:
      - 'external RAPTOR data root: 164 OPERATOR packets + FIRST_PASS views + queue + aggregate manifest + exclusion report + preregistered sample.'
  gemini_test_author:
    files:
      - tests/packet/test_corrected_review_packets.py
      - tests/packet/test_corrected_universe_conservation.py
      - tests/packet/test_corrected_discovery_sample.py
      - tests/packet/test_corrected_real_data_integration.py
    count: 4
    ordering: Gemini authors + RED-verifies these before Sonnet implements.
  preservation_scope_do_not_touch:
    - data/census/** (historical stats, disabled_manual census, certified gate, audits — read-only, hash-bound)
    - configs/** (all policy/config; read-only, hash-bound)
    - src/raptor/census/strata.py and src/raptor/packet/{build,queue,render,model,hashing,direction,decisions,state}.py (reused verbatim)
    - scripts/build_tsc_calibration_batch.py conservation/universe/selection/writers (behavior-preserving)
    - src/raptor/eval/gate.py, src/raptor/eval/scope_gate.py (authoritative gates)
    - the external raptor-data inputs (arm's-length, read-only)
  branch_counts: {planner: 1, sonnet: 5, gemini: 4, total_branch: 10}

# --------------------------------------------------------------------------
# 9. Gemini RED / unit / integration test matrix
# --------------------------------------------------------------------------

test_matrix:
  principles:
    - A test that merely loads a written packet/manifest and asserts its recorded
      values is VACUOUS and forbidden.
    - Synthetic unit tests exercise the algorithm; the real-data check recomputes
      from raw inputs through the reused seams.
  unit_universe:
    - 'G-CP1 complete universe == every LP+LB stratum -> exactly one packet (164); NTHL1/manual + no_deterministic_resolution never enter the universe.'
    - 'G-CP2 every packet has candidate_direction=null, null_reason=production_policy_unapproved, review_state=POLICY_BLOCKED.'
    - 'G-CP3 the eval LP/LB selection stratum appears ONLY in pattern_ref.census_selection_stratum, NEVER in candidate_direction (AC4).'
    - 'G-CP4 FIRST_PASS projection (redact_for_first_pass) strips the whole external_comparators envelope AND candidate direction/signed points/policy id/census direction labels; the queue index consumes only FIRST_PASS.'
    - 'G-CP5 packets are byte-deterministic and ordered by packet_id; an input permutation re-renders byte-identically; the four §4.2 hashes are stable.'
    - 'G-CP6 every fired PP3/BP4 renders with lineage disposition deferred; ZERO scored PP3/BP4 calls; no candidate-direction point.'
    - 'G-CP7 AAVC (if a comparator is supplied) is reveal-only: excluded from evidence_core_hash and absent from FIRST_PASS.'
  unit_conservation:
    - 'G-CP8 current-policy conservation reads the disabled_manual schema (raptor_current_policy_internal_direction 157/7, candidate_pattern_compression 7/2, source_hashes, run_integrity) and fails closed on drift; it does NOT read worker/run_integrity.input_vcf_sha256 and does NOT assert 238/1,333.'
    - 'G-CP9 identity/row/exact-join/source-hash invariants (6,618/6,618/one-to-one/3fff/0a55/7f99) conserved before any write.'
    - 'G-CP10 exclusion counts derived (6,424 unresolved + 30 manual = 6,454); 164 + 6,454 == 6,618; no expected-count literal in production code.'
  unit_provenance:
    - 'G-CP11 git-provenance helper resolves the FULL 40-hex HEAD on a clean tree; fails closed (raises, no output) on a dirty tree or an abbreviated/unresolvable commit.'
  unit_discovery_sample:
    - 'G-CP12 eight-case sample is 2/2/2/2 across LP/LB/unresolved/manual, deterministic (SPDI-sorted first-two per stratum), reproduces identically across runs, and is committed as hashes (LP/LB packet hashes; unresolved/manual salted SPDI commitments) with NO raw identity.'
  unit_output_boundary:
    - 'G-CP13 full packet/queue/first-pass/manifest writes land ONLY under the external data root; any in-repo output path is refused; an existing run directory is never overwritten; publication is atomic (temp + rename).'
    - 'G-CP14 canonical bytes: UTF-8, sorted keys, LF-only on every platform, one terminal newline, explicit binary write (never text-mode LF->CRLF); SHA tests hash canonical LF bytes.'
  integration_real_data:
    cases:
      - 'G-CP15 opt-in (env-gated, e.g. RAPTOR_PACKET_REAL_DATA=1) run over the immutable manifest + BIAS TSV + provenance + current configs asserts the binding oracles: 6,618 identities/rows; 164-packet universe (157 LP / 7 LB); 6,424 unresolved + 30 manual excluded; 7/2 patterns; raw PP3 2,226 / BP4 3,696 / union 5,474 / scored 0; the all-strata point distribution summing to 6,618 (0 band==149); every packet null/POLICY_BLOCKED; the deterministic eight-case sample. Skipped cleanly when inputs/env absent; never reads a written artifact as its own oracle.'
    boundary: >-
      This is the ONLY test touching raptor-data; it recomputes through the
      reused seams and writes only under a throwaway external temp root.

# --------------------------------------------------------------------------
# 10. Sonnet implementation contract
# --------------------------------------------------------------------------

sonnet_contract:
  must:
    - Make Gemini's RED tests pass by reusing build_candidate_universe + the
      packet path verbatim and adding the current-policy conservation guard,
      complete-universe writer, fail-closed full-commit provenance, and the
      deterministic eight-case sampler exactly as scoped.
    - Derive every count from inputs; keep production code free of benchmark
      labels and expected-count literals.
    - Verify approved policy status/mode + config hashes + immutable input hashes
      before processing; fail closed on drift; run current-policy conservation
      before any write.
    - Keep every packet candidate_direction=null / POLICY_BLOCKED; carry the eval
      LP/LB stratum ONLY in pattern_ref; deliver reviewers ONLY the FIRST_PASS
      projection.
    - Write full artifacts ONLY under the external data root, atomically,
      no-overwrite; resolve full-40-hex code_commit and fail closed on a dirty tree.
  must_not:
    - Generate any packet/queue/manifest artifact in the planner step, or write
      full packet artifacts into Git.
    - Reuse assert_source_of_record_conservation's historical direction assertions
      (238/1,333) or its worker/run_integrity.input_vcf_sha256 reads for the
      corrected run.
    - Change the calibration-batch conservation/universe/selection/writers'
      behavior, or edit gate.py, scope_gate.py, any config, or any census/audit
      data file.
    - Serialize the eval LP/LB selection stratum into candidate_direction, reveal
      AAVC (or its direction) in FIRST_PASS, or let PP3/BP4 become a scored call.
    - Tune, round, or "fix" the disappointing disabled-mode counts.

# --------------------------------------------------------------------------
# 11. GPT-5.4 checker probes (anti-trace-cribbing + privacy + policy)
# --------------------------------------------------------------------------

gpt_probes:
  probes:
    - 'P1 trace_cribbing — no expected-count literal (164/157/7/6424/30/6454/238/1333/2226/3696/5474/7/2/8) in src/raptor/packet/ or scripts/build_corrected_review_packets.py; counts derived; spec/historical/gate never scoring inputs.'
    - 'P2 direction_leakage — no packet serializes the eval LP/LB stratum into candidate_direction; every packet is null / production_policy_unapproved / POLICY_BLOCKED.'
    - 'P3 first_pass_blinding — the FIRST_PASS projection carries no candidate direction, signed points, policy id, census direction label, or AAVC comparator; queue delivery consumes only FIRST_PASS.'
    - 'P4 stale_policy — verifies CURRENT approved/disabled_manual policy + config hashes + immutable input hashes before processing; fails closed on drift.'
    - 'P5 pp3bp4_deferred — both PP3 and BP4 render as deferred lineage, scored 0, no candidate-direction point; both counted in suppression.'
    - 'P6 provenance_fail_closed — full 40-hex code_commit on a clean tree; a dirty/abbreviated/unresolvable commit fails closed before any write.'
    - 'P7 output_boundary — full artifacts only under the external data root, atomic + no-overwrite; identity never committed in-repo; only non-identifying aggregates + sample commitments may be (later) committed.'
    - 'P8 identity_leakage — the in-repo aggregate manifest / sample commitment expose no variant_id/SPDI/HGVS/rationale/label/patient/packet raw identity (LP/LB use packet hashes; unresolved/manual use salted SPDI commitments).'
    - 'P9 aavc_reveal_only — AAVC never enters criteria/combiner/grounding and is absent from FIRST_PASS and evidence_core_hash.'
    - 'P10 calibration_preserved — the calibration-batch script behavior is byte-identical (existing tests green); the corrected run is a distinct complete-universe output.'
  posture: >-
    The measured result may be scientifically disappointing and must not be
    tuned; the checker verifies faithfulness, not favorable numbers.

# --------------------------------------------------------------------------
# 12. Deterministic CLI + output boundary
# --------------------------------------------------------------------------

cli_and_output_boundary:
  cli:
    args: [--manifest, --bias-tsv, --provenance, --census-stats, --lineage-audit,
           --predictor-leakage-audit, --packet-config, --selection-config,
           --render-config, --narrative-catalog, --scorer-config, --eval-config,
           --predictor-policy, --output-root, --aavc-comparator, --dry-run, --summary]
    determinism: >-
      Canonical bytes: UTF-8, sort_keys=True, LF-only on every platform, exactly
      one terminal newline, explicit byte encode + binary write (never
      Path.write_text / text-mode LF->CRLF). code_commit is the FULL 40-hex
      `git rev-parse HEAD`; a dirty tree or abbreviated/unresolvable commit fails
      closed. Packet/queue ordering is by packet_id.
  output_boundary:
    accept: >-
      A run-scoped directory UNDER the external RAPTOR data root (outside the
      repository tree), created atomically and only when it does not already
      exist.
    refuse:
      - any path inside the repository tree (packets/queues/first-pass/manifest never enter Git)
      - overwriting ANY existing run directory or artifact
      - any non-canonical/text-mode write
    enforcement: check-before-write; conservation + hash verification precede any bytes.
  dry_run: proves the full verify + conservation + universe + sample path runs and summarizes WITHOUT writing.

# --------------------------------------------------------------------------
# 13. Migration / backout + Discovery handoff
# --------------------------------------------------------------------------

migration_and_backout:
  migration:
    - Land planner spec (this commit) -> Gemini RED tests -> Sonnet
      corrected-universe module + CLI + provenance helper + minimal calibration
      re-route -> GPT-5.4 checker probes -> orchestrator runs the real 6,618-row
      build to the external data root and freezes the non-identifying aggregate +
      the preregistered eight-case sample.
  backout:
    - Revert the corrected module/CLI/helper; the calibration script, configs,
      census, gates, and audits were never behavior-changed, and no in-repo data
      artifact was written, so no data backout is needed.
  discovery_handoff:
    - This track generates NO packets in the planner step and authorizes NO
      classification, worklist, submission, or clinical claim.
    - The Discovery eight-case comparison starts ONLY from the frozen sample
      after the checker returns CLEAN; it is an ecosystem experiment, gated by the
      negative masked gate (vus_authorized=false, BLOCKED_POLICY) and expert
      sign-off — never authorized by this packet run.

# --------------------------------------------------------------------------
# 14. Beat-4 self-audit (inversion / pre-mortem)
# --------------------------------------------------------------------------

beat4_self_audit:
  worst_ways_this_passes_while_wrong:
    - historical_oracle_misuse: >-
        The corrected run reuses assert_source_of_record_conservation and either
        KeyErrors on the disabled_manual census (no `worker` block) or the doer
        edits that shared calibration guard / asserts 238/1,333. MITIGATION:
        D2 + R1 + G-CP8 — a SEPARATE current-policy guard reads the
        disabled_manual schema; the shared guard is untouched.
    - checkout_hash_pinned: >-
        The census/gate/audit is pinned to its Windows CRLF checkout SHA
        (census 3b6d8bc…, gate e914…) instead of the canonical Git/LF blob.
        MITIGATION: committed_data_inputs.hash_rule pins the LF blob (census
        45ff9f9…, gate 7c55…) and records the CRLF hash as do_not_pin.
    - stale_census_hash_accepted: >-
        The planner blindly pins slot-3's census hash without verifying the file.
        MITIGATION: verified the file; the slot-3 hash is the LF blob and the
        content matches (157/7/6,424/30/6,618); reconciliation_note records it.
    - direction_leak: >-
        The eval LP/LB stratum is serialized into candidate_direction, turning a
        selection signal into a fake production call. MITIGATION: R6 + G-CP3 + P2
        keep it in pattern_ref only; every packet null / POLICY_BLOCKED.
    - first_pass_unblinded: >-
        The FIRST_PASS view or the queue leaks the candidate direction or the
        AAVC comparator. MITIGATION: G-CP4 + P3 + P9 — queue consumes only the
        redact_for_first_pass projection; AAVC reveal-only.
    - calibration_regression: >-
        Adding the complete-universe writer silently changes the calibration
        batch bytes. MITIGATION: D4 + R2 + P10 — a NEW writer; calibration
        conservation/universe/selection/writers behavior-preserving; existing
        tests green.
    - short_commit_shipped: >-
        Artifacts record a short/"unknown" commit or are generated from a dirty
        tree. MITIGATION: D5 + G-CP11 + P6 — full 40-hex, fail-closed clean.
    - identity_in_repo: >-
        A per-variant SPDI/packet leaks into a committed aggregate or the sample
        commitment. MITIGATION: D8/D9 + P7/P8 — full artifacts external-only;
        in-repo only packet hashes + salted SPDI commitments.
    - one_sided_suppression: >-
        Only PP3 (or only BP4) is deferred/suppressed. MITIGATION: G-CP6 + P5 —
        both scored 0, both deferred, both counted in the union.
    - vacuous_real_test: >-
        The integration test loads a written packet/manifest and asserts its own
        values. MITIGATION: G-CP15 recomputes through the reused seams; the
        written artifact is never its own oracle.
  empty_beats: none — every beat applied.

