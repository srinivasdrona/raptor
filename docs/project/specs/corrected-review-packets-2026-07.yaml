# --------------------------------------------------------------------------
# 7. Full-universe outputs + eight-case Discovery sample
# --------------------------------------------------------------------------

outputs:
  full_universe:
    location: NEW run-scoped directory under the external RAPTOR data root (outside the repo tree)
    artifacts:
      - name: operator_packets
        content: >-
          All 6,618 CandidateEvidencePacket OPERATOR JSONs across the four strata
          (candidate_direction=null, null_reason=production_policy_unapproved,
          review_state=POLICY_BLOCKED), canonical bytes, one file per packet_id,
          sorted by packet_id; evidence-absent packets (D12) for any zero-fired
          row.
      - name: first_pass_blinded_views
        content: >-
          FIRST_PASS JSON (redact_for_first_pass projection) + FIRST_PASS Markdown
          (render_markdown view=FIRST_PASS) for ALL 6,618 packets; strips the
          entire external_comparators envelope AND candidate direction/signed
          points/policy id/census direction labels (FR14.1).
      - name: per_stratum_queue_index
        content: >-
          Deterministic queue/index (CSV + JSONL) built by build_queue_index over
          the FIRST_PASS projection ONLY, partitioned by stratum (LP/LB/unresolved
          /manual), ordered by packet_id. Internal review queues, NOT external
          worklists.
      - name: candidate_priority_queue
        content: >-
          The 164-entry candidate-priority queue (157 LP + 7 LB) over the
          FIRST_PASS projection; the primary internal review queue.
      - name: aggregate_manifest
        content: >-
          Source/config hashes (raw-byte config pins + LF-blob artifact
          identities, labeled distinctly), full-40-hex code_commit, run pins, the
          current-policy conservation record (6,618 total / 157 / 7 / 6,424 / 30
          / 7+2 patterns), per-stratum coverage summary, current lineage binding
          (d2312…) with directly-derived firing/incidence, pinned limitations, and
          the preregistered eight-case sample commitment.
      - name: stratum_summary
        content: >-
          Explicit non-identifying per-stratum counts (157 / 7 / 6,424 / 30),
          candidate-priority queue size (164), and excluded-from-priority total
          (6,454); aggregate counts only, no per-variant identity.
      - name: corrected_calibration_sample_optional
        content: >-
          OPTIONAL NEW corrected 30-pattern calibration/sample over the corrected
          universe (select_calibration_batch), under a NEW name/hash distinct from
          the frozen 2026-07-11 artifact; external-root only unless a later,
          separately-scoped commit permits a non-identifying aggregate.
    determinism: >-
      All artifacts are byte-deterministic (canonical UTF-8, sorted keys, LF-only,
      one terminal newline) and packet ordering is by packet_id, so any
      input-sequence permutation re-renders byte-identically.
  in_repo_commit_scope:
    planner_commit: NONE beyond this spec file.
    later_optional: >-
      If a subsequent commit is explicitly scoped, ONLY a non-identifying
      aggregate record and the preregistered sample commitment (hashes only) may
      be committed under data/, under NEW names. Full packets/queues/first-pass
      views NEVER enter Git; the frozen historical artifacts are never touched.

eight_case_discovery_sample:
  purpose: >-
    A preregistered, deterministic eight-case Discovery evaluation sample for the
    ecosystem experiment (Gemini vs Sonnet auditor comparison). It is NOT packet
    authorization, NOT a classification, and NOT an external worklist.
  stratification:
    candidate_LP_review: 2
    candidate_LB_review: 2
    no_deterministic_resolution: 2
    manual_review: 2
    total: 8
  selection_rule: >-
    Deterministic and preregistered BEFORE any auditor result: within each of the
    four strata of the FULL packet universe, sort the stratum's packets by
    canonical SPDI (byte order) and take the first two. All eight cases now
    reference an existing packet (every stratum is packeted).
  commitment:
    all_cases: reference {packet_id, packet_hash, evidence_core_hash} — packet hashes only, NO raw SPDI in-repo.
    recorded_in: the aggregate manifest's `preregistered_discovery_sample` block, frozen before auditor results.
  boundary: >-
    An ecosystem experiment handoff only. Discovery comparison starts ONLY from
    this frozen eight-case sample after the checker returns CLEAN and the
    orchestrator runs the real 6,618-row build.

# --------------------------------------------------------------------------
# 8. Implementation + preservation file scopes
# --------------------------------------------------------------------------

implementation_scope:
  planner_commit_this_track:
    files: [docs/project/specs/corrected-review-packets-2026-07.yaml]
    count: 1
  sonnet_doer:
    files:
      - path: scripts/build_corrected_review_packets.py
        action: >-
          create the corrected full-universe CLI: verify the approved policy
          artifact (LF blob) + status/mode; verify the four subordinate configs +
          packet configs by RAW on-disk byte SHA-256; verify immutable input
          hashes; reproduce strata via raptor.census.strata; build packets for ALL
          6,618 identities across four strata via the reused build_candidate_universe
          (LP+LB) + the new build_full_vus_universe (unresolved+manual, incl.
          evidence-absent packets); run the current-policy conservation guard
          BEFORE any write; write all 6,618 OPERATOR packets + FIRST_PASS views +
          per-stratum queues + the 164 candidate-priority queue + aggregate
          manifest + stratum summary + the preregistered eight-case sample to a
          NEW external run directory, atomically, no-overwrite; resolve full-40-hex
          fail-closed clean code_commit.
      - path: src/raptor/packet/corrected_universe.py
        action: >-
          create the pure current-policy conservation guard
          (conserve_current_policy over the disabled_manual schema: 6,618
          identities/rows, exact one-to-one join, source_hashes, 157/7/6,424/30 +
          7/2 patterns), the all-strata assembler build_full_vus_universe (reusing
          build_packet + the calibration helpers, incl. the D12 evidence-absent
          packet and the D11 manual_review mapping), and the deterministic
          eight-case Discovery sampler (SPDI-sorted first-two per stratum). No
          expected-count literal; imports only raptor.census + raptor.packet +
          the calibration helpers.
      - path: src/raptor/packet/git_provenance.py
        action: >-
          create a shared git-provenance helper with require_clean +
          require_full_40hex mode that fails closed on a dirty/unresolvable/
          abbreviated commit; the corrected CLI uses this mode.
      - path: docs/reference/corrected-review-packets-runbook.md
        action: >-
          document the corrected CLI, external output boundary, raw-vs-LF hash
          rule, and non-authoritative boundary (documentation only).
    count: 4
    do_not_touch: scripts/build_tsc_calibration_batch.py is reused by import only; its behavior and tests are unchanged.
    generated_runtime_output_not_hand_authored:
      - 'external RAPTOR data root: 6,618 OPERATOR packets + FIRST_PASS views + per-stratum queues + 164 candidate-priority queue + aggregate manifest + stratum summary + preregistered sample (+ optional corrected calibration/sample).'
  gemini_test_author:
    files:
