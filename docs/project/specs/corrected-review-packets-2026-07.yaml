# --------------------------------------------------------------------------
# 1. Binding decisions (ADR-0012 + PRD-04 + certified negative gate)
# --------------------------------------------------------------------------

binding_decisions:
  adr_0012:
    reference: 'docs/DECISIONS.md#adr-0012--pp3bp4-automated-emission-disabled-for-the-current-masked-rerun'
    status: approved
    mode: disabled_manual
    invariants:
      - PP3/BP4 are absent from production `included_criteria`, evaluation
        `automatable_criteria`, and packet candidate-direction points; every
        automated PP3/BP4 call is suppressed and reported (ZERO scored calls).
      - PP3/BP4 remain in the ACMG vocabulary and BIAS can-fire lineage with
        `deferred` dispositions for manual review (never deleted).
      - Approval authorizes only the disabled/manual evidence mode. It does NOT
        authorize a VUS classification, research scope, clinical claim, public
        worklist, or ClinVar submission.
  prd_04:
    reference: docs/prd/PRD-04-candidate-evidence-packet.md
    invariants:
      - A candidate-evidence packet is produced for EVERY VUS (all 6,618),
        preserving the four first-class strata; packets are evidence records,
        not classifications, and no packet or queue is an external worklist.
      - Packet facts are assembled deterministically from an injected
        `PacketInput` (BIAS rows + census strata + approved configs); NO LLM/KB/
        benchmark/label file is reachable from packet generation (FR-d falsifier).
      - The production candidate-direction policy is UNAPPROVED, so every packet
        keeps `candidate_direction=null`, `null_reason=production_policy_unapproved`,
        and review state `POLICY_BLOCKED` (§4.5 T2). Direction-null packets stay
        first-pass EVIDENCE-reviewable via the direction-blinded FIRST_PASS view.
      - The eval-only candidate LP/LB selection stratum is carried ONLY as
        `pattern_ref.census_selection_stratum`; it MUST NEVER be serialized into
        the production `candidate_direction` field (FR5/FR16, AC4).
      - The redact_for_first_pass(packet) projection strips the entire
        external_comparators envelope AND candidate_direction/signed points/policy
        id/census direction labels; queue + reviewer delivery consume ONLY the
        FIRST_PASS projection (FR14.1, AC4/AC17/AC20).
      - The four named packet hashes (§4.2 packet/core/envelope + decision-log)
        are deterministic; a state/reviewer action never mutates a prior hash.
      - AAVC is a reveal-only disagreement comparator (`external_comparators`),
        excluded from `evidence_core_hash` and the FIRST_PASS view; it NEVER
        enters criteria, the combiner, or grounding (FR27, AC17).
  certified_masked_gate_is_negative:
    record: data/census/tsc_masked_holdout_gate_disabled_manual_2026-07-21.json
    sha256: 7c55cd4e3059713d1d53886d8893a3819153375b62ce9d37187d731132c6a77f
    sha256_provenance: committed_git_lf_blob
    sha256_windows_crlf_checkout_do_not_pin: e914f65231c8004b1c7a96d2fe80bd49bac591433112699ff91cc5b027e55207
    hash_rule: >-
      Committed data-artifact identity is the canonical Git/LF blob SHA-256
      (7c55…), NOT the Windows autocrlf CRLF checkout SHA-256 (e914…). The CRLF
      hash is a local-filesystem artifact and must never be pinned.
    legacy_v1_gate: FAIL
    full_spectrum_status: BLOCKED_POLICY
    vus_authorized: false
    tiered_v3: post_hoc_only_full_spectrum_not_authorized
    note: >-
      This masked-holdout gate is a DIFFERENT corpus (2,577 masked held-out
      rows) from the 6,618-VUS packet universe. It gates external readiness; the
      packet run is an internal, non-authoritative evidence assembly and does
      not depend on the gate's suppression numbers.
  authority_boundary:
    statement: >-
      A packet organizes INTERNAL, eval-only review evidence. No packet or queue
      (including the 164-entry candidate-priority queue) is an external worklist,
      a classification, an expert decision, a ClinVar submission, or a clinical
      claim. Candidate LP/LB directions are non-authoritative selection metadata
      only; AAVC is a reveal-only comparator, never a label or criterion source.

# --------------------------------------------------------------------------
# 2. Decision ledger + rejected alternatives (smallest DRY architecture)
# --------------------------------------------------------------------------

decision_ledger:
  D1_reuse_existing_seams_verbatim:
    decision: >-
      Reuse, unchanged, the already-extracted packet-free census seam
      (raptor.census.strata: ManifestEntry, StratumEntry, STRENGTH_MAP,
      load_manifest, reproduce_census_strata, _split_consequence_terms,
      _variant_class_for) and the PRD-04 packet path
      (raptor.packet.build.build_packet, raptor.packet.queue.build_queue_index,
      raptor.packet.render.render_markdown, raptor.packet.model.redact_for_first_pass
      / PacketView.FIRST_PASS). Reuse by import the pure packet-assembly helpers
      already defined in scripts/build_tsc_calibration_batch.py (build_packet_input,
      build_scorer_provenance, derive_quality_flags, _primary_consequence) WITHOUT
      changing that script's behavior.
    rationale: >-
      The strata reproduction, deterministic packet hashing, first-pass blinding,
      and queue index already exist and are test-covered. The only new work is a
      full-universe (all-strata) assembler, a current-policy conservation guard,
      fail-closed full-commit provenance, and the preregistered sampler.
  D2_full_universe_all_strata:
    decision: >-
      Build a reviewer-consumable packet for EVERY manifest identity (6,618)
      across the four first-class strata (157 candidate_LP_review, 7
      candidate_LB_review, 6,424 no_deterministic_resolution, 30 manual_review).
      Every packet has candidate_direction=null, null_reason=production_policy_unapproved,
      review_state=POLICY_BLOCKED, and carries its stratum only in
      pattern_ref.census_selection_stratum. The existing build_candidate_universe
      (LP+LB only) is reused for the candidate subset; a NEW build_full_vus_universe
      extends the same per-row assembly to the unresolved and manual strata.
    rationale: >-
      PRD-04 all-VUS packets + slot-3 unresolved/manual sample cases require every
      stratum to be packeted; rev-1's candidate-only narrowing was the F2 bug.
  D3_derive_facts_never_crib:
    decision: >-
      Production code derives every packet fact from the immutable inputs +
      approved configs + reproduced strata. It contains NO expected-count literal
      (6618/164/157/7/6424/30/6454/238/1333/1571/2226/3696/5474/7/2/8) and never
      reads this spec, the historical stats/artifact, or the masked gate as a
      scoring/fact input. The disabled_manual census is read ONLY to conserve
      counts (fail-closed), never to author packet contents.
    rationale: STRATEGY anti-trace-cribbing; slot-2 "LLMs may not add evidence".
  D4_candidate_priority_queue_plus_stratum_queues:
    decision: >-
      Emit a deterministic queue/index over the FIRST_PASS projection for EVERY
      packet, partitioned by stratum, plus a 164-entry candidate-priority queue
      (the candidate_LP_review + candidate_LB_review packets). The unresolved and
      manual strata have their own packet records and queue/index entries and are
      recorded in an explicit per-stratum summary; they are NOT excluded from
      packets — they are excluded only from the candidate-PRIORITY queue.
    rationale: >-
      Reconciles slot-3's "explicit unresolved/manual exclusion counts" (now:
      excluded from the candidate-priority queue) with PRD-04 all-VUS packet
      coverage and the eight-case sample's unresolved/manual cases.
  D5_current_policy_conservation_not_historical:
    decision: >-
      Add a current-policy conservation guard that reads the DISABLED_MANUAL
      census schema (raptor_current_policy_internal_direction 157/7/6424/30,
      candidate_pattern_compression 7/2, source_hashes {input_vcf, bias_tsv,
      manifest}, run_integrity {bias_rows, unique_raw_keys, exact_join, total
      6,618}). It conserves the policy-invariant identity/row/one-to-one join/
      source-hash invariants AND the CURRENT-policy per-stratum counts across ALL
      FOUR strata (157 + 7 + 6,424 + 30 == 6,618). It MUST NOT reuse
      assert_source_of_record_conservation, which reads the HISTORICAL schema keys
      (census_stats["worker"]["bias"], census_stats["run_integrity"]["input_vcf_sha256"])
      and asserts the PP3/BP4-ACTIVE totals (238 LP / 1,333 LB / 20 / 10 patterns)
      that do not exist in the disabled_manual census.
    rationale: >-
      slot-2/slot-3 current-policy conservation; the disabled_manual census has a
      different schema (no `worker` block) and different totals; a separate guard
      keeps the shared calibration guard untouched.
  D6_fail_closed_full_commit_provenance:
    decision: >-
      The corrected run resolves code provenance to the FULL fixed-width 40-hex
      `git rev-parse HEAD` and FAILS CLOSED (raises, no output) when the tree is
      dirty or the commit is unresolvable/abbreviated, via a NEW shared
      git-provenance helper. The historical 2026-07-11 artifact's short commit
      (e52e855) is exactly the defect this replaces.
    rationale: >-
      slot-3 "the corrected packet run must fail closed on a dirty/unresolvable
      full 40-hex commit".
  D7_current_lineage_binding_stale_audit_relabelled:
    decision: >-
      Bind every packet's PP3/BP4 lineage disposition to the CURRENT
      configs/eval/bias_lineage.yaml (raw-byte pin d2312b2c…, PP3/BP4 -> deferred)
      and the current packet candidate-direction policy
      (configs/packet/candidate_direction.yaml, raw-byte pin 778882c5…). Current
      firing/incidence is derived directly from the reproduced strata + census
      (raw_bias_criterion_incidence). The 2026-07-10 lineage audit is NOT embedded
      as current provenance; if a current lineage-audit artifact is genuinely
      needed, plan a NEW, separately-named, separately-scoped current audit bound
      to d2312… — never written by this planner.
    rationale: >-
      slot-3 "current PP3/BP4 deferred lineage and packet policy parity" +
      "current lineage audit provenance versus older static audit artifacts";
      F5 — the 2026-07-10 audit references the OLD lineage policy (743a…).
  D8_external_output_boundary_new_names_atomic_no_overwrite:
    decision: >-
      Full packet/queue/first-pass/manifest artifacts are written ONLY under the
      external RAPTOR data root (outside the repository tree), to a NEW
      run-scoped directory named for the corrected disabled_manual run (distinct
      from any historical artifact), with canonical bytes, no-overwrite, and
      atomic publication (write to a temp sibling + atomic rename; refuse if the
      run directory already exists). Only a NON-IDENTIFYING aggregate manifest and
      the preregistered sample COMMITMENT (hashes only) may be committed in-repo,
      under NEW names, and ONLY if explicitly scoped in a later commit — never by
      this planner commit.
    rationale: slot-2/slot-3 external-root output boundary + canonical/atomic publication.
  D9_historical_calibration_artifact_frozen:
    decision: >-
      Treat data/census/tsc_calibration_batch_2026-07-11.json (universe_size 1,571
      == 238 LP + 1,333 LB, selected_batch_size 30, OLD lineage 743a…, OLD
      candidate policy 990d3587…, short commit e52e855) as IMMUTABLE historical
      PP3/BP4-active evidence. It is never regenerated, overwritten, or renamed,
      and NO claim is made that the current disabled_manual config reproduces it
      byte-identically. If a corrected calibration/sample is useful, produce a NEW
      one over the corrected universe under a NEW name/hash. The existing
      scripts/build_tsc_calibration_batch.py and its tests are left UNTOUCHED so
      the historical code path and its tests remain valid.
    rationale: >-
      slot-3 "keep the old calibration path reproducible" is honored by freezing
      the historical artifact + its byte-preserving code/tests; F3 — the current
      config genuinely cannot reproduce the old PP3/BP4-active bytes.
  D10_hash_semantics_raw_byte_vs_lf_blob:
    decision: >-
      Verify the four subordinate approved configs (scorer/eval/lineage/packet
      candidate-direction) by RAW on-disk byte SHA-256 against the pins recorded
      inside the approved predictor policy (production_config_hash 1ba8066a… /
      eval_config_hash ea4ff684… / lineage_policy_hash d2312b2c… / packet_policy_hash
      778882c5…) — these were empirically confirmed to equal the raw working-tree
      (CRLF-checkout) bytes. Verify the packet render/selection/narrative/
      comparator/schema configs by raw on-disk byte SHA-256 too. Verify committed
      DATA-artifact identities (the approved predictor policy artifact itself, the
      census, the certified gate, the historical calibration artifact, and the
      audits) by canonical Git/LF blob SHA-256. Label every field precisely; never
      mix raw and LF pins.
    rationale: >-
      F1 — slot-2 did not distinguish approved raw-byte config pins from committed
      LF artifact identities; rev-1 mislabeled the config pins as canonical/loaded.
  D11_manual_review_annotation_mapping:
    decision: >-
      reproduce_census_strata labels the 30 NTHL1 rows with StratumEntry.stratum
      == "manual_review". The disabled_manual census aggregates the SAME 30 rows
      under raptor_current_policy_internal_direction.annotation_manual_review
      (== direction_by_gene.NTHL1.manual_review == direction_by_consequence.other.manual_review
      == 30). The corrected run treats stratum "manual_review" and census direction
      "annotation_manual_review" as ONE first-class stratum of 30 rows and never
      double-counts; packets in this stratum record census_selection_stratum
      "manual_review".
    rationale: slot-3 "define exact manual_review <-> annotation_manual_review mapping".
  D12_evidence_absent_packet_for_zero_fired_rows:
    decision: >-
      To guarantee exactly 6,618 packets, any manifest identity whose BIAS row
      fires zero scorable criteria produces a deterministic EVIDENCE-ABSENT packet
      (candidate_direction=null, POLICY_BLOCKED, empty scored-criterion set, a
      MissingEvidence entry documenting "no fired BIAS criteria"), rather than
      being dropped. build_packet/model is minimally extended to permit an
      evidence-absent packet in the corrected assembler ONLY; the calibration
      path is unchanged.
    rationale: >-
      PRD-04 all-VUS coverage — PM2 fires for 6,609 of 6,618 rows, so a small
      number of rows may fire no scorable criterion and must still be packeted to
      conserve 6,618.

rejected_alternatives:
  - id: R1_reuse_historical_conservation
    option: Reuse assert_source_of_record_conservation for the corrected run.
    rejected_because: >-
      It reads census_stats["worker"][...] and run_integrity["input_vcf_sha256"]
      (absent from the disabled_manual census) and asserts PP3/BP4-ACTIVE totals
      (238/1,333/20/10); it would KeyError or falsely fail (or invite an edit to
      a shared, calibration-critical guard).
  - id: R2_candidate_only_universe
    option: Build only the 164 candidate (LP+LB) packets and mark unresolved/manual excluded from packets.
    rejected_because: >-
      F2 — PRD-04 requires all-VUS packets and slot-3's eight-case sample needs
      unresolved/manual cases; all 6,618 must be packeted, with 164 as the
      candidate-priority queue.
  - id: R3_generate_artifacts_in_planner
    option: Emit packet/queue artifacts in this planner step.
    rejected_because: slot-3 "Do not generate artifacts in the planner step."
  - id: R4_emit_packets_into_repo
    option: Write full packet artifacts under docs/ or data/ in-repo.
    rejected_because: >-
      slot-2/slot-3 — full packet artifacts stay OUTSIDE Git; only non-identifying
      aggregates may be committed if explicitly scoped.
  - id: R5_short_or_unknown_commit
    option: Keep _resolve_code_commit()'s `--short`/"unknown" provenance for the corrected run.
    rejected_because: >-
      slot-3 requires fail-closed full 40-hex provenance; the historical e52e855
      short commit is the defect.
  - id: R6_serialize_selection_into_direction
    option: Write the eval LP/LB stratum into candidate_direction.
    rejected_because: >-
      PRD-04 FR5/FR16 AC4 — eval-only selection metadata must never enter the
      production candidate-direction field; policy unapproved -> null/POLICY_BLOCKED.
  - id: R7_reveal_aavc_in_first_pass
    option: Include the AAVC comparator (or its direction) in the FIRST_PASS view.
    rejected_because: >-
      PRD-04 FR14.1/FR27 — first-pass reviewers are blinded to BOTH machine
      directions; AAVC is reveal-only and stripped by redact_for_first_pass.
  - id: R8_claim_current_config_reproduces_1571
    option: Claim the current disabled_manual config reproduces the 2026-07-11 1,571-universe calibration byte-identically.
    rejected_because: >-
      F3 — the 2026-07-11 artifact used the OLD lineage (743a…), OLD candidate
      policy (990d3587…), and a short commit (e52e855); the current
      d2312…/778882c5… configs cannot reproduce those bytes. The artifact is
      frozen; the corrected run is NEW.
  - id: R9_embed_stale_audit_as_current
    option: Embed tsc_bias_lineage_audit_2026-07-10.json as the corrected run's CURRENT lineage provenance.
    rejected_because: >-
      F5 — that audit references the OLD lineage policy (743a…), not the current
      d2312…; embedding it would silently mix hashes.
  - id: R10_label_config_pins_as_lf_or_loaded
    option: Pin the four subordinate configs by LF blob (or as loaded/semantic hashes).
    rejected_because: >-
      F1 — the approved policy pins the RAW on-disk byte SHA-256; the LF-blob
      values (e.g. tsc2.yaml 45358c2e…) do not equal the policy pins (ea4ff684…).
  - id: R11_refactor_calibration_script
    option: Refactor scripts/build_tsc_calibration_batch.py to route provenance or emit the full universe.
    rejected_because: >-
      Risks the historical code path / tests; the corrected run is a NEW,
      self-contained script that reuses the calibration script's importable
      helpers without changing its behavior.

