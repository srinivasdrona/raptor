# RAPTOR corrected ADR-0012 expert-review packets — Opus planner contract (rev 2).
#
# Purpose: an implementation-ready, hash-bound, DRY plan to regenerate the
# internal TSC candidate-evidence review packets for the `clinvar_2026-07-07`
# VUS run under the APPROVED ADR-0012 disabled/manual PP3/BP4 policy and the
# CURRENT (disabled_manual) census. Per PRD-04 (all-VUS evidence packets) and
# slot-3, the corrected run produces reviewer-consumable packet records for ALL
# 6,618 VUS across the four PRD-04 first-class strata (157 candidate_LP_review +
# 7 candidate_LB_review + 6,424 no_deterministic_resolution + 30 manual_review),
# a deterministic per-stratum queue/index and a 164-entry candidate-priority
# queue (LP+LB), an aggregate manifest, first-pass blinded views for every
# packet, explicit per-stratum summary counts, and a preregistered eight-case
# Discovery evaluation sample drawn from the full packet universe. Every packet
# keeps candidate_direction=null / POLICY_BLOCKED.
#
# rev 2 applies the GPT-5.4 findings against rev 1:
#   F1 raw-vs-loaded config hash semantics — the ADR-0012 approved policy pins
#      the RAW on-disk byte SHA-256 of the subordinate scorer/eval/lineage/packet
#      configs; committed data artifacts use the canonical Git/LF blob. rev 1
#      mislabeled the config pins as loaded/semantic. Corrected here.
#   F2 candidate-only narrowing — PRD-04 requires packets for ALL 6,618 VUS and
#      slot-3 requires an eight-case sample including unresolved/manual; rev 1
#      built only the 164 candidate universe. Corrected: full-universe packets,
#      164 candidate-priority queue, unresolved/manual packeted (not excluded).
#   F3 historical calibration byte-identity — the 2026-07-11 1,571-universe
#      (238 LP + 1,333 LB) / 30-pattern calibration artifact is IMMUTABLE
#      historical PP3/BP4-active evidence built with the OLD lineage policy
#      (743a…) and a SHORT commit (e52e855). rev 1 falsely claimed the current
#      disabled_manual config reproduces it byte-identically. Corrected: it is
#      frozen; the corrected run is NEW under NEW names/hashes.
#   F4 real-data selector — G-CP15 (env-gated real-data integration) is now in
#      the MANDATORY selector with an exact invocation.
#   F5 stale lineage audit — tsc_bias_lineage_audit_2026-07-10.json is HISTORICAL
#      pre-ADR-0012 static provenance (internal policy hash 743a…), NOT current.
#      Packet decisions bind to the CURRENT d2312… lineage config; current firing
#      /incidence is derived directly; no silent hash mixing.
#
# This file is the planner PLAN ONLY. It performs NO implementation, NO tests,
# NO code/config/data edits, NO packet/artifact generation, NO gate/scope-gate/
# policy change, NO x64 run, and writes NO packet/queue/manifest artifact. The
# emitted packet artifacts use the PRD-04 CandidateEvidencePacket schema and are
# DOER RUNTIME OUTPUTS written OUTSIDE Git to the external RAPTOR data root; only
# a non-identifying aggregate + the preregistered sample commitment may (later,
# separately) be committed — NEVER by this planner commit.
#
# Schema: raptor-corrected-review-packets-planning-v1 (planner).

