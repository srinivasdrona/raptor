# RAPTOR Mechanism Atlas starter — binding planner design/implementation spec.
#
# Planner: Claude Opus (this document). Test author: Gemini 3.5 Flash. Doer:
# Claude Sonnet 5. Checker: GPT-5.4. Loop order is fixed: Opus PLAN -> Gemini RED
# tests -> Sonnet skeleton -> GPT-5.4 checker. Pilot CONTENT follows only after
# schema + leakage guards are CLEAN and corrected packets are frozen.
#
# This file is the PLAN. It performs no annotation, no extraction, no pilot
# content, and it is NOT an implementation. It authorizes no classification,
# assay, phenotype, intervention, or treatment claim. It defines the strict
# internal module contract for `src/raptor/atlas/` and the controls that bound
# it. Every substantive downstream claim must resolve to a primary source and an
# exact span, or be labeled UNVERIFIED.
#
# Authority order (slot 3): current STRATEGY.md / DECISIONS.md (ADRs) are
# authoritative; docs/project/atlas/MECHANISM_ATLAS_HANDOFF.md is PRELIMINARY
# design input, never factual authority.
#
# Every substantive downstream mechanism claim must resolve to a primary
# direct-evidence LEAF source and an exact span, or be labeled UNVERIFIED. Real
# grounding is a Phase 2 deliverable. Phase 1 (skeleton) MAY pin and verify real
# source-register bibliographic METADATA (PMID/PMCID/DOI/accession/license); it
# MUST NOT produce real verified observed claims, real grounding spans, R611Q or
# pilot claims/profiles, or mechanistic conclusions.
#
# Span ownership (rev 4): the exact grounding span (locator + exact_quote +
# page_or_figure) is owned SOLELY by the source reference (EntryRef.span).
# ObservedClaim references its source via source_ref and never duplicates the
# span. A verified claim cannot hash or validate against any locator/quote other
# than the one carried by its source reference.
#
# Dual path (rev 5): RAPTOR is the SOLE source of truth (canonical SPDI admission,
# Atlas schemas, source role/type validation, EntryRef.span ownership, citation
# resolver, hashes, leakage guards, and the accepted profiles). Microsoft
# Discovery is an ACTIVE but bounded Phase-2 research lane (Bookshelf, research
# agents, Discovery Engine) that only PROPOSES untrusted candidates; RAPTOR
# deterministically validates and promotes them. Discovery is runtime-optional and
# never sits on the accept/hash/guard path.

