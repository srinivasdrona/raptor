# Planner: Claude Opus (this document). Test author: Gemini 3.5 Flash. Doer:
# Claude Sonnet 5. Checker: GPT-5.4. Loop order is fixed: Opus PLAN -> Gemini RED
# tests -> Sonnet skeleton -> GPT-5.4 checker. Pilot CONTENT follows only after
# schema + leakage guards are CLEAN and corrected packets are frozen.
#
# This file is the PLAN. It performs no annotation, no extraction, no pilot
# content, and it is NOT an implementation. It authorizes no classification,
# assay, phenotype, intervention, or treatment claim. It defines the strict
# internal module contract for `src/raptor/atlas/` and the controls that bound
# it. Every substantive downstream claim must resolve to a primary source and an
# exact span, or be labeled UNVERIFIED.
#
# Authority order (slot 3): current STRATEGY.md / DECISIONS.md (ADRs) are
# authoritative; docs/project/atlas/MECHANISM_ATLAS_HANDOFF.md is PRELIMINARY
# design input, never factual authority.

