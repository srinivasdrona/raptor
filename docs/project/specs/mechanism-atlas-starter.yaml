# ---------------------------------------------------------------------------
# 0. Authority, scope, and non-authority
# ---------------------------------------------------------------------------
authority_and_scope:
  authoritative_inputs:
    - docs/STRATEGY.md            # vertical TSC/mTOR research-evidence program (ADR-0010)
    - docs/DECISIONS.md           # ADRs; binding on intent/mechanism boundaries
  preliminary_only:
    - path: docs/project/atlas/MECHANISM_ATLAS_HANDOFF.md
      role: PRELIMINARY / UNAPPROVED / UNVERIFIED design input; never factual authority
  binding_adrs:
    - id: ADR-0009
      why: ClinVar-derived criteria direct-copy banned (R-A2 circularity). The Atlas
        must never re-import a classifier/ClinVar-derived criterion as mechanism truth.
    - id: ADR-0012
      why: PP3/BP4 automated emission disabled for the masked rerun. Mechanism
        evidence must not become a scoring predictor by any back-channel.
    - id: ADR-0010
      why: RAPTOR is a vertical TSC/mTOR research-evidence product, not a generic
        platform. No cross-gene/cross-disease expansion for optics.
  program_position: Phase 1 (design + case-card contract) per the handoff phased build.
    Phase 2 pilot content is gated by this spec passing checker CLEAN and packet freeze.
  hard_prohibitions:
    - No patient-specific clinical interpretation.
    - No treatment or rescue recommendation; rescue-class hypotheses require a direct
      published experiment for the exact relationship and remain hypotheses, never advice.
    - No mechanism claim inferred from amino-acid substitution alone.
    - No deterministic phenotype prediction from molecular effect alone.
    - No classifier score imported as mechanism truth.
    - No mechanism profile imported back into ACMG scoring without a separately
      approved evidence policy (currently unapproved).
    - No cross-disease / cross-gene expansion in this track.
    - Every substantive claim resolves to a primary source + exact span, else UNVERIFIED.

# ---------------------------------------------------------------------------
# 0.5 Dual-path architecture (RAPTOR source of truth + Discovery research lane)
# ---------------------------------------------------------------------------
# Operator clarification (rev 5): Discovery's Bookshelf/library, research agents
# and Discovery Engine MAY be used for the bounded Mechanism Atlas research
# workflow where they add value. Discovery moves from a future adapter seam to an
# ACTIVE but bounded Phase-2 research-execution lane. RAPTOR remains the sole
# source of truth and the only writer of accepted profiles.
dual_path_architecture:
  raptor_source_of_truth:
    owns:
      - Canonical GRCh38 SPDI identity admission (identity.py).
      - All Atlas schemas, frozen dataclasses, and typed errors.
      - Source role/type validation and the direct_evidence_leaf grounding rule.
      - EntryRef.span ownership (single canonical grounding span).
      - Deterministic citation/source resolver and canonical-JSON hashes.
      - Leakage guards and the final ACCEPTED MechanismProfile records.
    rule: >
      Only RAPTOR admits, validates, grounds, hashes, and accepts. No external
      system writes an accepted claim or profile; Discovery output stays untrusted
      until RAPTOR validates and promotes it.
  discovery_research_lane:
    posture: >
      ACTIVE but bounded Phase-2 retrieval/orchestration lane and evaluation
      surface. It PROPOSES candidate evidence; it never accepts, grounds, scores,
      or gates. Runtime-optional: failure or unavailability MUST NOT block the
      RAPTOR Atlas or change any accepted profile.
    uses:
      - Bookshelf/library of PUBLIC, appropriately-licensed primary papers.
      - "Catalog agents: pubmed, bookshelf-researcher, online-researcher; optionally pdb-search / pdb-insights and stat-agent where they add value."
      - Discovery Engine tasks/dependencies/validation for identity confirmation,
        literature retrieval, claim/span extraction, contradiction search,
        assay-context normalization, and evidence-gap mapping.
    prototype_agent:
      name: tsc-mechanism-evidence-mapper
      scope: PRIVATE project-level prompt-agent prototype ONLY.
      not_now: NOT contributed to microsoft/discovery in this track.
      output: >-
        Untrusted staging JSON conforming to schemas.atlas_candidate_import; it
        CANNOT write accepted claims or profiles directly.
  promotion_contract:
    rule: >
      Every Discovery-produced AtlasCandidateImport is UNTRUSTED and enters RAPTOR
      only through deterministic validation: source type/role, citation resolution,
      exact EntryRef.span, canonical SPDI identity, context enums, duplicate/
      conflict rules, and no-classification leakage. A named human/oracle
      source-span review remains required for Phase-2 GO. Failing candidates are
      REJECTED (never silently downgraded into an accepted profile).
  boundaries:
    - Public, appropriately-licensed sources ONLY; no direct cloud/private/patient data; no PHI.
    - No migration of scoring, gates, packet source of truth, or the build loop into Discovery.
    - Discovery setup lives as CONFIG/TEMPLATES outside src/raptor/atlas; the core
      atlas package MUST NOT import any Discovery SDK/agent (out-of-process only).
    - A catalog contribution (tsc-mechanism-evidence-mapper or a generic
      mechanism-evidence auditor) may be considered SEPARATELY only after a clean
      5-10-case evaluation; it is out of scope for this track.

# ---------------------------------------------------------------------------
# 1. Ontology seeds (candidate mechanism classes + explicit states)
# ---------------------------------------------------------------------------
# These are ontology SEEDS, not established facts. Mechanisms are multi-label and
# context-dependent; `unknown` and `conflicting` are first-class VALID outcomes.
ontology_seeds:
  mechanism_classes:
    - id: rna_splicing_defect
      label: RNA / splicing defect presenting as a missense annotation
    - id: reduced_abundance_instability
      label: Reduced protein abundance or instability
    - id: misfolding_residual_function
      label: Misfolding with residual function
    - id: complex_formation_defect
      label: TSC1-TSC2(-TBC1D7) complex-formation defect
    - id: mislocalization
      label: Mislocalization
    - id: catalytic_site_impairment
      label: Catalytic / functional-site (e.g. GAP domain) impairment
    - id: dominant_negative
      label: Dominant-negative / interference mechanism
    - id: hypomorphic_partial_loss
      label: Hypomorphic partial loss of function
  mechanism_states:
    - supported            # >=1 resolvable primary source + span, direction consistent
    - contradicted         # >=1 resolvable primary source opposes the class
    - conflicting          # supporting AND contradicting resolvable sources coexist
    - unknown              # no resolvable primary evidence either way
    - unverified           # claim asserted but no resolvable primary source/span yet
  labeling_rules:
    - Multi-label allowed: a profile may carry several classes simultaneously.
    - Context-dependent: a class assignment is scoped to its assay/model/tissue record.
    - "`unknown` / `conflicting` must be representable and must not be coerced to a call."
    - No class may be asserted from substitution identity alone.

# ---------------------------------------------------------------------------
# 2. Schemas (stable, frozen, hash-bound)
# ---------------------------------------------------------------------------
# Convention mirrors src/raptor/packet (frozen dataclasses, tuples for ordered
# collections, typed errors, canonical-JSON sha256 content hashing:
# sort_keys=True, separators=(",", ":"), UTF-8; enums -> .value).
schemas:
  variant_identity:
    id: atlas.identity.v1
    purpose: canonical variant/transcript input contract; the ONLY admission key.
    admission_key: canonical GRCh38 SPDI (spdi_canonical). No record is admitted
      resolved without it.
    fields:
      gene: {type: enum, values: [TSC2], note: TSC2-only in this track}
      spdi_canonical: {type: str, required_for_resolved: true,
        note: canonical GRCh38 SPDI; the SOLE admission/identity key}
      assembly: {type: enum, values: [GRCh38], default: GRCh38,
        note: SPDI is GRCh38-anchored}
      transcript_pin: {type: str, pin: NM_000548.5, requires: MANE-Select-verification,
        role: provenance-alias}
      hgvs_c: {type: str, optional: true, role: provenance-alias,
        note: exact bare c. HGVS, NEVER the admission key}
      hgvs_p: {type: str, optional: true, role: provenance-alias}
      hgvs_g: {type: str, optional: true, role: provenance-alias,
        note: NC_000016.10 genomic anchor}
      identity_state: {type: enum, values: [resolved, unresolved]}
    spdi_transcript_reconciliation:
      rule: >
        Any hgvs_c/hgvs_g/transcript alias is reconciled TO the canonical GRCh38
        SPDI, never the reverse. An alias is accepted only if it deterministically
        projects to the same canonical SPDI; a mismatch or an un-projectable alias
        yields identity_state=unresolved.
      no_fabrication: >
        No cDNA->genomic/SPDI projection is fabricated; if a deterministic resolver
        is unavailable the record stays unresolved (never silently key on an alias).
    invariants:
      - Resolved admission REQUIRES a non-empty canonical GRCh38 spdi_canonical.
      - A record without a canonical SPDI is identity_state=unresolved and admission
        FAILS with AtlasIdentityError (no partial or alias-only admission).
      - hgvs_c/hgvs_p/hgvs_g/transcript_pin are PROVENANCE aliases only, never the key.
    transcript_caveat:
      note: >
        Existing MAVE register pins NM_000548.5 while BIAS on-disk outputs carry
        NM_000548.4; equal bare c. strings across .4/.5 are NOT proven to share CDS
        numbering. Because admission is SPDI-keyed (GRCh38-anchored), transcript
        version drift cannot silently equate two variants; a c. alias that does not
        reconcile to the canonical SPDI is rejected as unresolved.
  observed_claim:
    id: atlas.claim.v1
    purpose: one observed claim bound to an exact source span; never a summary.
    fields:
      claim_id: {type: str, note: stable id; edges/evidence reference THIS, not the object}
      claim_text: {type: str}
      claim_kind: {type: enum, values: [rna, splicing, abundance, stability,
        complex, localization, pathway_mtorc1, phenotype, other]}
      source_ref: {type: ref, to: source_register.EntryRef,
        note: the SINGLE source of truth for grounding; source_ref.span is the
          canonical exact span. ObservedClaim carries NO span field of its own.}
      verification: {type: enum, values: [verified, unverified]}
      directionality: {type: enum, values: [increase, decrease, none, unknown]}
    span_ownership:
      rule: >
        The exact grounding span (locator + exact_quote + page_or_figure) is owned
        SOLELY by EntryRef.span at source_ref. ObservedClaim MUST NOT declare or
        duplicate a span field; a duplicate span field is AtlasSchemaError. A
        verified claim's effective span IS source_ref.span, so a claim can never
        hash or validate against a locator/quote different from its source reference.
    invariants:
      - verification=verified REQUIRES source_ref -> a source_register entry whose
        role == direct_evidence_leaf AND source_type in
        allowed_direct_evidence_leaf_source_types (PRIMARY-LIT / DATASET) AND
        verification == verified, PLUS a non-empty source_ref.span (canonical exact
        span). BOTH role and source_type are checked, never role alone.
      - A claim grounded only in a provenance_only/context/crosswalk entry, OR in a
        disallowed source_type (PRIMARY-OFFICIAL / PRIMARY-DOC / SECONDARY-SYNTH /
        CROSSWALK / a grouping bucket), CANNOT be verified; it stays
        verification=unverified (AtlasProvenanceError / AtlasSchemaError if forced).
      - A claim whose source_ref does not resolve, or whose source_ref.span is empty,
        is verification=unverified.
      - phenotype claims are observations only; no deterministic inference permitted.
  context_record:
    id: atlas.context.v1
    purpose: assay / model / cell / tissue / condition context for every claim.
    fields:
      assay: {type: str, note: e.g. VAMP-seq, SGE, co-IP, immunoblot, luciferase-mTORC1}
      model_system: {type: str, note: e.g. HAP1, HEK293, patient fibroblast, mouse}
      cell_type: {type: str, optional: true}
      tissue: {type: str, optional: true}
      zygosity_context: {type: enum, values: [germline, somatic, mosaic, inferred, unknown]}
      assay_limitations: {type: list, note: known caveats/power limits}
  mechanism_edge:
    id: atlas.edge.v1
    purpose: >
      DNA -> RNA -> protein(abundance/stability/complex/localization) -> mTORC1 ->
      phenotype edge representation. Each edge is evidence-bound and context-scoped.
    node_layers: [dna, rna, protein_abundance, protein_stability, complex,
      localization, mtorc1_state, phenotype]
    edge_fields:
      from_layer: {type: enum, ref: node_layers}
      to_layer: {type: enum, ref: node_layers}
      effect: {type: enum, values: [increase, decrease, disrupt, none, unknown]}
      supporting_claims: {type: list, of: claim_id_ref, note: claim_id into profile.claims}
      contradicting_claims: {type: list, of: claim_id_ref, note: claim_id into profile.claims}
      context: {type: ref, to: context_record}
      edge_state: {type: enum, ref: ontology_seeds.mechanism_states}
    invariants:
      - An edge with support AND contradiction is edge_state=conflicting, never resolved to one.
      - phenotype edges never assert deterministic causation.
      - supporting/contradicting entries are claim_ids that MUST exist in profile.claims.
  evidence_assessment:
    id: atlas.evidence.v1
    fields:
      supporting: {type: list, of: claim_id_ref, note: claim_id into profile.claims}
      contradicting: {type: list, of: claim_id_ref, note: claim_id into profile.claims}
      missing_evidence: {type: list, note: named assay gaps preventing discrimination}
      unknowns: {type: list, note: explicit unknown/conflicting statements}
    invariants:
      - supporting/contradicting reference claim_ids that MUST exist in profile.claims.
  mechanism_profile:
    id: atlas.profile.v1
    purpose: the top-level per-variant record composed of the above.
    fields:
      identity: {ref: variant_identity}
      claims: {type: tuple, of: observed_claim,
        note: immutable canonical claim table; the SINGLE source of claim identity;
          edges/evidence reference members by claim_id}
      candidate_classes: {type: list, of: {class: ontology_seeds.mechanism_classes,
        state: ontology_seeds.mechanism_states, confidence: 'enum[low, moderate, high, na]'}}
      edges: {type: list, of: mechanism_edge}
      evidence: {ref: evidence_assessment}
      provenance: {ref: provenance}
      run_metadata: {ref: run_metadata}
    invariants:
      - candidate_classes may be empty or all-unknown; that is a valid profile.
      - No confidence value is derived from any classifier or ClinVar score.
      - Every claim_id referenced by edges/evidence resolves INTO profile.claims;
        no claim exists outside the claims tuple (single source of truth for hashing).
  run_metadata:
    id: atlas.run_metadata.v1
    purpose: non-content run fields, isolated so hashing is field-coherent.
    fields:
      run_id: {type: str}
      generated_at: {type: str}
      tool_versions: {type: list}
    note: run_metadata is EXCLUDED from both content hashes by definition.
  provenance:
    id: atlas.provenance.v1
    fields:
      source_pins: {type: tuple, of: source_register.EntryRef}
      version_pins: {type: tuple, note: transcript, source, and dataset versions}
      content_hashes:
        evidence_core_hash: {algo: sha256, over: evidence_core_payload}
        profile_envelope_hash: {algo: sha256, over: profile_envelope_payload}
  hashing:
    id: atlas.hashing.v1
    canonical_hash_rule: 'UTF-8 json.dumps(sort_keys=True, separators=(",", ":")); enums -> .value; tuples -> lists.'
    ordering: >
      Deterministic pre-serialization ordering: claims by (claim_kind,
      source_ref.entry_id, source_ref.span.locator, claim_text); edges by
      (from_layer, to_layer, effect); candidate_classes by (class, state);
      source_pins by entry_id. The claim sort/hash key reads the span from
      source_ref.span (canonical) — never a claim-local span field, which does not
      exist. Ordering is applied before hashing.
    dedup: Exact-duplicate claims (identical after canonicalization) collapse to one.
    evidence_core_payload:
      includes: [identity.spdi_canonical, identity.gene, claims, candidate_classes, edges, evidence]
      excludes: [provenance, run_metadata, identity.transcript_pin, identity.hgvs_c,
        identity.hgvs_p, identity.hgvs_g]
      note: >
        The evidence core is defined ONLY over listed `includes` fields; edges/
        evidence serialize claim references as claim_id into the same ordered claims
        tuple, so the payload is internally coherent (no dangling/undefined field).
    profile_envelope_payload:
      includes: [identity, claims, candidate_classes, edges, evidence,
        provenance.source_pins, provenance.version_pins]
      excludes: [run_metadata, provenance.content_hashes]
      note: excludes ONLY run_metadata and the self-referential content_hashes block.
  atlas_candidate_import:
    id: atlas.candidate_import.v1
    trust: >-
      UNTRUSTED staging payload emitted by the Discovery research lane; it is NOT
      an accepted record and grounds nothing until RAPTOR validates and promotes.
    purpose: carry Discovery-proposed evidence into RAPTOR's deterministic gate.
    fields:
      candidate_variant:
        spdi_proposed: str
        hgvs_aliases: list
        note: >-
          Identity is a PROPOSAL only; RAPTOR re-admits via canonical GRCh38 SPDI
          and never trusts the proposed identity.
      proposed_claims:
        type: list
        of: [claim_text, claim_kind, directionality, source_ref_proposed,
          span_proposed, context_proposed]
        note: >-
          Proposals only; source refs and spans are re-resolved by RAPTOR and are
          not grounded on import.
      proposed_sources:
        type: list
        of: [entry_id, source_type, role, bib]
        note: >-
          Bibliographic proposals; source_type and role are re-validated against
          the direct_evidence_leaf rule by RAPTOR.
      retrieval_provenance:
        agents: list
        queries: list
        run_id: str
        retrieved_at: str
        note: Discovery run trace retained for audit and native-vs-Discovery eval.
    invariants:
      - No field of this schema is trusted; promotion runs the full RAPTOR gate.
      - verification/accepted state is NEVER set by the importer; RAPTOR assigns it.
      - A candidate that fails identity / source-type / role / span / context /
        leakage validation is REJECTED (AtlasSchemaError / AtlasProvenanceError),
        never silently admitted.
  candidate_promotion:
    id: atlas.promotion.v1
    gate_order: [canonical_spdi_readmission, source_type_role_validation,
      citation_resolution, exact_span_resolution, context_enum_validation,
      duplicate_conflict_rules, no_classification_leakage, human_oracle_span_review]
    rule: >
      promote_candidate(import) yields accepted claims ONLY if every gate passes;
      the importer never writes accepted state. Human/oracle span review is
      mandatory before Phase-2 GO. Discovery is optional: a missing or failed
      candidate never blocks RAPTOR and never mutates an accepted profile.

# ---------------------------------------------------------------------------
# 3. Module API (src/raptor/atlas/)
# ---------------------------------------------------------------------------
module_api:
  package: src/raptor/atlas/
  layout:
    - __init__.py
    - model.py            # frozen dataclasses for all schemas above + typed errors
    - identity.py         # canonical variant/transcript admission contract
    - hashing.py          # canonical-JSON sha256 (mirrors packet/hashing.py)
    - registry.py         # source register loader + fail-closed verification
    - profile.py          # build_mechanism_profile(...) assembly
    - promote.py          # deterministic AtlasCandidateImport validation + promotion gate
    - export.py           # one-way DisMech-compatible export (post-validation only)
    - guards.py           # leakage/scoring-import prohibition enforcement
    - README.md           # module charter (non-authority, boundaries, prohibitions)
  typed_errors:
    - AtlasSchemaError
    - AtlasIdentityError
    - AtlasProvenanceError
    - AtlasSourceVerificationError
    - AtlasLeakageError
    - AtlasExportError
  public_functions:
    - build_mechanism_profile(identity, claims, contexts, edges, sources) -> MechanismProfile
    - validate_candidate_import(candidate) -> None  # deterministic; raises on any gate failure
    - promote_candidate(candidate) -> tuple  # accepted claims only after full gate + human/oracle review
    - verify_source(entry) -> None  # raises AtlasSourceVerificationError on drift
    - evidence_core_hash(profile) -> str
    - profile_envelope_hash(profile) -> str
    - export_dismech(profile) -> DisMechRecord  # one-way, post-internal-validation only
  api_independence:
    - The Atlas API takes only canonical identity + evidence inputs; it never imports
      raptor.scorer, raptor.eval, raptor.packet, or a ClinVar-derived criterion value.
    - No RAPTOR scoring/gate/packet module may import raptor.atlas (enforced by guards + tests).
    - The core atlas package imports NO Discovery SDK/agent; the Discovery lane
      runs OUT-OF-PROCESS and reaches atlas only as an untrusted AtlasCandidateImport
      payload validated by promote.py.

# ---------------------------------------------------------------------------
# 4. Panel selection contract (bounded TSC2 pilot)
# ---------------------------------------------------------------------------
panel_selection_contract:
  size: {min: 5, max: 10}
  gene: TSC2
  required_strata:
    - known_pathogenic
    - known_benign
    - conflicting
    - vus_with_functional_evidence
    - vus_without_functional_evidence
  selection_rules:
    - Strata are chosen to CONTRAST the ontology (avoid single-case overfitting).
    - Panel must exercise unknown, conflicting, and context-dependent representations.
    - Every admitted record needs resolved identity + independent source-span review.
  r611q_gate:
    variant: TSC2 p.Arg611Gln (R611Q)
    admission: BLOCKED until exact identity + primary-source re-grounding complete.
    prohibition: Do NOT hardcode the handoff's proposed R611Q mechanism, zygosity,
      stability, complex, localization, mTOR, or rescue statements as fact.
    on_admission: represent every unsupported handoff mechanism as a hypothesis/unknown.
  synthetic_fixtures:
    independence: >
      Module skeleton + synthetic RED-test fixtures MUST NOT depend on any real
      unfrozen VUS ID. Fixtures are synthetic/illustrative identity shapes only.
    rule: Exact current-policy VUS IDs may be selected only after corrected packets
      freeze; schema/module/skeleton design must not wait on them.

# ---------------------------------------------------------------------------
# 5. Source register (prior art; fail-closed, source-typed)
# ---------------------------------------------------------------------------
# Convention mirrors configs/external/mave_sources.yaml + the reference registers.
# verification in {verified, confirm_pending, unverified}; access-not-held allowed.
source_register:
  reading_rule: >
    Every entry is EVIDENCE provenance, never ACMG criteria, never raptor.scorer
    input, never ClinVar-derived criterion. No score/class here may gate a call.
  source_types: [PRIMARY-OFFICIAL, PRIMARY-DOC, PRIMARY-LIT, SECONDARY-SYNTH, DATASET, CROSSWALK, UNVERIFIED]
  # A direct_evidence_leaf is valid ONLY for these enumerated source_types:
  # an individual primary functional-assay paper (PRIMARY-LIT) or a direct
  # experimental functional dataset (DATASET). All other types are non-grounding.
  allowed_direct_evidence_leaf_source_types: [PRIMARY-LIT, DATASET]
  entry_schema:
    id: source_register.SourceRegisterEntry.v1
    fields:
      entry_id: {type: str, note: stable unique id; the EntryRef target}
      source_type: {type: enum, ref: source_types}
      role: {type: enum, values: [direct_evidence_leaf, provenance_only, context, crosswalk]}
      urn_or_ids: {type: obj, note: urn/pmid/doi/pmcid/accession as applicable}
      transcript: {type: str, optional: true}
      license: {type: str, optional: true}
      sha256: {type: str, optional: true}
      variant_count: {type: int, optional: true}
      verification: {type: enum, values: [verified, confirm_pending, unverified]}
    invariants:
      - role==direct_evidence_leaf is VALID ONLY when source_type is in
        allowed_direct_evidence_leaf_source_types (PRIMARY-LIT individual paper, or
        DATASET direct experimental dataset). Any other pairing raises AtlasSchemaError.
      - source_type in {PRIMARY-OFFICIAL, PRIMARY-DOC, SECONDARY-SYNTH, CROSSWALK,
        UNVERIFIED} MUST NOT carry role==direct_evidence_leaf (provenance_only /
        context / crosswalk only).
      - A PRIMARY-LIT program/grouping/aggregation BUCKET uses role==context, never
        direct_evidence_leaf; only an individual primary paper may be a leaf.
  entry_ref_schema:
    id: source_register.EntryRef.v1
    fields:
      entry_id: {type: str, note: FK into a SourceRegisterEntry}
      span:
        type: obj
        optional: true
        fields: {locator: str, exact_quote: str, page_or_figure: str}
        note: >-
          The CANONICAL exact span and its sole owner; ObservedClaim never
          duplicates this. Optional at schema level (e.g. a provenance-only
          source_pin) but MANDATORY and non-empty when this EntryRef is a verified
          claim's source_ref.
    invariants:
      - An EntryRef used to VERIFY an observed_claim MUST target an entry whose
        role == direct_evidence_leaf AND source_type in
        allowed_direct_evidence_leaf_source_types AND verification == verified, with
        a non-empty span. BOTH role AND source_type are checked, never role alone.
      - EntryRef.span is the ONLY grounding span; no ObservedClaim carries its own
        span, so a verified claim's locator/quote IS this span (never a divergent
        duplicate).
  grounding_rule:
    direct_evidence_leaf: >
      Only primary/direct-evidence LEAF entries may ground a verified observed
      mechanism claim: an individual primary functional-assay publication
      (source_type PRIMARY-LIT) with an exact span, or a verified direct
      experimental functional dataset (source_type DATASET). role AND source_type
      are both required and both checked.
    non_grounding: >
      ClinVar (PRIMARY-OFFICIAL, provenance), Monarch/DisMech (CROSSWALK), review /
      secondary-synthesis articles (SECONDARY-SYNTH), PRIMARY-DOC, and program /
      grouping / aggregation BUCKETS (role context) are provenance_only / context /
      crosswalk and CANNOT ground a verified mechanism claim, regardless of
      verification state and regardless of any role mis-tagging.
  categories:
    primary_functional_literature:
      - entry_id: nellist-hoogeveen-westerveld-program
        source_type: PRIMARY-LIT
        role: context           # program-level GROUPING bucket, not a leaf; cannot ground a claim
        scope: Dutch/European TSC1-TSC2 functional-assay program (abundance, complex
          formation, mTOR readouts) for TSC2 missense variants.
        verification: unverified
        phase2_note: Phase 2 enumerates individual primary publications as separate
          direct_evidence_leaf entries with exact PMIDs/DOIs + spans via the
          deterministic citation/source resolver; no leaf is grounded in the skeleton phase.
      - entry_id: later-tsc2-missense-functional-maps
        source_type: PRIMARY-LIT
        role: context           # grouping bucket, not a leaf
        scope: subsequent large-scale TSC2 missense functional maps (grouping bucket).
        verification: unverified
        phase2_note: same as above; individual leaf entries + exact spans are a Phase 2 deliverable.
    mave_functional_datasets:
      - urn: urn:mavedb:00001201-a-1
        entry_id: mavedb-00001201-a-1
        source_type: DATASET
        role: direct_evidence_leaf
        scope: TSC2 cliPE prime-editing MAVE (HAP1); NM_000548.5; CC0-1.0; 208 variants.
        publication_pmcid: PMC11185720
        doi: 10.1101/2024.06.07.597916
        sha256: 74fef301d3b3cf6b6958161f7eaf8fa1ebab7ae35befae3879d0a9841c769717
        verification: verified
        reuse_note: reuse the existing verified pin in configs/external/mave_sources.yaml;
          do not re-fetch or re-pin here.
      - urn: 'IGVF:analysis-set:IGVFDS5595BTYJ'
        entry_id: igvf-vampseq-tsc2
        source_type: DATASET
        role: direct_evidence_leaf
        scope: IGVF VAMP-seq TSC2 protein abundance.
        publication_pmcid: PMC12871146
        verification: confirm_pending
        note: access-not-held; confirm_pending cannot ground a verified claim until verified.
      - urn: 'IGVF:analysis-set:IGVFDS1782FCXW'
        entry_id: igvf-sge-tsc2
        source_type: DATASET
        role: direct_evidence_leaf
        scope: IGVF Saturation Genome Editing (SGE) TSC2 functional score.
        publication_pmcid: PMC12871146
        verification: confirm_pending
        note: access-not-held; cannot ground until verified.
      - urn: 'CAGI7:TSC2-stability-challenge'
        entry_id: cagi7-tsc2-stability
        source_type: DATASET
        role: direct_evidence_leaf
        scope: CAGI7 TSC2 protein-stability community challenge.
        verification: confirm_pending
        note: access-not-held; distribution terms not reviewed; cannot ground until verified.
    clinvar_provenance:
      - entry_id: clinvar-tsc2-provenance
        source_type: PRIMARY-OFFICIAL
        role: provenance_only
        scope: ClinVar records for identity/label provenance ONLY.
        verification: verified
        circularity_note: >
          ClinVar labels are provenance/context, NEVER mechanism truth and NEVER a
          grounding leaf. Direct-copy criteria (PP5/BP6/PS4) and any classifier score
          are banned as mechanism evidence per ADR-0009. Held-out independence rules
          from ADR-0009 apply.
    crosswalks:
      - entry_id: monarch-dismech-tsc2
        source_type: CROSSWALK
        role: crosswalk
        scope: Monarch / DisMech TSC mechanism synthesis crosswalk.
        verification: unverified
        note: one-way, DisMech-compatible export TARGET only (see dismech_export);
          never an Atlas source of truth, a grounding leaf, or an implementation dependency.
  register_invariants:
    - verify_source fails closed (AtlasSourceVerificationError) on transcript/license/
      sha256/count drift for any locally re-fetched copy.
    - confirm_pending entries raise if any path treats them as verified.
    - Only role==direct_evidence_leaf AND source_type in
      allowed_direct_evidence_leaf_source_types (PRIMARY-LIT / DATASET) AND
      verification==verified entries may ground a verified observed mechanism claim;
      provenance_only/context/crosswalk, disallowed source_types and grouping buckets
      never can (AtlasProvenanceError / AtlasSchemaError if forced).
    - Raw external data (MaveDB CSV, IGVF files) is NEVER committed; only pins + aggregates.

# ---------------------------------------------------------------------------
# 6. Leakage guards (bidirectional scoring-import prohibition)
# ---------------------------------------------------------------------------
leakage_guards:
  scoring_import_prohibition:
    - No raptor.scorer / raptor.eval scoring or gate module may import raptor.atlas.
    - raptor.atlas may not import a classifier/ClinVar-derived criterion value as
      mechanism truth (ADR-0009), nor emit anything consumed by PP3/BP4 (ADR-0012).
    - A mechanism profile may re-enter ACMG scoring ONLY under a separately approved
      evidence policy; no such policy exists, so the path is closed.
  atlas_import_boundary:
    forbidden_atlas_imports:
      - raptor.packet
      - raptor.scorer
      - raptor.eval
    allowed_only_after_explicit_approval:
      - neutral shared identity utilities (e.g. canonical SPDI/HGVS helpers)
      - neutral shared provenance/hashing utilities
    rule: >
      raptor.atlas MUST NOT import raptor.packet, raptor.scorer, or raptor.eval.
      Only neutral, side-effect-free shared identity/provenance/hashing utilities
      may be shared, and only after explicit owner approval + a recorded decision;
      absent that approval, raptor.atlas depends on none of them.
  circularity_guard:
    forbidden_consumers:
      - raptor.packet
      - raptor.scorer
      - raptor.eval.benchmark
      - raptor.eval.gate
      - raptor.eval.harness
      - raptor.eval.knowns
    forbidden_criteria: [PP3, BP4, PP5, BP6, PS4, PS3, BS3]
    forbidden_inputs_as_mechanism_truth: [classifier_score, clinvar_derived_criterion]
  discovery_import_boundary:
    rule: >
      The core raptor.atlas package MUST NOT import any Discovery SDK, client, or
      agent. The Discovery research lane runs OUT-OF-PROCESS (config/templates
      only) and reaches atlas solely as an untrusted AtlasCandidateImport payload
      validated by promote.py. Discovery is runtime-optional and never on the
      accept/hash/guard path.
    forbidden_atlas_imports_extra: [microsoft_discovery_sdk, discovery_agent_client]
  enforcement: guards.py + Gemini RED tests assert import-direction (incl. no
    raptor.packet/scorer/eval and no Discovery SDK/agent import from atlas), the
    criterion bans, and the direct_evidence_leaf grounding rule.

# ---------------------------------------------------------------------------
# 7. One-way DisMech-compatible export
# ---------------------------------------------------------------------------
dismech_export:
  direction: one-way (Atlas -> DisMech-compatible record) ONLY.
  precondition: export runs ONLY after internal validation (schema + guards CLEAN).
  prohibitions:
    - DisMech/Monarch is never the Atlas source of truth.
    - No DisMech schema becomes an implementation dependency of the internal module.
    - No external contact / contribution initiated in this track (owner approval required;
      tracked separately as grant-anthropic-dismech-integration-path).
  export_contract: export_dismech(profile) emits provenance-bound, span-carrying records;
    it drops nothing silently and never fabricates a claim.

# ---------------------------------------------------------------------------
# 8. Discovery research lane (active, bounded Phase-2) + evaluation
# ---------------------------------------------------------------------------
discovery_boundary:
  posture: >
    Per dual_path_architecture: Microsoft Discovery is an ACTIVE but bounded
    Phase-2 research/orchestration lane and evaluation surface. It PROPOSES
    untrusted candidates only; RAPTOR remains the source of truth and the sole
    writer of accepted profiles. Runtime-optional: failure/unavailability MUST NOT
    block the RAPTOR Atlas or change any accepted profile.
  engine_tasks:
    - identity_confirmation           # candidate identity proposal; RAPTOR re-admits via SPDI
    - literature_retrieval            # Bookshelf + pubmed/online-researcher public papers
    - claim_span_extraction           # propose claim + exact span; RAPTOR re-resolves
    - contradiction_search            # surface opposing evidence
    - assay_context_normalization     # normalize assay/model/context toward enums
    - evidence_gap_mapping            # name missing assays / unknowns
  validation_requirements: >
    Every task output is an AtlasCandidateImport validated by promote.py (identity,
    source type/role, citation resolution, exact span, context enums, duplicate/
    conflict rules, no-classification leakage) before any promotion; human/oracle
    span review is required before Phase-2 GO.
  native_vs_discovery_evaluation:
    scope: SAME bounded 5-10-case TSC2 panel, native RAPTOR vs Discovery-assisted.
    axes:
      - retrieval_recall
      - valid_claim_span_yield
      - contradiction_detection
      - hallucination_unsupported_claim_rate
      - context_completeness
      - reproducibility
      - latency_cost
    rule: >
      Discovery is optional at runtime; a failed/absent lane scores as unavailable
      and never blocks RAPTOR or mutates accepted profiles.
  contribution_gate:
    after_clean_eval: >
      Only after a clean 5-10-case evaluation MAY a catalog contribution
      (tsc-mechanism-evidence-mapper or a generic mechanism-evidence auditor) be
      considered SEPARATELY. It is OUT OF SCOPE for this track and requires owner
      approval.
  this_track_forbids:
    - Migrating RAPTOR scoring, gates, packet source of truth, or the build loop into Discovery.
    - Contributing the prompt agent to microsoft/discovery in this track.
    - Any direct cloud/private/patient data; only public, appropriately-licensed sources.
    - The core atlas package importing any Discovery SDK/agent (out-of-process only).

# ---------------------------------------------------------------------------
# 9. Packet dependency split (what proceeds now vs. waits for frozen packets)
# ---------------------------------------------------------------------------
packet_dependency_split:
  proceed_now_independent_of_packets:
    - All schemas (identity, claim, context, edge, evidence, profile, provenance).
    - module_api skeleton (src/raptor/atlas/) + typed errors + hashing + guards.
    - source_register structure + verified pins (MaveDB) + fail-closed verification.
    - synthetic RED-test fixtures (ID-independent) + panel selection CONTRACT (strata rules).
    - AtlasCandidateImport schema + deterministic promotion gate (promote.py).
    - Discovery Bookshelf/query/task TEMPLATES (config, out-of-process) + PUBLIC
      appropriately-licensed source collection + Discovery tool smoke tests.
    - one-way DisMech export contract.
  waits_for_frozen_corrected_packets:
    - Exact current-policy VUS IDs admitted into the live pilot panel.
    - R611Q admission (additionally gated on primary-source re-grounding).
    - Real leaf source enumeration (PMIDs/DOIs) + exact spans + any verified claim.
    - Any pilot CONTENT (real per-variant mechanism profiles).
    - Discovery-proposed real mechanism claims/profiles (candidates must pass the
      promotion gate + named human/oracle span review; nothing accepted in Phase 1).
  rule: Schema/module/skeleton design MUST NOT depend on unfrozen packet IDs; only
    concrete pilot ID admission and real source grounding (Phase 2) wait. Corrected
    packets are generated independently.

# ---------------------------------------------------------------------------
# 10. Workflow + per-model scopes (ADR-0003 / ADR-0005 loop)
# ---------------------------------------------------------------------------
workflow:
  order: Opus PLAN -> Gemini 3.5 Flash RED tests -> Claude Sonnet 5 skeleton -> GPT-5.4 checker
  gate: pilot content follows ONLY after checker CLEAN AND corrected packet availability.
  phases:
    phase1_skeleton:
      does: schema + guards + synthetic fixtures + unresolved-source behavior; MAY pin
        and verify real source-register bibliographic METADATA (PMID/PMCID/DOI/
        accession/license) as metadata only; MAY prepare Discovery Bookshelf/query/
        task TEMPLATES (config, out-of-process), collect PUBLIC appropriately-
        licensed sources, and run Discovery tool smoke tests.
      forbids: real grounding spans, real verified observed claims, R611Q evidence,
        pilot claims/profiles, mechanistic conclusions, and ANY accepted Discovery
        candidate (native or Discovery real mechanism claims/profiles are Phase 2).
    phase2_grounding:
      does: real leaf enumeration + exact grounding spans + verified claims + pilot
        content; runs the bounded Discovery research lane, RAPTOR validates and
        promotes candidates through the deterministic gate, and executes the
        native-vs-Discovery evaluation.
      requires: deterministic citation/source resolver AND a named human/oracle
        source-span review AND frozen corrected packets AND checker CLEAN AND every
        Discovery candidate passing the promotion gate (nothing accepted otherwise).
  gemini_tests:
    role: author FAILING (RED) schema/contract tests BEFORE any implementation.
    scope:
      - Schema shape + frozen/immutability + typed-error discrimination for every schema.
      - "SPDI-keyed identity: resolved admission requires canonical GRCh38 spdi_canonical;"
      - "alias-only / missing-SPDI records are unresolved and admission raises AtlasIdentityError."
      - "leaf grounding: verified claim requires role==direct_evidence_leaf AND source_type in {PRIMARY-LIT, DATASET} AND verification==verified AND span;"
      - "negative: mis-tagging each disallowed source_type (PRIMARY-OFFICIAL, PRIMARY-DOC, SECONDARY-SYNTH, CROSSWALK) or a grouping bucket as direct_evidence_leaf raises AtlasSchemaError;"
      - "negative: EntryRef/verified-claim admission rejects role-only tagging when source_type is not allowed (AtlasProvenanceError/AtlasSchemaError)."
      - "span ownership: an ObservedClaim declaring its own span field raises AtlasSchemaError; the ONLY grounding span is source_ref.span (EntryRef)."
      - "span determinism: the claim ordering/hash key reads source_ref.span.locator; a verified claim cannot hash or validate against a locator/quote differing from its source_ref.span (mutating source_ref.span changes the claim hash; no claim-local override exists)."
      - "provenance_only/context/crosswalk/grouping-bucket grounding raises AtlasProvenanceError."
      - unknown & conflicting states are representable and NOT coerced to a call.
      - context-dependence: same variant, different context -> distinct records.
      - "leakage guards: assert atlas does NOT import raptor.packet/scorer/eval; forbidden criteria/inputs; no consumer import of atlas."
      - "source register fail-closed: sha256/transcript/license/count drift raises; confirm_pending treated-as-verified raises."
      - "hash coherence: evidence_core/profile_envelope payloads over the DEFINED include/exclude fields only; claim_id refs resolve into profile.claims; canonical order/dedup deterministic; run_metadata excluded."
      - fixtures are synthetic and ID-independent (no unfrozen VUS ID dependency).
      - "unresolved-source behavior: unverified/confirm_pending entries never ground a verified claim."
      - "candidate import is UNTRUSTED: a proposed claim/source/identity never becomes accepted without passing the full promotion gate (AtlasSchemaError/AtlasProvenanceError on failure)."
      - "promotion gate order enforced: identity re-admission, source type/role, citation resolution, exact span, context enums, duplicate/conflict, no-classification leakage; any failure REJECTS the candidate."
      - "Discovery optionality: with the research lane unavailable/failing, RAPTOR Atlas still builds and accepted profiles are UNCHANGED (no dependency, no import)."
      - "Discovery import boundary: core atlas imports no Discovery SDK/agent (out-of-process only)."
    must_not: assert any real verified observed claim, any real grounding span, any
      R611Q/pilot content, any mechanistic conclusion, or any classifier value
      (real bibliographic metadata pins are permitted).
  sonnet_scope:
    role: implement ONLY the Phase-1 internal module skeleton to turn RED tests GREEN.
    in_scope:
      - src/raptor/atlas/ model/identity/hashing/registry/profile/export/guards + README.
      - Frozen dataclasses, tuples for ordered collections, typed errors.
      - SPDI-keyed identity admission + reconciliation + unresolved failure.
      - "SourceRegisterEntry/EntryRef schemas + role AND source_type gating (only PRIMARY-LIT/DATASET leaves ground)."
      - "May pin and verify real bibliographic METADATA (PMID/PMCID/DOI/accession/license) as metadata only; no grounding spans, no verified claims."
      - Field-coherent evidence_core/profile_envelope hashing (defined include/exclude,
        canonical order/dedup, run_metadata excluded).
      - Fail-closed source verification; atlas_import_boundary (no packet/scorer/eval import).
      - "provide the citation/source resolver INTERFACE keyed on source_ref (EntryRef): it resolves/validates the canonical EntryRef.span only, never a claim-local span (no real span resolution, no verified-claim output in Phase 1)."
      - "promote.py: deterministic AtlasCandidateImport validation + promotion gate (no acceptance without the full gate; importer never writes accepted state)."
      - "Discovery Bookshelf/query/task TEMPLATES as CONFIG/TEMPLATES outside src/raptor/atlas; core package imports no Discovery SDK/agent."
    out_of_scope:
      - No real grounding spans, no real verified observed claims, no mechanistic conclusions (Phase 2 only).
      - No R611Q evidence; no pilot CONTENT; no real VUS admission; no external fetch of held data.
      - No scorer/eval/packet/config/data edits; no PP3/BP4 or ACMG coupling.
      - No accepted Discovery candidate; no real Discovery mechanism claim/profile (Phase 2 + human/oracle review).
      - No DisMech contribution; no agent contributed to microsoft/discovery; no private/cloud/patient data.
  gpt54_probes:
    role: independent checker; adversarial schema/guard/leakage review (Phase 1),
      source-span review deferred to Phase 2.
    probes:
      - Leakage: can any mechanism value reach the scorer/gate or a banned criterion? (must be NO)
      - "Import boundary: does raptor.atlas import raptor.packet/scorer/eval? (must be NO)"
      - Circularity: is any confidence/class derived from a classifier/ClinVar score? (must be NO)
      - "SPDI: is resolved admission gated on canonical GRCh38 SPDI, aliases provenance-only? (must hold)"
      - "Source-type binding: is direct_evidence_leaf accepted ONLY for PRIMARY-LIT/DATASET, and does verified-claim/EntryRef admission check BOTH role AND source_type (not role alone)? (must hold)"
      - "Leaf grounding: can only a direct_evidence_leaf + allowed source_type + verified entry ground a verified claim? (must hold)"
      - "Span ownership: is the grounding span owned SOLELY by source_ref (EntryRef.span), with NO duplicate span on ObservedClaim, so a verified claim can never hash/validate against a different locator/quote than its source reference? (must hold)"
      - "Source of truth: does RAPTOR alone admit/validate/ground/hash/accept, with all Discovery output untrusted until promoted through the deterministic gate? (must hold)"
      - "Discovery optionality: does Discovery failure/unavailability leave RAPTOR Atlas and every accepted profile unchanged? (must hold)"
      - "Discovery import boundary: does the core atlas package import any Discovery SDK/agent? (must be NO)"
      - "Hash coherence: are payloads over defined fields with claim_id refs resolving into profile.claims, run_metadata excluded? (must hold)"
      - Contrast: does the ontology preserve unknown/conflicting/context across strata?
      - "Skeleton purity: are there ANY real verified claim/grounding span, R611Q/pilot content, or mechanistic conclusion in Phase 1? (must be NONE; real bibliographic metadata pins are allowed)"
      - Fixture independence: no dependency on unfrozen packet IDs? (must hold)
      - "Phase 2 (deferred): real source-span review by deterministic resolver + named human/oracle."
    verdict: CLEAN / REVISE / DO-NOT-MERGE.

# ---------------------------------------------------------------------------
# 11. Stop/go
# ---------------------------------------------------------------------------
stop_go:
  skeleton_phase_passes_only_if:      # Phase 1
    - "Schemas frozen: SPDI-keyed identity, leaf role+source_type-typed source register, coherent hashes."
    - "Guards CLEAN: raptor.atlas imports none of raptor.packet/scorer/eval; no banned criterion/input; no consumer imports atlas."
    - Synthetic fixtures + unresolved-source behavior pass the RED tests.
    - "NO real verified claim/grounding span, NO R611Q evidence, NO pilot curation, NO mechanistic conclusion (real bibliographic metadata pins ARE allowed)."
    - "Discovery is config/templates + public-source collection + smoke tests only: core atlas imports no Discovery SDK/agent; NO accepted Discovery candidate."
  pilot_phase_passes_only_if:         # Phase 2, gated
    - The ontology handles contrasting cases (all five strata) without collapse.
    - Context, contradictions, and unknowns are preserved (not coerced to a call).
    - Zero classification/scoring leakage (guards + checker CLEAN).
    - Every verified claim grounded in a direct_evidence_leaf + verified entry + a
      non-empty source_ref.span (canonical exact span owned by the EntryRef; no
      duplicate claim span).
    - Passes a deterministic citation/source resolver AND a named human/oracle
      source-span review.
    - Every Discovery candidate promoted ONLY through the deterministic gate
      (identity, source type/role, citation, exact span, context enums, duplicate/
      conflict, no-classification leakage) + human/oracle span review.
    - Native-vs-Discovery evaluation on the SAME panel reports retrieval recall,
      valid claim/span yield, contradiction detection, hallucination/unsupported-
      claim rate, context completeness, reproducibility, and latency/cost.
    - "Discovery is optional at runtime: its failure/unavailability does NOT block RAPTOR or change any accepted profile."
  otherwise: REVISE or STOP. No cross-gene / cross-disease expansion.
  go_signal_phase2: >
    schema + leakage guards CLEAN (checker) AND corrected packets frozen AND a
    deterministic citation/source resolver plus a named human/oracle source-span
    reviewer are available.
  post_eval_options: >
    After a clean 5-10-case native-vs-Discovery evaluation, a SEPARATE catalog
    contribution (tsc-mechanism-evidence-mapper or a generic mechanism-evidence
    auditor) MAY be considered under owner approval; it is out of scope for this
    track and never migrates scoring/gates/packet source of truth/build loop.

# ---------------------------------------------------------------------------
# 12. Extraction gate (repository extraction is later + evidence-gated)
# ---------------------------------------------------------------------------
extraction_gate:
  default: build INSIDE RAPTOR as src/raptor/atlas/; do NOT extract now.
  extraction_evidence_required_any:
    - the ontology survives multiple contrasting TSC2 variants;
    - it works for another gene;
    - the API is independent of RAPTOR;
    - another concrete consumer exists;
    - independent release / team / licensing needs emerge.
  seam: export.py + api_independence keep extraction cheap without doing it now.

# ---------------------------------------------------------------------------
# 13. Beat-4 inversion (how this spec could pass yet be wrong) + verification
# ---------------------------------------------------------------------------
deliberate_action:
  beat4_inversions:
    - "The spec names leakage guards but leaves a back-channel where mechanism evidence becomes a PP3/BP4 predictor -> mitigated: forbidden_criteria + forbidden_consumers + closed re-entry policy, asserted by RED tests."
    - "raptor.atlas imports raptor.packet/scorer/eval, coupling the module to scoring behind the behavioral independence claim -> mitigated: atlas_import_boundary (forbidden_atlas_imports) + RED import-direction guard tests."
    - "Admission accepts an hgvs/transcript alias without a canonical SPDI, silently equating NM_000548.4/.5 variants -> mitigated: SPDI-keyed admission, aliases provenance-only, unresolved -> AtlasIdentityError."
    - "A verified mechanism claim is grounded in ClinVar / Monarch-DisMech / a review / a program grouping bucket -> mitigated: direct_evidence_leaf role gating on EntryRef + AtlasProvenanceError."
    - "A disallowed source_type is MIS-TAGGED role==direct_evidence_leaf and grounds a verified claim because only role (not type) was checked -> mitigated: allowed_direct_evidence_leaf_source_types binding (PRIMARY-LIT/DATASET), entry/EntryRef/claim admission check BOTH role AND source_type, AtlasSchemaError, negative Gemini cases + GPT source-type-binding probe."
    - "An ObservedClaim carries its own span that DIVERGES from its source_ref (EntryRef) span, so a verified claim hashes/validates against a locator/quote the source never stated -> mitigated: single canonical span ownership on EntryRef.span, ObservedClaim carries no span field (AtlasSchemaError), ordering/hash key reads source_ref.span, Gemini span-ownership + determinism tests + GPT span-ownership probe."
    - "Phase-1 purity is read as banning even real bibliographic metadata pins, or conversely a real grounding span slips in disguised as metadata -> mitigated: explicit split — metadata pins (PMID/PMCID/DOI/accession/license) permitted and verified as metadata; grounding spans / verified claims / mechanistic conclusions are Phase 2 only."
    - "evidence_core_hash references a field the profile lacks (a top-level claims table) producing an undefined/unstable hash -> mitigated: top-level claims tuple + run_metadata + explicit include/exclude payloads + canonical order/dedup + claim_id refs into profile.claims."
    - "Real PMID/DOI/span grounding, R611Q evidence, or pilot curation sneaks into the skeleton phase, pre-empting frozen packets + human review -> mitigated: Phase-1 purity + Phase-2-only real grounding + go_signal_phase2 (resolver + named human/oracle review)."
    - "R611Q's handoff mechanism is silently treated as fact -> mitigated: r611q_gate BLOCKED + no-hardcode prohibition + GPT-5.4 probe + Phase-2 grounding gate."
    - "Pilot fixtures depend on unfrozen VUS IDs, coupling skeleton to packet freeze -> mitigated: synthetic_fixtures independence + packet_dependency_split."
    - "A classifier/ClinVar score leaks in as confidence/mechanism truth (R-A2 circularity) -> mitigated: forbidden_inputs_as_mechanism_truth + ADR-0009 binding."
    - "Discovery becomes a de-facto source of truth by writing accepted claims/profiles directly -> mitigated: AtlasCandidateImport is UNTRUSTED, promote.py runs the full deterministic gate + human/oracle review, only RAPTOR writes accepted profiles."
    - "The core atlas package imports a Discovery SDK/agent, coupling acceptance to an external service -> mitigated: discovery_import_boundary (out-of-process, config/templates only) + RED import guard + GPT probe."
    - "Discovery unavailability or failure silently blocks RAPTOR or mutates accepted profiles -> mitigated: runtime-optional posture + RED optionality test (RAPTOR builds unchanged with the lane down) + GPT optionality probe."
    - "Discovery pulls private/cloud/patient data or improperly-licensed sources -> mitigated: public appropriately-licensed sources only boundary + no-PHI rule + retrieval_provenance audit."
    - "The bounded evaluation quietly expands into a microsoft/discovery catalog contribution mid-track -> mitigated: prototype is PRIVATE; contribution deferred to a SEPARATE track after a clean 5-10-case eval (contribution_gate / post_eval_options)."
    - "The commit accidentally includes a code/config/data file -> mitigated: commit only this spec; verify with git show --stat."
  verification_contract:
    - Slot hashes verified MATCH (all three) at rev 1; composition unchanged.
    - rev 2 is a plan-only follow-up commit on head a840347 (no amend, no push).
    - rev 3 is a plan-only follow-up commit on head 29a330e (no amend, no push).
    - rev 4 is a plan-only follow-up commit on head 70091c8 (no amend, no push).
    - rev 5 is a plan-only follow-up commit on head 20a9a99 (no amend, no push).
    - Only docs/project/specs/mechanism-atlas-starter.yaml staged and committed.
    - Both required trailers present on the commit; YAML validated.

