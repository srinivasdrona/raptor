product_contract:
  operator: RAPTOR source-maintenance operator
  goal: >-
    Accept one already-present, operator-supplied staged candidate snapshot;
    verify its manifest and local bytes offline; bind it to exactly one
    validated V2-S1 source baseline; and emit byte-reproducible,
    content-addressed verification and fact-diff artifacts without applying
    the candidate.
  outputs_are:
    - deterministic observations of the supplied manifest and bytes
    - deterministic comparisons with one hash-bound V2-S1 source record
    - immutable inputs for a separately specified V2-S3 decision stage
  outputs_are_not:
    - source readiness or lifecycle state
    - a materiality, severity, approval, or promotion decision
    - an impact route, invalidation instruction, rebuild request, or rollback plan
    - scientific, legal, clinical, evidentiary, or product authorization
  validation_ceiling: >-
    V2-S2 records offline deterministic observations about supplied staged
    bytes and their declared comparison to one V2-S1 baseline. It makes no
    materiality, approval, promotion, lifecycle, scientific, legal, clinical,
    consumer-impact, or rollback decision.

scope:
  exact_in:
    - one staged manifest bound to one V2-S1 source_id and registry_content_hash
    - strict closed manifest parsing and immutable typed input models
    - safe repository-relative staging and generated-output boundaries
    - offline reads of manifest-listed local staged files only
    - raw-byte or canonical-LF-text checksum verification
    - exact inventory, duplicate, missing, unknown, type, and size checks
    - two-pass input immutability detection
    - validation of the current V2-S1 registry and declaration preconditions
    - deterministic source, content, declaration, and optional component fact diff
    - canonical JSON, content hashes, idempotent output writes, and CLI result JSON
  exact_out:
    - source download, URL dereference, network client, credential, or egress
    - live refresh, detector, scheduler, Prefect flow, service, database, UI, or API
    - archive extraction, decompression, candidate JSON/YAML domain parsing, or code execution
    - candidate promotion, activation, installation, copying into a domain path, or deletion
    - mutation of configs/sourceops/source_registry.yaml or any domain declaration
    - registry lifecycle advancement or V2-S1 READY/BLOCKED calculation
    - material-drift thresholds, severity, approval, action routing, or rollback rehearsal
    - consumer invalidation, benchmark rebuild, packet invalidation, Atlas regrounding, or validation rerun
    - evidence reinterpretation, scoring, classification, scientific/legal sufficiency, or clinical authorization
    - RescueScreen entry gates, behavior, files, structure work, screening, assays, or vendor work
  future_slice_guard: >-
    V2-S3 alone may interpret a valid V2-S2 diff for materiality, downstream
    impact routing, approval, or rollback rehearsal. V2-S2 must not import,
    copy, execute, or summarize V2-S1 drift_policy actions or consumer routes
    into its output.

