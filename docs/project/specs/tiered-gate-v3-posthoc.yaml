# ---------------------------------------------------------------------------
# 1. Decision context — what is misleading, and the post-hoc risk (slot 2 §1)
# ---------------------------------------------------------------------------

decision_context:
  operator_directive:
    - Preserve R2 unchanged (byte-identical).
    - Create a NEW versioned tiered gate that separates technical run validity,
      data sufficiency, conditional performance, policy parity, scope evidence,
      and authorization onto independent axes.
    - Recompute ONLY the final gate interpretation from frozen R2 counts.
    - Label the result POST-HOC re-adjudication, never new independent validation.
    - Preregister prospective validation on future/independent unseen data.
    - No x64, BIAS, Nirvana, annotation, or scorer rerun.
  misleading_v2_semantics_corrected:
    undefined_metric_coercion:
      symptom: >-
        R2 reports missense:pathogenic precision_lb=0.0, recall_lb=0.0 on
        path_called=0, and missense:benign precision_lb=recall_lb=0.6637 on only
        benign_called=9. The v2 gate reads these as metric_status=UNMET →
        scope_status=FAIL, i.e. a PERFORMANCE failure.
      correction: >-
        Undefined/underpowered conditional metrics are NOT_ESTIMABLE, never
        numeric zero and never a performance FAIL. The 0.0 in the frozen record
        is a fixture/coercion artifact (see model.Metrics default 0.0); the
        tiered gate MUST derive its axes from called/actual counts and treat the
        stored lower bounds as valid ONLY when data_sufficiency == ADEQUATE.
    overbroad_global_pm1_blocker:
      symptom: >-
        R2 carries authorization_blockers=["evaluation_skipped_criteria:PM1"],
        which forces EVERY authorization surface closed
        (full_spectrum_status=BLOCKED_POLICY, governance_state=NONE_VALIDATED,
        research_scope_flags.truncating_pathogenic_research_scope_validated=false)
        even though the per-scope verdict truncating:pathogenic=VALIDATED. PM1 is
        pathogenic-direction, missense-hotspot evidence and is irrelevant to the
        PVS1-driven truncating scope and to every benign scope.
      correction: >-
        Map each excluded criterion to ONLY the scopes it can affect (see
        criterion_scope_applicability). PM1 blocks missense:pathogenic alone; it
        must not leak into truncating or benign scopes.
  post_hoc_risk_named:
    statement: >-
      This tiered interpretation was designed AFTER seeing R2. Re-adjudicating
      the same frozen counts under a new rule cannot become independent
      validation. truncating:pathogenic clearing 0.95/0.95 was already visible
      (ADR-0011 §non-blind acknowledgment) before this rule was written, so
      adopting it as research support is post-hoc rule-making.
    controls:
      - No threshold, direction, gating flag, confidence, min_count, split, or
        Tavtigian value changes (all inherited locked from tsc2.yaml, which stays
        BYTE-IDENTICAL at approved SHA-256 ea4ff… — no additive block).
      - The versioned tiered rule (axis enums, criterion→scope map, governance
        statements, prospective registration) lives ENTIRELY in the new
        standalone configs/eval/tiered_gate_v3.yaml; the policy-bound scoring
        config tsc2.yaml is never mutated or re-signed.
      - The rule only NARROWS what a pass can mean (research-evidence, post-hoc,
        non-clinical); it grants no new capability.
      - Full-spectrum authorization still hard-requires the missense scopes and
        cannot be narrowed to drop them.
      - Real authorization requires a PROSPECTIVE run on unseen data; that is
        registered PENDING and is never claimed here.

