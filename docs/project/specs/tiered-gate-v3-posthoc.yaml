# RAPTOR tiered gate v3 — post-hoc re-adjudication of the frozen ADR-0012
# masked-holdout gate (R2). Claude Opus planner contract (rev 3).
#
# rev 2 applies every GPT-5.4 planner finding consistently: (1) reuse the exact
# canonical ADR-0011/v2 research key truncating_pathogenic_research_scope_validated
# everywhere (no alias); (2) explicit aggregate enums + precedence + pinned
# verbatim safety strings (full-spectrum status, narrow-scope evidence status,
# authorization status, governance state/statement, research disclaimer,
# no-new-evidence statement) with current post-hoc AND future
# prospective-authorized branches; (3) a typed fail-closed input/config error
# that writes NO artifact (A3/A5/A6 run only after valid input/config); (4) a
# single locked prospective dataset rule (no OR) with BLOCKED_DATA + no
# outcome-dependent fallback; (5) frozen-R2 tests over all six scopes and all
# axes incl. other:benign 112/2095 (called 113) and other:pathogenic 89/117
# (correct/actual, never called/actual); (6) config/impl/source/self content
# hashes over compact JSON PLUS the written artifact's canonical-LF file SHA-256
# recorded as an EXTERNAL manifest identity (a file cannot embed its own final
# hash without self-reference); (7) consistent test/Beat-4/migration/
# expected-R2/count updates, additive architecture, R2/v1/v2 immutable.
#
# rev 3 corrects a policy-hash regression in rev 2's config PLACEMENT: rev 2
# commanded APPENDING the tiered_authorization block to the policy-bound,
# census/ADR-0012-verified configs/eval/tsc2.yaml, which changed that file's
# APPROVED raw SHA-256 from ea4ff… to 38f729… and broke ADR-0012 / census
# policy verification (the approved scoring config was re-signed for an additive
# block it should never have carried). rev 3 relocates the ENTIRE v3 rule into a
# NEW STANDALONE configs/eval/tiered_gate_v3.yaml (its own schema
# raptor.eval.tiered_authorization.v3 + its own canonical hash), preserves
# tsc2.yaml BYTE-IDENTICAL at approved ea4ff…, adds a dedicated
# load_tiered_authorization(path) loader + typed validation while
# load_config(tsc2.yaml) and every v1/v2 policy-bound flow stay byte/behaviour
# compatible, a CLI arg --tiered-config configs/eval/tiered_gate_v3.yaml whose
# separately-loaded block drives tiered_config_canonical_sha256, DEFENSIVE
# Oracle-constant runtime validation inside decide_tiered_gate (confidence /
# thresholds / directions / gating / min_count must match the pinned v2
# constants; drift raises TieredReadjudicationConfigError before any decision),
# and an A3 policy-parity reason that stays visible INDEPENDENTLY of the A5
# precedence label (PM1 recorded for missense:pathogenic even when A5 is
