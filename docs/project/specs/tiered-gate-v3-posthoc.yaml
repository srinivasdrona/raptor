#
# Purpose: an implementation-ready, hash-bound, additive plan that RE-ADJUDICATES
# the FROZEN R2 masked-holdout aggregate under a new, multi-axis tiered gate
# ("v3"), WITHOUT rerunning annotation/scoring/BIAS/Nirvana/x64, WITHOUT touching
# any locked threshold, and WITHOUT overwriting R2. It corrects two specific
# misleading v2 semantics — (a) undefined missense precision/recall coerced to a
# numeric 0.0 and presented as a hard performance FAIL, and (b) an overbroad
# GLOBAL PM1 authorization blocker that leaked into and suppressed the
# independently-valid truncating-pathogenic research scope — while REFUSING to
# manufacture a more favorable headline: truncating-pathogenic is at most
# SUPPORTED_POSTHOC, never authorized, with prospective validation PENDING.
#
