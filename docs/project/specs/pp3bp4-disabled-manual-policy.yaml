# ---------------------------------------------------------------------------
# INTENT (slot 1 Beat 1/3/4) — the first-class contract this plan satisfies.
# ---------------------------------------------------------------------------
intent:
  summary: >-
    Design an explicit, hash-bound disabled/manual PP3/BP4 policy mode that lets
    the masked rerun proceed while emitting zero automated PP3/BP4, retains
    PP3/BP4 in the criterion vocabulary for manual review, binds the decision to
    exact production/eval config hashes, and keeps corrected/REVEL activation a
    separately gated future decision.
  contract:
    required: >-
      A policy schema (v2) that carries an evidence `mode` ORTHOGONAL to
      approval `status`; a terminal-runner branch that PROCEEDS only for an
      approved disabled/manual artifact whose ACTUAL-loaded production/eval
      config hashes AND runtime_bundle_hash match, that applies NO
      predictor correction, proves zero consumed PP3/BP4 calls, and stays
      AUTHORIZATION-NEUTRAL (the pre-registered gate/scope_gate decide from
      metrics); production/eval configs with PP3/BP4 removed from
      emission/automation but retained in vocabulary; and an owner approval
      recorded separately from the doer.
    done_means: >-
      The plan is self-contained and implementation-ready: a doer can author the
      exact files, the checker can review exact probes, and no design decision
      is left open. Disabled/manual is explicit and cannot be read as predictor
      approval; production and eval stay equal and hash-bound; pending/unapproved
      and any corrected-enabled mode stay BLOCKED_POLICY.
  expected_observable:
    - >-
      This rev-3 planner commit modifies exactly one file
      (docs/project/specs/pp3bp4-disabled-manual-policy.yaml); `git show --stat`
      shows 1 file changed, parent d40b6da, both trailers
      (Copilot-Session 7c146921), no amend, no push.
    - >-
      Post-implementation (Sonnet, separate track): with an APPROVED
      disabled/manual artifact + matching config hashes + the masked runtime
      inputs, `scripts/run_masked_holdout_eval.py` prints a gate status that is
      NOT BLOCKED_POLICY, and config_pins report policy_mode=disabled_manual,
      pp3bp4_scored_calls=0, non-empty pp3bp4_suppressed_counts, and
      predictor_correction_applied=false.
  inversion_beat4:
    - >-
      Worst silent-wrong: an `status: approved` artifact enables CORRECTED
      PP3/BP4 via the existing PredictorCorrectedEvidenceSource path
      (run_masked_holdout_eval.py enabled branch) even though the owner meant
      "disabled". Controlled by making `mode` mandatory and refusing to
      construct PredictorCorrectedEvidenceSource in the disabled branch.
    - >-
      Config removes PP3/BP4 from eval but not production (or vice versa):
      controlled by editing BOTH configs in one commit + the load-time parity
      invariant (live_source.py:243) + a Gemini parity test.
    - >-
      Report claims suppression without counting: controlled by a counting
      PolicyDisabledEvidenceSource and an asserted pp3bp4_scored_calls == 0.
    - >-
      Accidental code drift: the loader/wrapper/runner bytes change (e.g. an
      unrelated refactor) after approval while configs still hash-match.
      Detected by a runtime_bundle_hash over those three files; a byte change the
      verifier still sees => BLOCKED_POLICY. (A malicious edit that also removes
      the verifier is out of scope this phase -- see threat_model.)
    - >-
      Authorization over-reach in EITHER direction: the runner force-DENIES (the
      rejected GPT suggestion, which would break the production-faithful rerun /
      ADR-0011 scope reporting) or force-ALLOWS VUS/scope authorization from
      policy mode. Controlled by an authorization-neutral runner: only the
      pre-registered gate/scope_gate decide from metrics.
    - >-
      Planner-scope inversion: silently editing code/config/tests. This plan
      touches ONLY the one YAML; every other change is delegated, not performed.
  pm_sanity_check: >-
    PM: the rev-3 commit uses `Copilot-Session: 7c146921-f3dd-4a1e-8cf0-8f574de49204`
    -- the correct track session (base 680e803 and the core-annotation-bundle
    planner use it), same as rev 2 (d40b6da). Rev 1 (878bff8) wrongly used
    90703341; per the no-amend rule earlier commits are left as-is. If the
    required session differs, only the trailer needs to change.

# ---------------------------------------------------------------------------
# Threat model — the scope these controls are proportionate to.
# ---------------------------------------------------------------------------
threat_model:
  trusted:
    - 'the local owner, the orchestrator, and the RAPTOR codebase/repo are TRUSTED at the current phase (single-owner local research build).'
  in_scope_risks:
    - 'accidental byte drift of a pinned config, or of the loader/wrapper/runner code, between approval and a run'
    - 'a stale approval left in place after configs/code changed'
    - 'ordinary config/path mistakes (wrong --scorer-config/--eval-config, a hand-edited threshold, a one-sided PP3/BP4 removal)'
  out_of_scope_this_phase:
    - 'malicious or compromised writers, or a code change that deliberately removes/bypasses the verification itself (owner has explicitly excluded this at current scale)'
    - 'principal authentication / signature / release-provenance attacks'
    - 'concurrent adversarial mutation of a file between a check and its use (TOCTOU)'
  consequence: >-
    Controls below are AUTHENTICITY-of-intent checks against accident and
    staleness, NOT security controls against a motivated attacker. No control
    should be read as tamper-proof or self-authenticating. See residual_risk for
    limitations and revisit triggers.

# ---------------------------------------------------------------------------
# Problem statement — the exact current behavior this plan changes (Beat 2).
# ---------------------------------------------------------------------------
current_state:
  policy_artifact:
    file: configs/eval/bp4pp3_predictor_policy.json
    schema: bp4pp3-predictor-policy
    status: pending
    fields: [schema, status, predictor_source_hash, correction_hash, decision_reference]
    loader: src/raptor/eval/predictor_policy.py
    approved_semantics: >-
      predictor_policy.py sets approved = (status == "approved"); the loader has
      a CLOSED field set (_REQUIRED_FIELDS) and rejects unknown fields; the
      caller (terminal runner) owns fail-closed BLOCKED_POLICY wiring
      (predictor_policy.py:51-58).
  terminal_runner:
    file: scripts/run_masked_holdout_eval.py
    load_and_gate:
      - 'load_predictor_policy -> malformed => BLOCKED_POLICY (run_masked_holdout_eval.py ~301-310)'
      - 'not policy.approved => BLOCKED_POLICY (~311-317)'
      - 'verify_predictor_policy_hashes(policy, predictor_aggregation.yaml, [predictor_aggregation.py, terminal_source.py]) => BLOCKED_POLICY on mismatch (~327-332)'
    evidence_flow_today:
      - 'BiasEvidenceSource(...) reads the masked BIAS TSV; get_evidence returns ALL fired calls incl. raw PP3/BP4 (live_source.py get_evidence ~262-272)'
      - 'PredictorCorrectedEvidenceSource applies the BP4/PP3 correction as ACTIVE evidence (terminal_source.py:17-56) -- THIS is the enabled/corrected path'
      - 'ProductionVocabEvidenceSource enforces strength-vocab parity, routing whole variant to manual on out-of-vocab (terminal_source.py:59-138)'
      - 'run_eval(...) -> gate; config_pins record predictor_correction_counts + production_vocab_manual_routed_counts (~455-470)'
    the_trap: >-
      The ONLY non-blocked path is status=="approved", and it unconditionally
      wraps PredictorCorrectedEvidenceSource -- so a status-only "approval"
      silently enables corrected PP3/BP4. This is exactly beat4_failure_mode #1.
  criteria_configs:
    production: 'configs/acmg/tsc.yaml -> included_criteria (line 21) currently lists PP3 (line 29) and BP4 (line 34)'
    eval: 'configs/eval/tsc2.yaml -> automatable_criteria (line 28) currently lists PP3 (line 36) and BP4 (line 41)'
    vocabulary: 'configs/acmg/tsc.yaml acmg_criteria keeps PP3 (line 77) and BP4 (line 84); config.py VALID_CRITERIA (line 197) is the canonical 28-code registry; FORBIDDEN_CRITERIA (line 187) = {PP5,BP6,PS4} (PP3/BP4 are NOT forbidden)'
    parity_enforcement:
      - 'live_source.py:113-114 _normalized_criteria_set strips FORBIDDEN then compares'
      - 'live_source.py:240-247 Step 5 raises ConfigConsistencyError iff automatable != included'
      - 'lineage_registry.py:67-75 assert_registry_consistency reports included/automatable drift'
    emission_filters:
      - 'production: scorer/pipeline.py:87 included = set(config.included_criteria); :200 keeps only c.criterion in included; :206 no_evidence otherwise'
      - 'eval combiner: combine.py:90 `if crit not in automatable: continue` -- non-automatable criteria are never scored'
  suppression_prerequisite_open:
    id: PP3_BP4_SUPPRESSION_CONTRACT_REQUIRED
    source: configs/eval/core_annotation_bundle.yaml (pp3_bp4_suppression_prerequisite)
    finding: >-
      There is no implemented PP3/BP4 disabled/manual suppression path today;
      non-approved policy is hard-blocked and TSV reuse is
      BLOCKED_POLICY_IMPLEMENTATION until a tested suppression contract exists.
      This plan defines that contract.
  sentinel_test_coupling:
    test: tests/eval/test_predictor_policy_gate.py::test_approved_predictor_policy_hashes_pin_current_terminal_source_bundle
    behavior: >-
      Recomputes correction_hash over [predictor_aggregation.py,
      terminal_source.py] and compares to the artifact. Its docstring states it
      is EXPECTED to fail closed when terminal_source.py changes until the
      artifact is re-pinned. Adding PolicyDisabledEvidenceSource to
      terminal_source.py therefore REQUIRES re-pinning correction_hash in the
      migrated artifact (a config change, never a test edit).

# ---------------------------------------------------------------------------
# Decision ledger (slot 2) — the load-bearing choices and why.
# ---------------------------------------------------------------------------
decision_ledger:
  - id: D1
    decision: >-
      Introduce an explicit evidence `mode` field ORTHOGONAL to approval
      `status`. Enablement is NEVER inferred from status alone.
    rationale: >-
      Directly kills beat4 #1. status answers "did the owner approve THIS
      artifact"; mode answers "what evidence behavior is authorized"
      (disabled_manual vs corrected_enabled). Both are required; the runner
      dispatches on mode.
  - id: D2
    decision: >-
      Bump the artifact to schema bp4pp3-predictor-policy/2 with a closed v2
      field set; keep v1 loadable for existing fixtures but make the RUNNER
      refuse to proceed on any artifact lacking an explicit disabled_manual mode.
    rationale: >-
      Backward-compatible loader keeps protected v1 tests green; the runner's
      explicit-mode requirement means a legacy `status: approved` v1 artifact is
      BLOCKED_POLICY (proves status-alone never enables).
  - id: D3
    decision: >-
      Bind the disabled/manual approval to production_config_hash (raw bytes of
      configs/acmg/tsc.yaml) AND eval_config_hash (raw bytes of
      configs/eval/tsc2.yaml), verified at runtime; drift fails closed.
    rationale: >-
      Kills beat4 #5 (config drift re-enabling under an old approval): any later
      edit to either config breaks the hash and BLOCKS. Two hashes (not one)
      make an eval-only or production-only removal impossible to approve.
  - id: D4
    decision: >-
      Remove PP3/BP4 from included_criteria AND automatable_criteria in ONE
      commit; retain them in VALID_CRITERIA, scorer acmg_criteria, and the BIAS
      lineage can_fire/allowed set. Only automation is disabled.
    rationale: >-
      Preserves eval==production parity (kills beat4 #2 via the load-time
      invariant) and keeps PP3/BP4 available for future manual review and future
      activation without relabeling data lineage.
  - id: D5
    decision: >-
      Add a dedicated, counting PolicyDisabledEvidenceSource that strips PP3/BP4
      from evidence and records exact per-criterion suppression counts; the
      disabled runner branch wraps it INSTEAD of PredictorCorrectedEvidenceSource
      and asserts pp3bp4_scored_calls == 0.
    rationale: >-
      Kills beat4 #3 (runner still consumes PP3/BP4) and #4 (claims suppression
      without counting). Defense-in-depth over combine.py:90, which would also
      drop non-automatable calls, but without an auditable count.
  - id: D6
    decision: >-
      Keep predictor_source_hash and correction_hash in the v2 artifact as audit
      provenance; RE-PIN correction_hash to the new terminal_source.py bundle;
      do NOT apply correction and do NOT gate disabled-mode enablement on them.
    rationale: >-
      Preserves aggregation/correction provenance and satisfies the sentinel
      test, while making disabled mode independent of the correction code path.
  - id: D7
    decision: >-
      Owner approval is a SEPARATE human step: an ADR plus a distinct owner
      commit flipping status proposed->approved after verifying the two config
      hashes. The doer leaves status=proposed.
    rationale: >-
      Kills beat4 #7 (owner approval embedded by the doer). Self-approval by the
      planner or doer is structurally impossible.
  - id: D8
    decision: >-
      corrected_enabled / REVEL activation stays BLOCKED_POLICY in this track;
      re-enabling requires a new hash-bound owner decision and the recommendation
      section-8 activation checklist.
    rationale: >-
      Matches the task's future_activation scope. The only proceed path is
      approved + disabled_manual + matching config AND runtime-bundle hashes.
  - id: D9
    decision: >-
      Add a REQUIRED runtime_bundle_hash to policy v2, computed deterministically
      over the exact bytes+names of the three runtime files:
      src/raptor/eval/predictor_policy.py, src/raptor/eval/terminal_source.py,
      scripts/run_masked_holdout_eval.py. The disabled proceed path recomputes
      and compares it while the verifier/call-site execute; a byte mismatch =>
      BLOCKED_POLICY.
    rationale: >-
      The config hashes pin WHICH criteria are automatable but not that the
      suppression code is the same bytes as at approval. runtime_bundle_hash
      DETECTS ACCIDENTAL DRIFT of the loader/wrapper/runner (an unrelated
      refactor, a stale approval after a code change) so a run does not proceed
      on code that silently changed. It is NOT tamper-proof or self-authenticating:
      a malicious edit that also removes/bypasses the verifier is out of scope at
      the current scale (threat_model). It stays valuable for the accidental-drift
      and staleness cases it targets.
  - id: D10
    decision: >-
      verify_disabled_config_hashes receives the ACTUAL --scorer-config and
      --eval-config paths the runner will load, hashes THOSE bytes against
      production_config_hash/eval_config_hash BEFORE loading/using them, and
      blocks on mismatch. Alternate paths are allowed only if byte-identical.
    rationale: >-
      Binding hardcoded paths would let a caller load a DIFFERENT config than the
      one hashed. Hashing the actual loaded bytes means a config that drops
      PP3/BP4 but changes thresholds/scope/authorization is a different byte
      string => hash mismatch => BLOCKED_POLICY.
  - id: D11
    decision: >-
      The runner is AUTHORIZATION-NEUTRAL. Policy status/mode approves ONLY use
      of the disabled/manual evidence mode; it never sets or forces any
      VUS/full-spectrum/research authorization boolean. The pre-registered gate
      (raptor.eval.gate.decide_gate) and scope_gate (ADR-0011) decide
      PASS/FAIL/authorization from the production-faithful classifier's metrics.
      The runner neither force-allows nor force-denies; it only records mode +
      zero-consumed so the gate result is interpretable. gate.py and
      scope_gate.py are NOT modified.
    rationale: >-
      Orchestrator correction to the GPT-5.4 review: forcing authorization
      booleans false would contradict the production-faithful rerun goal and
      could suppress ADR-0011 scope reporting. Disabled mode changes only the
      evidence a variant carries (no automated PP3/BP4), not how the gate reads
      the resulting metrics.

rejected_alternatives:
  - option: 'Reuse status=="approved" on the v1 schema to mean "disabled".'
    rejected_because: >-
      Overloads one field; the existing runner would still wrap
      PredictorCorrectedEvidenceSource -> silent corrected enablement (beat4 #1).
  - option: 'Delete PP3/BP4 from VALID_CRITERIA / acmg_criteria / bias lineage.'
    rejected_because: >-
      Erases vocabulary and manual-review context, breaks lineage registry
      consistency, and forbids future activation; the spec requires retaining
      vocabulary and only disabling automation.
  - option: 'Single combined config-hash over both files.'
    rejected_because: >-
      Cannot independently prove BOTH production and eval dropped PP3/BP4; a
      one-sided change could be masked. Two explicit hashes + load-time parity
      are stronger.
  - option: 'Rely only on combine.py:90 (non-automatable skip) for suppression.'
    rejected_because: >-
      Correct but silent: no counted proof, and raw PP3/BP4 still flow out of
      BiasEvidenceSource. A counting wrapper yields the auditable zero-consumed
      proof (beat4 #4).
  - option: 'Have the doer set status=approved after implementing.'
    rejected_because: >-
      Self-approval; violates the separated owner gate (beat4 #7).
  - option: 'Add an online enable/disable toggle read at run time.'
    rejected_because: >-
      slot 2 forbids an online toggle; future activation must be a new hash-bound
      decision, not a runtime switch.
  - option: 'Force all gate/scope authorization booleans false in disabled mode (GPT-5.4 review suggestion).'
    rejected_because: >-
      Orchestrator correction: it contradicts the production-faithful rerun goal
      and could suppress ADR-0011 scope-specific reporting. The runner must be
      authorization-neutral; the pre-registered gate/scope_gate decide from
      metrics (D11).
  - option: 'Verify config hashes against hardcoded configs/acmg/tsc.yaml + configs/eval/tsc2.yaml paths.'
    rejected_because: >-
      The runner could then LOAD a different --scorer-config/--eval-config than
      the one hashed. Hash the ACTUAL loaded bytes before load (D10).
  - option: 'Bind only the two config hashes and not the runtime code bundle.'
    rejected_because: >-
      Suppression lives in the loader/wrapper/runner code; an ACCIDENTAL code
      change could alter behavior while configs match. A runtime_bundle_hash
      detects that drift (D9). (Not a defense against a malicious verifier
      removal -- out of scope this phase; see threat_model.)
  - option: 'Add an external signature/release-verification harness or a loader-API/principal-auth change to make the hashes tamper-proof.'
    rejected_because: >-
      Disproportionate to the stated threat model: the owner has excluded
      malicious/compromised writers and principal-auth attacks at current scale.
      This phase uses byte-drift detection only; a signing/provenance harness is
      a documented revisit trigger (residual_risk), not this phase's work.

# ---------------------------------------------------------------------------
# Policy schema v2 — closed artifact contract.
# ---------------------------------------------------------------------------
policy_schema_v2:
  artifact: configs/eval/bp4pp3_predictor_policy.json
  schema_id: bp4pp3-predictor-policy/2
  closed_field_set:
    schema: 'const "bp4pp3-predictor-policy/2"'
    status: 'enum {proposed, approved} -- APPROVAL STATE ONLY; never implies enablement'
    mode: 'enum {disabled_manual, corrected_enabled} -- EVIDENCE MODE; the first-class policy dimension'
    production_config_hash: '64-hex sha256 of the raw bytes of configs/acmg/tsc.yaml (post-removal)'
    eval_config_hash: '64-hex sha256 of the raw bytes of configs/eval/tsc2.yaml (post-removal)'
    predictor_source_hash: '64-hex sha256 of configs/eval/predictor_aggregation.yaml (retained audit provenance)'
    correction_hash: '64-hex sha256 over the [predictor_aggregation.py, terminal_source.py] bundle, RE-PINNED (retained audit provenance)'
    runtime_bundle_hash: '64-hex sha256 over the runtime code bundle [predictor_policy.py, terminal_source.py, run_masked_holdout_eval.py] (see runtime_bundle_hash_spec); REQUIRED; recomputed+compared on the disabled proceed path to detect ACCIDENTAL byte drift (not tamper-proof)'
    decision_reference: 'non-blank string; ADR/DECISIONS anchor for the disabled/manual decision'
  forbidden_fields:
    - authorized
    - clinical_use_authorized
    - vus_authorized
    - enabled
    - policy_sha256
  field_rules:
    - 'unknown/extra field => malformed (fail closed), as in v1 loader semantics'
    - 'each hash (production_config_hash, eval_config_hash, predictor_source_hash, correction_hash, runtime_bundle_hash) must match ^[0-9a-fA-F]{64}$'
    - 'mode is REQUIRED for schema v2; a v2 artifact missing mode is malformed'
    - 'runtime_bundle_hash is REQUIRED for schema v2; a v2 artifact missing it is malformed'
    - 'status and mode are independent: no field derives from the other'
    - 'production_config_hash/eval_config_hash bind the ACTUAL loaded --scorer-config/--eval-config bytes (verified before load), not a hardcoded path'
  hash_canonicalization: >-
    Single-file hashes (production_config_hash, eval_config_hash,
    predictor_source_hash) are raw file-bytes sha256 via
    predictor_policy._sha256_file (streamed 1 MiB chunks). Multi-file bundle
    hashes (correction_hash, runtime_bundle_hash) reuse the EXISTING
    verify_predictor_policy_hashes bundle convention: files sorted by name, and
    for each: sha256.update(name utf-8); update(NUL); update(bytes); update(NUL).
    No YAML/JSON re-serialization; the exact committed bytes are compared, so a
    byte-identical alternate path passes and an accidental byte change is detected
    while the verifier runs (not a defense against a verifier that is itself
    changed -- threat_model).
  runtime_bundle_hash_spec:
    files:
      - src/raptor/eval/predictor_policy.py
      - src/raptor/eval/terminal_source.py
      - scripts/run_masked_holdout_eval.py
    method: 'deterministic name+NUL+bytes+NUL, files sorted by name (same as correction_hash bundle)'
    verified_by: predictor_policy.verify_runtime_bundle_hash (new helper; NOT a loader-API or signature change)
    detects: accidental byte drift of the runtime code while the verifier/call-site execute
    does_not_detect: 'a malicious edit that also removes/bypasses the verifier (out of scope this phase; threat_model)'
    note: 'terminal_source.py appears in BOTH correction_hash and runtime_bundle_hash bundles; both are re-pinned in the migration commit'
  example_proposed_artifact_illustrative_only:
    schema: bp4pp3-predictor-policy/2
    status: proposed
    mode: disabled_manual
    production_config_hash: '<sha256(configs/acmg/tsc.yaml) after PP3/BP4 removal>'
    eval_config_hash: '<sha256(configs/eval/tsc2.yaml) after PP3/BP4 removal>'
    predictor_source_hash: '<sha256(configs/eval/predictor_aggregation.yaml)>'
    correction_hash: '<sha256 bundle over predictor_aggregation.py + terminal_source.py, re-pinned>'
    runtime_bundle_hash: '<sha256 bundle over predictor_policy.py + terminal_source.py + run_masked_holdout_eval.py>'
    decision_reference: 'docs/DECISIONS.md#adr-0012-pp3bp4-disabled-manual-policy'

# ---------------------------------------------------------------------------
# Status x mode state machine — the exact runner resolution.
# ---------------------------------------------------------------------------
state_machine:
  principle: >-
    effective_state is a pure function of (status, mode, config-hash match). Only
    ONE combination proceeds; everything else is BLOCKED_POLICY. decide_gate
    never emits BLOCKED_POLICY -- only the terminal runner does (model.py:104-113).
  transitions:
    - state: MALFORMED
      when: 'artifact missing / invalid JSON / unknown field / bad hash / v2 without mode'
      runner_action: BLOCKED_POLICY
      reason_prefix: 'predictor-policy artifact missing or malformed'
    - state: UNSUPPORTED_MODE
      when: 'schema v1 (no mode) OR mode not in {disabled_manual, corrected_enabled}'
      runner_action: BLOCKED_POLICY
      reason_prefix: 'explicit disabled_manual mode required; status-only/legacy policy never enables'
    - state: CORRECTED_ENABLED_OUT_OF_SCOPE
      when: 'mode == corrected_enabled (any status)'
      runner_action: BLOCKED_POLICY
      reason_prefix: 'corrected/REVEL activation is out of scope; requires a new hash-bound decision (recommendation section 8)'
    - state: PROPOSED_DISABLED
      when: 'mode == disabled_manual AND status != approved'
      runner_action: BLOCKED_POLICY
      reason_prefix: 'disabled/manual policy is proposed, not owner-approved'
    - state: CONFIG_DRIFT
      when: 'mode == disabled_manual AND status == approved AND sha256(actual --scorer-config bytes) != production_config_hash OR sha256(actual --eval-config bytes) != eval_config_hash (checked BEFORE load)'
      runner_action: BLOCKED_POLICY
      reason_prefix: 'disabled/manual approval is not bound to the actually-loaded production/eval configs (drift)'
    - state: RUNTIME_BUNDLE_DRIFT
      when: 'mode == disabled_manual AND status == approved AND runtime_bundle_hash != sha256 bundle over [predictor_policy.py, terminal_source.py, run_masked_holdout_eval.py]'
      runner_action: BLOCKED_POLICY
      reason_prefix: 'disabled/manual runtime code changed since approval (accidental byte drift; not a tamper claim)'
    - state: APPROVED_DISABLED
      when: 'mode == disabled_manual AND status == approved AND both config hashes match the actual loaded bytes AND runtime_bundle_hash matches'
      runner_action: PROCEED_DISABLED_MANUAL
      reason_prefix: 'approved disabled/manual policy; PP3/BP4 automation suppressed'
  proceed_preconditions_all_required:
    - 'status == approved'
    - 'mode == disabled_manual'
    - 'sha256(actual --scorer-config bytes) == production_config_hash  (verified before load)'
    - 'sha256(actual --eval-config bytes) == eval_config_hash  (verified before load)'
    - 'runtime_bundle_hash == sha256 bundle over [predictor_policy.py, terminal_source.py, run_masked_holdout_eval.py]'
    - 'PP3 and BP4 absent from scorer_config.included_criteria AND eval_config.automatable_criteria (defense-in-depth, after load)'
    - 'the masked runtime inputs + verified return manifest present (unchanged from today)'
  authorization_note: >-
    NONE of these preconditions set a VUS/scope authorization value. On PROCEED,
    the pre-registered gate/scope_gate compute PASS/FAIL/authorization from
    metrics exactly as today; the runner is authorization-neutral (see
    authorization_semantics).

# ---------------------------------------------------------------------------
# Hash contract.
# ---------------------------------------------------------------------------
hash_contract:
  bound_now:
    - name: production_config_hash
      target: 'the ACTUAL --scorer-config bytes (default configs/acmg/tsc.yaml), verified BEFORE load'
      meaning: 'binds the disabled decision to the exact production config with PP3/BP4 removed from included_criteria; an alternate path passes only if byte-identical'
    - name: eval_config_hash
      target: 'the ACTUAL --eval-config bytes (default configs/eval/tsc2.yaml), verified BEFORE load'
      meaning: 'binds the disabled decision to the exact eval config with PP3/BP4 removed from automatable_criteria; a config that drops PP3/BP4 but changes thresholds/scope/auth is a different byte string => BLOCKED'
    - name: runtime_bundle_hash
      target: '[src/raptor/eval/predictor_policy.py, src/raptor/eval/terminal_source.py, scripts/run_masked_holdout_eval.py] bundle'
      meaning: 'detects ACCIDENTAL byte drift of the runtime code (loader/wrapper/runner) between approval and a run; a byte change the verifier still sees => BLOCKED_POLICY. NOT tamper-proof (threat_model): a malicious verifier removal is out of scope this phase'
  audit_provenance_retained:
    - name: predictor_source_hash
      target: configs/eval/predictor_aggregation.yaml
      note: 'preserved; not used to enable disabled mode'
    - name: correction_hash
      target: '[src/raptor/eval/predictor_aggregation.py, src/raptor/eval/terminal_source.py] bundle'
      note: 're-pinned after the terminal_source.py edit; verified by the sentinel test; not used to enable disabled mode'
  immutable_evidence_referenced:
    masked_bias_tsv_sha256: 7eece438a880e0c6a591df62e231bc93848eeb42277a2f4360983914298fc512
    return_manifest_sha256: 5efdccdc57f7d2bdf774486dfbde106ab173bf87412c6db103aaba9958d9ac91
    note: 'from configs/eval/core_annotation_bundle.yaml; the masked TSV is reused unchanged (see reuse_vs_x64_conclusion)'
  drift_behavior: fail_closed_block_never_default_allow

# ---------------------------------------------------------------------------
# Exact config changes and parity validation.
# ---------------------------------------------------------------------------
config_changes:
  production:
    file: configs/acmg/tsc.yaml
    key: included_criteria (line 21)
    remove: [PP3 (line 29), BP4 (line 34)]
    resulting_list: [PVS1, PS1, PM1, PM2, PM4, PM5, PP2, BA1, BS1, BP1, BP3, BP7]
    keep_untouched: 'acmg_criteria PP3 (line 77) and BP4 (line 84) -- vocabulary + strength_vocab retained'
  eval:
    file: configs/eval/tsc2.yaml
    key: automatable_criteria (line 28)
    remove: [PP3 (line 36), BP4 (line 41)]
    resulting_list: [PVS1, PS1, PM1, PM2, PM4, PM5, PP2, BA1, BS1, BP1, BP3, BP7]
  parity_validation:
    - 'the two resulting lists MUST be identical (both 12 codes) so live_source.py:243 ConfigConsistencyError never fires'
    - 'lineage_registry.py:67-75 must report no included/automatable drift'
    - 'do NOT touch configs/eval/bias_lineage.yaml: PP3/BP4 keep their allowed/can_fire disposition (predictor_policy.py:1-16 states BP4/PP3 keep allowed data-lineage)'
  vocabulary_retained_invariants:
    - 'config.py VALID_CRITERIA (line 197) still contains PP3 and BP4'
    - 'scorer acmg_criteria still defines PP3 and BP4 (registry presence != inclusion)'
    - 'PP3/BP4 remain available for future manual review and future activation'

# ---------------------------------------------------------------------------
# Runner behavior + evidence source construction (the disabled data flow).
# ---------------------------------------------------------------------------
runner_behavior:
  file: scripts/run_masked_holdout_eval.py
  dispatch:
    - 'load_predictor_policy(args.predictor_policy) -> MALFORMED => BLOCKED_POLICY'
    - 'resolve effective_state via state_machine; every non-PROCEED state prints a BLOCKED_POLICY GateDecision (vus_authorized=False) and returns 0 with NO metrics'
    - 'PROCEED only for APPROVED_DISABLED, after: verify_runtime_bundle_hash(policy, [predictor_policy.py, terminal_source.py, run_masked_holdout_eval.py]) AND verify_disabled_config_hashes(policy, args.scorer_config, args.eval_config) on the ACTUAL loaded paths, BEFORE load_scorer_config/load_eval_config'
    - 'on PROCEED the runner is authorization-NEUTRAL: it never sets vus_authorized/scope booleans; the gate/scope_gate decide from metrics (see authorization_semantics)'
  disabled_manual_proceed_path:
    evidence_wrapping:
      - 'source = BiasEvidenceSource(...)  # unchanged; reads the immutable masked BIAS TSV'
      - 'disabled = PolicyDisabledEvidenceSource(source, disabled_criteria={PP3, BP4})  # strips + COUNTS; REPLACES PredictorCorrectedEvidenceSource'
      - 'production = ProductionVocabEvidenceSource(disabled, scorer_config.acmg_criteria, eval_config.automatable_criteria)  # unchanged; now a no-op on PP3/BP4 (not automatable)'
      - 'DO NOT construct PredictorCorrectedEvidenceSource in this branch (no correction applied)'
    guards_before_load:
      - 'verify_runtime_bundle_hash(policy, [predictor_policy.py, terminal_source.py, run_masked_holdout_eval.py]) or BLOCKED_POLICY  # accidental-drift detection, not tamper-proof'
      - 'verify_disabled_config_hashes(policy, args.scorer_config, args.eval_config) -- CHECK-BEFORE-LOAD path-byte verification: hash the bytes at each user-supplied path immediately before load and require a match, or BLOCKED_POLICY. This does NOT prove the loader later consumes the same in-memory bytes; concurrent adversarial mutation between check and load is out of scope (threat_model).'
    guards_after_load_defense_in_depth:
      - 'assert {PP3,BP4} disjoint from scorer_config.included_criteria and eval_config.automatable_criteria or BLOCKED_POLICY (kept as belt-and-suspenders on top of the hash)'
      - 'assert scorer_config.included_criteria == eval_config.automatable_criteria (parity; live_source.py:243 also enforces this)'
    after_run_eval:
      - 'assert emitted PP3/BP4 scored calls == 0 (invariant; derived from evidence, not hardcoded)'
      - 'do NOT alter gate/scope_gate output: the pre-registered gate decides PASS/FAIL/authorization from metrics. PP3/BP4 removal is NOT a "skipped criterion", so the existing PASS+skipped->UNVERIFIED demotion (about PM1-type parity skips) does not apply to PP3/BP4 and is left unchanged.'
  evidence_source_construction:
    new_class: src/raptor/eval/terminal_source.py::PolicyDisabledEvidenceSource
    contract:
      - 'ctor(source, disabled_criteria=frozenset({"PP3","BP4"})); normalizes codes strip().upper()'
      - 'get_evidence(variant_id): return only calls whose criterion not in disabled; drop the rest'
      - 'bookkeeping keyed by variant_id (dict variant_id -> {criterion: count}) so repeated get_evidence calls are IDEMPOTENT and never double-count (mirrors ProductionVocabEvidenceSource idempotency)'
      - 'properties: suppressed_counts -> {"PP3": n, "BP4": m}; suppressed_variant_ids -> sorted tuple; total_suppressed -> int'
      - 'a disabled criterion that never fires yields count 0 (explicit, not absent)'
      - 'passes variant_ids through from the wrapped source'
    preserved_for_future: 'PredictorCorrectedEvidenceSource and verify_predictor_policy_hashes remain in the code for the future corrected_enabled activation; this track does not delete or wire them into a proceed path'

report_provenance_fields:
  location: 'report.config_pins (folded into report.content_hash via report.py payload) + the JSON envelope predictor_policy=asdict(policy)'
  added_or_changed_in_disabled_mode:
    policy_mode: disabled_manual
    pp3bp4_automation_disabled: true
    pp3bp4_suppressed_counts: '{"PP3": n, "BP4": m}  # from PolicyDisabledEvidenceSource'
    pp3bp4_suppressed_variant_count: k
    pp3bp4_scored_calls: 0
    pp3bp4_in_included_criteria: false
    pp3bp4_in_automatable_criteria: false
    pp3bp4_retained_in_vocabulary: true
    predictor_correction_applied: false
    production_config_hash: '<policy.production_config_hash>  # verified against actual --scorer-config bytes'
    eval_config_hash: '<policy.eval_config_hash>  # verified against actual --eval-config bytes'
    runtime_bundle_hash: '<policy.runtime_bundle_hash>  # runtime code bundle; accidental-drift check'
    predictor_policy_source_hash: '<policy.predictor_source_hash>  # provenance'
    predictor_policy_correction_hash: '<policy.correction_hash>  # provenance'
    predictor_policy_decision_reference: '<policy.decision_reference>'
  authorization_neutral:
    - 'the runner sets NO authorization value; gate.status / gate.vus_authorized / scope_gate are computed by the pre-registered gate/scope_gate from metrics exactly as today.'
    - 'these mode/zero-consumed pins make the gate result INTERPRETABLE (the reader knows PP3/BP4 carried no automated evidence), without changing it.'
  removed_in_disabled_mode:
    - 'predictor_correction_counts (enabled-path only; no correction is applied)'
  unchanged:
    - 'production_vocab_manual_routed_counts (now reflects only still-automatable criteria)'
    - 'gate + scope_gate fields (decide_gate/decide_scope_gate output, unaltered)'
    - 'lineage_audit_hash, mask_attestation, verified_return_artifacts'

# ---------------------------------------------------------------------------
# Authorization semantics — NEUTRAL (orchestrator correction to GPT-5.4).
# ---------------------------------------------------------------------------
authorization_semantics:
  rule: >-
    Policy status/mode approval authorizes ONLY use of the disabled/manual
    evidence mode. It NEVER directly sets or forces a VUS/full-spectrum/research
    authorization value. The runner neither force-allows nor force-denies.
  gate_of_record:
    - 'raptor.eval.gate.decide_gate (v1) decides PASS/FAIL/UNVERIFIED/UNDERPOWERED from the production-faithful classifier metrics.'
    - 'raptor.eval.scope_gate.decide_scope_gate (v2, ADR-0011) decides scope-specific research authorization from metrics; its behavior is preserved.'
    - 'the gate outcome remains AUTHORITATIVE; disabled mode only guarantees PP3/BP4 carry no automated evidence (zero consumed calls).'
  do_not:
    - 'do NOT force gate/scope authorization booleans false in disabled mode (rejected GPT-5.4 suggestion; would break the production-faithful rerun and ADR-0011 reporting).'
    - 'do NOT force them true; policy approval is not an authorization.'
    - 'do NOT treat PP3/BP4 removal as a parity "skipped criterion"; that would wrongly demote the gate.'
  do_not_modify:
    - src/raptor/eval/gate.py
    - src/raptor/eval/scope_gate.py
  interpretability: >-
    The report records policy_mode + pp3bp4_scored_calls=0 + pp3bp4_suppressed_counts
    so a reader can interpret the (unchanged) gate result knowing PP3/BP4 were not
    automated.

# ---------------------------------------------------------------------------
# Implementation scope (Sonnet 5) — exact files, nothing else.
# ---------------------------------------------------------------------------
implementation_scope:
  doer: claude-sonnet-5
  single_commit: true
  atomicity: >-
    All config + code changes land in ONE commit so parity never breaks
    mid-flight and the sentinel re-pin is co-located with the terminal_source.py
    edit. The artifact stays status=proposed (blocked) so the doer enables nothing.
  files:
    - path: src/raptor/eval/predictor_policy.py
      change: >-
        Add schema-v2 support: dispatch on schema; v2 closed field set incl.
        mode/production_config_hash/eval_config_hash/runtime_bundle_hash;
        extend PredictorPolicy with mode + runtime_bundle_hash (default None for
        v1). Add verify_disabled_config_hashes(policy, scorer_config_path,
        eval_config_path) that hashes the ACTUAL given paths (single-file
        _sha256_file) against production_config_hash/eval_config_hash immediately
        before load. Add verify_runtime_bundle_hash(policy, code_paths) using the
        existing multi-file bundle convention over [predictor_policy.py,
        terminal_source.py, run_masked_holdout_eval.py] to detect accidental byte
        drift. Both are plain sha256 helpers alongside the existing
        verify_predictor_policy_hashes -- NO loader-API change, NO
        signature/release harness. All fail closed on mismatch/missing. Keep v1
        loading + verify_predictor_policy_hashes intact for fixtures/sentinel.
    - path: src/raptor/eval/terminal_source.py
      change: >-
        Add PolicyDisabledEvidenceSource (strip + idempotent counting). Do NOT
        modify PredictorCorrectedEvidenceSource / ProductionVocabEvidenceSource.
    - path: scripts/run_masked_holdout_eval.py
      change: >-
        Replace the status-only gate with the state_machine dispatch on
        (status, mode, config-hash, runtime-bundle-hash). Disabled_manual proceed
        path: verify_runtime_bundle_hash + verify_disabled_config_hashes on
        args.scorer_config/args.eval_config BEFORE load; then load; then
        defense-in-depth parity/absence asserts; wrap PolicyDisabledEvidenceSource
        instead of PredictorCorrectedEvidenceSource; add suppression + hash pins;
        assert pp3bp4_scored_calls==0. Stay AUTHORIZATION-NEUTRAL: do not set or
        force any gate/scope authorization value. corrected_enabled and
        legacy/unknown mode => BLOCKED_POLICY.
    - path: configs/acmg/tsc.yaml
      change: 'Remove PP3, BP4 from included_criteria (keep them in acmg_criteria).'
    - path: configs/eval/tsc2.yaml
      change: 'Remove PP3, BP4 from automatable_criteria.'
    - path: configs/eval/bp4pp3_predictor_policy.json
      change: >-
        Migrate to schema bp4pp3-predictor-policy/2; status=proposed;
        mode=disabled_manual; add production_config_hash + eval_config_hash
        (post-removal bytes) + runtime_bundle_hash (bundle over
        predictor_policy.py + terminal_source.py + run_masked_holdout_eval.py);
        RE-PIN correction_hash to the new terminal_source.py bundle; keep
        predictor_source_hash; update decision_reference to ADR-0012. Leave
        status=proposed (owner flips separately).
  explicitly_out_of_scope:
    - 'src/raptor/eval/gate.py and src/raptor/eval/scope_gate.py (ADR-0011 gate/scope authorization logic; MUST NOT change -- authorization stays metric-driven)'
    - 'any external signature/release-verification harness or loader-API/principal-auth change (excluded by threat_model at current scale; a documented residual_risk revisit trigger, not this phase)'
    - 'configs/eval/bias_lineage.yaml (PP3/BP4 lineage disposition unchanged)'
    - 'configs/eval/predictor_aggregation.yaml, pp3bp4_candidate_policy.json, pp3bp4_predictor_matrix.yaml (REVEL shadow scope untouched)'
    - 'src/raptor/scorer/* (production emission already keys off included_criteria)'
    - 'any protected test file (Gemini-owned)'
    - 'setting status=approved / writing an ADR acceptance (owner-only)'
  branch_scope:
    total_files_on_branch: 8
    per_agent_commits:
      - agent: opus_planner
        model: claude-opus-4.8
        commit_scope: [docs/project/specs/pp3bp4-disabled-manual-policy.yaml]
        note: 'this planner spec only (rev 1 = 878bff8, rev 2 = d40b6da, rev 3 = this commit)'
      - agent: gemini
        commit_scope: [tests/eval/test_pp3bp4_disabled_policy.py]
        note: 'ONE new RED test file; no edits to protected tests or any src/config'
      - agent: sonnet_5
        commit_scope:
          - src/raptor/eval/predictor_policy.py
          - src/raptor/eval/terminal_source.py
          - scripts/run_masked_holdout_eval.py
          - configs/acmg/tsc.yaml
          - configs/eval/tsc2.yaml
          - configs/eval/bp4pp3_predictor_policy.json
        note: 'exactly six files in ONE commit; NO gate.py/scope_gate.py; artifact stays status=proposed'
    excluded_from_branch:
      - src/raptor/eval/gate.py
      - src/raptor/eval/scope_gate.py

# ---------------------------------------------------------------------------
# Gemini RED test matrix (authored by Gemini; RED before Sonnet implements).
# ---------------------------------------------------------------------------
test_matrix:
  author: gemini
  new_file_suggestion: tests/eval/test_pp3bp4_disabled_policy.py
  authorship_rule: 'Sonnet must not edit Gemini tests; Gemini must not edit the protected v1 tests below except by adding new cases in the new file.'
  red_tests:
    - id: G-DM1
      target: predictor_policy.py
      asserts: >-
        v2 loader accepts the exact closed v2 field set and populates
        PredictorPolicy.mode; rejects an unknown/extra field; rejects a v2
        artifact missing mode; rejects an unknown mode value; rejects a
        non-64-hex production_config_hash/eval_config_hash.
    - id: G-DM2
      target: predictor_policy.verify_disabled_config_hashes
      asserts: 'hashes the ACTUAL passed --scorer-config/--eval-config bytes; passes when both match; PredictorPolicyError on either mismatch and on a missing file.'
    - id: G-DM3
      target: terminal_source.PolicyDisabledEvidenceSource
      asserts: >-
        strips PP3 and BP4, passes all other calls unchanged, reports exact
        suppressed_counts, and is IDEMPOTENT: two get_evidence calls for one
        variant do not double-count.
    - id: G-DM4
      target: 'run_masked_holdout_eval.py (subprocess, PROCEED path)'
      asserts: >-
        approved+disabled_manual with matching config + enforcement hashes +
        masked inputs => gate status != BLOCKED_POLICY and is the metric-derived
        decide_gate result (NOT forced by mode); config_pins show
        policy_mode=disabled_manual, pp3bp4_scored_calls=0, non-empty
        pp3bp4_suppressed_counts, predictor_correction_applied=false. Provide an
        offline synthetic-source variant plus a reference-partition variant (gate
        on data availability like the existing enabled tests).
    - id: G-DM5
      target: 'run_masked_holdout_eval.py (subprocess)'
      asserts: 'proposed+disabled_manual => BLOCKED_POLICY, no metrics.'
    - id: G-DM6
      target: 'run_masked_holdout_eval.py (subprocess)'
      asserts: 'approved+corrected_enabled => BLOCKED_POLICY (out-of-scope activation), no metrics.'
    - id: G-DM7
      target: 'run_masked_holdout_eval.py (subprocess)'
      asserts: 'approved+disabled_manual but a CHANGED config byte at the pinned path (hash mismatch) => BLOCKED_POLICY (drift); models an accidental edit/stale approval, not an attacker.'
    - id: G-DM8
      target: 'run_masked_holdout_eval.py (subprocess)'
      asserts: 'legacy v1 schema status=approved (no mode) => BLOCKED_POLICY -- proves status alone never enables.'
    - id: G-DM9
      target: 'configs + config.py'
      asserts: >-
        after removal included_criteria == automatable_criteria (12 codes, no
        ConfigConsistencyError); PP3/BP4 absent from both; PP3/BP4 STILL in
        VALID_CRITERIA and scorer acmg_criteria (vocabulary retained).
    - id: G-DM10
      target: 'end-to-end suppression'
      asserts: >-
        a BIAS record firing PP3+BP4+PVS1 yields zero emitted PP3/BP4, a counted
        suppression of 2, and a still-emitted PVS1.
    - id: G-DM11
      target: 'predictor_policy.verify_runtime_bundle_hash + runner (accidental drift)'
      asserts: >-
        verify_runtime_bundle_hash passes on the pinned bundle and raises on any
        changed/missing bundle file; end-to-end, mutating ONE of
        predictor_policy.py / terminal_source.py / run_masked_holdout_eval.py (or
        the artifact's runtime_bundle_hash) WHILE THE VERIFIER REMAINS INTACT =>
        runner BLOCKED_POLICY. (Scope note: exercises accidental byte drift; a
        change that also removes the verifier is out of scope -- threat_model.)
    - id: G-DM12
      target: 'run_masked_holdout_eval.py (subprocess, alternate config modified BEFORE invocation)'
      asserts: >-
        an alternate --scorer-config/--eval-config path that is BYTE-IDENTICAL to
        the pinned config => PROCEED; a config modified BEFORE invocation that
        removes PP3/BP4 but changes a threshold/scope/authorization byte =>
        BLOCKED_POLICY (check-before-load hash mismatch), proving absence alone is
        insufficient. (Models an accidental/incorrect path, not concurrent
        mutation between check and load -- threat_model.)
    - id: G-DM13
      target: 'authorization neutrality'
      asserts: >-
        (a) policy approval/mode ALONE cannot alter a synthetic gate decision --
        feeding fixed metrics yields the same decide_gate/decide_scope_gate
        result regardless of policy_mode/status; (b) a passing metric set and a
        failing metric set each produce the SAME gate semantics as the existing
        code, while pp3bp4 scored calls == 0 is guaranteed in both. The runner
        neither force-allows nor force-denies.
  protected_tests_expectations:
    - 'tests/eval/test_predictor_policy_gate.py v1 loader/hash/BLOCKED cases stay GREEN.'
    - 'tests/eval/test_terminal_runner_controls.py stays GREEN.'
    - 'test_approved_predictor_policy_hashes_pin_current_terminal_source_bundle goes RED on the terminal_source.py edit and returns GREEN only after the artifact re-pins correction_hash (config change, not a test edit).'
    - 'existing gate.py / scope_gate.py (ADR-0011) tests stay GREEN and unmodified; disabled mode does not change gate semantics.'

# ---------------------------------------------------------------------------
# GPT-5.4 review probes.
# ---------------------------------------------------------------------------
gpt_probes:
  reviewer: gpt-5.4
  probes:
    - 'P1: no proceed path exists for status=approved without mode=disabled_manual; corrected_enabled and legacy/unknown mode are BLOCKED_POLICY.'
    - 'P2: PredictorCorrectedEvidenceSource is NOT constructed in the disabled branch (grep the branch); the wrappers remain for future activation.'
    - 'P3: eval==production parity is enforced at load (live_source.py:243) and lineage_registry.py:67; a one-sided removal fails closed.'
    - 'P4: pp3bp4_scored_calls==0 is an asserted invariant and pp3bp4_suppressed_counts is derived from actual dropped calls (not a literal).'
    - 'P5: a single CHANGED config byte at the pinned path flips APPROVED_DISABLED -> BLOCKED_POLICY (accidental drift / stale approval); the owner status flip is a separate commit/artifact, absent from the doer commit.'
    - 'P6: PP3/BP4 remain in VALID_CRITERIA, scorer acmg_criteria, and bias_lineage can_fire/allowed (vocabulary + lineage retained; only automation disabled).'
    - 'P7: the correction_hash re-pin reflects exactly the new terminal_source.py bundle and predictor_source_hash did not drift unintentionally.'
    - 'P8: disabled mode adds no new scoring input (POLICY_ONLY_REUSE), so no x64 reannotation is triggered.'
    - 'P9: runtime_bundle_hash covers [predictor_policy.py, terminal_source.py, run_masked_holdout_eval.py]; an ACCIDENTAL change to any of them (or the pin), with the verifier intact, => BLOCKED_POLICY. It is a drift detector, not tamper-proof/self-authenticating (threat_model); confirm the spec makes no stronger claim.'
    - 'P10: config hashes are computed over the ACTUAL --scorer-config/--eval-config bytes and verified BEFORE load; a byte-identical alternate path passes, but changed thresholds/scope/auth (despite PP3/BP4 absence) => BLOCKED_POLICY.'
    - 'P11: the runner is authorization-NEUTRAL -- it sets no gate/scope authorization value; decide_gate/decide_scope_gate (ADR-0011) still decide from metrics; gate.py/scope_gate.py are unchanged; a synthetic gate decision is unaffected by policy mode.'

# ---------------------------------------------------------------------------
# Owner decision gate — no self-approval.
# ---------------------------------------------------------------------------
owner_decision_gate:
  sequence:
    - '1. Gemini authors the RED test matrix (separate authorship/commit).'
    - '2. Sonnet implements implementation_scope in one commit; artifact stays status=proposed, mode=disabled_manual with post-removal config hashes and re-pinned correction_hash; all tests green (sentinel green after re-pin).'
    - '3. GPT-5.4 runs gpt_probes.'
    - '4. Owner (operator/domain owner, @dronasrinivas) records ADR-0012 in docs/DECISIONS.md (MADR, Accepted). The ADR states that disabled/manual permits EVALUATION (use of the disabled/manual evidence mode) and does NOT grant automatic VUS/scope authorization -- the pre-registered gate/scope_gate outcome remains authoritative -- and records the unmet activation evidence (exact_revel_compatibility unresolved, permitted_use pending, training_overlap UNKNOWN, transportability BLOCKED_DATA_UNDERPOWERED).'
    - '5. Owner, in a SEPARATE status-only commit, flips configs/eval/bp4pp3_predictor_policy.json status proposed->approved after independently verifying production_config_hash/eval_config_hash (vs the actual configs) and runtime_bundle_hash (vs the runtime code bundle). No other field changes.'
    - '6. Only then may the terminal runner PROCEED in disabled_manual mode.'
  no_self_approval:
    - 'the planner (Opus) never approves; the doer (Sonnet) never sets status=approved.'
    - 'approval is a distinct human commit bound to the config hashes; drift after approval fails closed.'
  adr:
    id: ADR-0012
    title: 'PP3/BP4 automated emission disabled; explicit disabled/manual policy mode'
    status_when_written: Accepted (owner)
    supersedes: 'none (additive alongside ADR-0009 ClinVar-derived criteria ruling)'
    preserves: 'ADR-0011 scope-specific research-authorization gate (unchanged; still metric-driven)'
    authorization_statement: 'disabled/manual permits evaluation, NOT automatic VUS authorization; the gate outcome remains authoritative; the status flip is status-only and separate.'
    decision_reference_target: docs/DECISIONS.md#adr-0012-pp3bp4-disabled-manual-policy

# ---------------------------------------------------------------------------
# Reuse vs x64 conclusion for THIS mode.
# ---------------------------------------------------------------------------
reuse_vs_x64_conclusion:
  route: POLICY_ONLY_REUSE
  requires_x64: false
  rationale: >-
    disabled_manual SUPPRESSES PP3/BP4 downstream and introduces no new
    structured scoring input (no REVEL/AlphaMissense recompute), so no
    structured field absent from the held-out Nirvana JSON is needed. Per
    configs/eval/core_annotation_bundle.yaml reuse_vs_reannotate.decision_table,
    {upstream_inputs: unchanged, pp3_bp4: disabled_or_manual, suppression_contract:
    implemented_tested} -> POLICY_ONLY_REUSE.
  unblocks: >-
    This plan implements + tests the PP3_BP4_SUPPRESSION_CONTRACT_REQUIRED
    prerequisite, so the immutable masked BIAS TSV
    (sha256 7eece438...) may be reused via ARM-side downstream filtering once the
    owner approves -- no x64 worker, no 58.7 GB bundle rebuild.
  x64_only_if: >-
    a future corrected_enabled/REVEL activation needs a structured input absent
    from the held-out JSON (X64_REANNOTATE trigger) -- out of scope here.

# ---------------------------------------------------------------------------
# Migration and backout.
# ---------------------------------------------------------------------------
migration_and_backout:
  migration:
    - 'one atomic Sonnet commit edits both configs + policy artifact + loader + wrapper + runner so parity never breaks mid-flight.'
    - 'the terminal_source.py edit trips the sentinel; the co-located correction_hash re-pin restores it.'
    - 'artifact remains status=proposed (BLOCKED) until the separate owner approval; the doer enables nothing.'
  backout:
    - 'revert the Sonnet commit: PP3/BP4 return to included_criteria + automatable_criteria; the artifact returns to v1/pending; the runner returns to the prior behavior.'
    - 'a partial/one-sided revert fails closed at load (parity invariant) -- no drifted half-state can ship.'
  future_reactivation_gate:
    - 'corrected_enabled/REVEL requires a NEW owner ADR + new hash-bound artifact + the recommendation section-8 activation checklist + a fresh masked rerun.'
    - 'mode=corrected_enabled stays BLOCKED_POLICY; config drift fails closed under any stale approval.'

# ---------------------------------------------------------------------------
# Residual risk — what these proportionate controls do NOT cover.
# ---------------------------------------------------------------------------
residual_risk:
  limitations:
    - 'runtime_bundle_hash and the config path-byte checks are ACCIDENTAL-DRIFT detectors that run inside the same trusted process; a malicious edit that also removes/bypasses the verifier defeats them. They are not tamper-proof or self-authenticating.'
    - 'the config check is CHECK-BEFORE-LOAD: it hashes the bytes at each path immediately before load, not the exact in-memory bytes the loader parses; a concurrent adversarial mutation between check and load (TOCTOU) is not covered.'
    - 'trust is placed in the local owner/orchestrator/codebase; there is no principal authentication or release-provenance guarantee.'
  accepted_because: >-
    proportionate to the stated current threat model (single-owner local research
    build); the owner has explicitly excluded malicious/compromised-writer and
    principal-auth attacks at this scale.
  revisit_triggers:
    - 'multi-user or shared/service deployment (more than one writer/principal)'
    - 'remote or CI writes to configs/code/artifacts, or any untrusted contribution path'
    - 'regulated / clinical deployment or any external release of results'
  on_trigger: >-
    reassess and, if warranted, add signed artifacts / release-provenance
    verification, principal auth, and same-bytes (in-memory) load binding --
    explicitly OUT OF SCOPE for this phase.

# ---------------------------------------------------------------------------
# Validation scope — what is binding for plan acceptance.
# ---------------------------------------------------------------------------
validation_scope:
  binding:
    - 'the targeted PP3/BP4 policy + terminal-runner + config tests (the Gemini G-DM matrix and the affected protected tests in tests/eval/) must pass; this is the smallest set that covers the changed behavior.'
    - 'example selector: pytest tests/eval/test_pp3bp4_disabled_policy.py tests/eval/test_predictor_policy_gate.py tests/eval/test_terminal_runner_controls.py'
  not_acceptance_blocking:
    - 'a full-suite run that errors only due to a missing optional dependency (e.g. pysam not installed) is an ENVIRONMENT issue, not a plan or implementation defect; a collection/import error from pysam does not fail plan acceptance.'
  best_effort_post_implementation:
    - 'run the full suite where the environment permits (pysam present) as a post-implementation best-effort check; report environmental skips/errors distinctly from real failures.'

# ---------------------------------------------------------------------------
# Beat-4 self-audit (slot 1 Beat 4) — every failure mode -> its control.
# ---------------------------------------------------------------------------
beat4_self_audit:
  spec_failure_modes:
    - failure: 'Policy status approved silently enables corrected PP3/BP4.'
      control: 'D1/D2 mandatory mode; disabled branch never constructs PredictorCorrectedEvidenceSource; legacy/unknown mode => BLOCKED_POLICY (G-DM8, P1/P2).'
    - failure: 'Config removes PP3/BP4 in eval but not production, or vice versa.'
      control: 'D4 both configs edited in one commit + load-time parity (live_source.py:243) + lineage_registry.py:67 + G-DM9 (P3).'
    - failure: 'Runner still consumes PP3/BP4 from the historical TSV.'
      control: 'D5 PolicyDisabledEvidenceSource strips + counts; combine.py:90 defense-in-depth; asserted pp3bp4_scored_calls==0 (G-DM3/G-DM10, P4).'
    - failure: 'Report claims suppression without counting consumed calls.'
      control: 'D5 counted pp3bp4_suppressed_counts derived from actual dropped calls; idempotent bookkeeping (G-DM3, P4).'
    - failure: 'Future config drift re-enables PP3/BP4 under an old approval.'
      control: 'D3 production/eval config-hash binding verified at runtime; drift => BLOCKED_POLICY (G-DM7, P5).'
    - failure: 'Disabled mode mistaken for validated benign/pathogenic evidence.'
      control: 'D11 authorization-neutral: policy approval authorizes only the evidence mode; the pre-registered gate/scope_gate decide from metrics; report records pp3bp4_automation_disabled + predictor_correction_applied=false so the (unchanged) gate result is interpretable; corrected_enabled stays BLOCKED (P6/P8/P11).'
    - failure: 'Owner approval embedded by the doer rather than separately recorded.'
      control: 'D7 doer leaves status=proposed; owner flips in a separate status-only commit bound to the config + enforcement hashes + ADR-0012 (G-DM5, P5).'
    - failure: 'Loader/wrapper/runner code ACCIDENTALLY changes (refactor, stale approval) while configs still match.'
      control: 'D9 runtime_bundle_hash over the three files detects the byte drift while the verifier runs => BLOCKED_POLICY (G-DM11, P9). Scope: a malicious verifier removal is out of scope this phase (threat_model).'
    - failure: 'Runner loads a different config than the one hashed (alternate --scorer-config/--eval-config), or a config that drops PP3/BP4 but changes thresholds/scope/auth.'
      control: 'D10 verify the ACTUAL loaded bytes before load; alternate ok only if byte-identical; changed bytes => BLOCKED_POLICY (G-DM12, P10).'
    - failure: 'Runner force-DENIES or force-ALLOWS VUS/scope authorization from policy mode (the rejected GPT force-false suggestion is the force-deny case).'
      control: 'D11 authorization-neutral runner; gate.py/scope_gate.py untouched; a synthetic gate decision is unaffected by policy mode (G-DM13, P11).'
  planner_scope_inversions:
    - 'Editing code/config/tests instead of only the YAML: this planner commit modifies exactly one file (verified in VERIFICATION).'
    - 'Wrong or missing commit trailers: the corrected trailer Copilot-Session 7c146921-... is pinned in planner.required_trailers and verified post-commit; rev 1 (878bff8) used 90703341 and, per the no-amend rule, is left as-is with the spec corrected.'
    - 'Committing on the wrong branch/base: worktree/branch pinned; rev-3 parent is d40b6da and is verified before/after commit.'
  empty_beat4_allowed: false

# ---------------------------------------------------------------------------
# Acceptance mapping (authoritative spec `acceptance`).
# ---------------------------------------------------------------------------
acceptance_mapping:
  - acceptance: 'Plan is implementation-ready and self-contained.'
    satisfied_by: 'implementation_scope + policy_schema_v2 + state_machine + runner_behavior + test_matrix name exact files, fields and probes.'
  - acceptance: 'Disabled/manual mode is explicit and cannot be confused with predictor approval.'
    satisfied_by: 'D1/D2 orthogonal mode; corrected_enabled + legacy => BLOCKED_POLICY; D11 approval authorizes only the evidence mode.'
  - acceptance: 'Production-faithful rerun is preserved: policy approval never forces authorization; the gate decides from metrics (ADR-0011 preserved).'
    satisfied_by: 'authorization_semantics + D11 + gate.py/scope_gate.py out of scope; G-DM13/P11.'
  - acceptance: 'Production and eval configs remain equal and hash-bound.'
    satisfied_by: 'D3/D4 config-hash binding + load-time parity invariant.'
  - acceptance: 'Existing masked TSV can be reused without x64 only after the mode is approved and tests prove suppression.'
    satisfied_by: 'reuse_vs_x64_conclusion (POLICY_ONLY_REUSE) gated on approval + the tested suppression contract.'
  - acceptance: 'Pending/unapproved mode remains blocked.'
    satisfied_by: 'state_machine PROPOSED_DISABLED => BLOCKED_POLICY (G-DM5).'
  - acceptance: 'No held-out run, census, activation or owner approval occurs in planning.'
    satisfied_by: 'planner.prohibited_in_this_task; this commit writes only the YAML.'
  - acceptance: 'Tests authored by Gemini, implementation by Sonnet 5, review by GPT-5.4.'
    satisfied_by: 'test_matrix.author=gemini; implementation_scope.doer=claude-sonnet-5; gpt_probes.reviewer=gpt-5.4.'

# ---------------------------------------------------------------------------
# VERIFICATION (slot 1) — filled by the planner after the commit.
# ---------------------------------------------------------------------------
verification:
  expected: 'one follow-up (rev-3) commit on track/pp3bp4-resolution-2026-07 modifying exactly docs/project/specs/pp3bp4-disabled-manual-policy.yaml; parent d40b6da; both trailers; no amend; no push.'
  checks:
    - 'git show --stat HEAD => 1 file changed (this file only).'
    - 'git log -1 shows Co-authored-by Copilot AND Copilot-Session: 7c146921-f3dd-4a1e-8cf0-8f574de49204.'
    - 'HEAD~1 == d40b6dae0a54be0d952b5c63f647012a5f4d8124 (no amend); git status clean; branch unchanged; no remote update.'
  verdict: recorded_in_final_response
