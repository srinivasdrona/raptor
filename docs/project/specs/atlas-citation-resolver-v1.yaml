  scope: >-
    Commit ONLY the four allowed planner files (docs/project/specs/
    atlas-citation-resolver-v1.yaml, docs/DECISIONS.md, docs/project/atlas/
    ATLAS_RUNBOOK.md, docs/project/TODOS.yaml); NO code/tests/config/data; no amend; no
    push; no merge.
  required_trailers:
