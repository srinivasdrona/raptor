# RAPTOR Atlas Phase-2 minimal primary-source & exact-span resolver —
# binding planner design/implementation spec.
#
# Planner: Claude Opus (this document). Test author: Gemini 3.5 Flash (RED
# tests). Doer: Claude Sonnet 5 (skeleton). Checker: GPT-5.4. Loop order is
# fixed: Opus PLAN -> Gemini RED -> Sonnet GREEN -> GPT-5.4 checker. No real
# pilot content (no real R611Q claim/source/quote) enters implementation tests;
# real source acquisition follows AFTER this resolver is checker-CLEAN.
#
# This file is the PLAN. It performs NO retrieval, NO network access, NO
# extraction, NO pilot content, and it is NOT an implementation.
#
# Authority order: current docs/STRATEGY.md, docs/DECISIONS.md (ADRs, incl.
# ADR-0015 and the additive ADR-0016 authored alongside this spec) and the
# frozen tests under tests/atlas/ are authoritative. The preliminary
# docs/project/atlas/MECHANISM_ATLAS_HANDOFF.md is PRELIMINARY design input and
# NEVER factual authority: it may seed queries but can never ground a claim or
# appear as an accepted grounding source (ADR-0015).

