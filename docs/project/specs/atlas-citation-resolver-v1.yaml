      - No real source content, real identifiers, real quotes, or R611Q content anywhere.
      - No weakening/relaxing of RED tests beyond the legitimate strict-fake protocol update.

  gpt54_probes:
    role: independent adversarial checker.
    probes:
      - >-
        Network: does any atlas .py (esp. citation.py) import a network module? Is
        enforcement a STATIC AST scan (not sys.modules)? (must be NO / static)
      - >-
        Error taxonomy scope (gap-1): are the AtlasCatalogError subclasses raised ONLY by
        citation.py resolver/catalog ops (load/hash/normalize/resolve/verify)? Is there NO
        blanket claim that ALL failures are AtlasCatalogError? (must hold)
      - >-
        Error translation (gap-1): do promotion Gate 3/4 CATCH resolver AtlasCatalogError
        and RE-RAISE existing Phase-1 AtlasProvenanceError/AtlasSchemaError with
        'from exc'? Does the static network guard still raise AtlasLeakageError? Do
        promotion tests assert the Phase-1 types (not raw AtlasCatalogError)? (must hold)
      - >-
        Determinism/fail-closed: no silent fallback, no auto-repin, no fuzzy match; every
        resolver failure raises a distinct typed AtlasCatalogError subclass? (must hold)
      - >-
        Declared-hash distrust: does resolve/verify recompute raw+extracted hashes from
        disk and fail on drift, never trusting catalog-declared hashes? (must hold)
      - >-
        Path safety: are traversal/absolute/drive/symlink-junction-escape/missing/mutated
        files all rejected via resolved-realpath containment (strict=True)? (must hold)
      - >-
        Manifest path/id resolution (gap-3): is the bare-id vs explicit-path choice made
        from arg type/syntax WITHOUT stat (mirrors pack.py)? Bare id ->
        CATALOGS_ROOT/<id>/catalog.yaml with ^[A-Za-z0-9_-]+$; bare id with
        separator/drive/traversal/whitespace rejected; explicit manifest must be a
        regular NON-SYMLINK file; content artifacts strictly under content_root? (must hold)
      - >-
        Catalog self-hash: is only the top-level catalog_content_hash excluded, algorithm
        identical to atlas.pack_content_hash.v1, and immutability via deep-freeze? (must
        hold)
      - >-
        Identifier canonicalization (gap-4): PMID/PMCID/DOI/ACCESSION grammar exact; DOI
        lowercased with trailing-punct + '%' + internal-whitespace REJECTED and
        doi:/doi.org/dx.doi.org forms accepted; ACCESSION namespace-lowercased + opaque
        case-preserved + prefix-required; duplicate/cross-source alias rejected at load;
        ALL supplied aliases must agree at resolve (no priority)? (must hold)
      - >-
        Grounding eligibility (gap-2): does resolve enforce the FULL predicate (role ==
        direct_evidence_leaf, source_type in {PRIMARY-LIT,DATASET}, permitted_use ==
        grounding_and_quote, verification == verified, >=1 identifier, verified content)?
        Do non-grounding rows LOAD (structural) but fail resolve-for-grounding? Are
        reviews/ClinVar/context/handoff never grounding leaves? (must hold)
      - >-
        Span semantics: NFC + CRLF->LF normalization, character offsets, half-open
        interval, exact slice equality, duplicate-quote disambiguated by offsets, no
        fuzzy? (must hold)
      - >-
        PDF: resolver parses no PDF; verifies raw hash + separately-extracted-text hash;
