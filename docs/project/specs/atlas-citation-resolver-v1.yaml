          - anti-cribbing unchanged (real-content phrases only).
        note: >-
          tests/atlas/test_discovery_context_templates.py needs NO change (its
          citation_resolver lambda sits on a Gate-1-fail path that short-circuits before
          Gate 3); the Gemini author MUST confirm it still passes.
      - file: tests/atlas/test_hashing_import_guards.py
        status: REPAIRED (add network guard case)
        covers: >-
          add a case asserting assert_no_network_imports() passes for the atlas package
          (no forbidden network module imported by any atlas .py, including citation.py)
          and is a STATIC AST scan (not sys.modules based).
    anti_cribbing_rule: >-
      ban ONLY real-content phrases (pmc11185720, 10.1101/2024.06.07.597916, c.1832G>A,
      p.Arg611Gln); do NOT ban legitimate vocabulary.
    must_not: >-
      assert any real source/quote; weaken/delete Phase-1 assertions except where the
      resolver protocol legitimately requires the strict-fake update.

  sonnet_scope:
    role: implement ONLY the minimal offline resolver to turn RED tests GREEN; minimize scope.
    authorized_files:
      - 'src/raptor/atlas/citation.py            # NEW: catalog + resolver + normalize/hash'
      - 'src/raptor/atlas/model.py               # ADD errors, 5 dataclasses, CitationResolver protocol; retype PromotionContext.citation_resolver'
      - 'src/raptor/atlas/promote.py             # Gate 3 -> resolved map; Gate 4 -> verify_span; isinstance check; wiring'
      - 'src/raptor/atlas/guards.py              # ADD assert_no_network_imports + FORBIDDEN_NETWORK_IMPORT_PREFIXES (+ export)'
      - 'src/raptor/atlas/__init__.py            # re-export new symbols'
      - 'configs/atlas/catalogs/tsc2/catalog.yaml   # NEW committed metadata-only template (sources: []), correct self-hash'
      - 'tests/atlas/test_citation_resolver.py            # (Gemini authors; listed for scope)'
      - 'tests/atlas/test_discovery_candidate_import.py   # (Gemini repairs)'
      - 'tests/atlas/test_hashing_import_guards.py        # (Gemini repairs)'
    optional_files:
      - 'scripts/atlas_resolve_citation.py       # OPTIONAL thin CLI adapter (reads RAPTOR_ATLAS_CONTENT_ROOT, loads catalog, resolves/verifies, prints typed result); NO test depends on it; may be omitted in v1.'
    in_scope:
      - >-
        New src/raptor/atlas/citation.py: CitationCatalog, load_catalog,
