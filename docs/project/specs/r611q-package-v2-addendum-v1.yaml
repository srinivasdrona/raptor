schema: raptor.project.spec.v1
spec_id: r611q-package-v2-addendum-v1
spec_version: 1.0.3
status: APPROVED_BUILD
created_at: '2026-09-17'
owner: human-terminal-authority
branch: feature/r611q-package-v2-addendum
base:
  branch: design/panel-products-rescue-screen-2026-08
  commit: e7f48612a46a825f871c2fe474c7609937142154

objective: >-
  Create a versioned $R611Q$ package addendum that composes the immutable
  literature-v1, synthesis-v1, structure-readiness-v1 and unreviewed Atlas
  expert packet with the verified 2026-09-16 literature delta. Preserve every
  v1 artifact, add one group-attributed $TSC2$-$TSC2$ self-association boundary
  review unit, and record the downstream model, clinical and review sources as
  context without transferring them into mechanism, rescue or treatment claims.

decision:
  package_update_warranted: true
  reason: >-
    The delta contains one new primary grouped observation that narrows the
    complex-binding hypothesis and changes how a future complex assay should be
    interpreted.
  broader_historical_corpus_expansion_warranted: false
  reason_not_to_expand: >-
    The bounded delta already answered the package question. Further retrieval
    should be driven by a specific package gap or priority variant, not the
    approximately 4,169-publication historical $TSC2$ union.

non_goals:
  - modify, overwrite or silently regenerate any v1 package artifact
  - merge source-ingestion implementation into the RescueScreen package branch
  - accept, reject or adjudicate either existing Atlas claim
  - treat model-assisted triage as named-human Gate 8 review
  - add downstream patient-621 results as direct $R611Q$ mechanism or rescue evidence
  - infer genotype-specific treatment response from clinical occurrences
  - treat secondary reviews as proposition support
  - assign $PS3$, $BS3$, pathogenicity, clinical significance or evidence strength
  - authorize docking, screening, stage execution, procurement or treatment
  - retrieve any additional publication or make a network request
  - revise structural mappings, coordinates or structure-readiness conclusions

variant:
  gene: TSC2
  spdi: NC_000016.10:2070570:G:A
  hgvs_c: NM_000548.5:c.1832G>A
  hgvs_p: NP_000539.2:p.Arg611Gln

