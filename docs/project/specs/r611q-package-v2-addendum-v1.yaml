composition:
  version: r611q-package-v2-addendum
  rule: >-
    v2 is a wrapper over immutable v1 components plus the delta. It does not
    copy the v1 repository directories, redefine their source records or
    rewrite their manifests.

  expert_packet_v2:
    construction:
      - copy the v1 expert packet bytes exactly
      - append one clearly delimited v2 addendum section
      - append the delta context and transfer-boundary summary
      - retain the final overall outcome as unreviewed
    new_review_unit:
      claim_id: r611q-claim-2
      unit_type: BOUNDARY_OBSERVATION
      source_role: DIRECT_ALLELE_EXPERIMENT
      primary_result_state: PRIMARY_R611Q_RESULT
      baseline_relation: NARROWS
      related_claims:
        - r611q-claim-0
        - r611q-claim-1
      proposed_statement: >-
        In the reported HEK293T co-immunoprecipitation assay, a grouped set of
        GFP-tagged $TSC2$ constructs containing $R611Q$, $R905Q$ or $N1620S$
        co-immunoprecipitated with V5-tagged $TSC2$; the source reported no
        effect of those substitutions on $TSC2$-$TSC2$ association.
      claim_kind: complex_boundary
      directionality: no_observed_effect
      required_qualifiers:
        - the result is group-attributed and has no $R611Q$-specific magnitude
        - the assay uses transient tagged overexpression in HEK293T cells
        - preserved $TSC2$ self-association does not establish preserved $TSC1$ binding
        - the result narrows but does not contradict the existing claim units
      acceptance_state: PROPOSED_UNACCEPTED

  expert_form_v2:
    schema: atlas.expert_review_form.v2
    requirements:
      - preserve the v1 variant, bindings, reviewer fields and scope statement
      - preserve the first two claim records exactly
      - append r611q-claim-2 with a null decision and the same four decision options
      - add base packet/form hashes and delta manifest hash
      - accepted claim count remains zero
      - packet status remains unreviewed

  delta_context:
    patient_621_model_contexts:
      count: 4
      package_effect: CONTEXT_ONLY
      rule: >-
        These records may expand downstream model and assay context, but they
        do not support direct allele mechanism, mutant-protein rescue or
        biological independence because the patient-621 lineage is reused.
    clinical_occurrences:
      count: 2
      package_effect: OCCURRENCE_ONLY
      rule: >-
        These records may add occurrence context. They do not establish
        genotype-specific phenotype, prognosis or treatment response.
    secondary_reviews:
      count: 3
      package_effect: NO_PROPOSITION_SUPPORT
      rule: >-
        These records remain discovery/context sources and support no
        proposition without inspection of their cited primary sources.

  synthesis_impact:
    mechanism_baseline_v1:
      mutation: NONE
      addendum_boundary: >-
        The v1 complex-binding finding is not a claim that every $TSC2$
        interaction is disrupted. Grouped preservation of $TSC2$-$TSC2$
        association narrows the defect toward $TSC1$ association, abundance or
        another complex/function dimension.
    rescue_hypothesis_map_v1:
      mutation: NONE
      route_effect:
        RH-2: RETAIN_PLAUSIBLE_NOT_DEMONSTRATED
      new_constraint: >-
        Generic $TSC2$-$TSC2$ co-immunoprecipitation alone is not a
        discriminating endpoint for $R611Q$ interface rescue.
    assay_falsifier_matrix_v1:
      mutation: NONE
      AF-4_constraint: >-
        A future complex-rescue assay must measure $TSC1$-$TSC2$ complex
        formation with matched abundance controls. Preserved $TSC2$-$TSC2$
        association neither demonstrates nor falsifies route-specific rescue.
    structure_readiness_v1:
      mutation: NONE
      effect: UNCHANGED
    stage_execution:
      authorized: false
      decision: DO_NOT_START_RESCUESCREEN_STAGE_WORK

output:
  external_package:
    environment_variable: RAPTOR_R611Q_PACKAGE_V2_ROOT
    default_root: ~/raptor-data/external/r611q-package-v2
    root_must_preexist: true
    run_name: r611q-package-v2-addendum-2026-09-17
    package_id: r611q-package-v2-addendum-2026-09-17
    create_only: true
    publication_protocol:
      platform: POSIX_dir_fd_required
      root_open: O_DIRECTORY_and_O_NOFOLLOW
      staging_and_final_creation: descriptor_relative
      artifact_writes: O_CREAT_O_EXCL_O_NOFOLLOW
      commit_marker: package_manifest.json_written_last
      final_root_identity_check: required
      unsupported_platform: fail_closed
    artifacts:
      - R611Q_EXPERT_REVIEW_PACKET_V2.md
      - R611Q_EXPERT_REVIEW_FORM_V2.yaml
      - R611Q_PACKAGE_V2_IMPACT.json
      - R611Q_PACKAGE_V2_SUMMARY.md
      - package_manifest.json
  repository_summary:
    directory: data/rescuescreen/r611q/package-v2-addendum
    json_path: data/rescuescreen/r611q/package-v2-addendum/package_summary.json
    readme_path: data/rescuescreen/r611q/package-v2-addendum/README.md
    publication_protocol:
      trusted_existing_parent: data/rescuescreen/r611q
      parent_open: descriptor_relative_from_repo_root_with_O_NOFOLLOW
      final_directory_creation: descriptor_relative_create_only
      file_writes: O_CREAT_O_EXCL_O_NOFOLLOW
      final_identity_check: required
      rollback: descriptor_relative_invocation_created_paths_only
    contains:
      - exact input and external artifact hashes
      - aggregate counts and impact states
      - accepted claim and Gate 8 state
      - stage-execution state
      - explicit no-historical-expansion decision
    excludes:
      - new PMID, PMCID, DOI or article title
      - source quote, locator or candidate identifier
      - patient-level information
      - reviewer identity or model chain of thought
      - accepted mechanism, classification or treatment statement

implementation:
  package: src/raptor/rescuescreen/package_v2.py
  operator: scripts/build_r611q_package_v2_addendum.py
  config: configs/rescuescreen/r611q_package_v2_addendum.yaml
  tests: tests/rescuescreen/test_r611q_package_v2_addendum.py
  network: forbidden
  integration_updates:
    - path: .gitattributes
      rule: >-
        Force all text under structure-readiness-v1 to LF and preserve gzip
        artifacts as binary so checked-out bytes match the existing manifest.
    - path: tests/rescuescreen/test_import_and_firewall.py
      rule: >-
        Extend the exact RescueScreen module allowlist by package_v2.py only;
        apply every existing network, cross-lane and execution-surface check to
        the new module.

delivery_checks:
  - every v1 manifest file hash and every listed v1 file hash is reverified
  - structure-readiness working-tree bytes match their existing LF manifest under core.autocrlf
  - v1 manifest file sets remain exact and no v1 file is written
  - expert packet/form v1 bytes match their pins
  - delta manifest self-hash, file hash and required artifact hashes match
  - the selected boundary span and review record agree exactly by source and candidate identity
  - packet v2 begins with the exact v1 packet bytes
  - form v2 preserves the first two v1 claim records exactly
  - r611q-claim-2 remains decision-null and PROPOSED_UNACCEPTED
  - the boundary statement preserves grouped attribution and assay limitations
  - model contexts cannot become direct mechanism/rescue support
  - clinical occurrences cannot become genotype-specific treatment evidence
  - secondary reviews cannot support propositions
  - synthesis-v1, structure-readiness-v1 and entry-gate states are unchanged
  - $TSC2$-$TSC2$ co-immunoprecipitation is recorded as non-discriminating for AF-4
  - accepted claims remain zero and Gate 8 remains BLOCKED_HUMAN_REVIEW
  - stage execution remains unauthorized
  - output is external/create-only, path-contained and manifest-last
  - the external output root must pre-exist and is pinned by a no-follow directory descriptor
  - external staging, destination claims and writes are relative to the pinned root descriptor
  - repository-summary parent traversal, directory creation and writes are descriptor-relative
  - swapping either checked path to a symlink cannot redirect a staging, payload, summary or manifest write
  - unsupported non-POSIX publication platforms fail closed
  - repository summary is an exact aggregate-only projection
  - the RescueScreen firewall admits only package_v2.py as the additive module and remains otherwise unchanged

boundaries:
  model_assisted_review_is_human_review: false
  accepted_claims: 0
  atlas_gate_8: BLOCKED_HUMAN_REVIEW
  stage_execution_authorized: false
  clinical_use: forbidden
  evidence_strength_use: forbidden
  treatment_recommendation: forbidden
  historical_tsc2_corpus_expansion: deferred
