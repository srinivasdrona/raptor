# RAPTOR Atlas panel PRODUCTS -- dual-product design spec.
#
# This file is a PLAN. It contains NO code, NO tests, NO candidate identity,
# NO candidate count, NO functional result, NO selection and NO classification.
# It does not execute, re-execute, reinterpret or supersede any run.
#
# It defines TWO separately named, separately versioned panel products that
# both sit DOWNSTREAM of the audited 2026-08-06 INFEASIBLE_PANEL result:
#
#   P1  atlas-technical-coverage-panel     -- engineering product; pipeline
#                                             behaviour only; explicitly not
#                                             scientific generalization.
#   P2  atlas-independent-validation-panel -- scientific product; retains the
#                                             full independence/diversity bar;
#                                             currently BLOCKED_SOURCE_DIVERSITY.
#
# Authority order for BEHAVIOUR (this spec is subordinate to all of them):
#   1. docs/project/atlas/ATLAS_PHASE2_PANEL_SELECTION_PROTOCOL.md  (v1.0.4, frozen)
#   2. docs/project/atlas/atlas-phase2-panel-selection-registration-v1.yaml
#   3. configs/atlas/panels/tsc2/atlas-phase2-candidate-universe-lock-v4.yaml
#   4. configs/atlas/panels/tsc2/atlas-phase2-raw-identity-map-lock-v4.yaml
#   5. docs/DECISIONS.md (ADR-0014/0015/0016/0017), docs/project/specs/
#      atlas-panel-selector-v1.yaml, docs/project/specs/mechanism-atlas-starter.yaml
# Where this spec and the frozen protocol appear to differ, the protocol governs
# and this spec is defective. Existing code is NOT behaviour authority.

