blog_contract:
  publish_only_after: T4
  publish_before_stack_selection: true
  required_content:
    - exact task-corpus and evaluator versions
    - role and full-stack comparisons
    - hard-gate failures
    - negative and null results
    - variance and worst runs
    - elapsed time, token use, AI usage, and human-review burden
    - model/version/prompt/tool limitations
    - contamination and generalizability limits
  optional_post_selection_addendum:
    - owner-selected stack
    - selection rationale tied to the published benchmark
    - governance record or superseding ADR
  forbidden_content:
    - universal best-model claim
    - vendor-quality claim inferred from subscription availability
    - hiding failed, timed-out, or expensive runs
    - treating RAPTOR-specific results as a general software-engineering leaderboard
