attribution_contract:
  fields:
    - defect_id
    - severity
    - discovered_at_stage
    - present_in_artifact
    - primary_owner
    - contributing_owners
    - evidence
    - adjudicator
    - confidence
  rules:
    planner: >-
      Primary when the requirement, real artifact shape, invariant, or failure
      mode was omitted or materially wrong and downstream artifacts followed
      that specification.
    test_author: >-
      Primary when the frozen specification was adequate but executable tests
      omitted, vacuously asserted, or misrepresented the requirement.
    doer: >-
      Primary when the specification and protected tests were unambiguous but
      implementation violated them or introduced an unrelated defect.
    checker: >-
      Primary for a wrong CLEAN when an adjudicated defect was present in the
      reviewed artifact and independently detectable within the allowed tools.
    orchestration_or_environment: >-
      Primary for tool denial, dependency, context, timeout, prompt-composition,
      worktree, or execution defects not attributable to model reasoning.
    shared_attribution: >-
      A defect may have one primary owner and multiple contributing owners.
      Uncertain attribution remains UNKNOWN rather than being forced.

task_stratification:
  artifact_types: [CODE, TEST, DATA, CONFIG, DOCUMENTATION, RESEARCH_REVIEW]
  risk_tiers: [FOUNDATIONAL_HIGH_ASSURANCE, STANDARD, LOW_RISK]
  complexity_tiers:
    C1: localized one-surface change
    C2: multi-file bounded contract
    C3: cross-module integration with real fixtures
    C4: versioned governance or immutable-record change
  required_reporting:
    - per_role
    - per_artifact_type
    - per_risk_tier
    - per_complexity_tier
    - overall_with_macro_average

prospective_task_corpus:
  design:
    retrospective_analogue_count_target: 10
    synthetic_holdout_rule: >-
      Recreate the historical bug class in a novel schema, identifier set, and
      file layout so prior exposure to RAPTOR artifacts does not reveal the
      answer.
    minimum_task_mix:
      CODE: 4
      TEST: 2
      DATA_OR_CONFIG: 2
      DOCUMENTATION_OR_REVIEW: 2
    seeded_bug_classes:
      - real_schema_shape_mismatch
      - top_level_vs_record_level_binding
      - stale_snapshot_or_toctou
      - junction_or_path_escape
      - vacuous_test
      - impossible_or_self_triggering_fixture
      - incomplete_audit_record
      - wrong_protocol_or_hash_comparand
      - unauthorized_scope_change
      - false_clean_on_reproducible_defect
  execution:
    screening_runs_per_model_task: 3
    finalist_runs_per_model_task: 5
    fixed_timeout_seconds: 1800
    blind_evaluator: required
    preserve_failed_runs: true
    paired_base_commit: required
    paired_prompt_hashes: required
    paired_tool_permissions: required
    paired_context_budget: required

ranking:
  hard_gate_precedence: true
  rule: >-
    A candidate failing any hard gate cannot win that role regardless of speed
    or cost. Among hard-gate passers, rank by paired task-level quality first,
    then reproducibility, human burden, and normalized efficiency.
  weighted_score_after_hard_gates:
    correctness_and_safety: 45
    robustness_and_reproducibility: 20
    role_specific_effectiveness: 15
    human_review_burden: 10
    normalized_efficiency: 10
  no_score_conditions:
    - fewer than three completed independent runs per screened model/task
    - hidden evaluator contamination
    - unadjudicated CRITICAL or HIGH finding
    - unequal tools, context, timeout, or prompt contract
    - model version drift inside a comparison cell
  statistical_reporting:
    - paired task-level differences
    - bootstrap confidence intervals
    - median and worst-run score
    - no significance claim when the corpus is underpowered

