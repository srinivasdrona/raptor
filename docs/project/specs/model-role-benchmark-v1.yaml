  doer:
    historical_anchor: Claude Sonnet 5
    primary_peer_pool:
      - Claude Sonnet 5
      - GPT-5.3-Codex
      - GPT-5.6 Terra
      - MAI-Code-1.1-Flash
    high_reasoning_supplement:
      - GPT-5.6 Sol
      - Claude Opus 5
    efficiency_supplement:
      - GPT-5.6 Luna
      - MAI-Code-1-Flash
    primary_pool_rule: >-
      All four primary peers run the same complete doer task set. The
      high-reasoning and efficiency supplements run declared C3/C4 and C1/C2
      subsets respectively and are reported separately unless they advance to
      the finalist pool on hard-gate and quality results.
  test_author:
    historical_anchors:
      - Gemini 3.1 Pro Preview
      - Gemini 3.5 Flash
    primary_peer_pool:
      - Gemini 3.7 Flash
      - MAI-Code-1.1-Flash
      - GPT-5.3-Codex
      - Claude Opus 5
    constraint: The selected test-author family must differ from the selected doer family.
  planner:
    historical_anchor: Claude Opus 5
    primary_peer_pool:
      - Claude Opus 5
      - GPT-5.6 Sol
      - GPT-5.6 Terra
      - Gemini 3.7 Flash
      - Grok 4.6
    inclusion_note: >-
      Gemini 3.7 Flash is included because official sources support complex
      multi-step execution, tunable high reasoning, codebase research, and
      verification. Its Flash label is not a valid reason to preclude it.
  checker:
    historical_anchor: GPT-5.4
    primary_peer_pool:
      - GPT-5.4
      - GPT-5.6 Sol
      - Claude Opus 5
      - Grok 4.6
      - Gemini 3.7 Flash
    constraint: The selected checker family must differ from the selected doer family.

multi_model_screen:
  design: role_matched_successive_halving
  round_1:
    purpose: >-
      Screen every primary-pool model on the same three representative tasks
      for its role, with three independent runs per model/task.
    advancement: >-
      Eliminate hard-gate failures. Advance models on paired quality,
      reproducibility, and human-burden evidence; cost breaks ties only after
      quality gates.
  round_2:
    purpose: >-
      Run the top two or three models per role on the complete role corpus with
      five independent runs per model/task.
  round_3:
    purpose: >-
      Assemble a small number of full stacks from role finalists while
      enforcing test-author/doer and checker/doer family separation.
  reporting:
    - primary_peer_pool_results
    - high_reasoning_supplement_results
    - efficiency_supplement_results
    - per_complexity_tier_results
    - paired_role_results
    - finalist_stack_results
  anti_combinatorial_rule: >-
    Do not run every possible model permutation. Isolate roles first, advance
    finalists, then test only governance-valid stack combinations.
  final_stack_diversity_rule: >-
    Role-isolation winners do not automatically form the selected stack.
    Evaluate correlated-family risk explicitly. Any reduction from the current
    four-family diversity requires evidence that the quality gain outweighs the
    lost independence and an explicit owner governance decision.

tournament_sequence:
  - id: T0
    action: freeze_baseline_and_metric_dictionary
    status: COMPLETE
  - id: T1
    action: build_blinded_probe_corpus_and_adjudication_key
    status: NOT_STARTED
  - id: T2
    action: run_role_matched_multi_model_screens_with_one_role_changed_at_a_time
