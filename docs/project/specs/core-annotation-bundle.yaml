  model: claude-opus-4.8
  role: opus_planner
  plan_only: true
  prohibited_in_this_task:
    - implementation or code edits outside the single output file
    - any data download or bundle rebuild
    - any held-out annotation/scoring run
    - the PP3/BP4 owner policy decision
  may_modify_only:
    - docs/project/specs/core-annotation-bundle.yaml
  commit: one_planner_commit_no_push
  required_trailers:
