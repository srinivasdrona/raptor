# RAPTOR core annotation bundle — pinned, hash-bound planner contract (rev 5).
#
# Purpose: an implementation-ready, hash-bound record of the EXACT deployed
# annotation bundle for the production-faithful masked held-out rerun and the
# PP3/BP4 decision input — pinning the deployed bundle, NOT refreshing it.
#
# This file is the planner PLAN. It performs no annotation, download, held-out
# run or owner policy decision. It names the downstream implementation scope,
# corrects the ARM evidence inventory, splits historical attestation from
# current x64 readiness, and makes reuse conditional on an implemented PP3/BP4
# suppression contract.
#
# Rev 5 supersedes commit 62310e2, resolving a schema contradiction: x64-only
# directories/unknown-hash files no longer forced into the ARM file_entry shape.
# Schema: raptor-core-annotation-bundle-v1 (planner). The Sonnet manifest uses
# schema raptor-core-annotation-bundle-manifest-v1 / status pinned_historical_evidence.

schema: raptor-core-annotation-bundle-v1
status: planner_contract_ready_for_implementation
reuse_readiness: BLOCKED_POLICY_IMPLEMENTATION
reannotation_readiness: X64_WORKER_UNVERIFIED_UNTIL_OPERATOR_MAKES_AVAILABLE
licensing_readiness: PENDING_PERMITTED_USE_REVIEW
task_id: sources-pin-core-annotation-bundle
title: Minimum deployed core annotation bundle — pinned reproducibility contract

worktree: 'D:\AIProjects\raptor-worktrees\annotation-bundle'
branch: track/annotation-bundle-2026-07
base_commit: 29d5ab58c3e717325f6337cc940805743cf2507d

revision_log:
  - rev: 1
    commit: c0412342ca823eef9d2c636760ddae8033170785
    verdict: DO_NOT_MERGE (GPT-5.4)
  - rev: 2
    supersedes_commit: c0412342ca823eef9d2c636760ddae8033170785
    trigger: GPT-5.4 DO-NOT-MERGE
    attribution:
      orchestrator_or_spec_gap:
        - implementation scope (which files are the branch diff) was not specified.
        - licensing permitted-use / cloud-egress review was not specified.
        - ARM presence inventory was prompt-silent; the 28-source count was not required.
        - reuse-vs-x64 conflation was not disambiguated by the spec.
      planner_miss:
        - ARM-present copies were wrongly marked recompute-only/worker-only (factual miss).
        - only ~12 of 28 deployed data sources were pinned while T4 claimed metadata equality.
        - disabled/manual TSV reuse was declared safe with no implemented PP3/BP4 suppression contract.
    corrections_in: [implementation_scope, deployed_data_sources, arm_inventory,
      holdout_input_provenance, historical_run_attestation,
      current_x64_reannotation_readiness, pp3_bp4_suppression_prerequisite,
      reuse_vs_reannotate, licensing, test_matrix]
  - rev: 3
    supersedes_commit: 4e3ed7c8951da54f9a5c0132bdffc610fb758eea
    trigger: GPT-5.4 DO-NOT-MERGE
    attribution:
      planner_miss:
        - licensing said local execution was permitted; permission was not separated from the observed historical execution (fail-open wording).
        - the test matrix mixed CI-unrunnable commit/diff-scope and external-data assertions into the Gemini pytest, so it could not pass in current CI and skips could masquerade as success.
    corrections_in: [licensing, test_matrix, intent]
    preserved:
      - implementation_scope (exactly 3 files, no runner changes)
      - arm_inventory (14 present_hashed hashes/bytes)
      - deployed_data_sources (28 pinned)
      - historical_run_attestation and current_x64_reannotation_readiness split
      - pp3_bp4_suppression_prerequisite (reuse blocked)
  - rev: 4
    supersedes_commit: e08a17ef6be76cbd4c7e0b8eff23cbbe0e0dde46
    trigger: Gemini RED test exposed a planner-spec gap
    attribution:
      planner_spec_gap:
        - the canonical manifest's exact schema and runtime status were never defined, so the Gemini test (OFF1) reused the planner spec's schema/status (planner_contract_ready_for_implementation) for the manifest.
      correction:
        - define canonical_manifest_schema with schema raptor-core-annotation-bundle-manifest-v1 and status pinned_historical_evidence, closed top-level keys, and closed file/source entry shapes.
    corrections_in: [canonical_manifest_schema, implementation_scope, test_matrix, beat4_self_audit]
    preserved:
      - 9 offline + 3 reference test partition; 3-file scope; 28 sources; suppression blocker; licensing states; no runner/CI changes
  - rev: 5
    supersedes_commit: 62310e2c831fb5fe1315057e68a7442295dc404a
    trigger: schema contradiction (worker_only file_entry forced sha/bytes for directories and unknown ARM artifacts)
    attribution:
      planner_miss:
        - canonical_manifest_schema.arm_inventory required worker_only entries to use the file_entry shape (64-hex sha256, positive bytes), which directories and unknown-on-ARM files cannot satisfy without fabrication.
      correction:
        - arm_inventory is now exactly {data_root, present_hashed} (14 files); x64-only files/directories moved to x64_handoff_requirements.items with a null-allowing x64_requirement_shape (kind file/directory/manifest, expected_sha256 and expected_bytes nullable).
    corrections_in: [canonical_manifest_schema, arm_inventory, current_x64_reannotation_readiness, x64_handoff, test_matrix, beat4_self_audit]
    preserved:
      - top-level 14 manifest keys; 28 sources; licensing; suppression; 9 offline + 3 reference partition; 3-file scope

