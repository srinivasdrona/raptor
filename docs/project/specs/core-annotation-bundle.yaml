    hg38_PP2_missense_pathogenic_genes.tsv: '43f6002d8c88cbc200df4da79aeffb52d1f854589aeb50c97e190b80c376d2cf'
    hg38_BP1_truncating_genes.tsv: '274ab0ce632ef6d14b5fefe4a87c04a4955e1685569ad45a73d06f5a78fd5840'
    hg38_PM1_chrom_to_pathogenic_domain_list.tsv: 'ce9ee18d89f208f409dff66532590d7e7294a690cb631ffe2b1399acfe2409ee'
    evaluation_skip_list.txt: 'bb418c11773080d8cf6b3facadf71236d25ce35fa2ca173d63d33089c57a1d8a'

field_provenance:
  verified_from_arm_artifact:
    - Nirvana annotator/runtime_banner/schemaVersion/dataVersion/genomeAssembly
    - full data_sources version+release_date set (deployed header)
    - structured field JSON paths (revel.score, AlphaMissense.AM_score) + scalars
    - masked BIAS TSV identity (7eece438..., 2577 rows, 0 duplicate ids)
    - masked-run gates, resource hashes and deterministic commands (report text)
    - deployed archive/commit hashes and footprint (VERSIONS/HANDOFF text)
  requires_x64_worker_inspection:
    - on-disk file-by-file SHA256 of the full Nirvana + supplementary + BIAS data
    - presence + hash of the masked held-out Nirvana JSON (315e601c...)
    - required-paths JSONs (local + masked) on-disk hashes and byte sizes
    - REVEL/AlphaMissense scores for the 2,577 held-out variants (from held-out JSON)
    - phyloP version-label reconciliation (observed "hg38" vs spec "hg38_20way")
    - masked-resource TSV on-disk presence (hashes recorded, files not on ARM)

reuse_vs_reannotate:
  principle: >-
    Comparison reruns preserve the historical data bundle. A downstream
    policy-only rerun may reuse immutable evidence ONLY when the plan proves no
    upstream evidence-generation input changed. Neither route is selected here.
  reuse_path_no_x64:
    name: REUSE_IMMUTABLE_BIAS_TSV
    reuses: 'holdout_input.masked.bias_output.tsv (7eece438..., 2577 rows)'
    preconditions_all_required:
      - input VCF identity == frozen holdout_input.vcf hash
      - Nirvana 3.18.1 / data 91.27.66 / schema 6 unchanged
      - supplementary set (ClinVar 2026-02, AlphaMissense, gnomAD 4.0) unchanged
      - BIAS 3.0.0 @ ade13f2 and bias hg38 data bundle unchanged
      - masked required-paths JSON 6c05b8c3... and skip_list bb418c11... unchanged
      - PP3/BP4 outcome in {disabled, manual}
      - PP3/BP4 resolution adds NO new scoring input to Nirvana/BIAS
    applied_as: downstream policy-only recompute over already-emitted fields
  reannotate_path_x64:
    name: X64_REANNOTATE
    trigger_any:
      - input VCF / ID-set differs from the frozen 2,577-row set
      - any data-source version changes (any forbidden upgrade actually applied)
      - BIAS version/commit or bias data bundle changes
      - masked required-paths JSON or skip-list changes
      - PP3/BP4 activation needs a structured input not present in the held-out JSON
      - REVEL/structured recompute needed but held-out Nirvana JSON cannot be verified
  decision_table:
    - {upstream_inputs: unchanged, pp3_bp4: disabled_or_manual, new_scoring_input: false, route: REUSE_IMMUTABLE_BIAS_TSV}
    - {upstream_inputs: unchanged, pp3_bp4: activate, new_scoring_input: true, route: X64_REANNOTATE}
    - {upstream_inputs: unchanged, pp3_bp4: activate, new_scoring_input: false, route: 'REUSE + downstream policy recompute (structured fields from held-out JSON)'}
    - {upstream_inputs: changed, pp3_bp4: any, new_scoring_input: any, route: X64_REANNOTATE}
    - {upstream_inputs: unknown_or_unverifiable, pp3_bp4: any, new_scoring_input: any, route: BLOCKED_DATA_until_x64_verifies}

x64_handoff:
  boundary_rule: >-
    Do not download or rebuild the 58.7-GB x64 bundle on ARM64. The planner
    defines the worker-side verification/handoff contract; the operator makes the
    x64 machine available only when execution is needed.
  bundle_presence_proof:
    - recompute file-by-file SHA256 over nirvana-data\GRCh38 and diff vs nirvana-grch38-full.sha256.txt
    - recompute over SupplementaryAnnotation\GRCh38 and diff vs nirvana-grch38-updates.sha256.txt
    - recompute over bias-hg38-data and diff vs bias-hg38-data.sha256.txt
    - spot-verify anchors (Homo_sapiens.GRCh38.Nirvana.dat, Both.transcripts.ndb, gnomAD_4.0.nsa, ClinVar_hg38_2026-02.nsa, AlphaMissense_hg38.nirvana.nsa)
    - verify archive hashes (Nirvana 8CEE9D79..., .NET C077CCC3...) and BIAS commit ade13f2
    - confirm footprint approx 58,690,294,121 bytes and free disk before any run
    - confirm annotator header emits dataVersion 91.27.66 / schemaVersion 6 / same dataSources
  reannotation_commands_reference:
    note: exact deterministic commands are recorded in MASKED_HELDOUT_SCORING_REPORT.md
    nirvana: 'dotnet Nirvana.dll -c ...\Cache\GRCh38\Both --sd ...\SupplementaryAnnotation\GRCh38 -r ...\Homo_sapiens.GRCh38.Nirvana.dat -i holdout_input.vcf -o holdout_input_nirvana'
    bias: 'python bias_2015.py holdout_input_nirvana.json.gz hg38_nirvana_required_paths.masked.json holdout_input.masked.bias_output.tsv --skip_list evaluation_skip_list.txt'
  return_handoff_manifest:
    - recomputed full-bundle diff result (match/drift list)
    - held-out Nirvana JSON path + SHA256 (expected 315e601c... on reuse; new on reannotate)
    - BIAS TSV path + SHA256 (expected 7eece438... on reuse; new on reannotate)
    - row count == 2577 and duplicate-id count == 0
    - BiasTsvSource parse proof (records == rows, no BiasContractError)
    - wall times and exit codes

pejaver_calibration_inputs:
  purpose: provide decision inputs only; the owner makes the PP3/BP4 call downstream
  pinned_revel: {version: '20200205', release_date: '2020-02-05'}
  unresolved_question: >-
    Whether the Pejaver et al. REVEL calibration intervals apply to REVEL
    20200205 as deployed, or were derived on a different REVEL build (e.g.
    v1.3/2021). This requires a resolved provenance argument; it is NOT assumed.
  constraints:
    - do not relabel 20200205 as v1.3/2021 without a resolved provenance record
    - do not read held-out labels/VUS outputs/prior outcomes to pick a version
    - REVEL values come from the Nirvana structured path, not BIAS rationale

licensing:
  internal_research_use: permitted for the masked rerun and PP3/BP4 evidence
  redistribution_boundary: >-
    Do not redistribute raw non-commercial predictor scores (REVEL, AlphaMissense)
    in public or Anthropic-grant outputs. Public/grant artifacts may reference
    provenance and derived, non-raw results only.
  per_source_flags:
    revel: {use: internal_research, redistribute_raw: false}
    alphamissense: {use: internal_research, redistribute_raw: false}

preservation_set:
  do_not_change_before_comparison_rerun:
    - MANE, gnomAD, dbSNP, ClinVar, REVEL, Nirvana, BIAS versions
  do_not:
    - substitute current web releases for the deployed bundle
    - claim Pejaver intervals apply to REVEL 20200205 without resolved provenance
    - parse REVEL from BIAS free-form rationale
    - read held-out labels, VUS outputs or prior criterion outcomes to pick a version
    - redistribute raw non-commercial predictor scores in public/grant outputs

test_matrix:
  ownership: Gemini authors these RED tests before Sonnet implements the manifest.
  tests:
    - id: T1_schema_valid
      asserts: manifest parses against raptor-core-annotation-bundle-manifest-v1; required keys present; enums valid.
    - id: T2_hash_binding
      asserts: every present_hashed entry's recomputed SHA256 == pinned; worker_only entries are not asserted present.
    - id: T3_structured_provenance
      asserts: REVEL read only from positions[].variants[].revel.score and AlphaMissense from AlphaMissense.AM_score; a BIAS-rationale REVEL path is rejected.
    - id: T4_forbidden_upgrade_guard
      asserts: version set equals the pinned deployed set; fails if MANE 1.5, dbNSFP 5.x, gnomAD 4.1.1, dbSNP 157, RepeatMasker or a newer primary ClinVar appears.
    - id: T5_revel_label_guard
      asserts: REVEL version == "20200205"; fails if "1.3"/"2021" is asserted without a provenance record.
    - id: T6_arm_x64_boundary
      asserts: environment.x64_bundle_present == false on ARM; fails if any worker_only artifact is marked present on ARM.
    - id: T7_reuse_gate
      asserts: reuse allowed only when all upstream input hashes equal frozen values AND pp3_bp4 in {disabled, manual} AND no new scoring input; else reannotate.
    - id: T8_handoff_completeness
      asserts: x64_handoff includes bundle-presence proof, conditional reannotation commands and the return manifest fields.
    - id: T9_masked_tsv_invariants
      asserts: masked BIAS TSV has 2577 rows, 0 duplicate keys and parses via BiasTsvSource with no BiasContractError (worker-side fixture).
    - id: T10_licensing_guard
      asserts: raw non-commercial scores are flagged non-redistributable; fails if a public/grant output path embeds raw REVEL/AlphaMissense values.

gpt54_probes:
  - probe: substitute a "latest" source version -> must fail T4.
  - probe: mark the x64 bundle present on ARM -> must fail T6.
  - probe: relabel REVEL 20200205 as v1.3/2021 -> must fail T5.
  - probe: reuse the TSV after an upstream input hash changed -> must fail T7.
  - probe: source REVEL from the BIAS rationale column -> must fail T3.
  - probe: embed raw non-commercial scores in a public/grant output -> must fail T10.

routes:
  go_reuse: all upstream hashes frozen AND pp3_bp4 in {disabled, manual} AND no new scoring input -> REUSE_IMMUTABLE_BIAS_TSV + downstream policy recompute.
  go_reannotate: any upstream input changed OR activation needs a new scoring input -> X64_REANNOTATE.
  stop_blocked_data: x64 machine unavailable AND reannotation (or full-bundle verification) required -> record BLOCKED_DATA with the exact missing artifact and fallback.
  na_no_score_needed: PP3/BP4 resolves manual with no predictor score required -> neither the held-out JSON nor a rerun is needed.

downstream_policy_handoff:
  to: [resolve-pp3-bp4-activation, rerun-masked-gate]
  provides:
    - pinned REVEL 20200205 and AlphaMissense provenance and structured extraction route
    - the unresolved Pejaver/REVEL-20200205 compatibility question (inputs, not decision)
    - the reuse-vs-reannotate decision table and preconditions
    - the immutable masked evidence identity (7eece438..., 2577 rows)
  does_not:
    - make the PP3/BP4 activation or owner decision
    - select reuse or reannotate on the owner's behalf

blockers:
  - id: B1_x64_unavailable
    detail: 58.7-GB x64 bundle absent on ARM by design; needed for full-manifest verification or any reannotation.
    fallback: operator makes the x64 machine available; else BLOCKED_DATA.
  - id: B2_masked_nirvana_json_absent
    detail: held-out Nirvana JSON 315e601c... not on ARM; blocks ARM-side REVEL structured recompute.
    fallback: obtain/verify from x64; do not derive REVEL from the BIAS TSV.
  - id: B3_pejaver_provenance_unresolved
    detail: REVEL-20200205 vs Pejaver-calibrated build equivalence unproven.
    fallback: downstream provenance decision; keep versions distinct until resolved.
  - id: B4_phylop_label_reconcile
    detail: deployed header "hg38" vs spec "hg38_20way".
    fallback: worker confirms the deployed phyloP track/filename before equating.

beat4_self_audit:
  - failure_mode: Latest-release substitution changes the classifier before comparison.
    mitigation: pin deployed header versions (D1); deferred_upgrades explicit (D7).
    caught_by: T4, T5
  - failure_mode: A manifest claims the x64 bundle is present on ARM when only reports exist.
    mitigation: presence enum + worker_only rows; boundary rule (D2, D3).
    caught_by: T6, T2
  - failure_mode: REVEL 20200205 relabeled v1.3/2021 without evidence.
    mitigation: pin 20200205; Pejaver question left open (D6).
    caught_by: T5
  - failure_mode: Existing BIAS TSV reused despite a change requiring new evidence.
    mitigation: reuse gate with full upstream-hash preconditions (D4).
    caught_by: T7
  - failure_mode: A needless x64 rerun when downstream policy recompute suffices.
    mitigation: reuse path + decision table row for activate/no-new-input (D5).
    caught_by: T7, decision_table
  - failure_mode: Non-commercial score values leak into public/grant outputs.
    mitigation: licensing boundary and per-source redistribute_raw=false.
    caught_by: T10

acceptance_trace:
  self_contained: committed plan + exact external paths/hashes (binding_local_evidence, file_contract).
  pins_not_refreshes: deployed_bundle + preservation_set + deferred handling.
  rerun_vs_modernization: deferred_upgrades separated from the pinned bundle.
  revel_downstream: pejaver_calibration_inputs leaves calibration/activation open.
  both_routes_defined: reuse_vs_reannotate defines both without selecting.
  executable_tests_required: test_matrix T1-T10.
  no_forbidden_action: plan_only; no implementation/download/held-out run/owner decision.

deferred_upgrades:
  out_of_scope_until_a_separate_approved_refresh:
    - dbNSFP 5.x
    - MANE 1.5
    - gnomAD 4.1.1
    - dbSNP 157
    - RepeatMasker
    - broad multi-predictor (16-predictor) coverage
  rule: these are future source modernization; they must not enter this rerun.

verification_return:
  package: >-
    Returned to the orchestrator: INTENT, the single planner commit id, the
    manifest schema, verified-vs-worker-check field lists, the reuse-vs-reannotate
    decision table, the x64 handoff, the Gemini test matrix, blockers, the
    downstream policy handoff and the Beat-4 evidence.
