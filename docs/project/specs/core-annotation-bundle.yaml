    - 'Copilot-Session: 90703341-0147-4b5c-9939-42be522500b1'
  composed_prompt:
    manifest_schema: raptor-three-slot-planning-prompt-v1
    location: planning-session-local (not committed to this repo)
    composition_order:
      - slot1-DELIBERATE_ACTION_PREFIX_v2.md
      - slot2-ANNOTATION_BUNDLE_PLANNING_TEMPLATE.md
      - slot3-CORE_ANNOTATION_BUNDLE_PLAN.md
    verified_sha256:
      slot1_deliberate_action_prefix_v2: 'a0f94762e69b78f7db70398e20e1ccc6293708eff52de1e886174c2d4f7ea58f'
      slot2_annotation_bundle_planning_template: '951c28b4a12d1d10401fcbfcc76a116164e493da086dfeaf1bb0d99f113d96ef'
      slot3_core_annotation_bundle_plan: 'f7ffe991ad87f90f282777500d1b2bf3612368d78bf3fcc54528af372b8225cc'
      authoritative_spec: '6874a2b6daa4347a63d76d0dea3afc4fde5c553fa486b48552ff932ee275a329'
    authoritative_spec_name: 'ANNOTATION_BUNDLE_TASK_SPEC.yaml (raptor-annotation-bundle-task-spec-v1)'

intent:
  summary: >-
    Pin the exact deployed Nirvana 3.18.1 / BIAS 3.0.0 annotation bundle and its
    data-source versions as a hash-bound, machine-readable contract, and define
    the ARM/x64 verification boundary plus the reuse-vs-reannotate routes for the
    masked held-out rerun — without refreshing any source or making the PP3/BP4
    decision.
  contract:
    required: >-
      A single canonical manifest recording deployed artifact identity,
      file/checksum provenance, runtime field extraction, policy applicability
      and deferred refresh work for the masked rerun and the PP3/BP4 input.
    source: 'ANNOTATION_BUNDLE_TASK_SPEC.yaml: goal, required_planning_decisions, acceptance'
    done_means: >-
      The plan is self-contained through committed sources plus exact external
      artifact paths/hashes; it pins (not refreshes) the deployed bundle; and it
      leaves REVEL calibration and PP3/BP4 activation as explicit downstream
      decisions.
  expected_observable: >-
    docs/project/specs/core-annotation-bundle.yaml exists on branch
    track/annotation-bundle-2026-07 as exactly one planner commit (both Copilot
    trailers, no push, no other file changed); every ARM-present pinned hash
    reproduces and the pinned version set equals the deployed JSON header.
  inversion:
    worst_case: >-
      The plan reads as complete while silently substituting a latest internet
      release for a pinned source, or asserting the 58.7-GB x64 bundle is present
      on this ARM box when only reports exist — either corrupts the comparison
      baseline before it is measured.
    concrete_failure_modes_guarded: see beat4_self_audit
  pm_sanity_check: >-
    PM: I treat the deployed Nirvana JSON header (schemaVersion 6, dataVersion
    91.27.66, REVEL 20200205) as the ground-truth identity to pin, and I do NOT
    equate REVEL 20200205 with any REVEL v1.3/2021 Pejaver-calibrated build; if
    the Pejaver calibration must instead drive a source refresh, this pin is
    wrong and the task changes.

decision_ledger:
  - id: D1-pin-deployed-not-latest
    decision: >-
      Pin every artifact to the version actually deployed in D:\raptor-x64 and
      observed in the deployed Nirvana JSON header, not to any current internet
      release.
    evidence:
      - 'devbox VERSIONS.md (Nirvana 3.18.1 archive 8CEE9D79..., BIAS 3.0.0 @ ade13f2)'
      - 'deployed Nirvana header dataSources (verified from sample_tsc_nirvana.json.gz)'
    rejected_alternatives:
      - >-
        Resolve versions from upstream release pages / "latest": rejected — it
        changes the classifier before the comparison rerun (beat4 FM1) and
        breaks reproducibility of the frozen masked evidence.
  - id: D2-x64-bundle-presence-proof
    decision: >-
      The x64 worker proves the exact bundle still exists by recomputing
      file-by-file SHA256 over the Nirvana + supplementary-update + BIAS data
      roots and diffing against the frozen CHECKSUMS manifests, plus anchor-file
      and archive-hash spot checks and a footprint check.
    evidence:
      - 'D:\raptor-x64\CHECKSUMS\nirvana-grch38-full.sha256.txt (8024 bytes)'
      - 'D:\raptor-x64\CHECKSUMS\nirvana-grch38-updates.sha256.txt'
      - 'D:\raptor-x64\CHECKSUMS\bias-hg38-data.sha256.txt (2093 bytes)'
      - 'HANDOFF_REPORT.md footprint 58,690,294,121 bytes'
    rejected_alternatives:
      - >-
        Trust the ARM-visible VERSIONS.md text as proof of on-disk state:
        rejected — VERSIONS.md records hashes but the bundle files live on x64;
        only a recompute proves non-drift.
  - id: D3-missing-arm-manifest-entries
    decision: >-
      Enumerate the manifest entries that ARM cannot fill (full per-file hashes,
      the masked held-out Nirvana JSON, required-paths JSONs, masked-resource
      TSVs) and mark them worker-only rather than fabricating presence.
    evidence:
      - 'current_arm_state: x64_bundle_present=false, masked_nirvana_json_present=false'
    rejected_alternatives:
      - >-
        Copy the summarized "notable file hashes" into the manifest as if they
        were the complete file set: rejected — partial coverage masquerading as
        a full manifest (beat4 FM2).
  - id: D4-reuse-immutable-bias-tsv
    decision: >-
      Permit reuse of the immutable masked BIAS TSV for the rerun ONLY when
      every upstream evidence-generation input hash is unchanged AND PP3/BP4
      resolves to disabled/manual AND that resolution introduces no new scoring
      input into Nirvana/BIAS (it is applied as a downstream policy recompute).
    evidence:
      - 'masked BIAS TSV 7eece438... present on ARM, 2577 rows, 0 duplicate ids'
      - 'skip_list {PM1,PS4,PP5,BP6} bb418c11..., masked required-paths 6c05b8c3...'
    rejected_alternatives:
      - >-
        Reuse the TSV whenever PP3/BP4 is disabled/manual regardless of upstream
        inputs: rejected — reuse despite a changed evidence input ships stale
        scores (beat4 FM4).
  - id: D5-mandatory-x64-reannotation
    decision: >-
      Require a fresh x64 annotation whenever any evidence-generation input
      changes (input VCF/ID-set, any source version, BIAS version/data,
      required-paths/skip-list) or PP3/BP4 activation needs a structured input
      not already present in the immutable held-out Nirvana JSON.
    evidence:
      - 'environment_boundary.rule (no ARM rebuild of the 58.7-GB bundle)'
    rejected_alternatives:
      - >-
        Force an x64 rerun for every PP3/BP4 outcome: rejected — a needless
        rerun when a downstream policy-only recompute suffices (beat4 FM5).
  - id: D6-revel-version-distinct
    decision: >-
      Pin REVEL as version 20200205 (releaseDate 2020-02-05) and keep it
      explicitly distinct from any REVEL v1.3/2021 build; Pejaver-interval
      applicability is recorded as an unresolved downstream provenance question.
    evidence:
      - 'deployed header dataSource: REVEL | 20200205 | 2020-02-05 (verified)'
    rejected_alternatives:
      - >-
        Relabel 20200205 as v1.3/2021 to unlock Pejaver thresholds: rejected —
        unverified equivalence (beat4 FM3) and a hidden owner decision.
  - id: D7-defer-modernization
    decision: >-
      Keep source modernization and broad annotation coverage out of scope; list
      the deferred upgrades explicitly so they cannot leak into this rerun.
    evidence:
      - 'spec required_planning_decisions: explicit deferred-upgrade list'
    rejected_alternatives:
      - >-
        Fold "while we are here" upgrades (dbNSFP 5.x, MANE 1.5, gnomAD 4.1.1,
        dbSNP 157, RepeatMasker) into the pin: rejected — conflates rerun
        reproducibility with future modernization.

