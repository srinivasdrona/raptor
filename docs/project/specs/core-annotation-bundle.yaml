manifest_schema:
  intent: >-
    One canonical, machine-readable manifest is the single source of truth. Every
    file is either present+hashed, absent+required, or external-worker-only.
    Runtime metadata and source-download claims stay separate.
  proposed_name: raptor-core-annotation-bundle-manifest-v1
  top_level_keys:
    - schema
    - generated_by
    - environment: {machine_arch, x64_bundle_present}
    - runtime: {dotnet, nirvana}
    - data_bundle: {nirvana_data, supplementary_updates, bias, bias_data}
    - data_sources: 'map of source -> {version, release_date, presence}'
    - structured_fields: 'map of field -> {json_path, value_type}'
    - files: 'list of file entries (see file_entry_schema)'
    - masked_run: {input_vcf, nirvana_json, bias_tsv, required_paths, skip_list, rows, duplicate_ids}
    - licensing: {source -> permitted_use}
    - deferred_upgrades: list
  file_entry_schema:
    path: absolute or repo-relative path
    role: short description
    sha256: lowercase hex or null
    presence: {enum: [present_hashed, absent_required, worker_only]}
    verified_on: {enum: [arm, x64_worker, unverified]}
    bytes: integer or null
