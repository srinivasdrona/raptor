    - 'Copilot-Session: 7c146921-f3dd-4a1e-8cf0-8f574de49204'
  prohibited_in_this_task:
    - implementation/runner code, downloads, held-out runs, owner activation decision
  composed_prompt:
    manifest_schema: raptor-three-slot-planning-prompt-v1
    verified_sha256:
      slot1: 'a0f94762e69b78f7db70398e20e1ccc6293708eff52de1e886174c2d4f7ea58f'
      slot2: '951c28b4a12d1d10401fcbfcc76a116164e493da086dfeaf1bb0d99f113d96ef'
      slot3: 'f7ffe991ad87f90f282777500d1b2bf3612368d78bf3fcc54528af372b8225cc'
      authoritative_spec: '6874a2b6daa4347a63d76d0dea3afc4fde5c553fa486b48552ff932ee275a329'

intent:
  summary: >-
    Pin the exact deployed Nirvana 3.18.1 / BIAS 3.0.0 bundle and its full
    28-source header set as a hash-bound contract; correct the ARM evidence
    inventory; separate the historical run attestation from current x64
    readiness; and gate any TSV reuse behind an implemented PP3/BP4 suppression
    contract — without refreshing a source or deciding activation.
  contract:
    required: >-
      One canonical machine-readable manifest recording deployed identity,
      file/checksum provenance, runtime field extraction, policy applicability
      and deferred refresh, plus fail-closed licensing.
    done_means: >-
      Self-contained through committed sources + exact external paths/hashes;
      pins (not refreshes) the bundle; leaves REVEL calibration and PP3/BP4
      activation as explicit downstream decisions; reuse is not asserted GO.
  expected_observable: >-
    docs/project/specs/core-annotation-bundle.yaml is exactly one follow-up
    planner commit (both trailers incl. Copilot-Session 7c146921..., no amend,
    no push, no other file changed); every ARM-present hash reproduces and the
    pinned data-source set equals all 28 deployed header sources.
  inversion:
    worst_case: >-
      The plan again reads complete while (a) marking ARM-present evidence as
      x64-only, (b) pinning a partial source set that lets a latest release slip
      through, (c) declaring reuse GO with no implemented PP3/BP4 suppression,
      (d) asserting local raw-score use is permitted rather than pending review,
      or (e) shipping tests that cannot run in current CI or that count skips as
      success — any of which corrupts, blocks or falsely greenlights the rerun.
    guarded_by: beat4_self_audit
  pm_sanity_check: >-
    PM: policy-only reuse depends on the immutable ARM return evidence (return
    manifest + byte-identical copies), NOT on the 58.7-GB x64 bundle still
    existing today; and reuse stays BLOCKED_POLICY_IMPLEMENTATION until the
    PP3/BP4 suppression contract is implemented and tested. If either premise is
    wrong, the routing changes.

implementation_scope:
  note: >-
    This planner file (docs/project/specs/...) is the PLAN, not part of the
    implementation branch diff. The implementation branch diff is exactly three
    files, authored in two commits; no runner/production code changes here.
  branch_diff_is_exactly:
    - configs/eval/core_annotation_bundle.yaml
    - docs/reference/core-annotation-bundle-2026-07.md
    - tests/eval/test_core_annotation_bundle.py
  canonical_manifest:
    path: configs/eval/core_annotation_bundle.yaml
    author: Sonnet
    is: the single machine-readable source of truth for the deployed bundle
    schema: raptor-core-annotation-bundle-manifest-v1
    status: pinned_historical_evidence
    distinct_from_planner: >-
      This artifact is NOT this planner spec. It has its own schema id and its
      own artifact status. OFF1 must assert THESE values, never the planner
      spec's raptor-core-annotation-bundle-v1 / planner_contract_ready_for_implementation.
    exact_shape: see canonical_manifest_schema (closed top-level keys and nested shapes)
  human_reference:
    path: docs/reference/core-annotation-bundle-2026-07.md
    author: Sonnet
    is: human-readable companion explaining the pin, boundary and routes
    must_mirror_exact_values:
      manifest_schema: raptor-core-annotation-bundle-manifest-v1
      manifest_status: pinned_historical_evidence
      reuse_readiness: BLOCKED_POLICY_IMPLEMENTATION
      reannotation_readiness: X64_WORKER_UNVERIFIED_UNTIL_OPERATOR_MAKES_AVAILABLE
      licensing_readiness: PENDING_PERMITTED_USE_REVIEW
    must_state_explicitly:
      - historical evidence is pinned (immutable, present on ARM)
      - reuse is blocked pending the PP3/BP4 suppression contract
      - current x64 reannotation readiness is unverified
      - raw-predictor-score permissions are pending permitted-use review
  gemini_test:
    path: tests/eval/test_core_annotation_bundle.py
    author: Gemini
    order: RED before Sonnet implementation
  commit_split:
    gemini_commit: [tests/eval/test_core_annotation_bundle.py]
    sonnet_commit: [configs/eval/core_annotation_bundle.yaml, docs/reference/core-annotation-bundle-2026-07.md]
  excluded:
    - no runner or production code changes in this task
    - no new eval harness/runner wiring

canonical_manifest_schema:
  purpose: >-
    The EXACT closed schema for the Sonnet-authored artifact
    configs/eval/core_annotation_bundle.yaml. This artifact is DISTINCT from
    this planner spec: it has its own schema id and its own artifact status.
    OFF1 must check THESE values, never the planner spec's schema/status.
  schema: raptor-core-annotation-bundle-manifest-v1
  status: pinned_historical_evidence
  status_note: >-
    status describes the ARTIFACT (deployed historical evidence is pinned), not
    planner readiness; it must NOT be planner_contract_ready_for_implementation.
  closed: true
  reject_unknown_top_level_keys: true
  top_level_keys_exact:
    - schema
    - status
    - readiness
    - runtime
    - data_sources
    - structured_fields
    - arm_inventory
    - historical_run_attestation
    - current_x64_reannotation_readiness
    - pp3_bp4_suppression_prerequisite
    - reuse_vs_reannotate
    - licensing
    - deferred_upgrades
    - x64_handoff_requirements
  readiness:
    closed: true
    required_keys_exact: [reuse_readiness, reannotation_readiness, licensing_readiness]
    enums:
      reuse_readiness: [BLOCKED_POLICY_IMPLEMENTATION, GO_REUSE]
      reannotation_readiness: [X64_WORKER_UNVERIFIED_UNTIL_OPERATOR_MAKES_AVAILABLE, X64_WORKER_VERIFIED]
      licensing_readiness: [PENDING_PERMITTED_USE_REVIEW, CLEARED_BY_OWNER_RECORD]
    pinned_now:
      reuse_readiness: BLOCKED_POLICY_IMPLEMENTATION
      reannotation_readiness: X64_WORKER_UNVERIFIED_UNTIL_OPERATOR_MAKES_AVAILABLE
      licensing_readiness: PENDING_PERMITTED_USE_REVIEW
  runtime:
    closed: true
    required_keys_exact: [annotator, runtime_banner, nirvana_data_version, nirvana_schema_version, genome_assembly, bias_version, bias_commit, dotnet_runtime]
    pinned:
      annotator: Nirvana 3.18.1
      runtime_banner: 3.18.1-0-g05f88047
      nirvana_data_version: '91.27.66'
      nirvana_schema_version: 6
      genome_assembly: GRCh38
      bias_version: '3.0.0'
      bias_commit: ade13f206f3e2c2efe3ec92715d974645fc8da8f
      dotnet_runtime: '6.0.36'
  data_sources:
    closed: true
    type: list of exactly 28 source_entry
    count: 28
    source_entry_shape:
      closed: true
      required_keys_exact: [name, version, release_date]
      reject_extra_keys: true
    values: the 28 pinned triples in deployed_data_sources.sources (authoritative)
  structured_fields:
    closed: true
    required_keys_exact: [revel, alphamissense, scalars, forbidden_source]
    revel:
      required_keys_exact: [json_path, value_type]
      json_path: 'positions[].variants[].revel.score'
      value_type: float
    alphamissense:
      required_keys_exact: [json_path, value_type]
      json_path: 'positions[].variants[].AlphaMissense.AM_score'
      value_type: float
    scalars:
      required_keys_exact: [phylop, gerp]
    forbidden_source_rule: REVEL must not be sourced from BIAS free-form rationale
  arm_inventory:
    closed: true
    required_keys_exact: [data_root, present_hashed]
    no_worker_only: >-
      arm_inventory has NO worker_only key. x64-only files and directories are
      NOT ARM inventory; they live in x64_handoff_requirements.items. No x64 path
      may appear anywhere in arm_inventory.
    present_hashed:
      type: list of exactly 14 file_entry
      constraint: every entry has location arm and presence present_hashed
    file_entry_shape:
      closed: true
      required_keys_exact: [id, location, path, sha256, bytes, presence]
      allowed_optional_keys: [attributes]
      reject_keys_outside: required_keys_exact plus allowed_optional_keys
      fixed_values:
        location: arm
        presence: present_hashed
      invariants:
        - 'sha256 is 64 lowercase hex; bytes is a positive integer (never null)'
        - 'no x64 path appears anywhere in arm_inventory'
        - 'entry-specific extras (rows, duplicate_ids, contents, role, provenance_path) live only under attributes'
  historical_run_attestation:
    closed: true
    required_keys_exact: [claim, proven_by, hashes, independent_of]
    hashes:
      closed: true
      required_keys_exact: [input_vcf_sha256, provenance_sha256, provenance_manifest_hash, provenance_vcf_hash, return_manifest_sha256, scoring_report_sha256, bias_tsv_sha256, heldout_nirvana_json_sha256]
      pinned:
        input_vcf_sha256: '4dcba7c882b65838cedf8ce0ad56e0f7764df34b247ab412aac144d4027c622d'
        provenance_sha256: '63f1881287f1e3aa0b36ca14e1a7329ef2bcacc7b9674c2489f5e1d4352a6ac8'
        provenance_manifest_hash: '9e588cdf8ebaea2e3793e0ea74721ab5283b57c2abf045dbf3070cb6e81ec9e4'
        provenance_vcf_hash: '4dcba7c882b65838cedf8ce0ad56e0f7764df34b247ab412aac144d4027c622d'
        return_manifest_sha256: '5efdccdc57f7d2bdf774486dfbde106ab173bf87412c6db103aaba9958d9ac91'
        scoring_report_sha256: 'e5351a42e3120083d21d6b82775a38aee2a5d9bcf8586da08b3b239f24c35b3c'
        bias_tsv_sha256: '7eece438a880e0c6a591df62e231bc93848eeb42277a2f4360983914298fc512'
        heldout_nirvana_json_sha256: '315e601cc9ede55c07c4a59de796c2be5cf0f2827e441101ceea236390675d13'
    independent_of: current_x64_reannotation_readiness
    no_current_x64_dependency: true
  current_x64_reannotation_readiness:
    closed: true
    required_keys_exact: [required_only_for, status, x64_requirement_ids, presence_proof_when_needed, boundary_rule]
    required_only_for: X64_REANNOTATE
    status_enum: [UNVERIFIED, VERIFIED]
    x64_requirement_ids: references x64_handoff_requirements.items ids only (no inline file entries, no historical hashes)
    contains_only: reannotation proof requirements and x64 requirement references (no historical-evidence hashes)
  pp3_bp4_suppression_prerequisite:
    closed: true
    required_keys_exact: [id, finding, evidence, requirement, until_then]
    id: PP3_BP4_SUPPRESSION_CONTRACT_REQUIRED
    until_then: BLOCKED_POLICY_IMPLEMENTATION
  reuse_vs_reannotate:
    closed: true
    required_keys_exact: [principle, reuse_path, reannotate_path, decision_table]
    reuse_path_current_route: BLOCKED_POLICY_IMPLEMENTATION
  licensing:
    closed: true
    required_keys_exact: [model, historical_execution_observed, channels, downstream_use_rule, cloud_egress_rule, per_source]
    model: fail_closed
    historical_execution_observed: true
    channels:
      required_keys_exact: [local_execution_status, raw_public_redistribution, raw_cloud_egress]
      allowed_values:
        local_execution_status: [pending_permitted_use_review]
        raw_public_redistribution: [false]
        raw_cloud_egress: [false]
    per_source:
      required_keys_exact: [revel, alphamissense]
      revel_allowed:
        local_status: [pending_permitted_use_review]
        raw_public_redistribution: [false]
        raw_cloud_egress: [false]
      alphamissense_allowed:
        local_status: [pending_permitted_use_review]
        raw_public_redistribution: [false]
        raw_cloud_egress: [false]
        licence_version: [confirm_pending]
    recursive_permission_reject: >-
      OFF5 walks the whole licensing subtree and FAILS if any boolean is true,
      any status field is outside its allowed set, or any value asserts
      permission, redistribution or egress beyond the specified pending/false
      values.
  deferred_upgrades:
    closed: true
    required_keys_exact: [out_of_scope_until_a_separate_approved_refresh, rule]
    must_include: [dbNSFP 5.x, MANE 1.5, gnomAD 4.1.1, dbSNP 157, RepeatMasker]
  x64_handoff_requirements:
    closed: true
    required_keys_exact: [items, bundle_presence_proof, reannotation_commands_reference, return_handoff_manifest, required_artifact]
    required_artifact: x64_bundle_verification.json
    items:
