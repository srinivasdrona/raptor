# RAPTOR core annotation bundle — pinned, hash-bound planner contract.
#
# Purpose: an implementation-ready, hash-bound record of the EXACT existing
# annotation bundle required for the production-faithful masked held-out rerun
# and the PP3/BP4 owner decision — WITHOUT upgrading any data source or
# downloading a new comprehensive bundle.
#
# This file is the sole planner output. It performs no annotation, no download,
# no held-out run and no owner policy decision. It pins the deployed bundle,
# defines the ARM/x64 boundary, and defines BOTH a no-x64 reuse path and an
# x64 reannotation path without silently selecting either.
#
# Composed from a verified three-slot planning prompt (deliberate-action
# prefix v2 + annotation-bundle planning template + core-bundle task) over the
# authoritative ANNOTATION_BUNDLE_TASK_SPEC.yaml.
#
# Schema: raptor-core-annotation-bundle-v1 — see `spec_map` for section roles.

schema: raptor-core-annotation-bundle-v1
status: planner_contract_ready_for_implementation
task_id: sources-pin-core-annotation-bundle
title: Minimum deployed core annotation bundle — pinned reproducibility contract

worktree: 'D:\AIProjects\raptor-worktrees\annotation-bundle'
branch: track/annotation-bundle-2026-07
base_commit: 29d5ab58c3e717325f6337cc940805743cf2507d

spec_map:
  intent: Beat 1/3/4 record and PM sanity-check.
  decision_ledger: The seven critical decisions with rejected alternatives.
  binding_local_evidence: Exact evidence paths and ARM presence/absence.
  deployed_bundle: The pinned, hash-bound deployed identity.
  manifest_schema: Canonical machine-readable manifest schema and example.
  file_contract: Per-file present+hashed / absent+required / worker-only rows.
  field_provenance: Verified-from-artifact vs requires-x64-worker-inspection.
  reuse_vs_reannotate: Decision table for the two mutually exclusive routes.
  x64_handoff: Worker bundle-presence proof and reannotation/return contract.
  pejaver_calibration_inputs: REVEL-version decision inputs (no owner decision).
  licensing: Internal-research vs redistribution boundary.
  preservation_set: Sonnet must-not-change invariants.
  test_matrix: Gemini RED tests authored before Sonnet implementation.
  gpt54_probes: Adversarial checks against the failure modes.
  routes: Stop/go and N/A routing.
  downstream_policy_handoff: Handoff to PP3/BP4 and the masked rerun.
  blockers: Named blockers with fallback.
  beat4_self_audit: Failure mode -> mitigation -> catching test.

