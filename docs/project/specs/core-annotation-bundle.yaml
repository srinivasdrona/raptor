  finding: >-
    The existing runner has NO implemented PP3/BP4 disabled/manual suppression
    path. It hard-forbids {PP5, BP6, PS4} at config-load and combine time and the
    masked run only added a PM1 batch-scope skip; non-approved policy is
    hard-blocked. Reuse of the disabled/manual TSV therefore cannot be declared
    safe today.
  evidence:
    - 'src/raptor/eval/config.py:187 FORBIDDEN_CRITERIA = {PP5, BP6, PS4}'
    - 'src/raptor/eval/config.py:197 VALID_CRITERIA = 28 canonical ACMG codes; config-load + combine validation'
    - 'masked run evaluation_skip_list = {PM1, PS4, PP5, BP6} = forbidden set + PM1 batch waiver'
  requirement: >-
    The downstream resolve-pp3-bp4-activation / rerun task must IMPLEMENT AND
    TEST an explicit PP3/BP4 suppression contract (disabled/manual applied as a
    downstream policy recompute) before ANY reuse of the immutable TSV.
  until_then: route = BLOCKED_POLICY_IMPLEMENTATION (NOT GO_REUSE)

reuse_vs_reannotate:
  principle: >-
    Comparison reruns preserve the historical bundle. Policy-only reuse is
    allowed only when no upstream evidence-generation input changed AND a
    tested PP3/BP4 suppression contract exists. Neither route is selected here.
  reuse_path:
    name: POLICY_ONLY_REUSE
    relies_on: historical_run_attestation (immutable ARM evidence)
    input_preconditions_all_required:
      - input VCF == 4dcba7c8... (frozen)
      - masked required-paths == 6c05b8c3... ; skip_list == bb418c11...
      - masked resources unchanged (PS1/PM5 f17b19e6, PP2 43f6002d, BP1 274ab0ce, PM1 ce9ee18d)
      - Nirvana 3.18.1 / data 91.27.66 / schema 6 and BIAS 3.0.0 @ ade13f2 unchanged
      - PP3/BP4 outcome in {disabled, manual} and adds no new scoring input
    policy_precondition: PP3_BP4_SUPPRESSION_CONTRACT_REQUIRED is implemented+tested
    current_route: BLOCKED_POLICY_IMPLEMENTATION
  reannotate_path:
    name: X64_REANNOTATE
    relies_on: current_x64_reannotation_readiness
    trigger_any:
      - input VCF/ID-set differs from the frozen 2,577-row set
      - any of the 28 data-source versions changes (any forbidden upgrade applied)
      - BIAS version/commit or bias data bundle changes
      - masked required-paths JSON or skip-list changes
      - PP3/BP4 activation needs a structured input absent from the held-out JSON
      - a structured recompute is needed but the held-out Nirvana JSON is unverifiable
  decision_table:
    - {upstream_inputs: unchanged, pp3_bp4: disabled_or_manual, suppression_contract: absent, route: BLOCKED_POLICY_IMPLEMENTATION}
    - {upstream_inputs: unchanged, pp3_bp4: disabled_or_manual, suppression_contract: implemented_tested, route: POLICY_ONLY_REUSE}
    - {upstream_inputs: unchanged, pp3_bp4: activate, new_scoring_input: true, route: X64_REANNOTATE}
    - {upstream_inputs: changed, pp3_bp4: any, route: X64_REANNOTATE}
    - {upstream_inputs: unknown_or_unverifiable, pp3_bp4: any, route: BLOCKED_DATA_until_x64_verifies}

x64_handoff:
  bundle_presence_proof: see current_x64_reannotation_readiness.presence_proof_when_needed
  reannotation_commands_reference:
    note: exact deterministic commands recorded in MASKED_HELDOUT_SCORING_REPORT.md
    nirvana: 'dotnet Nirvana.dll -c ...\Cache\GRCh38\Both --sd ...\SupplementaryAnnotation\GRCh38 -r ...\Homo_sapiens.GRCh38.Nirvana.dat -i holdout_input.vcf -o holdout_input_nirvana'
    bias: 'python bias_2015.py holdout_input_nirvana.json.gz hg38_nirvana_required_paths.masked.json holdout_input.masked.bias_output.tsv --skip_list evaluation_skip_list.txt'
  return_handoff_manifest:
    - recomputed full-bundle diff result (match/drift list)
    - held-out Nirvana JSON path + SHA256 and BIAS TSV path + SHA256
    - row count == 2577 and duplicate-id count == 0
    - BiasTsvSource parse proof (records == rows, no BiasContractError)
    - exit codes and wall times

pejaver_calibration_inputs:
  purpose: decision inputs only; the owner makes the PP3/BP4 call downstream
  pinned_revel: {version: '20200205', release_date: '2020-02-05'}
  unresolved_question: >-
    Whether Pejaver REVEL intervals apply to REVEL 20200205 as deployed or were
    derived on a different build (e.g. v1.3/2021). Requires a resolved provenance
    argument; NOT assumed.
  constraints:
    - do not relabel 20200205 as v1.3/2021 without a resolved provenance record
    - do not read held-out labels/VUS outputs/prior outcomes to pick a version
    - REVEL values come from the Nirvana structured path, not BIAS rationale

licensing:
  model: fail_closed
  historical_execution_observed: true
  historical_execution_note: >-
    A masked BIAS run already occurred and its outputs are immutable historical
    artifacts on ARM. That execution HAPPENED is a fact; it is NOT permission to
    use raw predictor scores going forward.
  channels:
    local_execution_status: pending_permitted_use_review
    raw_public_redistribution: false
    raw_cloud_egress: false
  downstream_use_rule: >-
    The downstream policy/runner MUST NOT use raw predictor scores (REVEL,
    AlphaMissense) beyond the already-existing historical artifacts until the
    grant/data-rights todo closes OR an explicit owner permitted-use record
    exists. No field in this contract asserts that use is currently permitted.
  cloud_egress_rule: >-
    REVEL and AlphaMissense RAW scores must NOT enter Anthropic/cloud prompts or
    any cloud egress until a permitted-use review clears them. Default is deny.
  per_source:
    revel:
      local_status: pending_permitted_use_review
      raw_public_redistribution: false
      raw_cloud_egress: false
    alphamissense:
      licence_version: confirm_pending
      licence_note: conflicting official/current evidence; do not claim a licence version
      local_status: pending_permitted_use_review
      raw_public_redistribution: false
      raw_cloud_egress: false

preservation_set:
  do_not_change_before_comparison_rerun: [MANE, gnomAD, dbSNP, ClinVar, REVEL, Nirvana, BIAS versions]
  do_not:
    - substitute current web releases for the deployed bundle
    - claim Pejaver intervals apply to REVEL 20200205 without resolved provenance
    - parse REVEL from BIAS free-form rationale
    - read held-out labels/VUS outputs/prior outcomes to pick a version
    - egress or redistribute raw non-commercial predictor scores (REVEL, AlphaMissense)

test_matrix:
  ownership: >-
    Gemini authors tests/eval/test_core_annotation_bundle.py (RED before Sonnet).
    Always-on tests use only the committed manifest/reference; external-data
    tests gate behind RAPTOR_DATA_ROOT. File-scope/commit-split is a GPT-5.4
    review probe, NOT a Gemini pytest assertion.
  ci_constraint: >-
    Always-on tests must pass in current CI with no workflow or fetch-depth
    change and no repository data fetch. requires_reference tests skip cleanly
    when data is absent; a skip is NOT evidence of local completion.
  always_on_offline:
    runs_in_ci: true
    inputs: committed configs/eval/core_annotation_bundle.yaml and docs/reference/core-annotation-bundle-2026-07.md only
    tests:
      - {id: OFF1_schema, asserts: 'the canonical manifest parses and has the required keys and enums (schema-valid).'}
      - {id: OFF2_source_values_28, asserts: 'manifest data_sources equal the 28 pinned name/version/release_date values exactly; any missing, extra or mismatch fails.'}
      - {id: OFF3_presence_enums, asserts: 'every file entry presence is present_hashed or worker_only; worker_only files are not marked present on ARM; x64_bundle_present is false.'}
      - {id: OFF4_reuse_blocked_on_suppression, asserts: 'with the PP3/BP4 suppression contract absent, the reuse route resolves to BLOCKED_POLICY_IMPLEMENTATION and never GO_REUSE.'}
      - {id: OFF5_licensing_egress_flags, asserts: 'channel local_execution_status is pending_permitted_use_review; raw_public_redistribution and raw_cloud_egress are false for the channel and every per-source; AlphaMissense licence_version is confirm_pending; no field asserts currently-permitted use.'}
      - {id: OFF6_deferred_upgrade_guard, asserts: 'fails if MANE 1.5, dbNSFP 5.x, gnomAD 4.1.1, dbSNP 157, RepeatMasker or a newer primary ClinVar appears in data_sources.'}
      - {id: OFF7_structured_path_contract, asserts: 'REVEL path is positions[].variants[].revel.score and AlphaMissense is AlphaMissense.AM_score; a BIAS-rationale REVEL path is rejected.'}
      - {id: OFF8_revel_label_guard, asserts: 'REVEL version is 20200205; fails if 1.3 or 2021 is asserted without a provenance record.'}
      - {id: OFF9_historical_vs_current_split, asserts: 'historical_run_attestation references only immutable ARM evidence and has no dependency on current_x64_reannotation_readiness.'}
  data_backed_local:
    runs_in_ci: false
    marker: requires_reference
    env: RAPTOR_DATA_ROOT
    skip_rule: 'pytest.skip only when RAPTOR_DATA_ROOT or a listed file is absent; never silently pass and never treat an assertion failure as a skip.'
    inputs: the 14 arm_inventory.present_hashed files under RAPTOR_DATA_ROOT
    tests:
      - {id: REF1_arm_hash_bytes, asserts: 'each of the 14 present_hashed files exists and its recomputed SHA256 and byte size equal the pinned values.'}
      - {id: REF2_vcf_provenance_return_consistency, asserts: 'holdout_input.vcf SHA256 equals provenance.json vcf_hash equals 4dcba7c8...; manifest.jsonl SHA256 equals provenance.manifest_hash; RETURN_MANIFEST-listed hashes match the ARM copies.'}
      - {id: REF3_bias_tsv_invariants, asserts: 'the masked BIAS TSV has 2577 rows and 0 duplicate keys and parses via BiasTsvSource with no BiasContractError.'}
    missing_data_report: >-
      Absent reference data must be reported by the required local presence gate
      (validation_commands.local_reference_gate), which lists the missing files
      and exits non-zero. A CI skip of these tests does NOT count as
      implementation success.
  x64_worker_checks:
    is_pytest_on_arm_or_ci: false
    form: handoff checklist / probes plus a required worker verification artifact
    checks:
      - recompute file-by-file SHA256 over the Nirvana, supplementary-update and BIAS roots and diff vs the frozen CHECKSUMS manifests
      - anchor, archive and BIAS-commit spot checks; footprint approx 58,690,294,121 bytes
      - annotator header re-emits dataVersion 91.27.66, schema 6 and all 28 sources
    required_artifact: 'worker returns x64_bundle_verification.json (diff result, hashes, exit codes) attached to the reannotation handoff; required only for X64_REANNOTATE.'
  review_probes:
    owner: GPT-5.4
    probes:
      - the implementation branch diff equals exactly configs/eval/core_annotation_bundle.yaml, docs/reference/core-annotation-bundle-2026-07.md and tests/eval/test_core_annotation_bundle.py
      - the Gemini commit changes only the test; the Sonnet commit changes only the manifest and reference
      - no runner or production code is modified
  validation_commands:
    offline_ci: 'pytest tests/eval/test_core_annotation_bundle.py -m "not requires_reference"'
    local_data_backed_pwsh: '$env:RAPTOR_DATA_ROOT="D:\AIProjects\raptor-data"; pytest tests/eval/test_core_annotation_bundle.py -m requires_reference'
    local_reference_gate: 'required local command that verifies the 14 present_hashed files exist under RAPTOR_DATA_ROOT and exits non-zero listing any missing (distinct from a pytest skip).'
    gpt_diff_scope: 'git diff --name-only <impl_base>..HEAD must equal the three implementation files (GPT-5.4 probe, not pytest).'
    ci_fetch_depth: 'unchanged; do not modify actions/checkout fetch-depth and do not add a data-fetch step.'
  implementation_status_rule: >-
    Status is CLEAN only when offline_ci passes AND the local_reference_gate plus
    data_backed_local tests pass on a box with RAPTOR_DATA_ROOT. CI skips of
    requires_reference tests are NOT evidence of local completion.

blockers:
  - id: B1_reuse_blocked
    detail: 'no implemented PP3/BP4 suppression contract; route BLOCKED_POLICY_IMPLEMENTATION until resolve-pp3-bp4-activation implements+tests it.'
  - id: B2_x64_unavailable
    detail: '58.7-GB bundle absent on ARM by design; needed only for reannotation or full-manifest verification; fallback is operator makes x64 available else BLOCKED_DATA.'
  - id: B3_heldout_json_absent
    detail: 'held-out Nirvana JSON 315e601c... not on ARM; needed only for a structured recompute in reannotate/activation.'
  - id: B4_pejaver_provenance
    detail: 'REVEL-20200205 vs Pejaver-calibrated build equivalence unproven (downstream).'
  - id: B5_alphamissense_licence
    detail: 'licence version confirm_pending; raw cloud egress pending permitted-use review.'
  - id: B6_phylop_label
    detail: 'header phyloP hg38 vs spec hg38_20way; worker confirms track/filename.'
  - id: B7_transcript_ref_checksums
    detail: 'provenance.json NM_000368.5 and NM_000548.5 reference checksums are confirm-pending.'

downstream_policy_handoff:
  to: [resolve-pp3-bp4-activation, rerun-masked-gate]
  provides:
    - pinned REVEL 20200205 / AlphaMissense provenance and the structured extraction route
    - the unresolved Pejaver/REVEL-20200205 compatibility question (inputs, not decision)
    - the reuse-vs-reannotate decision table and the PP3_BP4_SUPPRESSION_CONTRACT_REQUIRED prerequisite
    - the immutable historical run attestation (return manifest + byte-identical ARM copies)
  does_not: [make the PP3/BP4 activation or owner decision, select reuse or reannotate, clear cloud-egress for raw scores]

beat4_self_audit:
  - failure_mode: 'ARM-present evidence mislabeled x64-only'
    mitigation: 'arm_inventory present_hashed with recomputed hashes; x64 paths are provenance only'
    caught_by: OFF3/REF1
  - failure_mode: 'Partial source pin lets a latest release slip through'
    mitigation: 'full 28-source equality plus deferred-upgrade guard'
    caught_by: OFF2/OFF6
  - failure_mode: 'Reuse declared GO with no suppression contract'
    mitigation: 'PP3_BP4_SUPPRESSION_CONTRACT_REQUIRED; route BLOCKED_POLICY_IMPLEMENTATION'
    caught_by: OFF4
  - failure_mode: 'Reuse conflated with current x64 bundle existence'
    mitigation: 'historical_run_attestation split from current_x64_reannotation_readiness'
    caught_by: OFF9
  - failure_mode: 'Raw non-commercial score use asserted as permitted or egressed'
    mitigation: 'fail-closed per-channel licensing; local status pending_permitted_use_review; no currently-permitted text; downstream_use_rule'
    caught_by: OFF5
  - failure_mode: 'REVEL 20200205 relabeled v1.3/2021'
    mitigation: 'pin plus open Pejaver question'
    caught_by: OFF8
  - failure_mode: 'Latest-release substitution changes the classifier'
    mitigation: 'pin deployed header; deferred_upgrades explicit'
    caught_by: OFF2/OFF6
  - failure_mode: 'Tests cannot run in CI or count skips as success'
    mitigation: 'always-on offline partition; requires_reference skip; required local gate; CI skip is not completion'
    caught_by: always_on_offline/implementation_status_rule

deferred_upgrades:
  out_of_scope_until_a_separate_approved_refresh: [dbNSFP 5.x, MANE 1.5, gnomAD 4.1.1, dbSNP 157, RepeatMasker, broad 16-predictor coverage]
  rule: future source modernization; must not enter this rerun.

verification_return:
  package: >-
    Returned to the orchestrator: commit id, corrected implementation scopes, the
    corrected ARM manifest, the historical-vs-current split, the suppression
    dependency, the 28-source set, the fail-closed licensing states, the revised
    tests and the verification block.
