intent:
  summary: >-
    Pin the exact deployed Nirvana 3.18.1 / BIAS 3.0.0 bundle and its full
    28-source header set as a hash-bound contract; correct the ARM evidence
    inventory; separate the historical run attestation from current x64
    readiness; and gate any TSV reuse behind an implemented PP3/BP4 suppression
    contract — without refreshing a source or deciding activation.
  contract:
    required: >-
      One canonical machine-readable manifest recording deployed identity,
      file/checksum provenance, runtime field extraction, policy applicability
      and deferred refresh, plus fail-closed licensing.
    done_means: >-
      Self-contained through committed sources + exact external paths/hashes;
      pins (not refreshes) the bundle; leaves REVEL calibration and PP3/BP4
      activation as explicit downstream decisions; reuse is not asserted GO.
  expected_observable: >-
    docs/project/specs/core-annotation-bundle.yaml is exactly one follow-up
    planner commit (both trailers incl. Copilot-Session 7c146921..., no amend,
    no push, no other file changed); every ARM-present hash reproduces and the
    pinned data-source set equals all 28 deployed header sources.
  inversion:
    worst_case: >-
      The plan again reads complete while (a) marking ARM-present evidence as
      x64-only, (b) pinning a partial source set that lets a latest release slip
      through, (c) declaring reuse GO with no implemented PP3/BP4 suppression,
      (d) asserting local raw-score use is permitted rather than pending review,
      or (e) shipping tests that cannot run in current CI or that count skips as
      success — any of which corrupts, blocks or falsely greenlights the rerun.
    guarded_by: beat4_self_audit
  pm_sanity_check: >-
    PM: policy-only reuse depends on the immutable ARM return evidence (return
    manifest + byte-identical copies), NOT on the 58.7-GB x64 bundle still
    existing today; and reuse stays BLOCKED_POLICY_IMPLEMENTATION until the
    PP3/BP4 suppression contract is implemented and tested. If either premise is
    wrong, the routing changes.

implementation_scope:
  note: >-
    This planner file (docs/project/specs/...) is the PLAN, not part of the
    implementation branch diff. The implementation branch diff is exactly three
    files, authored in two commits; no runner/production code changes here.
  branch_diff_is_exactly:
    - configs/eval/core_annotation_bundle.yaml
    - docs/reference/core-annotation-bundle-2026-07.md
    - tests/eval/test_core_annotation_bundle.py
  canonical_manifest:
    path: configs/eval/core_annotation_bundle.yaml
    author: Sonnet
    is: the single machine-readable source of truth for the deployed bundle
    must_contain:
      - runtime identity (Nirvana 3.18.1 / data 91.27.66 / schema 6 / BIAS 3.0.0)
      - all 28 deployed data sources (name/version/release_date)
      - structured field JSON paths (revel.score, AlphaMissense.AM_score)
      - arm_inventory with recomputed sha256/bytes for every present file
      - historical_run_attestation and current_x64_reannotation_readiness (separate)
      - reuse gate incl. PP3_BP4_SUPPRESSION_CONTRACT_REQUIRED
      - fail-closed licensing (per-channel, pending permitted-use review) and deferred_upgrades
  human_reference:
    path: docs/reference/core-annotation-bundle-2026-07.md
    author: Sonnet
    is: human-readable companion explaining the pin, boundary and routes
  gemini_test:
    path: tests/eval/test_core_annotation_bundle.py
    author: Gemini
    order: RED before Sonnet implementation
  commit_split:
    gemini_commit: [tests/eval/test_core_annotation_bundle.py]
    sonnet_commit: [configs/eval/core_annotation_bundle.yaml, docs/reference/core-annotation-bundle-2026-07.md]
  excluded:
    - no runner or production code changes in this task
    - no new eval harness/runner wiring

