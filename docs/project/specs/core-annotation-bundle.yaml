      sha256: '315e601cc9ede55c07c4a59de796c2be5cf0f2827e441101ceea236390675d13'
      presence: worker_only
      verified_on: unverified
      bytes: null
    - path: 'D:\raptor-x64\nirvana-data\GRCh38\...\gnomAD_4.0.nsa'
