      values: see x64_handoff.items (authoritative)
    x64_requirement_shape:
      closed: true
      required_keys_exact: [id, kind, x64_path, expected_sha256, expected_bytes, required_for, verification_rule]
      enums:
        kind: [file, directory, manifest]
      types:
        expected_sha256: 64-lowercase-hex string OR null (null when unknown on ARM; never fabricated)
        expected_bytes: positive integer OR null (null when unknown on ARM; never fabricated)

