acceptance_criteria:
  - id: FC-01
    rule: Every external input root is absolute and every path component is checked for symlink/junction/reparse status before resolve or read.
  - id: FC-02
    rule: All input bytes, self-hashes, schemas, row counts and provenance bindings match exact pins before joins.
  - id: FC-03
    rule: Functional rows are fully revalidated, but score_raw and functional class are never accessed for coverage decisions or output.
  - id: FC-04
    rule: The functional observation count is 9,681 and deduplicates to exactly 9,552 SPDI coverage rows.
  - id: FC-05
    rule: >-
      The 6,618 VUS identities conserve exactly and the 164 priority rows are
      reproduced through the existing disabled/manual census seam and match
      the frozen external priority queue by exact canonical-SPDI set equality.
  - id: FC-06
    rule: The priority subset is exactly 157 candidate-LP plus 7 candidate-LB rows and remains internal non-authoritative metadata.
  - id: FC-07
    rule: The prospective input reads only the 2,608-row label-free export manifest and provenance; every labeled or adjudication artifact is forbidden.
  - id: FC-08
    rule: The Atlas contrast identities are obtained only through the fully verified offline raw identity mapper; 25 resolved and 10 unresolved records are conserved.
  - id: FC-09
    rule: The $R611Q$ anchor remains Gate-8 blocked with zero accepted claims; only its pinned SPDI participates in coverage.
  - id: FC-10
    rule: All joins are exact SPDI equality and no unresolved Atlas identity is joined.
  - id: FC-11
    rule: VUS and prospective holdout identity sets are disjoint; any intersection aborts the run.
  - id: FC-12
    rule: Every expected cohort, source-membership, cross-cohort and leakage-marker count matches before publication.
  - id: FC-13
    rule: The external coverage JSONL has the exact row schema, one row per SPDI, deterministic order and no score or label fields.
  - id: FC-14
    rule: External publication is create-only, race-safe, symlink/reparse-safe, outside Git and manifest-last.
  - id: FC-15
    rule: The committed summary is a strict aggregate-only whitelist bound to the output manifest and artifact hashes.
  - id: FC-16
    rule: No output authorizes classification, evidence strength, $PS3$/$BS3$, Atlas promotion, threshold selection or calibration.

failure_cases:
  - any input hash, self-hash, schema, count or provenance drift
  - any duplicate cohort identity, vcf_key or functional source-row key
  - any VUS/holdout identity intersection
  - any priority queue/reproduced-set mismatch, total drift or policy/config pin drift
  - any labeled holdout artifact access
  - any unresolved Atlas identity used as a join key
  - any score or classification field entering coverage logic or output
  - any expected aggregate drift
  - any overwrite, in-repository output or unsafe path component

follow_on:
  - reproduce cliPE, VAMP-seq and SGE score transformations without using the prospective holdout
  - freeze assay-specific calibration and evaluation partitions
  - evaluate assay-specific $PS3$/$BS3$ only in a separately approved policy slice
