coverage_row_contract:
  schema: raptor.external.tsc2_functional_coverage_row.v1
  exact_fields:
    - schema
    - spdi
    - source_ids
    - observation_count
    - vus_2026_07
    - priority_stratum
    - prospective_holdout_2026_08
    - atlas_contrast_candidate
    - atlas_anchor_r611q
    - leakage_markers
  source_order: [mavedb_clipe, igvf_vamp_seq, igvf_sge]
  priority_stratum_values: [candidate_LP_review, candidate_LB_review, null]
  leakage_marker_order: [PROSPECTIVE_HOLDOUT, ATLAS_CONTEXT]
  invariants:
    - exactly one row per verified functional SPDI
    - rows sorted lexicographically by SPDI
    - source_ids are unique and follow source_order
    - observation_count equals len(source_ids)
    - priority_stratum is non-null only when vus_2026_07 is true
    - PROSPECTIVE_HOLDOUT is present iff prospective_holdout_2026_08 is true
    - ATLAS_CONTEXT is present iff atlas_contrast_candidate or atlas_anchor_r611q is true
    - no score, functional class, label, ACMG criterion or evidence strength is present

join_rules:
  - exact SPDI equality only; no trim, left-shift, liftover or accession substitution
  - VUS and holdout manifests must each contain unique variant_id and vcf_key values
  - the priority subset must be reproduced from all 6,618 VUS rows before overlap
  - VUS and prospective holdout identity sets must be disjoint
  - Atlas unresolved identities are counted but never joined
  - the Atlas anchor is separate from the contrast-candidate identity map
  - source overlap is membership coverage only, never functional agreement

output:
  external_bundle:
    environment_variable: RAPTOR_TSC2_FUNCTIONAL_COVERAGE_ROOT
    default_root: ~/raptor-data/external/tsc2-functional-coverage
    run_name: tsc2-functional-coverage-map-2026-09-14
    bundle_id: tsc2-functional-coverage-map-2026-09-14
    manifest_schema: raptor.external.tsc2_functional_coverage_bundle.v1
    artifacts:
      coverage:
        artifact_id: tsc2-functional-coverage-jsonl
        relative_path: coverage/functional_identity_coverage.jsonl
        row_count: 9552
    create_only: true
    symlink_and_reparse_safe: true
    manifest_last: true
  committed_summary:
    path: data/census/tsc2_functional_coverage_map_2026-09-14.json
    schema: raptor.external.tsc2_functional_coverage_summary.v1
    contains:
      - exact input hashes and self-hashes
      - source and unique functional identity counts
      - cohort sizes and gene counts
      - aggregate exact-SPDI coverage by cohort and source
      - aggregate source-membership patterns
      - aggregate cross-cohort intersections
      - aggregate leakage-marker counts
      - Atlas resolved/unresolved and anchor boundary counts
      - output artifact and manifest hashes
    excludes:
      - SPDI, HGVS, VCF key or raw-record identity
      - raw scores or functional classes
      - benchmark or holdout labels
      - BIAS rationale or classification fields
      - Atlas observation, claim, source-span or classification metadata

