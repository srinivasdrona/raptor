schema: raptor.project.spec.v1
spec_id: raptor-v2-functional-coverage-map-v1
spec_version: 1.0.0
status: APPROVED_BUILD
created_at: '2026-09-14'
owner: human-terminal-authority
branch: feature/raptor-v2-functional-coverage-map-v1
stacked_on:
  branch: feature/raptor-v2-functional-identity-promotion-v1
  commit: 1c33c34ec9792d76452b4cfc68597ed7cf2864b6

objective: >-
  Build an immutable, label-blind $TSC2$ functional identity coverage map.
  Join the 9,552 verified $\text{GRCh38}$ SPDI identities from the frozen
  functional-promotion bundle to the frozen 6,618-row VUS universe, its
  164-row internal priority subset, the 2,608-row protected prospective
  holdout, the 35-row Atlas contrast-candidate identity map and the $R611Q$
  Atlas anchor. Publish row-level membership only to an external create-only
  bundle and commit only aggregate counts, hashes and leakage markers.

non_goals:
  - score transformation, normalization, thresholding or calibration
  - reading benchmark or holdout labels
  - using raw functional scores or functional classes
  - assigning clinical status, evidence strength or $PS3$/$BS3$
  - treating VUS priority membership as a classification
  - treating Atlas selection metadata or claims as mechanism evidence
  - resolving any of the 10 unresolved Atlas candidate identities
  - mutating any prior external bundle, VUS run, holdout run or Atlas artifact
  - network access

workflow:
  planner: GPT-5.6-Sol
  red_tests: GPT-5.3-Codex
  builder: Claude-Sonnet-5
  checker: GPT-5.6-Terra-xhigh
  integrator: GPT-5.6-Sol
  terminal_authority: human-owner

identity_contract:
  assembly: GRCh38
  tsc1_accession: NC_000009.12
  tsc2_accession: NC_000016.10
  join_key: exact canonical SPDI string
  normalization_or_liftover: forbidden
  fuzzy_or_protein_only_join: forbidden
  duplicate_rule: >-
    Each cohort identity is unique. Functional observations may repeat an
    SPDI only across distinct source IDs; each output coverage row represents
    one unique SPDI and records the exact sorted source membership.

