# RAPTOR Atlas Phase-2 contrast-panel SELECTOR -- binding planner design/
# implementation spec.
#
# Planner: this document. Test author: Gemini (RED tests). Doer: Claude Sonnet
# (GREEN skeleton). Checker: GPT-5.4. Loop order is fixed:
# PLAN -> Gemini RED -> Sonnet GREEN -> GPT-5.4 checker -> real external run.
#
# This file is the PLAN. It contains NO code, NO tests, NO candidate identity,
# NO candidate count, NO functional result, and it performs NO selection.
#
# Authority order for BEHAVIOUR:
#   1. docs/project/atlas/ATLAS_PHASE2_PANEL_SELECTION_PROTOCOL.md  (v1.0.3)
#   2. docs/project/atlas/atlas-phase2-panel-selection-registration-v1.yaml
#   3. configs/atlas/panels/tsc2/atlas-phase2-candidate-universe-lock-v2.yaml
#   4. docs/DECISIONS.md (ADR-0014/0015/0016), docs/project/specs/
#      mechanism-atlas-starter.yaml, tests/atlas/
# This spec is subordinate to all of them. Where this spec and the protocol
# appear to differ, the protocol governs and this spec is defective. Existing
# code is NOT behaviour authority.

