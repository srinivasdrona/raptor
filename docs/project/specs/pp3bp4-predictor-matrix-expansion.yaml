# ---------------------------------------------------------------------------
# 1. Goal and bounded scope
# ---------------------------------------------------------------------------
goal: >-
  Represent the complete, source-verified set of 16 calibrated missense tools (plus the required
  bias_composite audit row) as a bounded, machine-readable and human-reviewable PP3/BP4 decision
  matrix in a NEW standalone artifact, WITHOUT touching the existing REVEL shadow policy or its
  bound provenance/leakage artifacts.
bounded_scope:
  is:
    - "16-tool decision support (16 calibrated rows + 1 bias_composite audit row); the 16-tool identity set is the completeness invariant."
    - "First technical unit on the Tier-1/2 VUS critical path; unblocks sources-pin-core-annotation-bundle."
  is_not:
    - "Not 16 integrations, not voting/ranking/consensus/fallback/per-variant selection."
    - "Not any change to the REVEL policy, its source register, or the active leakage registry."
    - "Not activation, owner approval, terminal rerun, VUS census, MAVE tuning, or clinical output."
  invariants:
    - "REVEL remains the sole advance_shadow candidate; policy stays proposed/shadow-only/unapproved."
    - "No fabricated interval/version/license/availability/training fact; use the fact-object status vocabulary."
    - "Matrix training_manifest_status is metadata only and never becomes a leakage-audit input."
    - "GERP++/PhyloP keep an explicit conservation_context role and are never independent votes."

# ---------------------------------------------------------------------------
# 2. Canonical architecture (rev-1 correction, preserved)
# ---------------------------------------------------------------------------
architecture:
  canonical_machine_matrix:
    path: configs/eval/pp3bp4_predictor_matrix.yaml           # NEW file (created by Sonnet)
    schema: pp3bp4-predictor-matrix/1
    role: sole machine source of truth for the comprehensive 16+BIAS decision matrix
  human_view:
    path: docs/reference/pp3bp4-candidate-matrix-2026-07.md
    role: "human rendering; candidate IDs and material dispositions must match the canonical machine matrix"
  recommendation_memo:
    path: docs/reference/pp3-bp4-predictor-policy-recommendation-2026-07.md
    role: "link-only update recording the comprehensive matrix exists and advances no new predictor"
  preserved_byte_identical:                                   # tested by hash; never edited
    - { path: configs/eval/pp3bp4_source_register.yaml,       sha256: 2e9c1f215f24bf6ea6fffa697737f84092e6c5fce02db5e74c91e479f0b36932, reason: "existing REVEL shadow-policy provenance register" }
    - { path: configs/eval/predictor_training_manifests.yaml, sha256: 64208cd23081d5c99db332709b5de6b3603ac7e11d7bcc203ca7f74f952f229c, reason: "active leakage-audit registry; matrix training status must not become a leakage input" }
    - { path: configs/eval/pp3bp4_candidate_policy.json,      sha256: 6bba6b906c7bf1296450c8f1df4addda052f5d3ee90f45879a062d02980428b2, reason: "existing proposed REVEL policy remains semantically and byte identical" }
  primary_implementation_reference_files:                     # committed repo files only
    - configs/eval/pp3bp4_predictor_matrix.yaml
    - docs/reference/pp3bp4-candidate-matrix-2026-07.md
    - docs/reference/pp3-bp4-predictor-policy-recommendation-2026-07.md
  reference_note: "Primary/official sources are embedded in the top-level source_map; no session-state file is an implementation input."

# ---------------------------------------------------------------------------
# 2b. Self-contained source map (R3-F1) -- direct citations/loci; every source_id resolves here
# ---------------------------------------------------------------------------
source_map:
  pejaver_2022:
    citation: "Pejaver V, Byrne AB, Feng BJ, et al. Calibration of computational tools for missense variant pathogenicity classification and ClinGen recommendations for PP3/BP4 criteria. AJHG 2022;109:2163-2177."
    doi: "10.1016/j.ajhg.2022.10.013"
    pmid: "36413997"
    pmc: "PMC9748256"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC9748256/"
    loci:
      methods: "13-tool calibrated set; higher-is-pathogenic direction transforms for FATHMM and SIFT; dbNSFP score acquisition; training-overlap exclusions; REVEL/BayesDel named as meta-predictors."
      table_2: "Calibrated PP3/BP4 score intervals; the REVEL row is the only fully-verified multi-level interval set."
      supplement: "Supplementary materials: exact independently-generated tool versions; the calibrated PhyloP column; the evaluated PrimateAI release; and the dbNSFP release/columns used for dbNSFP-obtained tools (resolves CP-9/CP-14/CP-15/CP-23)."
  bergquist_2025:
    citation: "Bergquist T, Pejaver V, et al. Calibration of additional computational tools expands ClinGen recommendation options for variant classification with PP3/BP4 criteria. Genetics in Medicine 2025."
    doi: "10.1016/j.gim.2025.101402"
    pmid: "40084623"
    preprint_doi: "10.1101/2024.09.17.611902"
    pmc: "confirm_pending (CP-8)"
    url: "https://www.biorxiv.org/content/10.1101/2024.09.17.611902v1"
    loci:
      table_1: "AlphaMissense, ESM1b, VARITY_R calibration conclusions; exact numeric intervals remain confirm_pending until Table 1 is read directly (CP-5/CP-6/CP-7)."
      methods_data_availability: "Methods and Data Availability: exact evaluated releases for AlphaMissense (CP-10), ESM1b (CP-22), and VARITY_R (CP-11)."
  stenton_2024:
    citation: "Stenton SL, Pejaver V, Harrison SM, et al. Assessment of the evidence yield for the calibrated PP3/BP4 computational recommendations. Genetics in Medicine 2024."
    pmid: "39030733"
    pmc: "PMC11560577"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11560577/"
    loci:
      box_1: "One preselected predictor, no cherry-picking, established thresholds; combined PP3+PM1 capped at Strong."
  richards_2015:
    citation: "Richards S, Aziz N, Bale S, et al. Standards and guidelines for the interpretation of sequence variants (ACMG/AMP). Genetics in Medicine 2015."
    doi: "10.1038/gim.2015.30"
    pmid: "25741868"
    pmc: "PMC4544753"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC4544753/"
    loci:
      pp3_bp4: "PP3/BP4 computational-evidence criteria; correlated-tool (apply once per variant) rule."
  tavtigian_2018:
    citation: "Tavtigian SV, et al. Modeling the ACMG/AMP variant classification guidelines as a Bayesian classification framework. Genetics in Medicine 2018."
    doi: "10.1038/gim.2017.210"
    url: "https://doi.org/10.1038/gim.2017.210"
    loci:
      model: "Bayesian evidence-strength ladder (supporting/moderate/strong/very-strong)."
  dbnsfp_v4:
    citation: "Liu X, Li C, Mou C, Dong Y, Tu Y. dbNSFP v4. Genome Medicine 2020;12:103."
    url: "https://sites.google.com/site/jpopgen/dbNSFP"
    loci:
      distribution_metadata: "Official dbNSFP distribution page (https://sites.google.com/site/jpopgen/dbNSFP): per-release download/file listing, the release column/field inventory (README/'column description'), and the academic-vs-commercial licence-separated branches. Used only to locate candidate score fields, their availability, and licence terms; it does not pin a release. The exact RAPTOR release remains confirm_pending (CP-21)."
    role: "Distribution/availability reference only (not a calibration source). The exact RAPTOR-pinned release/column/licence branch remain confirm_pending: current_release_pin (CP-21), availability (CP-12/CP-13), licences (CP-16..CP-19)."
  resolution_rule: >-
    Every candidate basis, component/dependence claim, calibration conclusion, and confirm_pending
    item resolves to one of these source_map IDs + locus, or to the official URL above. The matrix
    file's own source_map mirrors these entries with the same DOI/PMID/PMC/URL/locus.

