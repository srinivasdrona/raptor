# ---------------------------------------------------------------------------
# 5. Disposition + evidence-role classification (F4 preserved)
# ---------------------------------------------------------------------------
classification:
  disposition_vocabulary: [advance_shadow, eligible_primary_candidate, shadow_comparator, research_watchlist, separate_consequence_policy, functional_evidence_not_pp3bp4, full_classifier_exclusion, audit_only_reject_authoritative, blocked_pending_source]
  evidence_role_vocabulary: [calibrated_missense, conservation_context, audit_only]
  conservation_context_members: [gerp_plus_plus, phylop]
  conservation_context_rule: "A distinct policy role within the calibrated set, not an extra PP3/BP4 vote and not a splice policy."
  non_missense_tiers_no_rows:
    separate_splice_policy: "Splice predictors are a separate consequence policy (handoff: sources-add-splice-track); no missense rows/votes here."
    functional_evidence_not_pp3bp4: "MAVE/functional assays are orthogonal (PS3/BS3 family), never a predictor label."
    full_classifier_exclusions: "Full end-to-end classifiers are excluded from the PP3/BP4 comparison; populate only from sourced facts, else not_applicable."
  per_candidate:              # disposition + evidence_role; basis = published calibration conclusions in source_map pejaver_2022 (Table 2) / bergquist_2025 (Table 1), NOT held-out
    revel:                { disposition: advance_shadow,             evidence_role: calibrated_missense,  basis: "PP3 Strong + BP4 Moderate; existing sole shadow candidate" }
    bayesdel_noaf:        { disposition: eligible_primary_candidate, evidence_role: calibrated_missense,  basis: "PP3 Strong + BP4 Moderate; meta-predictor; component overlap" }
    mutpred2:             { disposition: eligible_primary_candidate, evidence_role: calibrated_missense,  basis: "PP3 Strong + BP4 Moderate; separately generated" }
    vest4:                { disposition: eligible_primary_candidate, evidence_role: calibrated_missense,  basis: "PP3 Strong + BP4 Moderate" }
    alphamissense:        { disposition: eligible_primary_candidate, evidence_role: calibrated_missense,  basis: "PP3 Strong + BP4 Moderate; release pin pending (CP-10)" }
    esm1b:                { disposition: eligible_primary_candidate, evidence_role: calibrated_missense,  basis: "PP3 Strong + BP4 Moderate (PP3 may cap); direction lower; pins CP-6/CP-12" }
    varity_r:             { disposition: eligible_primary_candidate, evidence_role: calibrated_missense,  basis: "PP3 Strong + BP4 Strong; pins CP-7/CP-11/CP-13" }
    cadd:                 { disposition: shadow_comparator,          evidence_role: calibrated_missense,  basis: "Did not meet both preferred maxima; many embedded features" }
    evolutionary_action:  { disposition: shadow_comparator,          evidence_role: calibrated_missense,  basis: "Did not meet both preferred maxima; separate generation route" }
    fathmm:               { disposition: shadow_comparator,          evidence_role: calibrated_missense,  basis: "Did not meet both maxima; REVEL/BayesDel component; native lower pre-transform" }
    gerp_plus_plus:       { disposition: shadow_comparator,          evidence_role: conservation_context, basis: "Conservation; feature overlap with meta-predictors" }
    mpc:                  { disposition: shadow_comparator,          evidence_role: calibrated_missense,  basis: "Constraint/population dependence; BayesDel component" }
    phylop:               { disposition: shadow_comparator,          evidence_role: conservation_context, basis: "Conservation; exact calibrated dbNSFP column pending (CP-14)" }
    polyphen2_humvar:     { disposition: shadow_comparator,          evidence_role: calibrated_missense,  basis: "Did not meet both maxima; REVEL/BayesDel component" }
    primateai_original:   { disposition: shadow_comparator,          evidence_role: calibrated_missense,  basis: "Did not meet both maxima; evaluated release needs confirmation (CP-15)" }
    sift:                 { disposition: shadow_comparator,          evidence_role: calibrated_missense,  basis: "Did not meet both maxima; REVEL/BayesDel component; native lower pre-transform" }
    bias_composite:       { disposition: audit_only_reject_authoritative, evidence_role: audit_only,      basis: "No external end-to-end calibration; audit reconstruction only" }
  binding_rule: "Dispositions/roles are decision-matrix labels, not runtime routes; only revel is advance_shadow; no voting/fallback/ranking/per-variant selection."

# ---------------------------------------------------------------------------
# 6. Fact-status discipline + machine fact-object schema (R2-F2)
# ---------------------------------------------------------------------------
fact_status:
  enum: [verified, confirm_pending, unavailable, not_applicable]
  fact_object:
    applies_to: [calibrated_score_intervals, explicit_indeterminate_interval, maximum_supported_pp3_strength, maximum_supported_bp4_strength, calibrated_version, current_release_pin_status, structured_score_availability, license_status, training_manifest_status, tsc_specific_evidence, implementation_cost]
    required_shape:
      status: "verified | confirm_pending | unavailable | not_applicable"
      value: "scalar | mapping | null"
      source_ids: ["string"]
      cp_ids: ["string"]
    validation:
      - "verified: non-null value, >=1 source_id, cp_ids empty."
      - "confirm_pending: value null or explicitly partial, >=1 cp_id, no fabricated resolved value."
      - "unavailable: value null, plus a source/note explaining the missing input."
      - "not_applicable: value null, plus a rationale source/note."
      - "every cp_id resolves to the matrix top-level confirm_pending_register."
    rule: "CP IDs are first-class machine data, never comment-only. No success-shaped default may substitute for a status."
  revel_verified_intervals:    # Pejaver Table 2, REVEL row -- the ONLY verified numeric intervals; MUST match the frozen policy
    pp3_supporting: "0.644 <= s < 0.773 (enabled)"
    pp3_moderate:   "0.773 <= s < 0.932 (enabled)"
    pp3_strong:     "s >= 0.932 (enabled)"
    indeterminate:  "0.290 < s < 0.644 (no criterion)"
    bp4_supporting: "0.183 < s <= 0.290 (enabled)"
    bp4_moderate:   "0.016 < s <= 0.183 (enabled)"
    bp4_strong:     "0.003 < s <= 0.016 (calibrated, DISABLED in the current policy)"
    bp4_very_strong: "s <= 0.003 (calibrated, DISABLED in the current policy)"
  verified_cross_facts:
    - "Native direction: higher-is-pathogenic for all EXCEPT fathmm & sift (lower, transformed for calibration) and esm1b (lower). [pejaver_2022 methods; bergquist_2025 table_1]"
    - "Score acquisition: Pejaver obtained dbNSFP precomputed scores EXCEPT bayesdel_noaf, cadd, evolutionary_action, mutpred2, polyphen2 (generated separately). [pejaver_2022 methods]"
    - "Bergquist calibrated alphamissense/esm1b to PP3 Strong + BP4 Moderate and varity_r to PP3 Strong + BP4 Strong; EVE attempted but excluded (sampling bias). [bergquist_2025 table_1]"
  component_dependence_map:    # verified in source_map pejaver_2022 (methods; meta-predictor feature discussion)
    revel: "SIFT, PolyPhen-2, FATHMM + others"
    bayesdel_noaf: "SIFT, PolyPhen-2, FATHMM-coding, MPC, conservation features"
    cadd: "conservation + protein-prediction features (PhyloP/GERP++/PolyPhen-derived)"
    rule: "REVEL and its components are not independent PP3/BP4 evidence; REVEL and BayesDel-noAF are not both applied as independent criteria; conservation/context tools are comparators, not votes."
  confirm_pending_register:    # binding; every fact-object cp_id must resolve here; also a matrix top-level field. Resolutions cite source_map IDs/loci or an official source.
    CP-1: "BayesDel-noAF intervals -> pejaver_2022 table_2"
    CP-2: "MutPred2 intervals -> pejaver_2022 table_2"
    CP-3: "VEST4 intervals -> pejaver_2022 table_2"
    CP-4: "Intervals/maxima for CADD, EA, FATHMM, GERP++, MPC, PhyloP, PolyPhen-2 HumVar, PrimateAI, SIFT -> pejaver_2022 table_2"
    CP-5: "AlphaMissense intervals -> bergquist_2025 table_1"
    CP-6: "ESM1b intervals -> bergquist_2025 table_1"
    CP-7: "VARITY_R intervals -> bergquist_2025 table_1"
    CP-8: "Bergquist 2025 PMCID -> PubMed/PMC"
    CP-9: "Exact independently-generated tool versions Pejaver evaluated (BayesDel-noAF, CADD, EA, MutPred2, PolyPhen-2 HumVar) -> pejaver_2022 supplement"
    CP-10: "AlphaMissense release evaluated by Bergquist -> bergquist_2025 methods_data_availability"
    CP-11: "VARITY_R release evaluated by Bergquist -> bergquist_2025 methods_data_availability"
    CP-12: "ESM1b availability in the selected dbNSFP branch -> selected dbNSFP release README (dbnsfp_v4 distribution_metadata)"
    CP-13: "VARITY_R availability in the selected dbNSFP branch -> selected dbNSFP release README (dbnsfp_v4 distribution_metadata)"
    CP-14: "Exact PhyloP column calibrated by Pejaver -> pejaver_2022 supplement"
    CP-15: "Exact PrimateAI release evaluated by Pejaver -> pejaver_2022 supplement"
    CP-16: "Official MPC licence -> official MPC distribution source"
    CP-17: "Official GERP++ licence -> official GERP++ distribution source"
    CP-18: "Official PhyloP/PHAST licence -> official PHAST distribution source"
    CP-19: "Official Evolutionary Action licence -> official EA distribution source"
    CP-20: "Training overlap vs the TSC benchmark -- APPLIES ONLY to CADD, EA, MPC, PhyloP, GERP++, PrimateAI -> verified training manifests + leakage audit. No other candidate may carry CP-20."
    CP-21: "REVEL/dbNSFP release to pin for RAPTOR -- APPLIES ONLY to REVEL current_release_pin_status -> sources-pin-core-annotation-bundle. Must NOT ground any licence, implementation cost, non-REVEL acquisition, or any other candidate's release."
    CP-22: "Exact ESM1b evaluated release -> bergquist_2025 methods_data_availability (dedicated release CP; NOT the ESM1b interval CP-6)"
    CP-23: "Exact dbNSFP release/columns Pejaver evaluated for dbNSFP-obtained tools (REVEL, FATHMM, GERP++, MPC, SIFT, VEST4) -> pejaver_2022 supplement/methods"
    CP-24: "Official licence for candidates not covered by CP-16..CP-19 (REVEL, BayesDel-noAF, MutPred2, VEST4, AlphaMissense, ESM1b, VARITY_R, CADD, FATHMM, PolyPhen-2 HumVar, PrimateAI, SIFT) -> each tool's official distribution/terms; never upgraded to verified"
    CP-25: "Availability of dbNSFP-bundled candidate scores in the selected dbNSFP release/branch (bundled route) -> selected dbNSFP release README/column inventory (dbnsfp_v4 distribution_metadata)"
    CP-26: "Standalone MutPred2 score acquisition (separately generated; NOT dbNSFP-bundled) -> official MutPred2 distribution"
    CP-27: "Standalone Evolutionary Action score acquisition (separately generated; NOT dbNSFP-bundled) -> official Evolutionary Action distribution"
    CP-28: "Annotation-bundle RAPTOR release pin for NON-REVEL calibrated candidates -> sources-pin-core-annotation-bundle (distinct from CP-21)"

# ---------------------------------------------------------------------------
# 6b. Field-level CP + source_id semantics (R4) -- per-field allowlists
# ---------------------------------------------------------------------------
field_cp_semantics:
  source_id_rule: >-
    A fact object carries non-empty source_ids ONLY when a source_map entry's locus actually
    resolves the fact (intervals/maxima via pejaver_2022 table_2 or bergquist_2025 table_1;
    evaluated versions via pejaver_2022 supplement or bergquist_2025 methods_data_availability;
    dbNSFP-branch availability via dbnsfp_v4 distribution_metadata). For confirm_pending facts whose
    resolution is an official source not present in source_map (selected release README, official
    tool distribution/licence, or the annotation-bundle decision), source_ids MUST be empty and the
    named CP identifies the missing official source. Never attach a source_id whose locus cannot
    resolve the fact.
  fields:
    calibrated_score_intervals: &interval_rule
      revel: { status: verified, source_ids: [pejaver_2022] }
      bayesdel_noaf: { status: confirm_pending, cp: CP-1, source_ids: [pejaver_2022] }
      mutpred2: { status: confirm_pending, cp: CP-2, source_ids: [pejaver_2022] }
      vest4: { status: confirm_pending, cp: CP-3, source_ids: [pejaver_2022] }
      cadd_ea_fathmm_gerp_mpc_phylop_polyphen2_primateai_sift: { status: confirm_pending, cp: CP-4, source_ids: [pejaver_2022] }
      alphamissense: { status: confirm_pending, cp: CP-5, source_ids: [bergquist_2025] }
      esm1b: { status: confirm_pending, cp: CP-6, source_ids: [bergquist_2025] }
      varity_r: { status: confirm_pending, cp: CP-7, source_ids: [bergquist_2025] }
      bias_composite: { status: not_applicable, note: "no external calibration" }
    explicit_indeterminate_interval: *interval_rule
    maximum_supported_pp3_strength:
      revel: { status: verified, value: strong, source_ids: [pejaver_2022] }
      all_other_calibrated: { status: confirm_pending, cp: "same interval CP as the row (CP-1..CP-7)", source_ids: "[pejaver_2022] or [bergquist_2025]" }
      bias_composite: { status: not_applicable }
    maximum_supported_bp4_strength:
      revel: { status: verified, value: very_strong, source_ids: [pejaver_2022], note: "calibrated maximum is very_strong; current ENABLED maximum in the REVEL policy is moderate" }
      all_other_calibrated: { status: confirm_pending, cp: "same interval CP as the row (CP-1..CP-7)", source_ids: "[pejaver_2022] or [bergquist_2025]" }
      bias_composite: { status: not_applicable }
    calibrated_version:
      independently_generated__bayesdel_noaf_cadd_evolutionary_action_mutpred2_polyphen2_humvar: { status: confirm_pending, cp: CP-9, source_ids: [pejaver_2022] }
      dbnsfp_obtained__revel_fathmm_gerp_plus_plus_mpc_sift_vest4: { status: confirm_pending, cp: CP-23, source_ids: [pejaver_2022] }
      phylop: { status: confirm_pending, cp: CP-14, source_ids: [pejaver_2022] }
      primateai_original: { status: confirm_pending, cp: CP-15, source_ids: [pejaver_2022] }
      alphamissense: { status: confirm_pending, cp: CP-10, source_ids: [bergquist_2025] }
      esm1b: { status: confirm_pending, cp: CP-22, source_ids: [bergquist_2025] }
      varity_r: { status: confirm_pending, cp: CP-11, source_ids: [bergquist_2025] }
      bias_composite: { status: not_applicable, note: "internal audit reconstruction; not an externally versioned predictor" }
    current_release_pin_status:
      revel: { status: confirm_pending, cp: CP-21, source_ids: [] }
      all_other_calibrated: { status: confirm_pending, cp: CP-28, source_ids: [] }
      bias_composite: { status: not_applicable }
    structured_score_availability:
      dbnsfp_bundled__revel_bayesdel_noaf_cadd_fathmm_gerp_plus_plus_mpc_phylop_polyphen2_humvar_primateai_original_sift_vest4_alphamissense: { status: confirm_pending, cp: CP-25, source_ids: [dbnsfp_v4] }
      esm1b: { status: confirm_pending, cp: CP-12, source_ids: [dbnsfp_v4] }
      varity_r: { status: confirm_pending, cp: CP-13, source_ids: [dbnsfp_v4] }
      standalone__mutpred2: { status: confirm_pending, cp: CP-26, source_ids: [] }
      standalone__evolutionary_action: { status: confirm_pending, cp: CP-27, source_ids: [] }
      bias_composite: { status: not_applicable, note: "reconstructed_only" }
    license_status:
      mpc: { status: confirm_pending, cp: CP-16, source_ids: [] }
      gerp_plus_plus: { status: confirm_pending, cp: CP-17, source_ids: [] }
      phylop: { status: confirm_pending, cp: CP-18, source_ids: [] }
      evolutionary_action: { status: confirm_pending, cp: CP-19, source_ids: [] }
      all_other_calibrated: { status: confirm_pending, cp: CP-24, source_ids: [] }
      bias_composite: { status: not_applicable, note: "audit-only; not a distributed PP3/BP4 predictor" }
      rule: "No licence field is ever status: verified."
    training_manifest_status:
      cp20_set__cadd_evolutionary_action_mpc_phylop_gerp_plus_plus_primateai_original: { status: unavailable, cp: CP-20, source_ids: [], note: "manifest not obtained; overlap-vs-TSC pending (CP-20); metadata only, not a leakage input" }
      all_other_calibrated: { status: unavailable, cp: none, source_ids: [], note: "manifest not obtained; NOT in the CP-20 overlap set; metadata only, not a leakage input" }
      bias_composite: { status: unavailable, cp: none, source_ids: [], note: "inherits unknown constituent provenance; audit-only" }
    tsc_specific_evidence:
      all_calibrated: { status: unavailable, source_ids: [], cp_ids: [], note: "none identified for TSC1/TSC2; not assessed at matrix stage" }
      bias_composite: { status: not_applicable, note: "audit-only reconstruction" }
      rule: "Calibrated rows use unavailable/none-identified, NEVER not_applicable. Reserve not_applicable for bias_composite."
    implementation_cost:
      all_rows: { status: unavailable, source_ids: [], cp_ids: [], note: "not assessed; out of scope for this bounded decision matrix" }
      rule: "No CP and no source; implementation_cost is out of scope for this matrix."

# ---------------------------------------------------------------------------
# 7. Canonical matrix schema + fact-object examples (pp3bp4-predictor-matrix/1)
# ---------------------------------------------------------------------------
matrix_schema:
  top_level: [schema, version, source_map, confirm_pending_register, candidates, audit_rows, smallest_pin_handoff]
  source_map_rule: "The matrix file carries its own source_map mirroring this spec's top-level source_map (citation + DOI/PMID/PMC/URL + locus per source). Every source_id used by any record or fact-object resolves there. No coupling to configs/eval/pp3bp4_source_register.yaml."
  confirm_pending_register_rule: "Top-level mapping of CP-id -> resolution; every fact-object cp_id must be a key here."
  identity_and_routing_fields: [candidate_id, display_name, tool_kind, evidence_role, calibration_source_id, calibration_locus, score_direction, transcript_and_consequence_scope, component_or_feature_overlap, structured_score_source, license_source, disposition, rationale_source_ids]
  fact_object_fields: [calibrated_score_intervals, explicit_indeterminate_interval, maximum_supported_pp3_strength, maximum_supported_bp4_strength, calibrated_version, current_release_pin_status, structured_score_availability, license_status, training_manifest_status, tsc_specific_evidence, implementation_cost]
  example_verified_revel:
    revel:
      candidate_id: revel
      tool_kind: meta_predictor
      evidence_role: calibrated_missense
      disposition: advance_shadow
      calibration_source_id: pejaver_2022
      score_direction: higher_more_pathogenic
      calibrated_score_intervals:
        status: verified
        value: { pp3_supporting: "0.644<=s<0.773", pp3_moderate: "0.773<=s<0.932", pp3_strong: "s>=0.932", bp4_supporting: "0.183<s<=0.290", bp4_moderate: "0.016<s<=0.183" }
        source_ids: [pejaver_2022]
        cp_ids: []
      maximum_supported_pp3_strength: { status: verified, value: strong, source_ids: [pejaver_2022], cp_ids: [] }
      maximum_supported_bp4_strength: { status: verified, value: very_strong, source_ids: [pejaver_2022], cp_ids: [], note: "calibrated maximum is very_strong; current ENABLED maximum in the REVEL policy is moderate" }
  example_confirm_pending_gerp:
    gerp_plus_plus:
      candidate_id: gerp_plus_plus
      display_name: "GERP++"
      tool_kind: conservation
      evidence_role: conservation_context
      calibration_source_id: pejaver_2022
      calibration_locus: "Table 2"
      score_direction: higher_more_pathogenic
      transcript_and_consequence_scope: missense_variant
      component_or_feature_overlap: "embedded in CADD and other meta-predictors"
      structured_score_source: dbnsfp_v4
      license_source: official_gerp_distribution
      disposition: shadow_comparator
      rationale_source_ids: [pejaver_2022]
      calibrated_score_intervals:      { status: confirm_pending, value: null, source_ids: [pejaver_2022], cp_ids: [CP-4] }
      explicit_indeterminate_interval: { status: confirm_pending, value: null, source_ids: [pejaver_2022], cp_ids: [CP-4] }
      maximum_supported_pp3_strength:  { status: confirm_pending, value: null, source_ids: [pejaver_2022], cp_ids: [CP-4] }
      maximum_supported_bp4_strength:  { status: confirm_pending, value: null, source_ids: [pejaver_2022], cp_ids: [CP-4] }
      calibrated_version:              { status: confirm_pending, value: null, source_ids: [pejaver_2022], cp_ids: [CP-23] }
      current_release_pin_status:      { status: confirm_pending, value: null, source_ids: [],            cp_ids: [CP-28] }
      structured_score_availability:   { status: confirm_pending, value: null, source_ids: [dbnsfp_v4],   cp_ids: [CP-25] }
      license_status:                  { status: confirm_pending, value: null, source_ids: [],            cp_ids: [CP-17] }
      training_manifest_status:        { status: unavailable,     value: null, source_ids: [],            cp_ids: [CP-20], note: "manifest not obtained; overlap-vs-TSC pending (CP-20); metadata only, not a leakage input" }
      tsc_specific_evidence:           { status: unavailable,     value: null, source_ids: [],            cp_ids: [], note: "none identified for TSC1/TSC2; not assessed at matrix stage" }
      implementation_cost:             { status: unavailable,     value: null, source_ids: [],            cp_ids: [], note: "not assessed; out of scope for this bounded decision matrix" }
  notes:
    - "Only REVEL carries status: verified interval + maxima objects (bp4 very_strong calibrated, note enabled=moderate); every other candidate's interval/maxima fields are confirm_pending with a resolving cp_id."
    - "tool_kind is pinned by candidate_identity.tool_kind_map; per-field CP/source use field_cp_semantics (CP-20 only for the six overlap tools; CP-21 only for REVEL's pin; licences via CP-16..19/CP-24; implementation_cost and calibrated-row tsc_specific_evidence are unavailable with a note, never CP-21 or not_applicable)."
    - "fathmm/sift record native lower + a pejaver_transform note; esm1b is lower."

# ---------------------------------------------------------------------------
# 8. File-by-file change contract (Sonnet) + documentation cleanup (R2-F3)
# ---------------------------------------------------------------------------
file_change_contract:
  - path: configs/eval/pp3bp4_predictor_matrix.yaml
    action: create
    owner: sonnet
    change: "New canonical machine matrix per matrix_schema: source_map, top-level confirm_pending_register, 16 calibrated records + bias_composite audit row (fact objects for all fact_object_fields), disposition + evidence_role, smallest_pin_handoff."
  - path: docs/reference/pp3bp4-candidate-matrix-2026-07.md
    action: expand
    owner: sonnet
    change: >-
      Render the 16+BIAS rows for human review; candidate IDs and material dispositions must match the
      canonical machine matrix. Replace the 'Backing config' row value 'configs/eval/pp3bp4_source_register.yaml'
      with 'configs/eval/pp3bp4_predictor_matrix.yaml', and state that pp3bp4_source_register.yaml remains
      only the existing REVEL policy provenance register (not the matrix backing). Preserve the
      PROPOSED/UNAPPROVED/SHADOW-ONLY header and the 'held-out acknowledged, not used' language.
  - path: docs/reference/pp3-bp4-predictor-policy-recommendation-2026-07.md
    action: link_only
    owner: sonnet
    change: >-
      In the relation table, add/identify pp3bp4_predictor_matrix.yaml as the comprehensive decision matrix
      and relabel pp3bp4_source_register.yaml as REVEL policy provenance. Note the matrix advances no new
      predictor; REVEL stays the sole shadow candidate. No new selection/interval/activation.
documentation_cleanup:
  - "Markdown Backing config -> configs/eval/pp3bp4_predictor_matrix.yaml."
  - "Markdown states configs/eval/pp3bp4_source_register.yaml is REVEL policy provenance only."
  - "Memo relation table: pp3bp4_predictor_matrix.yaml = comprehensive decision matrix; pp3bp4_source_register.yaml = REVEL policy provenance."

# ---------------------------------------------------------------------------
# 9. Gemini RED test contract (isolated; author FIRST)
# ---------------------------------------------------------------------------
gemini_tests:
  may_create: [tests/eval/test_pp3bp4_matrix_expansion.py]
  must_not_modify: [tests/eval/test_pp3bp4_candidate_policy.py, tests/eval/test_predictor_leakage_audit.py]
  required_assertions:
    - T1: "Canonical machine matrix contains exactly the 16 candidate IDs plus bias_composite."
    - T2: "Aliases PrimateAI-3D, generic VARITY/VARITY_ER, and BayesDel-addAF are rejected."
    - T3: "Every record uses the closed identity/routing + fact_object field set; unknown fields fail."
    - T4: "Every source ID (records + fact objects) resolves within the matrix source_map, and each source_map entry carries a citation plus at least one of DOI/PMID/PMC/URL and a locus (the matrix is self-contained; no session-state file is referenced)."
    - T5: "Only REVEL has status: verified interval fact objects; all other candidates' interval fields are confirm_pending."
    - T6: "Markdown candidate IDs and material dispositions match the canonical machine matrix."
    - T7: "Exactly one candidate has disposition advance_shadow and it is REVEL."
    - T8: "GERP++ and PhyloP carry evidence_role conservation_context and cannot be treated as independent votes."
    - T9: "Matrix training_manifest_status is a metadata fact object; it does not alter predictor_training_manifests.yaml or leakage-audit inputs."
    - T10: "The three preserved artifacts match their base SHA-256 values byte-for-byte (2e9c1f21..., 64208cd2..., 6bba6b90...)."
    - T11: "No scorer, gate, packet, terminal, census, or production-policy wiring is added."
    - T12: "Every fact object obeys fact_status.fact_object.validation (status/value/source_ids/cp_ids), and every cp_id resolves to the top-level confirm_pending_register; no CP id is comment-only."
    - T13: "Markdown Backing config names pp3bp4_predictor_matrix.yaml (not the source register); the memo relation table labels the matrix and the REVEL provenance register distinctly."
    - T14: "Every candidate's tool_kind equals candidate_identity.tool_kind_map exactly in the machine matrix; BayesDel-noAF is meta_predictor."
    - T15: "Markdown/machine parity for every row: candidate_id, display_name, tool_kind, evidence_role, calibration source, and disposition match the canonical machine matrix."
    - T16: "training_manifest_status carries CP-20 ONLY for cadd, evolutionary_action, mpc, phylop, gerp_plus_plus, primateai_original; no other candidate carries CP-20, and each such row uses an honest note with empty source_ids."
    - T17: "Field-CP allowlist (field_cp_semantics): each fact-object field's cp_ids are drawn only from the allowed set for that field/candidate; CP-21 appears only on REVEL current_release_pin_status; interval CPs (CP-1..CP-7) never appear on version/release/licence/availability/pin fields."
    - T18: "Bergquist release facts (alphamissense/esm1b/varity_r calibrated_version) use CP-10/CP-22/CP-11 with source_ids [bergquist_2025] (methods_data_availability locus); ESM1b evaluated release uses CP-22, never interval CP-6."
    - T19: "tsc_specific_evidence for every calibrated row is unavailable/none-identified (never not_applicable; not_applicable only for bias_composite); implementation_cost for every row is unavailable with no cp_ids and empty source_ids."
    - T20: "source_id_rule holds: source_ids are non-empty only when a source_map locus resolves the fact; licence, non-REVEL pin, and standalone-acquisition confirm_pending facts have empty source_ids with a naming CP."

# ---------------------------------------------------------------------------
# 10. Sonnet boundary
# ---------------------------------------------------------------------------
sonnet_boundary:
  may_modify: [configs/eval/pp3bp4_predictor_matrix.yaml, docs/reference/pp3bp4-candidate-matrix-2026-07.md, docs/reference/pp3-bp4-predictor-policy-recommendation-2026-07.md]
  must_not_modify: [configs/eval/pp3bp4_source_register.yaml, configs/eval/predictor_training_manifests.yaml, configs/eval/pp3bp4_candidate_policy.json, src/raptor/, data/census/, tests/]
  prohibited_actions:
    - "Change any REVEL policy field, its bound register, or the active leakage registry (all byte-identical)."
    - "Select/rank a predictor via held-out/VUS/MAVE outputs or voting; add fallback/consensus/per-variant choice."
    - "Assert a version/license/interval/training/availability fact without a primary/official source."
    - "Add scorer/gate/packet/terminal/census/production-policy wiring; integrate or download any predictor."
  commit_scope: "The single Sonnet commit changes exactly its three files (see change_scope.sonnet_commit_diff)."

# ---------------------------------------------------------------------------
# 11. GPT-5.4 review probes
# ---------------------------------------------------------------------------
gpt54_review_probes:
  - "Overall implementation diff changes exactly the four declared files (1 Gemini test + 3 Sonnet files); the Gemini commit is its test only; the Sonnet commit is its three files only; no assertion says the overall diff is only three files."
  - "The three preserved artifacts are byte-identical to their base SHAs; the plan contains no source_register_sha256 update, register-deferred branch, hash-equivalence step, or matrix-wide predictor_training_manifests.yaml expansion."
  - "configs/eval/pp3bp4_predictor_matrix.yaml is the sole canonical matrix; Markdown IDs/dispositions mirror it."
  - "Every fact object validates (status/value/source_ids/cp_ids); every cp_id resolves to the top-level confirm_pending_register; no CP id is comment-only."
  - "Markdown Backing config and the memo relation table name pp3bp4_predictor_matrix.yaml as the matrix and pp3bp4_source_register.yaml as REVEL provenance only."
  - "Exactly 16 calibrated IDs + bias_composite; aliases absent; only REVEL has advance_shadow; GERP++/PhyloP are conservation_context; no non-REVEL verified intervals."
  - "Protected tests test_pp3bp4_candidate_policy.py and test_predictor_leakage_audit.py are run and unmodified."
  - "The committed spec is self-contained: no implementation-time field (reference files, source_ids, candidate bases, component claims, cp resolutions) names a session-state brief/prompt/revision artifact; all facts resolve to the embedded source_map or an official URL. Session artifacts appear only under revision.planner_provenance_only."

# ---------------------------------------------------------------------------
# 12. Validation, sequence, ownership
# ---------------------------------------------------------------------------
validation_commands:
  setup: 'python -m pip install -e ".[dev]"'
  targeted:
    - "python -m pytest tests/eval/test_pp3bp4_matrix_expansion.py -q"
    - "python -m pytest tests/eval/test_pp3bp4_candidate_policy.py tests/eval/test_predictor_leakage_audit.py -q"
  preserved_hashes: 'python -c "import hashlib,pathlib;[print(p, hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()) for p in [''configs/eval/pp3bp4_source_register.yaml'',''configs/eval/predictor_training_manifests.yaml'',''configs/eval/pp3bp4_candidate_policy.json'']]"'
  scope_checks:
    - "Gemini commit changes only tests/eval/test_pp3bp4_matrix_expansion.py."
    - "Sonnet commit changes only its three files."
    - "Total implementation branch diff changes exactly the four declared files."
    - "Planner commit changes only docs/project/specs/pp3bp4-predictor-matrix-expansion.yaml."
implementation_sequence:
  - "1. Gemini authors tests/eval/test_pp3bp4_matrix_expansion.py (T1-T13); confirm RED on the base tree; this is the Gemini one-file commit."
  - "2. Sonnet creates configs/eval/pp3bp4_predictor_matrix.yaml, renders the Markdown view (with Backing-config migration), and updates the memo relation table; this is the Sonnet three-file commit."
  - "3. Run both validation command lines; T1-T13 GREEN; protected policy/leakage tests unmodified and GREEN; preserved hashes byte-identical."
  - "4. GPT-5.4 review against the probes; confirm the four-file overall diff and per-owner scopes."
ownership_boundaries:
  planner: "This YAML only; one follow-up commit; no amend; no push."
  gemini: "tests/eval/test_pp3bp4_matrix_expansion.py only (RED-first); runs but never edits the protected tests."
  sonnet: "The three may_modify files only; one implementation commit."
  gpt54: "Review only."

# ---------------------------------------------------------------------------
# 13. Blockers + smallest-pin handoff
# ---------------------------------------------------------------------------
blockers:
  - "Numeric intervals for all 15 non-REVEL candidates (CP-1..CP-7) require direct Pejaver Table 2 / Bergquist Table 1 inspection."
  - "Releases/licences/availability (CP-8..CP-19) require supplements and official/selected-release sources."
  - "Training overlap for CADD/EA/MPC/PhyloP/GERP++/PrimateAI (CP-20) requires verified manifests + leakage audit."
  - "The pinned REVEL/dbNSFP release (CP-21) is decided in sources-pin-core-annotation-bundle."
smallest_pin_handoff:
  next_task_id: sources-pin-core-annotation-bundle
  rule: "The next task pins ONE annotation bundle and only the fields needed to decide/operate the primary policy. No integration of all 16 tools."
  priority:
    - "Exact REVEL field/release required by the current shadow policy (CP-21)."
    - "Other eligible candidate fields already present in the same licensed bundle."
    - "Transcript/provenance/dependence columns."
  explicit_non_requirements: [mutpred2_integration, evolutionary_action_integration, all_16_score_acquisition]
  related_track: "Splice tier hands off to sources-add-splice-track."
  invariant: "The comprehensive matrix stays at 16 calibrated rows even when the pinned bundle implements a smaller score subset."

# ---------------------------------------------------------------------------
# 14. Acceptance (typed)
# ---------------------------------------------------------------------------
acceptance:
  mechanical:
    - "Overall implementation diff = exactly the 4 declared files; Gemini commit = 1 file; Sonnet commit = 3 files; planner commit = this spec only. No surviving three-file overall-diff claim."
    - "The three preserved artifacts equal their base SHAs."
    - "Matrix has exactly the 16 calibrated IDs + bias_composite; aliases absent; exactly one advance_shadow (revel)."
    - "GERP++/PhyloP evidence_role == conservation_context."
    - "Every fact object conforms to the schema and every cp_id resolves to the top-level confirm_pending_register (no comment-only CP ids); no non-REVEL candidate has verified intervals."
    - "Planner commit changes exactly one file, parent 72614a8, both required trailers (Copilot-Session 7c146921-...), no amend/push."
  evidence_form:
    - "Every asserted fact resolves to a source_map ID (pejaver_2022/bergquist_2025/stenton_2024/richards_2015/tavtigian_2018/dbnsfp_v4) with an exact locus, or an official URL; unresolved facts are confirm_pending with a resolving cp_id. No fact depends on a session-state brief/prompt file."
    - "Documentation source-of-truth is migrated to the canonical matrix; the source register is named REVEL policy provenance only."
    - "Protected policy/leakage tests are run explicitly and stay GREEN."
    - "16-row decision support, not 16 integrations; no voting/held-out/VUS/MAVE/activation/clinical output; REVEL policy semantics + bytes unchanged."
    - "Smallest realistically pinnable subset identified without narrowing the 16-row matrix."

# ---------------------------------------------------------------------------
# 15. Beat-4 self-audit
# ---------------------------------------------------------------------------
beat4_self_audit:
  - mode: "Scope claim conflates per-owner commits with the overall branch (omits Gemini's test) or keeps a three-file overall-diff assertion."
    guard: "change_scope defines overall 4 vs Gemini 1 vs Sonnet 3; probes/commands/acceptance distinguish them; no residual three-file claim."
  - mode: "CP ids remain comment-only, not mechanically validatable."
    guard: "fact_object schema + validation; tests T3/T12; every cp_id resolves to the top-level confirm_pending_register."
  - mode: "Docs still name the source register as the matrix backing."
    guard: "documentation_cleanup + test T13; Markdown Backing config -> matrix; memo relation-table relabel."
  - mode: "New matrix file added but policy/leakage coupling residue survives."
    guard: "preserved_byte_identical + T10; no hash-update/register-deferred/manifest-expansion language."
  - mode: "GERP++/PhyloP collapsed; or matrix drifts into an ensemble; or fabricated facts."
