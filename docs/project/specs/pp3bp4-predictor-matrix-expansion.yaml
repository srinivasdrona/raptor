# ---------------------------------------------------------------------------
# 1. Goal and bounded scope
# ---------------------------------------------------------------------------
goal: >-
  Represent the complete, source-verified set of 16 calibrated missense tools (plus the required
  bias_composite audit row) as a bounded, machine-readable and human-reviewable PP3/BP4 decision
  matrix in a NEW standalone artifact, WITHOUT touching the existing REVEL shadow policy or its
  bound provenance/leakage artifacts.
bounded_scope:
  is:
    - "16-tool decision support (16 calibrated rows + 1 bias_composite audit row); the 16-tool identity set is the completeness invariant."
    - "First technical unit on the Tier-1/2 VUS critical path; unblocks sources-pin-core-annotation-bundle."
  is_not:
    - "Not 16 integrations, not voting/ranking/consensus/fallback/per-variant selection."
    - "Not any change to the REVEL policy, its source register, or the active leakage registry."
    - "Not activation, owner approval, terminal rerun, VUS census, MAVE tuning, or clinical output."
  invariants:
    - "REVEL remains the sole advance_shadow candidate; policy stays proposed/shadow-only/unapproved."
    - "No fabricated interval/version/license/availability/training fact; use confirm_pending / unavailable / not_applicable."
    - "Matrix training_manifest_status is metadata only and never becomes a leakage-audit input."
    - "GERP++/PhyloP keep an explicit conservation_context role and are never independent votes."

# ---------------------------------------------------------------------------
# 2. Canonical architecture (Slot-3-rev1 correction)
# ---------------------------------------------------------------------------
architecture:
  canonical_machine_matrix:
    path: configs/eval/pp3bp4_predictor_matrix.yaml            # NEW file (created by Sonnet)
    schema: pp3bp4-predictor-matrix/1
    role: sole machine source of truth for the comprehensive 16+BIAS decision matrix
    contents: [source_map, sixteen_calibrated_records, bias_composite_audit_record, fact_statuses_and_confirm_pending_ids, component_dependence_metadata, disposition_and_evidence_role, smallest_pin_handoff]
  human_view:
    path: docs/reference/pp3bp4-candidate-matrix-2026-07.md
    role: "human rendering; candidate IDs and material dispositions must match the canonical machine matrix"
  recommendation_memo:
    path: docs/reference/pp3-bp4-predictor-policy-recommendation-2026-07.md
    role: "link-only update recording the comprehensive matrix exists and advances no new predictor"
  preserved_byte_identical:                                    # tested by hash; never edited
    - { path: configs/eval/pp3bp4_source_register.yaml,       sha256: 2e9c1f215f24bf6ea6fffa697737f84092e6c5fce02db5e74c91e479f0b36932, reason: "bound to the existing REVEL shadow policy" }
    - { path: configs/eval/predictor_training_manifests.yaml, sha256: 64208cd23081d5c99db332709b5de6b3603ac7e11d7bcc203ca7f74f952f229c, reason: "active leakage-audit registry; matrix-wide training status must not become required leakage inputs" }
    - { path: configs/eval/pp3bp4_candidate_policy.json,      sha256: 6bba6b906c7bf1296450c8f1df4addda052f5d3ee90f45879a062d02980428b2, reason: "existing proposed REVEL policy remains semantically and byte identical" }
  canonical_store_decision: >-
    A NEW file (not the policy-bound register) is the sole canonical matrix because the register's
    raw bytes are hashed into the REVEL policy; writing matrix content there would re-hash and
    disturb the policy (the exact F1-F3 defect). The new file has no policy/leakage binding, so the
    matrix can be comprehensive while the shadow policy stays frozen.
  primary_implementation_reference_files:                      # <= 4
    - configs/eval/pp3bp4_predictor_matrix.yaml            # to create
    - docs/reference/pp3bp4-candidate-matrix-2026-07.md    # human view
    - docs/reference/pp3-bp4-predictor-policy-recommendation-2026-07.md  # link-only
    - PRIMARY_SOURCE_RESEARCH_BRIEF.md                    # fact source

# ---------------------------------------------------------------------------
# 3. Candidate identity (task spec + brief S1-2)
# ---------------------------------------------------------------------------
candidate_identity:
  completeness_invariant: "Exactly these 16 calibrated candidate_ids, plus bias_composite as the audit row."
  pejaver_2022_thirteen: [bayesdel_noaf, cadd, evolutionary_action, fathmm, gerp_plus_plus, mpc, mutpred2, phylop, polyphen2_humvar, primateai_original, revel, sift, vest4]
  bergquist_2025_three: [alphamissense, esm1b, varity_r]
  additional_audit_row: [bias_composite]
  alias_rejections:
    - "primateai_original is NOT PrimateAI-3D."
    - "varity_r is NOT generic VARITY / VARITY_ER."
    - "bayesdel_noaf (no allele frequency) is NOT BayesDel-addAF."

# ---------------------------------------------------------------------------
# 4. Disposition + evidence-role classification (Slot 3 decision 4; F4)
# ---------------------------------------------------------------------------
classification:
  disposition_vocabulary: [advance_shadow, eligible_primary_candidate, shadow_comparator, research_watchlist, separate_consequence_policy, functional_evidence_not_pp3bp4, full_classifier_exclusion, audit_only_reject_authoritative, blocked_pending_source]
  evidence_role_vocabulary: [calibrated_missense, conservation_context, audit_only]
  conservation_context_members: [gerp_plus_plus, phylop]       # F4: distinct role within the calibrated set
  conservation_context_rule: "A distinct policy role, not an extra PP3/BP4 vote and not a splice policy."
  non_missense_tiers_no_rows:
    separate_splice_policy: "Splice predictors are a separate consequence policy (handoff: sources-add-splice-track); no missense rows/votes here."
    functional_evidence_not_pp3bp4: "MAVE/functional assays are orthogonal (PS3/BS3 family), never a predictor label."
    full_classifier_exclusions: "Full end-to-end classifiers are excluded from the PP3/BP4 comparison; populate only from sourced facts, else not_applicable."
  per_candidate:               # disposition + evidence_role; basis = brief S5 published conclusions (NOT held-out)
    revel:                { disposition: advance_shadow,             evidence_role: calibrated_missense,   basis: "PP3 Strong + BP4 Moderate; existing sole shadow candidate" }
    bayesdel_noaf:        { disposition: eligible_primary_candidate, evidence_role: calibrated_missense,   basis: "PP3 Strong + BP4 Moderate; meta-predictor; component overlap" }
    mutpred2:             { disposition: eligible_primary_candidate, evidence_role: calibrated_missense,   basis: "PP3 Strong + BP4 Moderate; separately generated" }
    vest4:                { disposition: eligible_primary_candidate, evidence_role: calibrated_missense,   basis: "PP3 Strong + BP4 Moderate" }
    alphamissense:        { disposition: eligible_primary_candidate, evidence_role: calibrated_missense,   basis: "PP3 Strong + BP4 Moderate; release pin pending (CP-10)" }
    esm1b:                { disposition: eligible_primary_candidate, evidence_role: calibrated_missense,   basis: "PP3 Strong + BP4 Moderate (PP3 may cap); direction lower; pins CP-6/CP-12" }
    varity_r:             { disposition: eligible_primary_candidate, evidence_role: calibrated_missense,   basis: "PP3 Strong + BP4 Strong; pins CP-7/CP-11/CP-13" }
    cadd:                 { disposition: shadow_comparator,          evidence_role: calibrated_missense,   basis: "Did not meet both preferred maxima; many embedded features" }
    evolutionary_action:  { disposition: shadow_comparator,          evidence_role: calibrated_missense,   basis: "Did not meet both preferred maxima; separate generation route" }
    fathmm:               { disposition: shadow_comparator,          evidence_role: calibrated_missense,   basis: "Did not meet both maxima; REVEL/BayesDel component; native lower pre-transform" }
    gerp_plus_plus:       { disposition: shadow_comparator,          evidence_role: conservation_context,  basis: "Conservation; feature overlap with meta-predictors" }
    mpc:                  { disposition: shadow_comparator,          evidence_role: calibrated_missense,   basis: "Constraint/population dependence; BayesDel component" }
    phylop:               { disposition: shadow_comparator,          evidence_role: conservation_context,  basis: "Conservation; exact calibrated dbNSFP column pending (CP-14)" }
    polyphen2_humvar:     { disposition: shadow_comparator,          evidence_role: calibrated_missense,   basis: "Did not meet both maxima; REVEL/BayesDel component" }
    primateai_original:   { disposition: shadow_comparator,          evidence_role: calibrated_missense,   basis: "Did not meet both maxima; evaluated release needs confirmation (CP-15)" }
    sift:                 { disposition: shadow_comparator,          evidence_role: calibrated_missense,   basis: "Did not meet both maxima; REVEL/BayesDel component; native lower pre-transform" }
    bias_composite:       { disposition: audit_only_reject_authoritative, evidence_role: audit_only,       basis: "No external end-to-end calibration; audit reconstruction only" }
  binding_rule: "Dispositions/roles are decision-matrix labels, not runtime routes; only revel is advance_shadow; no voting/fallback/ranking/per-variant selection."

# ---------------------------------------------------------------------------
# 5. Fact-status discipline (Slot 3 decision 2)
# ---------------------------------------------------------------------------
fact_status:
  enum: [verified, confirm_pending, unavailable, not_applicable]
  rule: "Every cell is a verified value WITH a rationale_source_id, or an explicit status token. No success-shaped defaults; unavailable manifests are never zero-overlap; bundled availability is never licence approval."
  revel_verified_intervals:      # Pejaver Table 2, REVEL row -- the ONLY verified numeric intervals; MUST match the frozen policy
    pp3_supporting: "0.644 <= s < 0.773 (enabled)"
    pp3_moderate:   "0.773 <= s < 0.932 (enabled)"
    pp3_strong:     "s >= 0.932 (enabled)"
    indeterminate:  "0.290 < s < 0.644 (no criterion)"
    bp4_supporting: "0.183 < s <= 0.290 (enabled)"
    bp4_moderate:   "0.016 < s <= 0.183 (enabled)"
    bp4_strong:     "0.003 < s <= 0.016 (calibrated, DISABLED in the current policy)"
    bp4_very_strong: "s <= 0.003 (calibrated, DISABLED in the current policy)"
  verified_cross_facts:
    - "Native direction: higher-is-pathogenic for all EXCEPT fathmm & sift (lower, Pejaver-transformed) and esm1b (lower)."
    - "Score acquisition: Pejaver used dbNSFP precomputed scores EXCEPT bayesdel_noaf, cadd, evolutionary_action, mutpred2, polyphen2 (generated separately)."
    - "Bergquist calibrated alphamissense/esm1b to PP3 Strong + BP4 Moderate and varity_r to PP3 Strong + BP4 Strong; EVE attempted but excluded (sampling bias)."
  component_dependence_map:      # brief S6 -- verified
    revel: "SIFT, PolyPhen-2, FATHMM + others"
    bayesdel_noaf: "SIFT, PolyPhen-2, FATHMM-coding, MPC, conservation features"
    cadd: "conservation + protein-prediction features (PhyloP/GERP++/PolyPhen-derived)"
    rule: "REVEL and its components are not independent PP3/BP4 evidence; REVEL and BayesDel-noAF are not both applied as independent criteria; conservation/context tools are comparators, not votes."
  confirm_pending_register:      # brief S8 -- binding; do not upgrade
    CP-1: "BayesDel-noAF intervals -> Pejaver Table 2"
    CP-2: "MutPred2 intervals -> Pejaver Table 2"
    CP-3: "VEST4 intervals -> Pejaver Table 2"
    CP-4: "Intervals/maxima for CADD, EA, FATHMM, GERP++, MPC, PhyloP, PolyPhen-2 HumVar, PrimateAI, SIFT -> Pejaver Table 2"
    CP-5: "AlphaMissense intervals -> Bergquist Table 1"
    CP-6: "ESM1b intervals -> Bergquist Table 1"
    CP-7: "VARITY_R intervals -> Bergquist Table 1"
    CP-8: "Bergquist 2025 PMCID -> PubMed/PMC"
    CP-9: "Independently-generated tool versions used by Pejaver -> Pejaver supplement"
    CP-10: "AlphaMissense release evaluated by Bergquist -> Bergquist Methods/Data Availability"
    CP-11: "VARITY_R release evaluated by Bergquist -> Bergquist Methods/Data Availability"
    CP-12: "ESM1b availability in the selected dbNSFP branch -> selected release README"
    CP-13: "VARITY_R availability in the selected dbNSFP branch -> selected release README"
    CP-14: "PhyloP column calibrated by Pejaver -> Pejaver supplement"
    CP-15: "PrimateAI release evaluated by Pejaver -> Pejaver supplement"
    CP-16: "Official MPC licence -> official distribution source"
    CP-17: "Official GERP++ licence -> official distribution source"
    CP-18: "Official PhyloP/PHAST licence -> official distribution source"
    CP-19: "Official Evolutionary Action licence -> official distribution source"
    CP-20: "Training overlap for CADD, EA, MPC, PhyloP, GERP++, PrimateAI vs the TSC benchmark -> verified manifests + leakage audit"
    CP-21: "REVEL/dbNSFP release to pin for RAPTOR -> annotation-bundle decision"

# ---------------------------------------------------------------------------
# 6. Canonical matrix schema + example (pp3bp4-predictor-matrix/1)
# ---------------------------------------------------------------------------
matrix_schema:
  top_level: [schema, version, source_map, candidates, audit_rows, fact_status_vocabulary, confirm_pending_register, smallest_pin_handoff]
  source_map_rule: "Self-contained citation map (pejaver_2022, bergquist_2025, stenton_2024, richards_2015, tavtigian_2018, dbnsfp_v4 as a distribution token). Every candidate calibration_source_id and rationale_source_id must resolve here. No coupling to configs/eval/pp3bp4_source_register.yaml."
  candidate_record_fields:      # closed set = 23 task-spec matrix fields + evidence_role
    - candidate_id
    - display_name
    - tool_kind
    - evidence_role                 # calibrated_missense | conservation_context | audit_only
    - calibration_source_id
    - calibration_locus
    - calibrated_score_intervals_or_confirm_pending
    - maximum_supported_pp3_strength
    - maximum_supported_bp4_strength
    - explicit_indeterminate_interval_or_confirm_pending
    - calibrated_version_or_confirm_pending
    - current_release_pin_status
    - score_direction
    - transcript_and_consequence_scope
    - training_manifest_status      # METADATA ONLY; not a leakage input
    - component_or_feature_overlap
    - structured_score_source
    - structured_score_availability
    - license_source
    - license_status
    - tsc_specific_evidence
    - implementation_cost
    - disposition
    - rationale_source_ids
  example_record:
    gerp_plus_plus:
      display_name: "GERP++"
      tool_kind: conservation
      evidence_role: conservation_context
      calibration_source_id: pejaver_2022
      calibration_locus: "Table 2"
      calibrated_score_intervals_or_confirm_pending: confirm_pending    # CP-4
      maximum_supported_pp3_strength: confirm_pending                    # CP-4
      maximum_supported_bp4_strength: confirm_pending                    # CP-4
      explicit_indeterminate_interval_or_confirm_pending: confirm_pending
      calibrated_version_or_confirm_pending: confirm_pending
      current_release_pin_status: confirm_pending
      score_direction: higher_more_pathogenic
      transcript_and_consequence_scope: missense_variant
      training_manifest_status: unavailable       # metadata only
      component_or_feature_overlap: "embedded in CADD and other meta-predictors"
      structured_score_source: dbnsfp_v4
      structured_score_availability: confirm_pending
      license_source: official_distribution
      license_status: confirm_pending             # CP-17
      tsc_specific_evidence: none_identified
      implementation_cost: confirm_pending
      disposition: shadow_comparator
      rationale_source_ids: [pejaver_2022]
  notes:
    - "Only revel carries verified numeric multi-level intervals; every other interval field is confirm_pending with a CP id."
    - "fathmm/sift record native lower + a pejaver_transform note; esm1b is lower."

