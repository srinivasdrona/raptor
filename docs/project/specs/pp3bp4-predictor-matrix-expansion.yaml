# ---------------------------------------------------------------------------
# 1. Goal and bounded-scope contract
# ---------------------------------------------------------------------------
goal: >-
  Expand RAPTOR's PP3/BP4 decision matrix from four dispositioned candidates to
  the complete, source-verified set of 16 calibrated missense tools (plus the
  required BIAS composite audit row), as machine-readable and human-reviewable
  DECISION SUPPORT, while keeping the existing REVEL candidate policy proposed,
  shadow-only, unapproved, and behaviourally unchanged.

bounded_scope_contract:
  is:
    - "A 16-tool decision matrix (16 calibrated rows + 1 bias_composite audit row = 17 table rows)."
    - "The 16-calibrated-tool identity set is the binding completeness invariant."
    - "Comparison/disposition metadata sourced only from published calibration and official tool pages."
    - "The first technical unit on the Tier-1/2 VUS critical path; it unblocks sources-pin-core-annotation-bundle."
  is_not:
    - "Not 16 score integrations. Matrix completeness must not imply downloading or wiring any predictor."
    - "Not predictor voting, ranking, consensus, strongest-score, fallback, or per-variant selection."
    - "Not activation, owner approval, terminal held-out rerun, VUS census, or clinical output."
    - "Not held-out / VUS-census / MAVE-class tuning of any selection, disposition, interval, or ranking."
  invariants:
    - "16-tool decision support, never 16 integrations."
    - "No production scorer / gate / packet / census wiring is added or touched."
    - "No fabricated interval, version, license, availability, or training-overlap fact; use confirm_pending / unavailable / not_applicable."
    - "The existing REVEL policy is semantically unchanged; only its bound source_register_sha256 may change, and only under an explicit, approved, hash-only update proven equivalent."
    - "REVEL remains the sole proposed shadow candidate; MAVE remains orthogonal functional evidence, never a predictor label."

# ---------------------------------------------------------------------------
# 2. Motivating references
# ---------------------------------------------------------------------------
motivating_references:
  primary_sources:
    pejaver_2022:
      citation: "Pejaver V, Byrne AB, Feng BJ, et al. AJHG 2022;109:2163-2177."
      ids: { doi: "10.1016/j.ajhg.2022.10.013", pmid: "36413997", pmc: "PMC9748256" }
      relevant_locus: "Methods (13-tool set, direction transforms, score acquisition, training-overlap exclusions); Table 2 (calibrated intervals)."
      verified_use: "REVEL Table-2 intervals are the ONLY fully-verified multi-level numeric intervals (see revel_verified_intervals)."
    bergquist_2025:
      citation: "Bergquist T, Pejaver V, et al. Genetics in Medicine 2025."
      ids: { doi: "10.1016/j.gim.2025.101402", pmid: "40084623", preprint_doi: "10.1101/2024.09.17.611902", pmc: confirm_pending }
      relevant_locus: "Table 1 (AlphaMissense, ESM1b, VARITY_R exact intervals) -- numeric use requires direct Table 1 verification (CP-5/6/7); PMCID is CP-8."
    stenton_2024:
      citation: "Stenton SL, Pejaver V, Harrison SM, et al. Genetics in Medicine 2024."
      ids: { pmid: "39030733", pmc: "PMC11560577" }
      relevant_locus: "Box 1 operational guidance -- one preselected predictor, no cherry-picking, combined PP3+PM1 capped at Strong."
    richards_2015:
      citation: "Richards S, Aziz N, Bale S, et al. ACMG/AMP standards. 2015."
      ids: { doi: "10.1038/gim.2015.30", pmid: "25741868", pmc: "PMC4544753" }
      relevant_locus: "PP3/BP4 as computational evidence applied once per variant; correlated-tool rule."
    tavtigian_2018:
      citation: "Tavtigian SV, et al. Bayesian evidence framework. 2018."
      ids: { doi: "10.1038/gim.2017.210" }
      relevant_locus: "Bayesian evidence-strength ladder (supporting/moderate/strong)."
  distribution_reference:
    dbnsfp_v4:
      citation: "Liu X, Li C, Mou C, Dong Y, Tu Y. dbNSFP v4. Genome Medicine 2020;12:103."
      note: >-
        Distribution/availability reference only, NOT a calibration primary source and NOT a
        pinned RAPTOR release. The exact release, column inventory, and licence branch are
        confirm_pending (CP-12/CP-13/CP-14/CP-21) and are decided in sources-pin-core-annotation-bundle.
        Referenced from candidate structured_score_source fields as the token `dbnsfp_v4`; it is
        deliberately NOT added to the register required_primary_sources to avoid implying a pinned release.

