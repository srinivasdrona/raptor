  strict_yaml_and_hash:
    parser:
      - UTF-8 strict, one non-empty safe YAML mapping document
      - duplicate keys, aliases, anchors, merge keys, custom tags, sets, binary scalars, timestamps as objects, and non-JSON values forbidden
      - mapping keys are strings and unknown keys fail at every closed level
      - bounded bytes, nodes, depth, strings, rule count, and sequence lengths
    hash_algorithm:
      - deep-copy the validated raw mapping
      - remove only top-level policy_content_hash
      - serialize canonical JSON with sorted keys, compact separators, ensure_ascii=false, allow_nan=false
      - preserve every sequence exactly and retain explicit nulls
      - encode UTF-8 without a trailing LF
      - compute lowercase SHA-256 and compare with policy_content_hash
    repository_test_rule: >-
      Tests independently compute the exact expected digest from
      initial_checked_in_mapping and require the production config mapping and
      self-hash to match. The implementation must not use its own hash helper
      as the test oracle.
  closed_policy_schema:
    top_level_required_exact:
      - schema
      - policy_id
      - policy_version
      - policy_content_hash
      - hash_basis
      - approval_binding
      - registry_binding
      - artifact_binding
      - evaluator
      - rules
    rule_required_exact:
      - priority
      - rule_id
      - rationale_id
      - selectors
      - outcome
    selector_required_exact:
      - classifications
      - difference_kinds
      - fact_kinds
      - subject_types
      - fact_path
      - source_roles
      - source_lifecycles
      - consumer_freshness_profiles
      - record_kinds
    fact_path_required_exact:
      - mode
      - values
    fact_path_modes:
      - ANY
      - EXACT
      - PREFIX
    outcomes:
      - NO_OBSERVED_CHANGE
      - NON_MATERIAL_CHANGE
      - MATERIAL_CHANGE
    priority_rule: integer 0 through 9999, unique, and rules strictly ascending
    id_rule: stable non-empty ASCII identifiers unique exactly and after casefold
    id_maximum_characters: 128
    general_string_maximum_characters: 1024
    ANY_rule: >-
      ANY may appear only as the sole item in a selector list. It is not
      allowed in fact_path.values.
    exact_path_rule: one or more known V2-S2 fact paths, sorted and unique
    prefix_path_rule: one or more slash-terminated known source-path prefixes, sorted and unique
    no_threshold_rule: numeric severity, score, confidence, percentage, count threshold, regex, expression, code, or callable selectors are forbidden
  approved_baseline_binding:
    exact_registry_hash_required: true
    exact_artifact_schemas_required: true
    policy_change_behavior: >-
      Any rule or binding change requires a new policy_version, recomputed
      policy_content_hash, updated registry binding when applicable, RED tests,
      Opus checking, and human adjudication. In-place silent threshold or rule
      changes are invalid.
    human_gate: >-
      The policy identifies HUMAN_ADJUDICATED_EXACT_HASH as its approval mode.
      That approves only use of the mechanical evaluator. It never approves a
      generated route, rollback, promotion, scientific claim, or legal claim.

materiality_evaluation_algorithm:
  registry_context:
    record_kind: current selected source record_kind
    source_lifecycle: >-
      Current selected source lifecycle_state is context only. It is never
      copied into a candidate, used as a readiness result, or emitted as a
      materiality outcome.
    consumer_freshness_profile:
      NO_CONSUMERS: selected source has zero current consumer edges
      NONE_REQUIRED: at least one edge and every target consumer freshness_required=false
      SOME_REQUIRED: both true and false freshness_required values occur
      ALL_REQUIRED: at least one edge and every target consumer freshness_required=true
    source_role_derivation:
      SOURCE: SOURCE_RECORD
      DECLARATION: 'DECLARATION_REF:<current declaration role>'
      COMPONENT_existing: 'COMPONENT:<current baseline component source_role>'
      COMPONENT_added: 'COMPONENT:<added after.value.source_role>'
      FILE_added: 'STAGED_FILE:<after.value.role>'
      content_declaration: 'DECLARATION_REF:<current declaration role>'
      content_component: 'COMPONENT:<current component source_role>'
    role_transition_rule: >-
      A component source_role field change is evaluated with the current
      baseline role context. The changed candidate role remains an observed
      value and is material under MAT-COMPONENT-001. It never changes routing
      ownership or grants authority.
  selector_match:
    list_semantics: exact membership unless the sole value is ANY
    fact_path_ANY: always matches
    fact_path_EXACT: exact Unicode string equality against one listed path
    fact_path_PREFIX: startswith one listed slash-terminated prefix
    source_role: exact derived context string
    all_dimensions_required: true
  rule_selection:
    steps:
      - inspect rules in strictly ascending unique priority
      - collect rules whose every selector dimension matches
      - select the first matching rule
      - later matching rules are shadowed by explicit priority and do not create ambiguity
    invalid_policy_cases:
      - duplicate priority
      - unsorted rules
      - duplicate/case-colliding rule or rationale id
      - unknown selector token, outcome, mode, lifecycle, record kind, or freshness profile
      - malformed path selector
      - missing required unchanged rule or terminal changed catchall
    defensive_unmatched_behavior: >-
      A valid changed fact reaching no policy rule evaluates MATERIAL_CHANGE
      with rule_id SYSTEM-UNMATCHED-MATERIAL-001 and
      rationale_id CONSERVATIVE_DEFAULT. This is a fail-safe; the required
      terminal rule makes it unreachable for the approved baseline.
    unknown_fact_behavior: >-
      An unknown enum, fact path, subject/provenance combination, or impossible
      envelope is invalid V2-S2 input and is not evaluated. It is never treated
      as non-material.
  per_fact_output:
    required_exact:
      - fact_id
      - fact_index
      - fact_locator
      - context
      - evaluation
      - rule_id
      - rationale_id
      - conservative_default
    fact_locator_required_exact:
      - difference_kind
      - fact_kind
      - subject_type
      - subject_id
      - fact_path
      - classification
    context_required_exact:
      - source_role
      - source_lifecycle
      - consumer_freshness_profile
      - record_kind
    conservative_default_type: boolean
    severity_field: forbidden
    rationale_prose_field: forbidden
  aggregate_algorithm:
    precedence:
      - if any fact is MATERIAL_CHANGE, aggregate MATERIAL_CHANGE
      - else if any fact is NON_MATERIAL_CHANGE, aggregate NON_MATERIAL_CHANGE
      - else aggregate NO_OBSERVED_CHANGE
    validity_precedence:
      - malformed/tampered artifact or policy gives INVALID and no plan artifact
      - unknown/stale current baseline gives NOT_EVALUATED and no plan artifact
    consistency:
      NO_OBSERVED_CHANGE: V2-S2 stage_outcome must be OBSERVED_NO_DIFFERENCE
      NON_MATERIAL_CHANGE: V2-S2 stage_outcome must be OBSERVED_DIFFERENCE
      MATERIAL_CHANGE: V2-S2 stage_outcome must be OBSERVED_DIFFERENCE
    counts:
      required_exact:
        - total_facts
        - NO_OBSERVED_CHANGE
        - NON_MATERIAL_CHANGE
        - MATERIAL_CHANGE
      sum_rule: the three outcome counts sum to total_facts
  normative_examples:
    no_change:
      input: every independently validated V2-S2 fact is UNCHANGED
      result: NO_OBSERVED_CHANGE
      routes: record_only only; stage_diff is recorded as evidenced by input
    non_material:
      input: >-
        On a non-PINNED_HISTORICAL source with NO_CONSUMERS or NONE_REQUIRED
        freshness profile, only /release/retrieved_at changes and every other
        fact is unchanged.
      result: NON_MATERIAL_CHANGE
      winning_rule: NONMAT-RETRIEVED-AT-001
      routes: record_only only; no consumer block, rebuild, invalidation, regrounding, validation, or rollback
    material:
      input: one valid content checksum, declaration, identity, version, component, licence, acquisition, or unmatched changed fact
      result: MATERIAL_CHANGE
      routes: exact declared/edge-conditioned proposal set
    pinned_historical:
      input: only /release/retrieved_at changes on frozen-core-annotation-bundle
      result: MATERIAL_CHANGE
      winning_rule: MAT-PINNED-HISTORICAL-001

impact_routing_contract:
  authority_source:
    actions: current selected source drift_policy.actions only
    consumer_edges: current selected source consumers plus matching registry consumer records only
    owner: current registry owner fields only
    candidate_values_can_authorize_routes: false
  allowed_action_enum_in_order:
    - record_only
    - block_consumer
    - stage_diff
    - rebuild_benchmark
    - review_policy
    - invalidate_packets
    - reground_atlas
    - rerun_validation
    - rollback
  promote_resolution: >-
    V2-S1's closed allowed action enum contains no promote action. V2-S3 v1
    therefore has no promotion route, prerequisite, disposition, or approval.
    A promote/promotion action or field is invalid. A future authority must
    version both the registry action enum and this contract before promotion
    can be represented.
  action_disposition_required_exact:
    - action
    - disposition
    - reason_id
    - route_ids
  action_dispositions:
    - PROPOSED
    - EVIDENCED_BY_VALIDATED_INPUT
    - NOT_DECLARED_BY_SOURCE
    - NOT_PROPOSED_NO_OBSERVED_CHANGE
    - NOT_PROPOSED_NON_MATERIAL
    - NOT_PROPOSED_NO_TARGET_EDGE
    - NOT_PROPOSED_NO_PREDECESSOR
    - NOT_PROPOSED_REHEARSAL_BLOCKED
  action_disposition_reason_ids:
    - COMPLETED_ASSESSMENT_REQUIRES_RECORD
    - VALIDATED_V2_S2_DIFF_PRESENT
    - ACTION_NOT_DECLARED
    - NO_OBSERVED_CHANGE
    - NON_MATERIAL_CHANGE
    - TARGET_EDGE_ABSENT
    - NO_PREDECESSOR
    - ROLLBACK_REHEARSAL_BLOCKED
    - MATERIAL_ROUTE_CONDITION_MET
  action_disposition_selection_order:
    - if action is not in current source actions, use NOT_DECLARED_BY_SOURCE/ACTION_NOT_DECLARED
    - if action is stage_diff, use EVIDENCED_BY_VALIDATED_INPUT/VALIDATED_V2_S2_DIFF_PRESENT
    - if action is record_only, use PROPOSED/COMPLETED_ASSESSMENT_REQUIRES_RECORD
    - if aggregate is NO_OBSERVED_CHANGE, use NOT_PROPOSED_NO_OBSERVED_CHANGE/NO_OBSERVED_CHANGE
    - if aggregate is NON_MATERIAL_CHANGE, use NOT_PROPOSED_NON_MATERIAL/NON_MATERIAL_CHANGE
    - if an edge-conditioned action has no exact target edge, use NOT_PROPOSED_NO_TARGET_EDGE/TARGET_EDGE_ABSENT
    - if rollback has a null predecessor, use NOT_PROPOSED_NO_PREDECESSOR/NO_PREDECESSOR
    - if rollback rehearsal is BLOCKED, use NOT_PROPOSED_REHEARSAL_BLOCKED/ROLLBACK_REHEARSAL_BLOCKED
    - otherwise use PROPOSED/MATERIAL_ROUTE_CONDITION_MET with the action-specific route ids
  action_disposition_route_id_rule: >-
    PROPOSED carries the exact final route ids for that action in route order.
    Every other disposition carries an explicit empty route_ids sequence.
  exact_route_conditions:
    record_only:
      target_scope: SOURCE
      condition: >-
        The action is declared and materiality evaluation completed with any
        of the three successful outcomes.
      route_count: exactly_one
    block_consumer:
      target_scope: CONSUMER
      condition: >-
        The action is declared and aggregate outcome is MATERIAL_CHANGE.
      targets: every current non-reserved selected-source consumer edge
      route_count: one_per_target_or_zero_when_no_edges
    stage_diff:
      target_scope: none
      condition: >-
        The action is declared and the independently validated V2-S2 pair is
        the required staged diff evidence.
      disposition: EVIDENCED_BY_VALIDATED_INPUT
      route_count: zero
      no_execution_claim: >-
        This disposition records an input precondition, not an assertion that
        V2-S3 ran or approved stage_diff.
    rebuild_benchmark:
      target_scope: CONSUMER
      condition: >-
        The action is declared, aggregate outcome is MATERIAL_CHANGE, and the
        current source has an exact consumer edge to eval-benchmark.
      target_id: eval-benchmark
      route_count: zero_or_one
    review_policy:
      target_scope: SOURCE
      condition: the action is declared and aggregate outcome is MATERIAL_CHANGE
      route_count: exactly_one_when_condition_met
    invalidate_packets:
      target_scope: CONSUMER
      condition: >-
        The action is declared, aggregate outcome is MATERIAL_CHANGE, and the
        current source has an exact consumer edge to packet.
      target_id: packet
      route_count: zero_or_one
    reground_atlas:
      target_scope: CONSUMER
      condition: >-
        The action is declared, aggregate outcome is MATERIAL_CHANGE, and the
        current source has an exact consumer edge to atlas.
      target_id: atlas
      route_count: zero_or_one
    rerun_validation:
      target_scope: SOURCE
      condition: the action is declared and aggregate outcome is MATERIAL_CHANGE
      route_count: exactly_one_when_condition_met
    rollback:
      target_scope: SOURCE
      condition: >-
        The action is declared, aggregate outcome is MATERIAL_CHANGE, a
        non-null predecessor exists, and rollback rehearsal outcome is
        READY_FOR_HUMAN_ADJUDICATION.
      route_count: zero_or_one
      no_predecessor: no route and disposition NOT_PROPOSED_NO_PREDECESSOR
      blocked_rehearsal: no route and disposition NOT_PROPOSED_REHEARSAL_BLOCKED
  no_change_and_non_material_rules:
    NO_OBSERVED_CHANGE:
      proposed_actions:
        - record_only
      stage_diff_disposition: EVIDENCED_BY_VALIDATED_INPUT
    NON_MATERIAL_CHANGE:
      proposed_actions:
        - record_only
      stage_diff_disposition: EVIDENCED_BY_VALIDATED_INPUT
    rule: >-
      block_consumer, rebuild_benchmark, review_policy, invalidate_packets,
      reground_atlas, rerun_validation, and rollback are never proposed for a
      non-material or no-change aggregate.
  ProposedRoute:
    required_exact:
      - route_id
      - action
      - state
      - source_id
      - target
      - consumer_id
      - prerequisites
      - reason_fact_ids
      - reason_rule_ids
      - proposal_only
      - approval_required
      - approval_state
      - executed
    constants:
      state: PROPOSED
      proposal_only: true
      approval_required: true
      approval_state: NOT_GRANTED
      executed: false
    target_required_exact:
      - type
      - id
      - owner
    target_types:
      - SOURCE
      - CONSUMER
    consumer_id_rule: null for SOURCE target; exact target id for CONSUMER target
    route_id_algorithm: >-
      Join action, target.type, and target.id with a colon in that order. All
      components are already validated stable identifiers.
  prerequisites:
    required_exact:
      - prerequisite
      - status
    enum_order:
      - VALIDATED_V2_S2_PAIR
      - CURRENT_BASELINE_MATCH
      - POLICY_BASELINE_MATCH
      - MATERIAL_CHANGE
      - CURRENT_CONSUMER_EDGE
      - ROLLBACK_REHEARSAL_READY
      - HUMAN_ADJUDICATION
    statuses:
      - SATISFIED
      - REQUIRED
    rules:
      - every route contains the first three SATISFIED prerequisites
      - material-only routes contain MATERIAL_CHANGE=SATISFIED
      - consumer routes contain CURRENT_CONSUMER_EDGE=SATISFIED
      - rollback contains ROLLBACK_REHEARSAL_READY=SATISFIED
      - every route ends with HUMAN_ADJUDICATION=REQUIRED
  reason_assignment:
    record_only: all changed fact ids; empty for NO_OBSERVED_CHANGE
    material_routes: every MATERIAL_CHANGE fact id in V2-S2 fact order
    reason_rule_ids: unique winning rule ids in policy priority order
    no_candidate_owner_or_consumer_fact_can_change_targeting: true
  dedupe_and_order:
    dedupe_key:
      - action
      - target.type
      - target.id
    aggregation: >-
      Union reason_fact_ids and reason_rule_ids without duplicates, preserving
      the specified source orders. Any duplicate final route is an internal
      contract failure, never emitted twice.
    route_order:
      - action in V2-S1 allowed enum order
      - target.type SOURCE before CONSUMER
      - target.id Unicode code-point order
    action_disposition_order: V2-S1 allowed enum order
  reserved_consumer_rule: >-
    A reserved consumer cannot appear in a route, target, prerequisite,
    approval, owner derivation, or reason. Its presence on a current source
    edge fails the baseline before routing.

rollback_input_artifact_contract:
  purpose: >-
    A separately authored immutable metadata artifact for a future source
    record with a non-null predecessor. V2-S3 reads and validates it; V2-S3
    never creates, repairs, or updates it.
  null_predecessor_exception: >-
    For predecessor_source_id=null, validate only that the registry
    rollback_artifact string is a safe repository-relative path. Do not require
    existence, do not read it, do not apply the non-null filename/schema rule,
    and emit NO_PREDECESSOR/NOT_APPLICABLE. Missing path segments are allowed;
    inspect every existing ancestor without following links or reparses.
  null_predecessor_unsafe_path: >-
    An unsafe, absolute, external, traversing, linked-ancestor, or malformed
    rollback_artifact path is invalid registry rollback metadata even when the
    predecessor is null. Fail DRIFT_LINEAGE_INVALID, exit 5, and publish no
    artifact; only safe absence receives the root exception.
  non_null_path:
    exact_shape: configs/sourceops/rollbacks/rb-<artifact_content_hash>.json
    filename_hash_binding: required
    arbitrary_yaml_or_legacy_name: forbidden
    safe_real_file: required
  rollback_source_record_binding:
    hash_basis: raptor.sourceops.rollback_source_record_binding_hash.v1
    fixed_sentinel: __RAPTOR_ROLLBACK_ARTIFACT_CONTENT_ADDRESS_V1__
    artifact_field_names:
      basis: rollback_source_record_binding_hash_basis
      current: current_rollback_source_record_binding_hash
      predecessor: predecessor_rollback_source_record_binding_hash
    preconditions:
      - validate the complete raw source record under the unchanged V2-S1 schema
      - retain explicit nulls, mapping membership, and sequence order
      - require rollback.rollback_artifact to be present and valid before normalization
    algorithm:
      - deep-copy the complete validated raw source-record mapping
      - replace only rollback.rollback_artifact with the exact fixed_sentinel string
      - remove no key and transform no other value
      - serialize with sorted mapping keys, compact separators, ensure_ascii=false, allow_nan=false
      - preserve every sequence and explicit null exactly
      - encode UTF-8 without a trailing LF
      - compute lowercase SHA-256
    treatment:
      current: always recomputed from the selected current raw registry record
      predecessor_non_null: recomputed from the exact predecessor raw registry record
      predecessor_null: explicit null in V2-S3 outputs; no rollback input artifact exists
      deeper_chain: recompute for every lineage-chain entry emitted by V2-S3
    excluded_from_rollback_input_artifact:
      - registry_content_hash
      - current_source_record_content_hash
      - predecessor_source_record_content_hash
    exclusion_reason: >-
      Each excluded full hash contains a rollback artifact path and would feed
      the artifact's own filename hash back into its self-hash. They remain
      mandatory current-baseline and V2-S3 output bindings.
    tamper_evidence: >-
      The normalized hash covers every source-record key and value except the
      content-addressed path value. The exact path is independently constrained
      to rb-<artifact_content_hash>.json and checked against the artifact
      self-hash. V2-S3 also validates the full registry and full record hashes,
      declaration bytes, file bindings, preservation bindings, and immutable
      snapshots, then cross-binds all values in both output plans.
    normative_cycle_free_example:
      base_registry_content_hash: ef6995a8822c53a1bef228545b0a01c23963b79212967d3f3c15b66d54b02e90
      base_current_source_id: tsc-ingest-and-reference-declarations
      exact_construction:
        - deep-copy the base current raw source record from the frozen registry
        - set current rollback.predecessor_source_id to synthetic-predecessor-tsc-ingest
        - set current rollback.origin_reason to synthetic non-null READY fixture
        - initially set current rollback.rollback_artifact to configs/sourceops/rollbacks/rb-<64 lowercase ASCII zeroes>.json
        - leave every other current source-record key, value, explicit null, mapping member, and sequence position byte-semantically unchanged
        - deep-copy the unmodified base record as predecessor
        - set predecessor source_id and display_name to the exact values below, lifecycle_state to PINNED_HISTORICAL, and consumers to an empty sequence
        - set predecessor rollback.predecessor_source_id to explicit null, rollback.rollback_artifact to configs/sourceops/rollbacks/synthetic-predecessor-root.yaml, and rollback.origin_reason to synthetic root predecessor
        - leave predecessor rollback.immutable_predecessor_required=true and every other predecessor key, value, explicit null, mapping member, and sequence position byte-semantically unchanged from the base record
        - derive both normalized hashes before creating the artifact
        - copy both exact declaration-ref sequences shown below without reordering
        - zip the two declaration-ref sequences by their 1-based sequence index and assign binding_id as ASCII bind- plus that index zero-padded to three decimal digits
        - emit file bindings in ascending binding_id order with the exact fields and values below
        - emit preservation bindings in the frozen registry preservation_rules sequence with the exact fields and values below
        - create the artifact with exactly the schema top-level keys and exact scalar/sequence values below; remove only artifact_content_hash when self-hashing
        - set artifact_content_hash to the lowercase self-hash, serialize the final artifact as canonical JSON plus exactly one LF, then replace the current provisional path with the exact final_registry_path below
        - replace the current record at its existing source_records index, append the predecessor as the final source_records element, preserve every other registry value and sequence, and recompute only registry_content_hash
        - compute the full current/predecessor record and synthetic registry hashes only after final path assignment
      predecessor_source_id: synthetic-predecessor-tsc-ingest
