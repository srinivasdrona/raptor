product_contract:
  operator: RAPTOR source-maintenance operator
  goal: >-
    Given one immutable V2-S2 diff/verification pair and the still-current
    canonical V2-S1 registry, independently validate all bindings, apply one
    checked-in human-governed materiality policy, and publish deterministic
    proposed impact and rollback-rehearsal plans for human adjudication.
  accepted_inputs:
    - one V2-S2 diff artifact
    - the exact V2-S2 verification artifact that cross-binds that diff
    - the current canonical V2-S1 registry and its declaration/preservation preconditions
    - one fixed checked-in, self-hashed materiality policy
    - when a non-null predecessor exists, its fixed registry-bound rollback metadata artifact
  outputs_are:
    - independently verified references to observed V2-S2 facts
    - deterministic per-fact policy evaluations
    - deterministic proposed routes derived from current V2-S1 actions and edges
    - read-only rollback lineage, integrity, and feasibility observations
    - inert proposed rollback operations for later human adjudication
  outputs_are_not:
    - an approval, recommendation, authorization, command, dispatch, or execution
    - a source readiness, blocked-state, activation, promotion, or lifecycle transition
    - a benchmark rebuild, validation rerun, packet invalidation, Atlas regrounding, rollback, restoration, or deletion
    - a scientific, legal, clinical, evidence-sufficiency, classification, worklist, submission, RescueScreen, or panel decision
  validation_ceiling: >-
    V2-S3 can establish that one valid V2-S2 observation was evaluated by one
    exact approved mechanical policy, that proposed routes follow the current
    declared SourceOps graph, and that a rollback lineage is mechanically
    ready, not applicable, or blocked. It cannot approve or execute any route,
    establish scientific or legal sufficiency, alter evidence, authorize
    promotion, or satisfy a clinical, RescueScreen, or independent-panel gate.

scope:
  exact_in:
    - fixed-leaf discovery of one final V2-S2 artifact pair by manifest hash
    - independent strict JSON, canonical-byte, schema, self-hash, filename-hash, and pair validation
    - independent V2-S2 fact, summary, ordering, classification, and input-tree invariant validation
    - current V2-S1 registry, source record, declarations, consumers, actions, and preservation preconditions
    - fixed checked-in policy parsing, self-hash, registry/schema binding, and exact categorical rule evaluation
    - deterministic NO_OBSERVED_CHANGE, NON_MATERIAL_CHANGE, or MATERIAL_CHANGE aggregation
    - deterministic proposal-only impact routes and action dispositions
    - immutable predecessor lineage and rollback metadata validation
    - read-only rollback feasibility checks and inert typed rollback plan
    - two-pass no-follow input immutability checks
    - canonical JSON artifacts, content-addressed fixed output, atomic pair publication, deterministic CLI JSON
  exact_out:
    - acquisition, download, URL dereference, network, credential, egress, archive extraction, or decompression
    - scheduler, workflow dispatch, Prefect flow, service, daemon, database, UI, API, or external-content-root read
    - source promotion, activation, installation, lifecycle mutation, registry mutation, or declaration mutation
    - benchmark rebuild, validation rerun, packet invalidation, Atlas regrounding, policy change, consumer invalidation, or rollback
    - file restoration, replacement, copy, rename, chmod, deletion, shell execution, subprocess, or generated command string
    - candidate-domain parsing, scoring, evidence reinterpretation, classification, legal or clinical decision
    - worklist, submission, patient-facing, RescueScreen, structure, assay, procurement, or panel authorization
    - V2-S1 READY/BLOCKED calculation or a call to status_for_consumer
  execution_rule: >-
    V2-S3 performs bounded reads, hashes, equality checks, deterministic
    evaluation, and generated-artifact publication only. Every domain action
    remains a proposal with approval_required=true, approval_state=NOT_GRANTED,
    and executed=false.

