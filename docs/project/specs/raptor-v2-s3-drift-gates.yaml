terminology:
  observed_fact: >-
    One independently validated V2-S2 DiffFact. Its before/after values and
    ADDED/REMOVED/CHANGED/UNCHANGED classification are observations, not a
    V2-S3 materiality or action decision.
  policy_evaluation: >-
    One deterministic categorical result for one observed fact under the exact
    checked-in policy and current registry context.
  proposal: >-
    A non-executable route or rollback operation prepared for human
    adjudication. It is never approval and never evidence that an action ran.
  assessment_outcomes:
    NO_OBSERVED_CHANGE: every fact is UNCHANGED and evaluates to NO_OBSERVED_CHANGE
    NON_MATERIAL_CHANGE: >-
      At least one fact changed, every changed fact matches a
      NON_MATERIAL_CHANGE rule, and no fact is material.
    MATERIAL_CHANGE: at least one changed fact evaluates to MATERIAL_CHANGE
    INVALID: supplied artifact or policy bytes are malformed, inconsistent, tampered, or non-canonical
    NOT_EVALUATED: current baseline, source identity, or another prerequisite prevents policy interpretation
  rollback_rehearsal_outcomes:
    READY_FOR_HUMAN_ADJUDICATION: >-
      A non-null immutable predecessor and its rollback artifact pass every
      read-only integrity and preservation check. No restoration has run.
    NOT_APPLICABLE: >-
      predecessor_source_id is explicitly null on a valid root lineage record;
      reason_code is exactly NO_PREDECESSOR and no rollback operation exists.
    BLOCKED: >-
      A non-null predecessor exists but the safe rollback path, artifact,
      binding, content, or preservation prerequisites are unavailable.
  forbidden_outcome_terms:
    - READY
    - BLOCKED_SOURCE
    - APPROVED
    - AUTHORIZED
    - PROMOTE
    - EXECUTED
    - RESTORED

runtime_boundaries:
  repository_root: >-
    Resolve the repository root from installed SourceOps code using the same
    concept as V2-S1/V2-S2. The production CLI exposes no root override.
  canonical_registry:
    path: configs/sourceops/source_registry.yaml
    cli_argument: none
    rule: >-
      V2-S3 always reads this exact repository-relative path. An alternate
      registry path is not accepted by the production command.
  materiality_policy:
    path: configs/sourceops/materiality_policy.yaml
    cli_argument: none
    created_during_v2_s3_implementation: true
    rule: >-
      This is the only production policy path. There is no CLI threshold,
      policy-path, inline-rule, environment-variable, or default override.
  v2_s2_input:
    parent: .raptor/sourceops/generated/staged-snapshots
    leaf_shape: .raptor/sourceops/generated/staged-snapshots/<manifest_content_hash>
    selector_argument: --manifest-hash
    selector_regex: '^[0-9a-f]{64}$'
    allowed_final_files:
      verification: 'v-<verification_artifact_content_hash>.json'
      diff: 'd-<diff_artifact_content_hash>.json'
    exact_leaf_rule: >-
      The derived leaf must be a real directory containing exactly one matching
      verification file and exactly one matching diff file. A lock, temp,
      partial, extra, hidden, linked, special, or differently named entry means
      the V2-S2 publication is not an acceptable final pair.
    override_forbidden:
      - arbitrary leaf path
      - verification path
      - diff path
      - output path
      - policy path
      - registry path
  generated_output:
    parent: .raptor/sourceops/generated/drift-plans
    leaf_shape: >-
      .raptor/sourceops/generated/drift-plans/
      <diff_artifact_content_hash>/<policy_content_hash>
    files:
      impact: impact-<impact_artifact_content_hash>.json
      rollback: rollback-<rollback_artifact_content_hash>.json
    cli_override_allowed: false
    rules:
      - the diff hash already binds the V2-S2 manifest, verification, source record, registry, and input tree
      - the policy hash binds the exact human-governed evaluator
      - no latest pointer, mutable index, timestamp directory, force, overwrite, cleanup, or alternate root exists
      - output is never inside or overlapping the V2-S2 input leaf
  path_normalization:
    cli_hash: no path normalization because only a lowercase SHA-256 is accepted
    repository_paths: >-
      Emit forward-slash repository-relative paths. Reject absolute, drive,
      UNC, device, URI, root-relative, dot, dot-dot, empty-segment, control,
      trailing-space/period, and Windows device-name segments.
    maximum_path_characters: 240
    maximum_segments: 12
    case_collision_rule: exact and Unicode-casefold collisions are invalid
  no_follow_and_reparse_rule: >-
    Inspect every existing ancestor and final entry with lstat without
    following it. Reject symlinks, Windows junctions/reparse points, mounts
    that appear as reparse entries, directories where a file is required,
    regular files where a directory is required, sockets, FIFOs, devices, and
    other special entries. Use O_NOFOLLOW where available plus pre-read and
    post-read lstat/fstat equality; Windows must also inspect
    FILE_ATTRIBUTE_REPARSE_POINT/st_reparse_tag without relying only on
    os.path.isjunction.
  read_and_structure_limits:
    verification_artifact_bytes: 2097152
    diff_artifact_bytes: 16777216
    materiality_policy_bytes: 524288
    registry_bytes: 1048576
    each_declaration_or_preservation_file_bytes: 16777216
    rollback_artifact_bytes: 2097152
    each_rollback_bound_file_bytes: 16777216
    total_baseline_and_rollback_file_bytes: 67108864
    maximum_diff_facts: 2048
    maximum_json_nodes: 200000
    maximum_json_depth: 32
    maximum_policy_nodes: 20000
    maximum_policy_depth: 20
    maximum_policy_rules: 64
    maximum_routes: 256
    maximum_rollback_file_bindings: 64
    maximum_proposed_rollback_operations: 260
    each_output_artifact_bytes: 16777216
    total_output_artifact_bytes: 33554432

v2_s2_input_pair_contract:
  discovery_algorithm:
    steps:
      - validate --manifest-hash lexical form before any filesystem read
      - derive the one fixed input leaf from the validated hash
      - validate all ancestors and the leaf without following links or reparses
      - enumerate the complete leaf in Unicode code-point filename order
      - require exactly two regular final files and no other entry
      - require one filename matching the verification pattern and one matching the diff pattern
      - capture first-pass directory and file lstat identity before reading bytes
    no_glob_outside_leaf: true
    no_latest_selection: true
    no_multiple_pair_selection: true
  strict_json_read:
    encoding: UTF-8 strict without BOM
    document_count: exactly_one
    root_type: mapping
    duplicate_mapping_keys: rejected
    mapping_keys: strings_only
    non_finite_numbers: rejected
    trailing_bytes: exactly_one_LF_after_the_JSON_document
    parser_failures_caught:
      - UnicodeDecodeError
      - JSONDecodeError
      - RecursionError
      - OSError
      - ValueError
      - TypeError
    raw_exception_text_in_output: forbidden
  canonical_artifact_bytes:
    algorithm:
      - parse and fully validate the closed artifact mapping
      - serialize the complete mapping with json.dumps sort_keys=true
      - use separators=(',', ':'), ensure_ascii=false, allow_nan=false
      - encode UTF-8 without platform newline translation
      - append exactly one LF
      - require exact byte equality with the supplied file
    consequence: >-
      A semantically equivalent but non-canonical file is invalid. V2-S3 does
      not normalize or republish a V2-S2 input.
  self_hash_and_filename:
    algorithm:
      - deep-copy the complete validated artifact mapping
      - remove only top-level artifact_content_hash
      - serialize canonical JSON without a trailing LF
      - compute lowercase SHA-256
      - require equality with artifact_content_hash
      - require the filename hash segment to equal artifact_content_hash
    verification_filename_prefix: v-
    diff_filename_prefix: d-

  common_source_binding_schema:
    required_exact:
      - source_id
      - registry_content_hash
      - source_record_content_hash
      - declaration_refs
    declaration_ref_required_exact:
      - path
      - role
      - canonical_lf_sha256
      - authority_scope

  verification_artifact:
    schema: raptor.sourceops.staged_snapshot_verification.v1
    hash_basis: raptor.sourceops.staged_snapshot_verification_content_hash.v1
    top_level_required_exact:
      - schema
      - artifact_content_hash
      - hash_basis
      - manifest_content_hash
      - observed_at
      - source_binding
      - candidate_snapshot_id
      - component_projection_status
      - input_tree
      - checks
      - stage_outcome
      - diff_artifact_content_hash
      - validation_ceiling
    input_tree_required_exact:
      - hash_basis
      - input_tree_content_hash
      - files
      - total_bound_content_bytes
    input_tree_hash_basis: raptor.sourceops.staged_snapshot_input_tree_content_hash.v1
    observed_file_required_exact:
      - file_id
      - path
      - role
      - media_type
      - checksum_mode
      - content_byte_size
      - content_sha256
      - component_ids
    check_keys_exact:
      - manifest_schema_valid
      - manifest_hash_match
      - baseline_registry_valid
      - baseline_hash_match
      - declaration_bindings_match
      - baseline_immutable_during_run
      - inventory_complete
      - content_bindings_valid
      - component_projection_valid
      - file_checksums_match
      - input_immutable_during_run
      - inputs_not_mutated_by_command
    check_rule: every value is the JSON boolean true
    stage_outcomes:
      - OBSERVED_NO_DIFFERENCE
      - OBSERVED_DIFFERENCE
    component_projection_statuses:
      - NOT_PROVIDED
      - COMPLETE

  diff_artifact:
    schema: raptor.sourceops.staged_snapshot_diff.v1
    hash_basis: raptor.sourceops.staged_snapshot_diff_content_hash.v1
    top_level_required_exact:
      - schema
      - artifact_content_hash
      - hash_basis
      - manifest_content_hash
      - observed_at
      - source_binding
      - candidate_snapshot_id
      - input_tree_content_hash
      - component_projection_status
      - stage_outcome
      - summary
      - facts
      - validation_ceiling
    summary_required_exact:
      - total_facts
      - classifications
      - difference_kinds
      - fact_kinds
    summary_classification_keys:
      - ADDED
      - REMOVED
      - CHANGED
      - UNCHANGED
    summary_difference_kind_keys:
      - CONTENT
      - METADATA
      - DECLARATION
    summary_fact_kind_keys:
      - IDENTITY
      - VERSION
      - CHECKSUM
      - MANIFEST
      - COMPONENT
      - METADATA
    recursively_forbidden_keys:
      - ready
      - blocked
      - lifecycle_state
      - materiality
      - severity
      - approval
      - recommendation
      - promote
      - promotion
      - action
      - consumer_impacts
      - rollback
      - executed

  pair_cross_bindings:
    exact_equal_between_artifacts:
      - manifest_content_hash
      - observed_at
      - source_binding
      - candidate_snapshot_id
      - component_projection_status
      - stage_outcome
    derived_equalities:
      - verification.diff_artifact_content_hash equals diff.artifact_content_hash
      - --manifest-hash equals both manifest_content_hash values and the input leaf name
      - verification.input_tree.input_tree_content_hash equals diff.input_tree_content_hash
      - canonical hash of verification.input_tree.files equals input_tree_content_hash
      - sum of verification file content_byte_size equals total_bound_content_bytes
    validation_ceiling_exact: >-
      V2-S2 records offline deterministic observations about supplied staged
      bytes and their declared comparison to one V2-S1 baseline. It makes no
      materiality, approval, promotion, lifecycle, scientific, legal, clinical,
      consumer-impact, or rollback decision.

  diff_fact_validation:
    DiffFact_required_exact:
      - difference_kind
      - fact_kind
      - subject_type
      - subject_id
      - fact_path
      - classification
      - before
      - after
      - provenance
    difference_kinds:
      - CONTENT
      - METADATA
      - DECLARATION
    fact_kinds:
      - IDENTITY
      - VERSION
      - CHECKSUM
      - MANIFEST
      - COMPONENT
      - METADATA
    subject_types:
      - SOURCE
      - FILE
      - COMPONENT
      - DECLARATION
    classifications:
      - ADDED
      - REMOVED
      - CHANGED
      - UNCHANGED
    fact_envelope_required_exact:
      - present
      - value
    provenance_required_exact:
      - baseline_origin
      - candidate_origin
    baseline_origins:
      - REGISTRY_SOURCE_RECORD
      - REGISTRY_DECLARATION_REF
      - REGISTRY_COMPONENT
      - ABSENT
    candidate_origins:
      - MANIFEST_CANDIDATE
      - STAGED_FILE_OBSERVATION
      - MANIFEST_COMPONENT
      - ABSENT
    classification_recompute:
      ADDED: before.present=false and after.present=true
      REMOVED: before.present=true and after.present=false
      UNCHANGED: >-
        both present and canonical JSON bytes of before.value and after.value
        are identical
      CHANGED: >-
        both present and canonical JSON bytes of before.value and after.value
        differ
      impossible: both present=false
    absent_value_rule: present=false requires value=null
    explicit_null_rule: present=true/value=null is distinct from absence
    fact_id_algorithm: >-
      Canonicalize the complete DiffFact mapping without a trailing LF, hash
      with SHA-256, and prefix the lowercase digest with "fact-".
    ordering:
      difference_kind:
        - CONTENT
        - METADATA
        - DECLARATION
      fact_kind:
        - IDENTITY
        - VERSION
        - CHECKSUM
        - MANIFEST
        - COMPONENT
        - METADATA
      subject_type:
        - SOURCE
        - FILE
        - COMPONENT
        - DECLARATION
      remaining:
        - subject_id Unicode code-point order
        - fact_path Unicode code-point order
    uniqueness_key:
      - difference_kind
      - fact_kind
      - subject_type
      - subject_id
      - fact_path

  source_fact_universe:
    required_exact_paths:
      - /identity/display_name
      - /identity/record_kind
      - /identity/owner
      - /identity/authoritative_locator
      - /release/version_or_snapshot
      - /release/release_date
      - /release/retrieved_at
      - /release/content_pin_status
      - /licence/status
      - /licence/identifier_or_family
      - /licence/terms_locator
      - /licence/permitted_use
      - /licence/redistribution
      - /licence/cloud_egress
      - /licence/verification_basis
      - /acquisition/method
      - /acquisition/operator_contract
      - /acquisition/writes_outside_repository
    rules:
      - exactly one fact exists for each path
      - subject_type is SOURCE and subject_id is the selected source_id
      - before and after are both present, including explicit null release_date
      - before value equals the current source-record pointer exactly
      - baseline_origin is REGISTRY_SOURCE_RECORD and candidate_origin is MANIFEST_CANDIDATE
      - difference_kind and fact_kind equal the V2-S2 source projection table

  content_fact_universe:
    allowed_fact_paths:
      - /content-bindings/<binding_id>
      - /content-bindings/<binding_id>/sha256
    universe_partition:
      discriminator: fact_path, not subject_type alone
      component_checksum_variant: >-
        A content binding whose baseline_kind is COMPONENT_CHECKSUM has
        subject_type=COMPONENT and a /content-bindings/<binding_id> or
        /content-bindings/<binding_id>/sha256 fact_path. It belongs exclusively
        to content_fact_universe; COMPONENT subject_type does not make it a
        component-projection fact.
      exclusive_rule: >-
        Every /content-bindings/... fact is validated only as a content fact
        and never counted in component_fact_universe.
    rules:
      - binding_id satisfies the V2-S2 file-identifier grammar
      - every verification input-tree file is represented by exactly one content fact
      - every DECLARATION_REF baseline id exists in current source declaration_refs
      - every COMPONENT_CHECKSUM baseline id exists in current source components and carries a checksum role/hash
      - candidate file hashes/sizes/roles in facts equal verification input-tree observations
      - baseline hashes equal current declaration/component hashes
      - subject type, provenance, fact kind, difference kind, and envelope shape match the V2-S2 variant table
      - no unknown or duplicate candidate file or baseline target is accepted

  component_fact_universe:
    universe_partition:
      allowed_fact_path_prefix: /components/
      exclusive_rule: >-
        Only facts whose fact_path starts with /components/ belong to the
        component projection universe. A COMPONENT-subject content-binding
        fact remains outside this universe in every projection mode.
    when_projection_not_provided:
      component_fact_count: 0
      prohibition_scope: >-
        NOT_PROVIDED prohibits only /components/... component-projection facts.
        It does not prohibit a valid COMPONENT_CHECKSUM content-binding fact
        with subject_type=COMPONENT and a fact_path under /content-bindings/.
      valid_content_binding_requirement: >-
        The same valid COMPONENT_CHECKSUM content binding must pass content
        fact validation when component_projection is NOT_PROVIDED and when it
        is COMPLETE. Its content baseline remains independently bound to the
        current registry component checksum in both modes.
    when_projection_complete:
      authority_clarification:
        source_of_truth: >-
          The V2-S2 COMPLETE component projection and the current V2-S1
          registry are the complete component fact universe. V2-S3 validates
          their exact identities, five projected fields, envelopes,
          provenance, classifications, ordering, and aggregates.
        file_anchor_requirement: none
        explicit_non_requirement: >-
          V2-S3 must not require a projected component id to appear in
          verification.input_tree.files[*].component_ids or in a content
          binding. V2-S2 permits an explicit empty component_ids list and does
          not make file anchoring a precondition of a COMPLETE projection.
      rules:
        - every current baseline component has either one REMOVED aggregate fact or five field facts
        - every added candidate component has one ADDED aggregate fact
        - aggregate component values contain exactly display_name, source_role, version_or_snapshot, licence_status, declaration_locator
        - shared component field facts cover exactly those five fields
        - baseline component identities equal the current registry component identities exactly
        - REMOVED and shared component ids exist in the current registry; ADDED component ids do not
        - before values equal current registry component values
        - RFC6901 escaping is validated for component ids
        - no partial, duplicate, missing, or extra component projection is accepted
        - input-tree component_ids remain validated as V2-S2 file metadata but do not define or corroborate the component projection
      materiality_handoff: >-
        After these structural and baseline checks pass, an uncorroborated or
        unfamiliar candidate component value remains a valid observed fact.
        It is evaluated by the exact materiality policy; changed, added, or
        removed component facts are material under the applicable component
        rule or conservative terminal default. Lack of a file anchor or an
        unfamiliar role is never by itself DRIFT_FACT_INVARIANT_INVALID.

  summary_and_outcome_recompute:
    steps:
      - recompute every classification from envelopes
      - recompute all summary counts from facts
      - require every summary grouping to sum to total_facts
      - require total_facts to equal facts length and be between 1 and 2048
      - derive OBSERVED_NO_DIFFERENCE only when every fact is UNCHANGED
      - otherwise derive OBSERVED_DIFFERENCE
      - require both artifacts stage_outcome to equal the derived value
    no_trust_rule: >-
      A self-hashed artifact with a forged summary, fact classification, stage
      outcome, before value, file observation, or registry binding is invalid.

current_registry_and_baseline_contract:
  validation_order:
    - read the canonical registry as a bounded no-follow regular UTF-8 file
    - load it with the public V2-S1 loader
    - run the public V2-S1 validator against the repository root
    - map declaration drift/reference errors separately from other registry invalidity
    - require the registry schema, id, hash basis, and self-hash to be valid
    - locate the pair source_id exactly once; UNKNOWN_SOURCE precedes hash comparison
    - require pair registry_content_hash to equal current registry_content_hash
    - require pair declaration_refs to equal the current source sequence
    - recompute and require source_record_content_hash
    - validate selected source actions, approval flag, consumers, owner, rollback metadata, and reserved boundaries
    - independently validate the complete V2-S2 fact universe against the current source
  no_readiness_interpretation:
    status_for_consumer_called: false
    READY_or_BLOCKED_used_as_materiality: false
    lifecycle_mutation_or_candidate_lifecycle: false
  source_record_hash_algorithm: >-
    Serialize the selected raw source-record mapping as canonical JSON with
    sorted mapping keys, compact separators, ensure_ascii=false,
    allow_nan=false, preserved sequences, and no trailing LF; hash its UTF-8
    bytes with SHA-256. Remove no field.
  action_preconditions:
    - drift_policy.actions is unique exactly and after casefold
    - every action is in the V2-S1 allowed enum
    - actions preserve the V2-S1 enum relative order
    - drift_policy.approval_required is exactly true
    - an unknown action, promote-like action, duplicate, reordered action, or false approval flag is a baseline failure
  consumer_edge_preconditions:
    - every source consumer id exists exactly once in registry consumers
    - the reverse consumer.required_sources edge contains the selected source
    - source consumer sequence contains no duplicate or case collision
    - no reserved consumer id appears on the selected source
    - target owner always comes from the current registry, never a candidate after value
  immutable_first_snapshot:
    include:
      - registry file
      - every declaration_refs.path in all seven source records
      - every preservation_rules.path
      - V2-S2 input leaf directory and both artifacts
      - materiality policy
      - a non-null-predecessor rollback artifact and every bound current/predecessor file when present
    stable_fields:
      - entry type
      - st_dev where supplied
      - st_ino where supplied
      - st_size
      - st_mtime_ns where supplied
      - st_ctime_ns where supplied
      - raw bytes for every read file
      - complete enumerated entry set for each governed directory
    ignore:
      - st_atime
  immutable_second_snapshot:
    timing: >-
      After policy evaluation, impact routing, rollback rehearsal, and both
      complete output objects are computed, but before creating any output
      directory or file.
    steps:
      - repeat no-follow enumeration, lstat, bounded reads, and hashes
      - rerun V2-S1 load/validation
      - rerun policy parse/hash/binding validation
      - rerun V2-S2 artifact parse/hash/cross-binding validation
      - rerun rollback artifact/hash/file checks when applicable
      - require exact equality with the first snapshot and validation reports
    failures:
      v2_s2_input_changed: input invalid, exit 2, no artifacts
      registry_or_declaration_changed: baseline mismatch, exit 5, no artifacts
      policy_changed: policy mismatch, exit 6, no artifacts
      rollback_input_changed: rollback rehearsal failure, exit 8, no artifacts

materiality_policy_contract:
  production_file:
    path: configs/sourceops/materiality_policy.yaml
