authority_amendment:
  id: V2-S3-A1-ROLLBACK-BINDING-AND-RED-NON-VACUITY
  trigger: >-
    Independent review proved the original non-null READY rollback contract
    structurally unreachable. The raw current source-record hash and the full
    registry hash both include rollback.rollback_artifact, whose filename was
    required to equal the rollback artifact's own content hash; embedding
    either full hash in that artifact therefore required a cryptographic
    fixpoint.
  decision:
    chosen: OPTION_A_DEDICATED_ROLLBACK_SOURCE_RECORD_BINDING
    rationale: >-
      Retain filename-bound content addressing and introduce one dedicated,
      versioned source-record binding hash whose only transformed value is
      rollback.rollback_artifact. The rollback input artifact carries the
      normalized current and predecessor bindings, not the full registry or
      full source-record hashes that contain the artifact path. V2-S3
      independently validates and emits the full hashes beside the normalized
      hashes in its output pair.
    rejected:
      option: OPTION_B_DROP_FILENAME_OWN_HASH
      reason: >-
        Dropping the filename binding would remove useful content-addressed
        discovery, collision detection, and immutable admission semantics when
        the cycle can instead be removed without weakening those properties.
  cycle_proof:
    original: >-
      A = SHA256(artifact(registry_hash(record_path(A)),
      source_record_hash(record_path(A)))) required an accidental SHA-256
      fixpoint before a READY artifact could exist.
    amended: >-
      Under raptor.sourceops.rollback_source_record_binding_hash.v1, B =
      SHA256(canonical(record_path(SENTINEL))); A =
      SHA256(canonical(artifact(B))); path = rb-A.json. Full source-record and
      registry hashes are computed only after path assignment and are emitted
      by V2-S3, never fed back into A.
  preserved_authority:
    - V2-S1 registry schema, hash basis, content hash, and all seven current source-record hashes
    - V2-S2 schemas, hash bases, artifacts, component projection authority, and public behavior
    - rollback artifact filename-own-hash and canonical-byte requirements
    - materiality policy mapping, version, hash, selectors, outcomes, and registry binding
    - all proposal-only, no-execution, no-network, preservation, mutation, and output guarantees
  policy_impact:
    materiality_policy_mapping_changed: false
    materiality_policy_content_hash_changed: false
    retained_policy_content_hash: 8e6fb7cf254afdda56858308be94e2f2c3456df9e46c9b8fcb19cb0cf17297a5
    policy_config_edit_authorized: false
    reason: >-
      The policy binds the unchanged full registry and V2-S2 schemas. The new
      hash basis is confined to rollback metadata admission and V2-S3 output
      bindings; it changes no materiality rule or policy input.

