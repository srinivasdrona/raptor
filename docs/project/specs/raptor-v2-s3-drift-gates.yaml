  cleanup_contract:
    - fixture names include the test id plus a collision-resistant suffix
    - cleanup runs in fixture finalizers after success, failure, and skip
    - before deletion lstat every owned path and reject links/reparses/special entries
    - delete only paths carrying the fixture's ownership marker in memory and canonical path
    - never delete .raptor/sourceops/generated/staged-snapshots or drift-plans parents
    - never delete a pre-existing leaf or a file not created by that test
    - a cleanup failure fails the test and reports only canonical repository-relative paths
  skip_policy:
    xfail: forbidden
    unconditional_skip: forbidden
    WSL_core_cases_mandatory:
      - symlink rejection
      - dangling symlink rejection
      - CRLF canonical behavior
      - unreadable-read boundary through a deterministic public-boundary sentinel
    conditional_physical_skip_allowed_only_for:
      - creating a Windows junction/reparse point when the host denies the required privilege
      - creating a FIFO/device when the mounted filesystem reports the feature unsupported
      - physical chmod unreadability when DrvFS cannot enforce it
    companion_rule: >-
      Every conditionally skipped physical probe has a mandatory non-skipped
      lstat/read-boundary simulation proving the same closed error. os.name,
      CI, or WSL alone is not a skip reason.
  independent_oracle_rules:
    - canonical hashes are recomputed in test code written from this file
    - policy expected mapping/hash is not imported from implementation
    - route and blocker expected tables are literal test data from this authority
    - no private implementation helper decides expected output
    - representative tests compare complete persisted files and complete stdout bytes

migration_compatibility_and_backout:
  migration:
    registry_schema: none
    V2_S2_artifact_schema: none
    rollback_input_artifact_schema: pre_publication_v1_authority_correction
    V2_S3_output_artifact_schemas: pre_publication_v1_authority_correction
    domain_declarations: none
    data: none
    database: none
    service: none
    scheduler: none
  additive_changes:
    - one checked-in materiality policy config
    - one SourceOps planning module plus additive exports/CLI/models/helpers
    - four new V2-S3 test files and optional tiny synthetic fixtures
  compatibility:
    - V2-S1 registry remains the current governance baseline
    - V2-S2 artifacts remain immutable and are never upgraded in place
    - validate, status, and verify-stage outputs/exits remain byte-compatible
    - a V2-S2 pair bound to an old registry fails rather than auto-rebinding
    - a policy bound to an old registry fails rather than auto-updating
    - the materiality policy mapping/version/hash remains exactly unchanged
    - >-
      rollback input and V2-S3 output schema ids remain v1 for this correction
      because no non-null artifact or V2-S3 output has been accepted or
      published and the superseded contract admitted no READY artifact
    - after the first accepted V2-S3 publication, breaking policy, rollback, output, or CLI changes require new schema/hash ids
  rollback_artifact_migration_rule: >-
    Current null-predecessor legacy paths remain untouched and may remain
    absent. No checked-in or accepted non-null rollback artifact exists.
    Synthetic/draft artifacts using registry_content_hash,
    current_source_record_content_hash, or
    predecessor_source_record_content_hash as rollback input fields are
    incompatible and must be regenerated algorithmically with the normalized
    v1 binding fields; they are never rewritten or trusted in place. A future
    non-null lineage uses the corrected content-addressed JSON contract in a
    separately approved registry admission. V2-S3 performs no migration or
    unsafe registry repair.
  backout: >-
    Revert only V2-S3 policy/code/exports/CLI additions and V2-S3 tests.
    Existing V2-S1/V2-S2 files and operator inputs remain untouched. Generated
    V2-S3 artifacts may be retained for audit or removed manually by an
    operator; V2-S3 has no automated deletion. No data, evidence, registry,
    declaration, database, service, or rollback recovery is required.

human_adjudication_points:
  policy:
    - accept or reject the exact materiality policy hash and rule set
    - require a new policy version for any changed rule or registry binding
  each_generated_plan:
    - decide whether a proposed route should be authorized
    - decide whether a blocked rollback prerequisite should be repaired in a separate change
    - decide whether a ready rollback should ever be executed under a separate authority
    - decide whether source promotion or lifecycle change is appropriate under a future spec
    - decide scientific, legal, evidentiary, clinical, RescueScreen, and panel questions outside SourceOps
  machine_default: no approval and no action

open_questions_resolved_by_planning:
  - question: arbitrary artifact paths versus fixed discovery
    resolution: one --manifest-hash selects one exact final V2-S2 leaf; no path override
  - question: trust V2-S2 successful outcome
    resolution: independently validate both full artifacts and current baseline before interpretation
  - question: checked-in versus CLI materiality thresholds
    resolution: one versioned self-hashed config at configs/sourceops/materiality_policy.yaml
  - question: policy registry binding
    resolution: exact current registry hash; registry change requires policy re-adjudication
  - question: non-material baseline
    resolution: only non-historical, non-freshness-required retrieved_at-only change is non-material
  - question: unknown or ambiguous facts
    resolution: invalid fact structure or conservative material default; never non-material
  - question: material versus non-material exit code
    resolution: both are successful observation exit 0; JSON carries the result
  - question: stage_diff route
    resolution: validated V2-S2 input evidences the declared prerequisite; V2-S3 emits no redundant route or execution claim
  - question: promotion action
    resolution: absent from V2-S1 enum and forbidden in V2-S3 v1
  - question: artifact count
    resolution: exactly two combined assessment/plan artifacts, no executable manifest
  - question: null predecessor and missing legacy rollback path
    resolution: NO_PREDECESSOR/NOT_APPLICABLE, no read, no blocker, exit 0
  - question: non-null predecessor missing rollback artifact
    resolution: stable BLOCKED plan pair, no operations/rollback route, exit 8
  - question: rollback artifact filename/hash cycle
    resolution: >-
      choose Option A; use the domain-separated normalized source-record
      binding in the input artifact, omit cyclic full hashes there, retain
      filename-own-hash, and emit normalized plus full hashes in V2-S3 plans
  - question: COMPLETE component projection file anchoring
    resolution: >-
      none beyond V2-S2 authority; validate exact registry/projection facts,
      then evaluate structurally valid unfamiliar or uncorroborated facts
      conservatively
  - question: mapped-test non-vacuity
    resolution: >-
      every AC/FM has exact required production-surface categories; unrelated
      public calls, spec checks, and local-helper-only tests do not satisfy them
  - question: V2-S3 creates rollback metadata
    resolution: no; future source admission supplies it under separate approval
  - question: rollback commands
    resolution: none; only closed inert typed operations with executed=false
  - question: current time
    resolution: observed_at is inherited only from V2-S2
  - question: concurrency
    resolution: whole-leaf transaction semantics equivalent to proven V2-S2 behavior
  - question: real source rehearsals in implementation acceptance
    resolution: excluded; use current offline integration and synthetic rollback fixtures only

v2_phase_rehearsal_handoff:
  timing: after V2-S3 implementation publication and human acceptance
  separate_rehearsals:
    - one mutable source with a separately admitted immutable predecessor and rollback artifact
    - one external-content-root refresh with its own bounded source-specific acquisition/staging authority
  prerequisites:
    - no network or source acquisition is added to V2-S3
    - each candidate first passes V2-S2 and then V2-S3 offline
    - each V2-S3 output remains proposal-only and is reviewed by a human
    - preservation checks remain clean
    - no promotion, rebuild, invalidation, regrounding, rerun, or rollback occurs without separate approval
  implementation_acceptance_exclusion: >-
    These real rehearsals are not embedded in V2-S3 RED or implementation
    acceptance. Tests use synthetic/checked-in tiny fixtures and current
    repository declarations only.
  handoff_evidence:
    - V2-S2 diff and verification refs
    - V2-S3 impact plan ref
    - V2-S3 rollback rehearsal plan ref
    - human adjudication record outside the machine artifacts

definition_of_done:
  planner_stage:
    - this file is the sole detailed V2-S3 authority
    - kickoff V2-S3 entry points here and says planning complete
    - only the two allowed documentation files differ
    - both edited YAML files parse with WSL /home/sdrona/raptor/bin/python and yaml.safe_load
    - WSL-normalized git diff --check succeeds with required worktree/git-dir/config
    - no commit or push is made
  red_stage:
    - Codex 5.3 authors every mapped named test before implementation
    - new tests fail for missing V2-S3 behavior, not for fixture or environment defects
    - V2-S1/V2-S2 tests remain unchanged and green
  implementation_stage:
    - Sonnet 5 implements without weakening RED, V2-S1, or V2-S2
    - production policy exactly matches the approved mapping and self-hash
    - every acceptance criterion and falsifier probe passes
    - all minimum WSL commands pass sequentially
    - generated bytes are reproducible and only fixed output leaves change
    - Opus 5 independently records PASS
    - human adjudication accepts the policy hash and implementation
  stop_conditions:
    - published V2-S2 commit or current V2-S1 registry differs from the planning baseline unexpectedly
    - implementation requires registry/declaration/preservation edits to make tests pass
    - implementation requires network, external content, new dependency, scheduler, service, database, UI, API, or domain import
    - an artifact or route would claim approval, execution, promotion, readiness, scientific/legal sufficiency, clinical authority, or RescueScreen/panel authorization
    - fixed-path, no-follow, mutation, bounded-parser, or transactional publication guarantees cannot be demonstrated under WSL
    - a doer proposes creating current missing rollback files for null-predecessor records
  not_done_by_v2_s3:
    - source acquisition, promotion, activation, or lifecycle change
    - policy outcome approval
    - benchmark rebuild or validation rerun
    - packet invalidation or Atlas regrounding
    - consumer block execution
    - rollback or file restoration
    - mutable-source or external-content-root real rehearsal
    - evidence, classification, clinical, RescueScreen, or panel result
