      - artifact_content_hash
      - hash_basis
      - rollback_source_record_binding_hash_basis
      - current_source_id
      - current_rollback_source_record_binding_hash
      - predecessor_source_id
      - predecessor_rollback_source_record_binding_hash
      - current_declaration_refs
      - predecessor_declaration_refs
      - file_bindings
      - preservation_bindings
    self_hash: remove only artifact_content_hash and hash canonical JSON without LF
    recursively_forbidden_keys:
      - command
      - shell
      - script
      - executable
      - execute
      - executed
      - approval
      - promote
      - promotion
      - delete
  FileBinding:
    required_exact:
      - binding_id
      - predecessor_path
      - predecessor_content_byte_size
      - predecessor_canonical_lf_sha256
      - current_path
      - current_content_byte_size
      - current_canonical_lf_sha256
    rules:
      - binding_id is unique exactly and after casefold
      - sequence is strictly ascending by binding_id
      - all sizes are positive JSON integers no greater than the file limit
      - every path is canonical repository-relative and safe
      - every current declaration_refs.path appears exactly once as current_path
      - every predecessor declaration_refs.path appears exactly once as predecessor_path
      - current and predecessor declaration counts must be equal
      - declared hashes equal their corresponding declaration_ref canonical_lf_sha256
      - actual strict UTF-8 canonical-LF byte sizes/hashes equal the artifact values
      - source and target paths cannot be generated, staging, policy, registry, or rollback metadata paths
      - preservation overlap is structurally representable but is evaluated only by the dedicated preservation-conflict check
  PreservationBinding:
    required_exact:
      - rule_id
      - path
      - content_byte_size
      - canonical_lf_sha256
    rules:
      - sequence exactly matches current registry preservation_rules by rule_id/path order
      - each file is strict UTF-8 text and its canonical-LF size/hash match
      - all rule ids and paths are unique exactly and after casefold
  exact_cross_bindings:
    - current_source_id equals the selected V2-S2 source
    - predecessor_source_id equals current rollback.predecessor_source_id
    - rollback_source_record_binding_hash_basis equals the fixed v1 basis
    - both rollback source-record binding hashes recompute from the current registry
    - both declaration-ref sequences equal their current registry records
    - file and preservation bindings are complete, exact, and content-valid
    - the current registry path filename equals artifact_content_hash
    - full registry and source-record hashes recompute independently for V2-S3 output binding but are not artifact fields
  future_admission_rule: >-
    Adding a non-null predecessor requires the rollback artifact to exist and
    be content-addressed in the same separately approved registry admission.
    Creating a formerly missing artifact in place without a new registry hash,
    policy binding, and V2-S2 observation is not an allowed repair.

rollback_rehearsal_contract:
  lineage_validation:
    steps:
      - read current rollback metadata from the validated registry
      - require immutable_predecessor_required=true
      - if predecessor is null, stop lineage traversal with NO_PREDECESSOR
      - otherwise require predecessor exists exactly once and differs from current source
      - require predecessor lifecycle is VERIFIED_ACTIVE or PINNED_HISTORICAL
      - require predecessor immutable_predecessor_required=true
      - require matching authoritative_locator under the V2-S1 lineage rule
      - traverse predecessor links to a null root with no repeated id
      - cap traversal at registry source-record count
    invalid_lineage: current baseline invalid, exit 5, no artifacts
  root_source_semantics:
    lineage_status: NO_PREDECESSOR
    rehearsal_outcome: NOT_APPLICABLE
    reason_code: NO_PREDECESSOR
    rollback_artifact_status: NOT_REQUIRED
    rollback_artifact_content_hash: null
    rollback_source_record_binding_hash_basis: raptor.sourceops.rollback_source_record_binding_hash.v1
    current_rollback_source_record_binding_hash: recomputed
    predecessor_source_record_content_hash: null
    predecessor_rollback_source_record_binding_hash: null
    predecessor_declaration_refs: []
    integrity_checks_not_applicable: true
    proposed_operations: []
    rollback_route_eligible: false
    missing_legacy_path_is_not_a_blocker: true
  non_null_rehearsal:
    read_only_checks_in_order:
      - safe rollback artifact path
      - rollback artifact exists as a regular no-follow file
      - strict canonical schema, filename hash, and self-hash
      - normalized current/predecessor source and declaration cross-bindings
      - dedicated preservation-target conflict gate before any current/predecessor file or preservation-binding check
      - current declaration file size/hash bindings
      - predecessor immutable file size/hash bindings
      - complete preservation binding size/hash checks
      - no file/path/registry/policy/input mutation across both snapshots
    ready_result:
      outcome: READY_FOR_HUMAN_ADJUDICATION
      reason_code: REHEARSAL_INTEGRITY_VALID
      blocker: null
    blocked_result:
      outcome: BLOCKED
      one_blocker_only: true
      exit_code: 8
      artifacts_are_published_when_inputs_are_stable: true
      no_rollback_route: true
  blocker_precedence:
    - ROLLBACK_PATH_INVALID
    - ROLLBACK_ARTIFACT_MISSING
    - ROLLBACK_ARTIFACT_TYPE_INVALID
    - ROLLBACK_ARTIFACT_READ_FAILED
    - ROLLBACK_ARTIFACT_LIMIT_EXCEEDED
    - ROLLBACK_ARTIFACT_ENCODING_INVALID
    - ROLLBACK_ARTIFACT_JSON_INVALID
    - ROLLBACK_ARTIFACT_CANONICAL_BYTES_INVALID
    - ROLLBACK_ARTIFACT_SCHEMA_INVALID
    - ROLLBACK_ARTIFACT_FILENAME_HASH_MISMATCH
    - ROLLBACK_ARTIFACT_HASH_MISMATCH
    - ROLLBACK_ARTIFACT_BINDING_MISMATCH
    - ROLLBACK_PRESERVATION_CONFLICT
    - ROLLBACK_FILE_BINDING_INVALID
    - ROLLBACK_CURRENT_CONTENT_MISMATCH
    - ROLLBACK_PREDECESSOR_CONTENT_UNAVAILABLE
    - ROLLBACK_PRESERVATION_BINDING_MISMATCH
  blocker_schema:
    required_exact:
      - code
      - phase
      - subject
      - expected
      - actual
    details_rule: JSON-safe, bounded, canonical, and never raw exception text
  binding_failure_partition:
    ROLLBACK_ARTIFACT_SCHEMA_INVALID: >-
      A required normalized-binding field is missing, extra, malformed, or has
      an unknown hash-basis id.
    ROLLBACK_ARTIFACT_FILENAME_HASH_MISMATCH: >-
      The safe rb-<hash>.json filename does not equal the declared artifact
      content hash.
    ROLLBACK_ARTIFACT_HASH_MISMATCH: >-
      The declared artifact content hash does not equal the self-excluding
      canonical artifact hash.
    ROLLBACK_ARTIFACT_BINDING_MISMATCH: >-
      A structurally valid declared normalized source-record hash, source id,
      or declaration sequence does not equal the recomputed current-registry
      value. Detailed file and preservation binding validation belongs to its
      later dedicated checks.
    DRIFT_BASELINE_BINDING_MISMATCH: >-
      A full V2-S2 registry/source-record/declaration binding is stale; this is
      a baseline error with exit 5 and no artifacts, not a rollback blocker.
  performed_integrity_check:
    required_exact:
      - check
      - status
    statuses:
      - PASS
      - FAIL
      - NOT_APPLICABLE
    exact_checks:
      - CURRENT_SOURCE_BINDING
      - PREDECESSOR_SOURCE_BINDING
      - LINEAGE_ACYCLIC
      - ROLLBACK_PATH_SAFE
      - ROLLBACK_ARTIFACT_PRESENT
      - ROLLBACK_ARTIFACT_HASH_MATCH
      - ROLLBACK_ARTIFACT_BINDINGS_MATCH
      - CURRENT_FILES_MATCH
      - PREDECESSOR_FILES_MATCH
      - PRESERVATION_BINDINGS_MATCH
      - PRESERVATION_TARGETS_CLEAR
      - INPUTS_IMMUTABLE
    reporting_and_execution_semantics:
      exact_checks_is_canonical_reporting_order: true
      status_rule: >-
        Status records actual execution, not a position-derived fiction. A
        performed successful check is PASS, the dedicated failed check is
        FAIL, and every bypassed or unexecuted check is NOT_APPLICABLE even
        when that row appears earlier in exact_checks.
      blocker_index_prefix_fill: forbidden
      preservation_conflict_execution: >-
        After the first seven checks succeed, execute
        PRESERVATION_TARGETS_CLEAR before CURRENT_FILES_MATCH,
        PREDECESSOR_FILES_MATCH, and PRESERVATION_BINDINGS_MATCH. On conflict,
        fail it immediately, bypass those three file/binding checks and
        INPUTS_IMMUTABLE, and emit no operation.
      ROLLBACK_PRESERVATION_CONFLICT_exact_vector:
        expected_length: 12
        rows_in_exact_checks_order:
          - {check: CURRENT_SOURCE_BINDING, status: PASS}
          - {check: PREDECESSOR_SOURCE_BINDING, status: PASS}
          - {check: LINEAGE_ACYCLIC, status: PASS}
          - {check: ROLLBACK_PATH_SAFE, status: PASS}
          - {check: ROLLBACK_ARTIFACT_PRESENT, status: PASS}
          - {check: ROLLBACK_ARTIFACT_HASH_MATCH, status: PASS}
          - {check: ROLLBACK_ARTIFACT_BINDINGS_MATCH, status: PASS}
          - {check: CURRENT_FILES_MATCH, status: NOT_APPLICABLE}
          - {check: PREDECESSOR_FILES_MATCH, status: NOT_APPLICABLE}
          - {check: PRESERVATION_BINDINGS_MATCH, status: NOT_APPLICABLE}
          - {check: PRESERVATION_TARGETS_CLEAR, status: FAIL}
          - {check: INPUTS_IMMUTABLE, status: NOT_APPLICABLE}
        statuses_in_exact_checks_order:
          - PASS
          - PASS
          - PASS
          - PASS
          - PASS
          - PASS
          - PASS
          - NOT_APPLICABLE
          - NOT_APPLICABLE
          - NOT_APPLICABLE
          - FAIL
          - NOT_APPLICABLE
    binding_check_semantics:
      CURRENT_SOURCE_BINDING: >-
        Current id, normalized binding hash, and declaration refs match the
        current raw registry record; the full current record hash is separately
        retained for output.
      PREDECESSOR_SOURCE_BINDING: >-
        Predecessor id, normalized binding hash, lifecycle, immutable lineage,
        and declaration refs match the exact predecessor raw registry record;
        the full predecessor record hash is separately retained for output.
      ROLLBACK_ARTIFACT_HASH_MATCH: >-
        Canonical bytes, artifact self-hash, and filename hash all match.
      ROLLBACK_ARTIFACT_BINDINGS_MATCH: >-
        Hash-basis id, source ids, normalized record hashes, and declaration
        refs match. The file/preservation sequences have closed schema, but
        their target membership and content are not claimed checked here;
        those belong to CURRENT_FILES_MATCH, PREDECESSOR_FILES_MATCH, and
        PRESERVATION_BINDINGS_MATCH.
  proposed_operation_contract:
    required_exact:
      - operation_id
      - sequence
      - operation_type
      - source_path
      - target_path
      - expected_source_hash
      - expected_target_hash
      - preservation_rule_id
      - proposal_only
      - approval_required
      - approval_state
      - executed
    operation_types:
      - REVALIDATE_INPUT_BINDINGS
      - REVALIDATE_PRESERVATION_BOUNDARIES
      - RESTORE_DECLARATION_FROM_PREDECESSOR
      - VERIFY_RESTORED_DECLARATION_HASH
      - REQUEST_HUMAN_ADJUDICATION
    constants:
      proposal_only: true
      approval_required: true
      approval_state: NOT_GRANTED
      executed: false
    no_command_fields: true
    ready_plan_order:
      - one REVALIDATE_INPUT_BINDINGS
      - one REVALIDATE_PRESERVATION_BOUNDARIES
      - one RESTORE_DECLARATION_FROM_PREDECESSOR per file binding in binding order
      - one VERIFY_RESTORED_DECLARATION_HASH per file binding in binding order
      - one REQUEST_HUMAN_ADJUDICATION
    blocked_or_not_applicable_operations: []
    execution_ceiling: >-
      These are inert typed descriptions. V2-S3 contains no dispatcher,
      subprocess, shell, file-copy, file-replace, delete, chmod, workflow, or
      callback surface capable of executing them.
  creates:
    rollback_metadata_artifact: false
    executable_rehearsal_manifest: false
    restoration_script: false
    rollback_rehearsal_plan_artifact: true

artifact_contracts:
  artifact_set_decision:
    count: 2
    impact_assessment_and_plan: one combined impact artifact
    rollback_rehearsal_and_plan: one combined rollback artifact
    separate_manifest: false
    rationale: >-
      Two cross-bound artifacts are the minimum coherent set. Each keeps
      observations, evaluation/checks, and proposals in separate closed
      sections without adding a mutable index or executable manifest.
  common_canonical_json:
    mapping_order: sorted keys
    separators: [',', ':']
    ensure_ascii: false
    allow_nan: false
    encoding: UTF-8
    hash_input_trailing_newline: false
    persisted_file_trailing_newline: exactly_one_LF
    write_mode: bytes_without_platform_newline_translation
    sequence_rule: preserve specified deterministic order
    explicit_null_rule: retain
  self_excluding_hash: >-
    Deep-copy the complete artifact mapping, remove only top-level
    artifact_content_hash, serialize common canonical JSON without a trailing
    LF, and compute lowercase SHA-256.
  observed_at_rule: >-
    Copy observed_at byte-for-byte from the validated V2-S2 pair. No current
    time, command time, file time, policy approval time, or rollback time enters
    artifact bytes, hashes, paths, or successful CLI stdout.

  impact_artifact:
    schema: raptor.sourceops.drift_impact_plan.v1
    hash_basis: raptor.sourceops.drift_impact_plan_content_hash.v1
    top_level_required_exact:
      - schema
      - artifact_content_hash
      - hash_basis
      - observed_at
      - input_binding
      - observation
      - policy_evaluation
      - proposal
      - proposal_only
      - approval_required
      - approval_state
      - executed
      - validation_ceiling
    constants:
      proposal_only: true
      approval_required: true
      approval_state: NOT_GRANTED
      executed: false
    input_binding_required_exact:
      - manifest_content_hash
      - diff_artifact
      - verification_artifact
      - registry
      - source
      - policy
    artifact_ref_required_exact:
      - path
      - content_hash
      - schema
    registry_binding_required_exact:
      - path
      - schema
      - registry_id
      - content_hash
    source_binding_required_exact:
      - source_id
      - source_record_content_hash
      - rollback_source_record_binding_hash_basis
      - rollback_source_record_binding_hash
      - declaration_refs
    policy_binding_required_exact:
      - path
      - schema
      - policy_id
      - policy_version
      - content_hash
      - approval_mode
    observation_required_exact:
      - stage_outcome
      - summary
      - fact_ids
    policy_evaluation_required_exact:
      - outcome
      - counts
      - evaluations
    proposal_required_exact:
      - source_declared_actions
      - action_dispositions
      - routes
    rules:
      - observed before/after values remain authoritative only in the referenced V2-S2 diff
      - evaluations are one-to-one and in V2-S2 fact order
      - proposed routes satisfy exact route order and uniqueness
      - no route carries an approved or executed state

  rollback_artifact:
    schema: raptor.sourceops.rollback_rehearsal_plan.v1
    hash_basis: raptor.sourceops.rollback_rehearsal_plan_content_hash.v1
    top_level_required_exact:
      - schema
      - artifact_content_hash
      - hash_basis
      - observed_at
      - input_binding
      - impact_plan_content_hash
      - lineage
      - rollback_artifact
      - integrity_checks
      - rehearsal
      - proposal_only
      - approval_required
      - approval_state
      - executed
      - validation_ceiling
    constants:
      proposal_only: true
      approval_required: true
      approval_state: NOT_GRANTED
      executed: false
    input_binding: same_as_impact_artifact
    lineage_required_exact:
      - status
      - rollback_source_record_binding_hash_basis
      - current_source_id
      - current_source_record_content_hash
      - current_rollback_source_record_binding_hash
      - current_declaration_refs
      - predecessor_source_id
      - predecessor_source_record_content_hash
      - predecessor_rollback_source_record_binding_hash
      - predecessor_declaration_refs
      - chain
    lineage_chain_entry_required_exact:
      - source_id
      - source_record_content_hash
      - rollback_source_record_binding_hash
    lineage_chain_rule: >-
      Current source first, then each predecessor, ending at the null-root
      source; every id and both hashes recompute from the current registry, and
      the sequence is unique and bounded.
    rollback_artifact_required_exact:
      - registry_path
      - status
      - content_hash
      - file_bindings
      - preservation_bindings
    rollback_artifact_statuses:
      - NOT_REQUIRED
      - VERIFIED
      - BLOCKED
    rollback_artifact_field_rules:
      - root null-predecessor output retains the safe registry path, status NOT_REQUIRED, null hash, and empty binding sequences
      - a verified non-null artifact retains its safe canonical path, status VERIFIED, declared hash, and complete bindings
      - a blocked safe path retains the canonical path, status BLOCKED, nullable hash, and only fully validated bindings
      - ROLLBACK_PATH_INVALID uses registry_path=null and never echoes the unsafe raw value
    rehearsal_required_exact:
      - outcome
      - reason_code
      - blocker
      - rollback_route_eligible
      - proposed_operations
    cross_reference_rule: >-
      impact_plan_content_hash equals the exact self-hash of the impact artifact
      published in the same output leaf. Both artifacts repeat the same input
      binding and observed_at.

  output_write_policy:
    compute_before_write:
      - complete rollback assessment in memory
      - complete and self-hash impact artifact
      - bind impact hash into rollback artifact and self-hash rollback artifact
      - compute both exact persisted byte strings
      - require each and total persisted byte length to satisfy the output limits
      - complete the second immutable-input snapshot
    allowed_leaf_initial_states:
      - absent
      - existing real empty directory
      - existing real directory containing exactly the two expected identical final files
    rejected_leaf_states:
      - symlink, junction, reparse, special, or non-directory leaf
      - extra or unknown entry
      - expected filename with non-identical bytes
      - expected filename that is not a regular no-follow file
      - active, malformed, foreign, or orphan transaction lock
    idempotency: >-
      Identical valid inputs produce identical paths, names, hashes, bytes, and
      stdout. Existing identical files are accepted without rewrite or mtime
      change.
    transaction_pattern:
      fixed_lock_name: .sourceops-transaction.lock
      temporary_prefix: .sourceops-artifact-tmp-
      acquire_timeout_seconds: 30
      rules:
        - all writers contend on the exact same per-leaf in-process and on-disk lock
        - on-disk lock creation is exclusive and owner metadata is bounded and parseable
        - a live owner is bounded-waited; foreign, malformed, dead, or orphan lock is preserved and fails closed
        - no run reclaims or deletes a lock or temp file it did not create
        - final creation is exclusive; a winner is accepted only after no-follow byte-identical reread
        - on handled failure remove only this run's own temp/finals and never a winner's bytes
        - publish impact then rollback as one whole-leaf transaction
    conceptual_reuse_rule: >-
      Reuse the proven V2-S2 transaction semantics. A behavior-preserving
      extraction to shared SourceOps artifact I/O is allowed only with
      byte-compatible V2-S2 tests; V2-S3 must not call unsafe private helpers
      or weaken V2-S2 collision/rollback guarantees.

typed_model_and_public_api_contract:
  required_public_models:
    - MaterialityPolicy
    - MaterialityRule
    - MaterialitySelectors
    - V2S2ArtifactRef
    - V2S2ArtifactPair
    - DiffFact
    - FactEvaluation
    - MaterialityAssessment
    - ActionDisposition
    - ProposedRoute
    - RoutePrerequisite
    - ImpactRoutingResult
    - RollbackMetadataArtifact
    - RollbackFileBinding
    - PreservationBinding
    - RollbackBlocker
    - RollbackIntegrityCheck
    - ProposedRollbackOperation
    - RollbackRehearsal
    - ImpactPlanArtifact
    - RollbackPlanArtifact
    - ArtifactReference
    - PlanDriftCliResult
    - PlanDriftResult
  immutability_and_types:
    - public state is frozen and slotted
    - sequences are tuples or another immutable concrete sequence
    - enums are closed string enums or equivalent literal-safe types
    - no public required field is Any, object, bare dict/list/tuple/set, or mutable raw mapping
    - optionality is explicit with typed nulls
    - serializers return fresh exact closed mappings only at JSON/YAML boundaries
  required_public_errors:
    base: DriftPlanningError
    subclasses_follow_error_catalog: true
    properties:
      - code
      - phase
      - exit_code
      - fixed message
      - JSON-safe subject
      - JSON-safe expected
      - JSON-safe actual
  required_public_functions:
    - signature: 'load_materiality_policy() -> MaterialityPolicy'
      behavior: load and validate only the fixed production policy
    - signature: 'load_v2_s2_artifact_pair(manifest_content_hash: str) -> V2S2ArtifactPair'
      behavior: discover and independently validate only the fixed final leaf
    - signature: 'evaluate_materiality(pair: V2S2ArtifactPair, registry: Registry, policy: MaterialityPolicy) -> MaterialityAssessment'
      behavior: pure deterministic evaluation with no filesystem mutation
    - signature: 'route_impact(assessment: MaterialityAssessment, registry: Registry, rehearsal: RollbackRehearsal) -> ImpactRoutingResult'
      behavior: pure deterministic proposal derivation
    - signature: 'rehearse_rollback(pair: V2S2ArtifactPair, registry: Registry) -> RollbackRehearsal'
      behavior: bounded read-only validation and inert plan construction
    - signature: 'plan_drift(manifest_content_hash: str) -> PlanDriftResult'
      behavior: complete production operation used by the CLI
  testability_rule: >-
    Tests may monkeypatch only public loader/repository-boundary functions to
    supply synthetic typed fixtures. They must not assert private helper names,
    copy private hash helpers as oracles, or require a CLI path override.
  V2_S1_V2_S2_reuse:
    - use public load_registry and validate_registry
    - consume public typed V2-S2 schemas or add independent public loaders
    - do not trust a mutable raw dictionary retained by a public result
    - helper extraction is behavior-preserving and additive only
  dependency_and_import_boundary:
    allowed:
      - Python standard library
      - PyYAML
      - raptor.sourceops modules
    forbidden:
      - requests
      - httpx
      - urllib.request
      - socket network use
      - subprocess
      - sqlite3
      - schedulers or workflow clients
      - raptor domain packages outside sourceops

cli_contract:
  existing_commands_byte_compatible:
    - validate
    - status
    - verify-stage
  new_command:
    count: 1
    command: plan-drift
    invocation: >-
      python -m raptor.sourceops.cli plan-drift
      --manifest-hash <lowercase-sha256>
    arguments:
      --manifest-hash:
        required: true
        regex: '^[0-9a-f]{64}$'
    forbidden_arguments:
      - --registry
      - --policy
      - --diff
      - --verification
      - --input
      - --output
      - --output-root
      - --force
      - --threshold
      - --materiality
      - --approve
      - --execute
      - --promote
      - --rollback
      - --consumer
      - --network
  exit_codes:
    0: >-
      Valid input, baseline, and policy; impact/rollback artifacts published;
      materiality is NO_OBSERVED_CHANGE, NON_MATERIAL_CHANGE, or
      MATERIAL_CHANGE; rollback is READY_FOR_HUMAN_ADJUDICATION or
      NOT_APPLICABLE.
    2: CLI usage or invalid/tampered/unsafe V2-S2 input pair
    4: source_id from the valid pair is absent from the valid current registry
    5: current registry, declarations, source record, actions, consumers, lineage, or V2-S2 baseline binding is invalid, stale, mismatched, or changed
    6: fixed policy is missing, invalid, tampered, unapproved-by-binding, mismatched, ambiguous, or changed
    7: generated-output boundary, collision, transaction, or write failure
    8: >-
      Input/baseline/policy evaluation succeeded and both artifacts were
      published, but a non-null-predecessor rollback rehearsal is BLOCKED; or a
      rollback input mutated before publication, in which case no artifact is
      published.
    70: unexpected internal failure caught at the plan-drift boundary
  successful_observation_exit_rule: >-
    Material and non-material observations both use exit 0. Materiality is data
    in deterministic JSON, not process failure. Exit 8 is reserved only for a
    mechanically blocked non-null rollback rehearsal.
  stdout:
    schema: raptor.sourceops.drift_plan_cli_result.v1
    serialization: canonical JSON one line followed by exactly one LF
    top_level_required_exact:
      - schema
      - command
      - run_status
      - input_validity
      - baseline_validity
      - policy_validity
      - assessment_outcome
      - rollback_rehearsal_outcome
      - source_id
      - manifest_content_hash
      - diff_artifact_content_hash
      - verification_artifact_content_hash
      - registry_content_hash
      - policy_content_hash
      - impact_plan
      - rollback_plan
      - error
      - proposal_only
      - approval_required
      - approval_state
      - executed
      - validation_ceiling
    constants:
      schema: raptor.sourceops.drift_plan_cli_result.v1
      command: plan-drift
      proposal_only: true
      approval_required: true
      approval_state: NOT_GRANTED
      executed: false
    run_status_values:
      - COMPLETED
      - FAILED
    input_validity_values:
      - VALID
      - INVALID
      - NOT_EVALUATED
    baseline_validity_values:
      - VALID
      - INVALID
      - MISMATCH
      - UNKNOWN_SOURCE
      - NOT_EVALUATED
    policy_validity_values:
      - VALID
      - INVALID
      - MISMATCH
      - NOT_EVALUATED
    assessment_outcome_values:
      - NO_OBSERVED_CHANGE
      - NON_MATERIAL_CHANGE
      - MATERIAL_CHANGE
      - INVALID
      - NOT_EVALUATED
    rollback_rehearsal_outcome_values:
      - READY_FOR_HUMAN_ADJUDICATION
      - NOT_APPLICABLE
      - BLOCKED
      - NOT_EVALUATED
    success_artifact_ref_required_exact:
      - path
      - content_hash
      - schema
    success_artifact_ref_rules:
      - impact_plan schema is raptor.sourceops.drift_impact_plan.v1
      - rollback_plan schema is raptor.sourceops.rollback_rehearsal_plan.v1
      - each path is the canonical forward-slash fixed output path
      - each content_hash equals the filename and artifact self-hash
    success_rules:
      - run_status=COMPLETED
      - input_validity=VALID
      - baseline_validity=VALID
      - policy_validity=VALID
      - both artifact refs are non-null
      - error=null
      - exit 0 or 8 according to rollback outcome
    failure_rules:
      - run_status=FAILED
      - artifact refs are null
      - error is non-null
      - usage/internal failures use NOT_EVALUATED outcomes
      - invalid V2-S2 bytes use assessment_outcome=INVALID
      - baseline failures use assessment_outcome=NOT_EVALUATED
      - policy invalidity uses assessment_outcome=INVALID
      - output failures retain already computed materiality/rollback outcomes
  stderr:
    handled_results: exactly_zero_bytes
    traceback_or_raw_exception_text: forbidden
  argument_error_rule: >-
    Missing, duplicate, extra, unknown, non-lowercase, or malformed plan-drift
    arguments emit one closed JSON CLI_USAGE_ERROR, exit 2, and empty stderr.
    Existing command argument behavior remains byte-compatible.

error_contract:
  error_envelope_required_exact:
    - code
    - type
    - phase
    - message
    - subject
    - expected
    - actual
  value_rules:
    subject: canonical repository-relative path, identifier, field name, or null
    expected: bounded JSON value or null
    actual: bounded JSON value or null
    message: fixed catalog text only
  deterministic_phase_order:
    - CLI
    - BOUNDARY
    - INPUT_DISCOVERY
    - ARTIFACT_READ
    - ARTIFACT_SCHEMA
    - ARTIFACT_HASH
    - ARTIFACT_CROSS_BINDING
    - BASELINE
    - FACT_VALIDATION
    - POLICY_READ
    - POLICY_SCHEMA
    - POLICY_HASH
    - MATERIALITY
    - ROUTING
    - ROLLBACK
    - IMMUTABILITY
    - OUTPUT
    - INTERNAL
  deterministic_selection:
    - fail on the first failing phase
    - within the pair validate verification before diff
    - inspect mapping fields in required_exact order
    - inspect sequences in index order
    - choose the lowest Unicode-sorted duplicate/collision subject
    - choose the first rollback blocker in blocker_precedence
    - emit exactly one error envelope or one rollback blocker, never both
  JSON_safety:
    - recursively normalize only JSON scalars, mappings, and sequences
    - non-finite or unsupported values become fixed type labels in error details
    - never call repr on an arbitrary object
    - never include absolute paths, drive letters, environment values, PIDs, tokens, or raw OS text
    - truncate normalized detail strings to 1024 Unicode code points
    - cap detail sequences and mappings at 64 entries and detail nesting at depth 8
  catalog:
    - code: CLI_USAGE_ERROR
      type: DriftCliUsageError
      phase: CLI
      exit: 2
      message: plan-drift arguments do not match the closed command contract
    - code: DRIFT_INPUT_LEAF_INVALID
      type: DriftInputLeafError
      phase: BOUNDARY
      exit: 2
      message: V2-S2 input leaf is outside the fixed safe generated boundary
    - code: DRIFT_INPUT_ARTIFACT_SET_INVALID
      type: DriftInputArtifactSetError
      phase: INPUT_DISCOVERY
      exit: 2
      message: V2-S2 input leaf does not contain exactly one final artifact pair
    - code: DRIFT_INPUT_LEAF_NOT_FINALIZED
      type: DriftInputLeafNotFinalizedError
      phase: INPUT_DISCOVERY
      exit: 2
      message: V2-S2 input leaf contains a lock, temporary, linked, special, or partial entry
    - code: DRIFT_ARTIFACT_READ_FAILED
      type: DriftArtifactReadError
      phase: ARTIFACT_READ
      exit: 2
      message: V2-S2 artifact could not be read as a bounded local regular file
    - code: DRIFT_ARTIFACT_LIMIT_EXCEEDED
      type: DriftArtifactLimitError
      phase: ARTIFACT_READ
      exit: 2
      message: V2-S2 artifact exceeds a closed byte or structure limit
    - code: DRIFT_ARTIFACT_ENCODING_INVALID
      type: DriftArtifactEncodingError
      phase: ARTIFACT_READ
      exit: 2
      message: V2-S2 artifact is not strict UTF-8 without a BOM
    - code: DRIFT_ARTIFACT_JSON_INVALID
      type: DriftArtifactJsonError
      phase: ARTIFACT_SCHEMA
      exit: 2
      message: V2-S2 artifact is not one duplicate-safe finite JSON mapping
    - code: DRIFT_ARTIFACT_CANONICAL_BYTES_INVALID
      type: DriftArtifactCanonicalBytesError
      phase: ARTIFACT_SCHEMA
      exit: 2
      message: V2-S2 artifact bytes are not canonical JSON with exactly one LF
    - code: DRIFT_VERIFICATION_SCHEMA_INVALID
      type: DriftVerificationSchemaError
      phase: ARTIFACT_SCHEMA
      exit: 2
      message: V2-S2 verification artifact violates its closed schema
    - code: DRIFT_DIFF_SCHEMA_INVALID
      type: DriftDiffSchemaError
      phase: ARTIFACT_SCHEMA
      exit: 2
      message: V2-S2 diff artifact violates its closed schema
    - code: DRIFT_ARTIFACT_FILENAME_HASH_MISMATCH
      type: DriftArtifactFilenameHashMismatch
      phase: ARTIFACT_HASH
      exit: 2
      message: V2-S2 artifact filename does not match its declared content hash
    - code: DRIFT_ARTIFACT_HASH_MISMATCH
      type: DriftArtifactHashMismatch
      phase: ARTIFACT_HASH
      exit: 2
      message: V2-S2 artifact self-hash does not match its canonical mapping
    - code: DRIFT_ARTIFACT_CROSS_BINDING_MISMATCH
      type: DriftArtifactCrossBindingMismatch
      phase: ARTIFACT_CROSS_BINDING
      exit: 2
      message: V2-S2 diff and verification artifacts do not bind the same observation
    - code: DRIFT_INPUT_TREE_HASH_MISMATCH
      type: DriftInputTreeHashMismatch
      phase: ARTIFACT_CROSS_BINDING
      exit: 2
      message: V2-S2 input-tree hash or summary does not recompute
    - code: DRIFT_BASELINE_REGISTRY_INVALID
      type: DriftBaselineRegistryError
      phase: BASELINE
      exit: 5
      message: current V2-S1 registry is invalid
    - code: DRIFT_BASELINE_DECLARATION_INVALID
      type: DriftBaselineDeclarationError
      phase: BASELINE
      exit: 5
      message: current V2-S1 declaration or preservation precondition is invalid
    - code: DRIFT_UNKNOWN_SOURCE
      type: DriftUnknownSourceError
      phase: BASELINE
      exit: 4
      message: V2-S2 source_id is not present in the current valid registry
    - code: DRIFT_BASELINE_BINDING_MISMATCH
      type: DriftBaselineBindingMismatch
      phase: BASELINE
      exit: 5
      message: V2-S2 source, registry, record, or declaration binding is stale or mismatched
    - code: DRIFT_BASELINE_ACTION_POLICY_INVALID
      type: DriftBaselineActionPolicyError
      phase: BASELINE
      exit: 5
      message: current source actions, approval flag, consumer edges, or reserved boundary are invalid
    - code: DRIFT_LINEAGE_INVALID
      type: DriftLineageError
      phase: BASELINE
      exit: 5
      message: current rollback predecessor lineage is not a valid immutable chain
    - code: DRIFT_FACT_INVARIANT_INVALID
      type: DriftFactInvariantError
      phase: FACT_VALIDATION
      exit: 2
      message: V2-S2 fact, summary, ordering, classification, provenance, or baseline invariant is invalid
    - code: DRIFT_POLICY_READ_FAILED
      type: DriftPolicyReadError
      phase: POLICY_READ
      exit: 6
      message: fixed materiality policy could not be read as a bounded local regular file
    - code: DRIFT_POLICY_ENCODING_INVALID
      type: DriftPolicyEncodingError
      phase: POLICY_READ
      exit: 6
      message: fixed materiality policy is not strict UTF-8
    - code: DRIFT_POLICY_YAML_INVALID
      type: DriftPolicyYamlError
      phase: POLICY_SCHEMA
      exit: 6
      message: fixed materiality policy is not one safe duplicate-free YAML mapping
    - code: DRIFT_POLICY_SCHEMA_INVALID
      type: DriftPolicySchemaError
      phase: POLICY_SCHEMA
      exit: 6
      message: fixed materiality policy violates its closed schema
    - code: DRIFT_POLICY_HASH_MISMATCH
      type: DriftPolicyHashMismatch
      phase: POLICY_HASH
      exit: 6
      message: fixed materiality policy self-hash does not match its canonical mapping
    - code: DRIFT_POLICY_BINDING_MISMATCH
      type: DriftPolicyBindingMismatch
      phase: POLICY_HASH
      exit: 6
      message: fixed materiality policy does not bind the current registry or V2-S2 schemas
    - code: DRIFT_POLICY_AMBIGUOUS
      type: DriftPolicyAmbiguityError
      phase: POLICY_HASH
      exit: 6
      message: fixed materiality policy contains ambiguous, duplicate, or unordered rules
    - code: DRIFT_MATERIALITY_EVALUATION_INVALID
      type: DriftMaterialityEvaluationError
      phase: MATERIALITY
      exit: 6
      message: materiality evaluation did not produce one closed result per valid fact
    - code: DRIFT_ROUTE_INVARIANT_INVALID
      type: DriftRouteInvariantError
      phase: ROUTING
      exit: 70
      message: proposed impact routes violate the closed dedupe, order, target, or approval contract
    - code: DRIFT_INPUT_MUTATED
      type: DriftInputMutationError
      phase: IMMUTABILITY
      exit: 2
      message: V2-S2 artifact pair changed during planning
    - code: DRIFT_BASELINE_CHANGED_DURING_RUN
      type: DriftBaselineMutationError
      phase: IMMUTABILITY
      exit: 5
      message: registry, declaration, preservation, or lineage input changed during planning
    - code: DRIFT_POLICY_CHANGED_DURING_RUN
      type: DriftPolicyMutationError
      phase: IMMUTABILITY
      exit: 6
      message: materiality policy changed during planning
    - code: DRIFT_ROLLBACK_INPUT_MUTATED
      type: DriftRollbackMutationError
      phase: IMMUTABILITY
      exit: 8
      message: rollback artifact or bound file changed during rehearsal
    - code: DRIFT_OUTPUT_BOUNDARY_INVALID
      type: DriftOutputBoundaryError
      phase: OUTPUT
      exit: 7
      message: drift-plan output path is not a safe real path below the fixed boundary
    - code: DRIFT_OUTPUT_LIMIT_EXCEEDED
      type: DriftOutputLimitError
      phase: OUTPUT
      exit: 7
      message: drift-plan artifact pair exceeds a closed output byte limit
    - code: DRIFT_OUTPUT_COLLISION
      type: DriftOutputCollisionError
      phase: OUTPUT
      exit: 7
      message: content-addressed drift-plan leaf contains non-identical or unknown content
    - code: DRIFT_OUTPUT_WRITE_FAILED
      type: DriftOutputWriteError
      phase: OUTPUT
      exit: 7
      message: drift-plan artifact pair could not be published atomically
    - code: DRIFT_INTERNAL_ERROR
      type: DriftInternalError
      phase: INTERNAL
      exit: 70
      message: plan-drift failed closed because of an unexpected internal error

implementation_and_repository_layout:
  implementation_allowed:
    create:
      - configs/sourceops/materiality_policy.yaml
      - src/raptor/sourceops/drift_planning.py
    update_additively:
      - src/raptor/sourceops/__init__.py
      - src/raptor/sourceops/cli.py
      - src/raptor/sourceops/model.py
    conditional_shared_helpers:
      - src/raptor/sourceops/artifact_io.py
      - src/raptor/sourceops/hashing.py
      - src/raptor/sourceops/paths.py
    rule: >-
      Shared helper extraction is allowed only when observable V2-S1/V2-S2
      behavior, bytes, errors, exits, and tests remain unchanged. No private
      V2-S2 implementation function becomes a required V2-S3 public contract.
  red_test_author_expected:
    create:
      - tests/sourceops/test_drift_planning_contract.py
      - tests/sourceops/test_drift_planning_cli.py
      - tests/sourceops/test_drift_planning_safety.py
      - tests/sourceops/test_drift_planning_repository.py
    may_create_fixture_directory:
      - tests/sourceops/fixtures/drift_planning/
  forbidden_changes:
    - configs/sourceops/source_registry.yaml
    - configs/sourceops/rollbacks/
    - configs/ingest/
    - configs/eval/
    - configs/external/
    - configs/atlas/
    - configs/acmg/
    - data/
    - docs/project/TODOS.yaml
    - dependency manifests
    - existing domain packages
    - existing V2-S1/V2-S2 tests except additive shared-fixture imports with byte-identical assertions
    - any RescueScreen or panel-product path
  runtime_artifacts:
    V2_S2_input: .raptor/sourceops/generated/staged-snapshots/<manifest-hash>/
    V2_S3_output: .raptor/sourceops/generated/drift-plans/<diff-hash>/<policy-hash>/
    tracked: false
  fixture_decisions:
    checked_in_generated_golden_artifacts: false
    checked_in_real_rollback_artifacts: false
    rollback_rehearsal_fixtures: synthetic_only
    optional_tiny_payload_limit_bytes: 4096
    real_source_integration: >-
      At least one integration uses the actual current registry and a V2-S2
      artifact pair generated through public verify-stage behavior for
      tsc-ingest-and-reference-declarations. It must exercise no-change,
      retrieved_at-only non-material, and one material fact without changing a
      declaration or the registry.
    future_predecessor_cases: >-
      Non-null predecessor, missing artifact, unsafe path, malformed artifact,
      and preservation-conflict cases use synthetic typed registries and tiny
      checked-in or programmatically generated files only. They do not edit the
      production registry or create its currently absent rollback paths.
    algorithmic_non_null_READY_fixture:
      required: true
      construction: >-
        Build a complete valid current/predecessor registry lineage and its
        bound files programmatically. Compute both normalized source-record
        binding hashes first, self-hash the rollback artifact second, assign
        rb-<artifact_content_hash>.json to the current raw record third, and
        compute the full record/registry hashes last. No brute force, repeated
        hash search, monkeypatched digest, hard-coded self-hash, or fixpoint
        assumption is allowed.
      minimum_file_bindings: 1
      expected_rehearsal_outcome: READY_FOR_HUMAN_ADJUDICATION
      exact_integrity_result: all 12 performed_integrity_check rows are PASS
      exact_operation_type_coverage:
        - REVALIDATE_INPUT_BINDINGS
        - REVALIDATE_PRESERVATION_BOUNDARIES
        - RESTORE_DECLARATION_FROM_PREDECESSOR
        - VERIFY_RESTORED_DECLARATION_HASH
        - REQUEST_HUMAN_ADJUDICATION
      operation_constants:
        proposal_only: true
        approval_required: true
        approval_state: NOT_GRANTED
        executed: false
      required_production_surface: rehearse_rollback
      normative_example_self_test:
        exact_test: tests/sourceops/test_drift_planning_contract.py::test_v2s3_ac16_normative_cycle_free_example_constants_reproduce_independently
        oracle_rule: >-
          Reimplement the published exact_construction in test code using only
          Python standard-library canonical JSON/SHA-256, PyYAML for the frozen
          registry, and direct repository-byte reads. Do not call or copy an
          implementation helper and do not seed any derived hash.
        assertions:
          - every exact current/predecessor mutation and sequence position
          - both declaration-ref sequences and every file/preservation binding field in order
          - both normalized source-record binding hashes
          - artifact_content_hash, final_registry_path, and both artifact byte sizes
          - current and predecessor full source-record hashes after final path assignment
          - synthetic registry hash after current replacement and final predecessor append
          - the final fixture reaches rehearse_rollback with all 12 checks PASS
        required_production_surface: rehearse_rollback
    blocker_fixture_integrity_sequence:
      - use a valid non-null immutable lineage and a canonical safe registry path before testing any blocker after ROLLBACK_PATH_SAFE
      - for a missing-artifact case, all source/lineage/path checks preceding ROLLBACK_ARTIFACT_PRESENT are PASS and that check alone is FAIL
      - for each later artifact/hash/binding/file/preservation blocker, make every check earlier in actual execution order PASS and mutate only the targeted prerequisite
      - when testing a binding after self-hash validation, recompute the artifact self-hash and filename so the intended binding blocker is first
      - assert every unexecuted check is NOT_APPLICABLE and proposed_operations is empty
      - ROLLBACK_PRESERVATION_CONFLICT uses its exact non-linear 12-row vector; CURRENT_FILES_MATCH, PREDECESSOR_FILES_MATCH, and PRESERVATION_BINDINGS_MATCH are NOT_APPLICABLE rather than fabricated PASS
      - unsafe-path cases remain separate and intentionally fail ROLLBACK_PATH_SAFE
    cleanup: >-
      Tests remove only uniquely owned .raptor test leaves and synthetic
      repository roots after lstat/no-follow ownership checks. They never
      delete fixed parents, current policy, operator input, or unrelated
      generated artifacts.

acceptance_criteria:
  - id: V2S3-AC01
    type: boundary
    text: >-
      plan-drift accepts only one lowercase manifest hash, derives one fixed
      final V2-S2 leaf, and rejects every alternate, linked, reparse, special,
      partial, extra, ambiguous, or unsafe input path without writing output.
  - id: V2S3-AC02
    type: artifact_validation
    text: >-
      Both V2-S2 artifacts are strict canonical one-LF JSON with exact closed
      schemas, filename-bound self-hashes, bounded structures, and no duplicate
      keys or non-finite values.
  - id: V2S3-AC03
    type: cross_binding
    text: >-
      Manifest, observed_at, source, registry, source-record, declarations,
      candidate, projection, input-tree, stage outcome, and diff/verification
      hash bindings all recompute and match before interpretation.
  - id: V2S3-AC04
    type: fact_validation
    text: >-
      Every source, content, and component fact is independently validated
      against the V2-S2 closed universe and current source; classifications,
      summary, order, provenance, explicit nulls, and stage outcome recompute.
      COMPONENT_CHECKSUM content-binding facts remain exclusively content
      facts despite subject_type=COMPONENT and are valid under both
      NOT_PROVIDED and COMPLETE component projection modes.
      A valid COMPLETE component projection needs no input-tree file anchor;
      exact baseline identities/values are checked and unfamiliar valid
      candidate values proceed to conservative policy evaluation.
  - id: V2S3-AC05
    type: baseline
    text: >-
      The canonical V2-S1 registry and all declaration/preservation
      preconditions validate; unknown source, stale hash, changed declaration,
      invalid actions, false approval flag, bad edge, and reserved consumer are
      distinct fail-closed baseline outcomes. Readiness is never queried.
  - id: V2S3-AC06
    type: immutability
    text: >-
      V2-S2 artifacts, registry, all declarations, preservation files, policy,
      and applicable rollback inputs pass two no-follow snapshots and
      revalidation. Any mutation prevents mixed-input publication.
  - id: V2S3-AC07
    type: policy
    text: >-
      The fixed checked-in policy exactly matches the approved mapping, closed
      schema, self-hash, current registry hash, and V2-S2 schema bindings; no
      CLI threshold or alternate policy exists.
  - id: V2S3-AC08
    type: materiality
    text: >-
      Every valid fact receives exactly one stable rule/rationale result, and
      aggregation yields only NO_OBSERVED_CHANGE, NON_MATERIAL_CHANGE, or
      MATERIAL_CHANGE with the specified precedence and counts.
  - id: V2S3-AC09
    type: conservative_default
    text: >-
      Unknown fact structure is invalid; unknown role context or a defensively
      unmatched valid changed fact is material; duplicate/ambiguous policy
      rules are invalid. No unknown becomes silently non-material.
  - id: V2S3-AC10
    type: outcome_examples
    text: >-
      All-unchanged, non-historical retrieved_at-only, ordinary content change,
      and pinned-historical retrieved_at cases produce the exact four normative
      results and winning rule ids.
  - id: V2S3-AC11
    type: routing
    text: >-
      Routes derive only from current declared actions and current non-reserved
      edges, use current owners, satisfy the exact action conditions, carry
      reason fact/rule ids, and are deterministically deduplicated and ordered.
  - id: V2S3-AC12
    type: proposal_boundary
    text: >-
      Every route and artifact is proposal_only=true,
      approval_required=true, approval_state=NOT_GRANTED, executed=false; no
      promote action or approval/execution-shaped field can be laundered in.
  - id: V2S3-AC13
    type: reserved_boundary
    text: >-
      RescueScreen and both panel consumers cannot become routes, targets,
      prerequisites, owners, approvals, or evidence of readiness.
  - id: V2S3-AC14
    type: rollback_lineage
    text: >-
      A non-null predecessor must form an acyclic immutable same-lineage chain,
      and current/predecessor full record hashes, normalized rollback binding
      hashes, and declaration sequences bind exactly to the current registry.
  - id: V2S3-AC15
    type: root_rollback
    text: >-
      Every current root source yields lineage NO_PREDECESSOR, rehearsal
      NOT_APPLICABLE, reason NO_PREDECESSOR, no rollback route/operations, and
      exit 0 even though its legacy rollback_artifact path is absent.
  - id: V2S3-AC16
    type: rollback_artifact
    text: >-
      A future non-null predecessor requires one safe content-addressed
      canonical rollback artifact with exact normalized current/predecessor
      source, declaration, file, and preservation bindings. Its own filename
      hash is constructable without a fixpoint; full registry and record hashes
      are validated separately and emitted by V2-S3. V2-S3 creates no such
      input artifact.
  - id: V2S3-AC17
    type: rollback_blocked
    text: >-
      Stable missing, unsafe, malformed, mismatched, unavailable, or
      preservation-conflicting non-null rollback metadata yields one
      deterministic BLOCKED rehearsal artifact, no rollback route/operations,
      both V2-S3 artifacts published, and exit 8.
  - id: V2S3-AC18
    type: rollback_inertness
    text: >-
      An algorithmically constructed non-null ready rehearsal produces all 12
      integrity checks as PASS and exercises all five operation types as closed
      inert proposals with no command string, dispatcher, copy, replacement,
      deletion, chmod, shell, workflow, or restoration behavior.
  - id: V2S3-AC19
    type: artifacts
    text: >-
      Exactly two output artifacts have closed schemas, self-excluding hashes,
      exact one-LF canonical bytes, fixed content-addressed paths, exact
      cross-references, full registry/source-record bindings beside normalized
      rollback source-record bindings, and observed_at inherited only from
      V2-S2.
  - id: V2S3-AC20
    type: publication
    text: >-
      Pair publication is idempotent, whole-leaf transactional, race-safe, and
      collision-preserving under identical writers, partial failures, live or
      orphan locks, extra files, links, and non-identical winners.
  - id: V2S3-AC21
    type: cli
    text: >-
      plan-drift is the sole new command; handled results emit one deterministic
      JSON object, exactly one LF, empty stderr, exact exits, and material plus
      non-material observations both use exit 0.
  - id: V2S3-AC22
    type: typed_api
    text: >-
      New public models, functions, results, and errors are closed, typed, and
      immutable with no Any or mutable raw required surfaces; runtime remains
      standard library plus PyYAML and offline.
  - id: V2S3-AC23
    type: bounded_failure
    text: >-
      Parser, tree, fact, route, rollback, input, output, and concurrency work
      is bounded; first-error phase selection is deterministic; raw exceptions,
      absolute paths, secrets, and non-JSON values never escape.
  - id: V2S3-AC24
    type: non_mutation
    text: >-
      Success, exit 8, and representative failures leave registry, policy,
      declarations, preservation paths, V2-S2 artifacts, frozen evidence,
      staging, domain files, RescueScreen, and rollback inputs byte-identical.
  - id: V2S3-AC25
    type: compatibility
    text: >-
      Existing validate, status, and verify-stage stdout/exits remain
      byte-compatible; all V2-S1/V2-S2 and established domain regression gates
      pass without weakened assertions, skips, fixtures, or semantics.
  - id: V2S3-AC26
    type: phase_handoff
    text: >-
      Implementation acceptance uses only synthetic rollback fixtures and
      current offline integration. Separate post-publication rehearsals of one
      mutable source and one external-content-root refresh remain human-gated
      V2 phase work and authorize no promotion.

inversion_and_falsifier_probes:
  - id: V2S3-FM01
    threat: arbitrary input path or ambiguous leaf selection
    probe: >-
      Supply path-like, uppercase, short, traversal, drive, UNC, URI, latest,
      extra-argument, and multi-pair cases. All fail before artifact content is
      accepted and write nothing.
  - id: V2S3-FM02
    threat: symlink, junction, reparse, FIFO, device, or special input launders bytes
    probe: >-
      Place each type at an input ancestor, leaf, and artifact. No target is
      followed, read, or written; the exact boundary/discovery error wins.
  - id: V2S3-FM03
    threat: self-hash or filename creates false content address
    probe: >-
      Tamper each artifact byte, declared hash, and filename independently.
      Canonical bytes, self-hash, and filename checks detect every case.
  - id: V2S3-FM04
    threat: valid self-hashed files are cross-paired
    probe: >-
      Pair diff and verification artifacts from different manifests, sources,
      trees, observations, candidates, or outcomes. Cross-binding fails before
      registry or policy interpretation.
  - id: V2S3-FM05
    threat: forged V2-S2 outcome or summary is trusted
    probe: >-
      Rehash a fact with wrong before value, classification, provenance,
      summary count, ordering, input-tree hash, or stage outcome. Independent
      fact validation rejects it.
  - id: V2S3-FM06
    threat: stale current registry or declaration is interpreted
    probe: >-
      Change registry hash, selected record, any declaration, consumer edge,
      action, approval flag, or preservation precondition. The baseline fails
      with exit 4 or 5 and no plan.
  - id: V2S3-FM07
    threat: input changes between validation and publication
    probe: >-
      Replace or modify a V2-S2 artifact, registry, declaration, preservation
      file, policy, rollback artifact, or bound file after first snapshot. The
      exact mutation category wins and no mixed-input pair is published.
  - id: V2S3-FM08
    threat: ad hoc threshold or alternate policy bypass
    probe: >-
      Pass a policy/threshold argument, environment override, or alternate
      file. CLI usage fails; the production evaluator still reads only the
      fixed checked-in path.
  - id: V2S3-FM09
    threat: policy tamper, stale binding, or ambiguous rule becomes accepted
    probe: >-
      Change a policy byte/hash/version/registry binding/schema binding, add an
      unknown selector/outcome, duplicate priority/id, reorder rules, or remove
      the terminal default. Exit 6, no artifacts.
  - id: V2S3-FM10
    threat: unknown or unmatched fact becomes non-material
    probe: >-
      Use an unknown fact path/enum and a valid changed fact with an unfamiliar
      added component role in a COMPLETE projection whose staged files have
      empty component_ids. The former is invalid; the latter is structurally
      valid without file anchoring and reaches the component material rule or
      conservative material default. Separately exercise a valid
      COMPONENT_CHECKSUM content binding with subject_type=COMPONENT under
      both NOT_PROVIDED and COMPLETE projections; both pass content-universe
      validation, while a forged current-registry component checksum baseline
      is invalid in both modes and never reaches materiality evaluation.
  - id: V2S3-FM11
    threat: no-change is conflated with non-material change
    probe: >-
      Compare all-UNCHANGED against retrieved_at-only change. Outcomes,
      evaluation counts, rule ids, and route dispositions remain distinct.
  - id: V2S3-FM12
    threat: historical or freshness context is ignored
    probe: >-
      Apply the same retrieved_at change to NONE_REQUIRED non-historical,
      SOME_REQUIRED, and PINNED_HISTORICAL contexts. Results are respectively
      non-material, material, and material.
  - id: V2S3-FM13
    threat: action laundering or candidate owner controls routes
    probe: >-
      Add promote/executed/approved fields, unknown actions, false approval,
      and a changed candidate owner. Inputs fail or routes retain current
      registry owner and NOT_GRANTED/executed=false.
  - id: V2S3-FM14
    threat: reserved consumer becomes impact target or approval
    probe: >-
      Add each reserved id to source edges or forged facts/routes. Baseline or
      artifact validation fails; no reserved route exists.
  - id: V2S3-FM15
    threat: duplicate or nondeterministic routes
    probe: >-
      Feed multiple material facts for the same target and perturb fact/policy
      mapping insertion order. Exactly one route per dedupe key appears with
      stable unioned reasons and byte-identical order.
  - id: V2S3-FM16
    threat: stage_diff is falsely claimed executed by V2-S3
    probe: >-
      Assert stage_diff has EVIDENCED_BY_VALIDATED_INPUT disposition, no route,
      and no execution/approval claim on all successful materiality outcomes.
  - id: V2S3-FM17
    threat: absent root rollback path blocks current baseline
    probe: >-
      Run each current null-predecessor source with its absent registry path.
      Each is NOT_APPLICABLE/NO_PREDECESSOR, has zero operations/route, and does
      not attempt to open the path.
  - id: V2S3-FM18
    threat: missing non-null rollback artifact is silently treated feasible
    probe: >-
      Use a valid synthetic non-null lineage and absent canonical safe artifact
      path. All source, lineage, and path checks pass before artifact presence
      alone fails. Publish BLOCKED with ROLLBACK_ARTIFACT_MISSING, later checks
      NOT_APPLICABLE, no operations/route, and exit 8.
  - id: V2S3-FM19
    threat: unsafe or tampered rollback artifact becomes an executable plan
    probe: >-
      Exercise absolute/traversal/link path, wrong filename/self-hash, malformed
      JSON, wrong normalized hash basis, wrong current/predecessor normalized
      hash, declarations, duplicate file binding, and missing predecessor
      bytes. Except for explicit unsafe-path cases, use a canonical safe
      registry path and satisfy every earlier integrity check; re-self-hash and
      rename when necessary so the targeted first blocker is stable. Operations
      remain empty.
  - id: V2S3-FM20
    threat: rollback targets frozen preservation content
    probe: >-
      Make a target equal, ancestor, or descendant of a preservation path.
      Rehearsal is BLOCKED with ROLLBACK_PRESERVATION_CONFLICT and proposes no
      restore operation. Its 12 rows remain in canonical reporting order with
      statuses PASS x7, NOT_APPLICABLE x3, FAIL, NOT_APPLICABLE; the three
      earlier-listed file/preservation-binding rows were bypassed and must
      never be fabricated as PASS from the blocker index.
  - id: V2S3-FM21
    threat: inert typed operation is converted into a command
    probe: >-
      Search output models/JSON and implementation AST for command, shell,
      subprocess, copy, replace, delete, chmod, dispatch, callable, or command
      string surfaces. None exist.
  - id: V2S3-FM22
    threat: explicit null, omission, or sequence order is normalized
    probe: >-
      Exercise explicit null source facts, omitted required keys, reordered
      facts/rules/actions/bindings, and mapping-order-only changes. Null and
      omission differ; required sequence changes fail; mapping order does not
      change hashes.
  - id: V2S3-FM23
    threat: current time, locale, timezone, hash seed, or filesystem time changes bytes
    probe: >-
      Repeat under changed timezone, locale, PYTHONHASHSEED, mtimes, and command
      time. Paths, hashes, artifact bytes, and stdout remain identical.
  - id: V2S3-FM24
    threat: concurrent or partial publication overwrites evidence
    probe: >-
      Exercise identical writers, differing winner, extra file, partial second
      write, live lock, orphan lock, foreign temp, leaf creation race, and
      rollback/adoption race. No foreign byte is replaced or deleted.
  - id: V2S3-FM25
    threat: WSL filesystem edge escapes closed errors
    probe: >-
      Under WSL exercise symlink, dangling symlink, FIFO/special when supported,
      unreadable file, CRLF checkout, case collision, extreme depth, and
      oversized input. Exact bounded errors occur with no raw exception.
  - id: V2S3-FM26
    threat: V2-S3 mutates authority or existing behavior
    probe: >-
      Hash/lstat registry, policy, declarations, preservation, V2-S2 inputs,
      staging, frozen evidence, and RescueScreen before/after success, exit 8,
      and failures; run byte-compatibility snapshots and all preservation
      suites.
  - id: V2S3-FM27
    threat: network, service, database, workflow, or domain behavior enters SourceOps
    probe: >-
      Static imports and runtime monkeypatch sentinels prove no network,
      subprocess, database, scheduler, workflow, external-root, or domain
      package call occurs.

test_author_contract:
  panel:
    planner: Sol
    red_test_author: Codex 5.3
    implementation_doer: Sonnet 5
    independent_checker: Opus 5
    final_authority: human adjudication
    evidence_note: >-
      V2-S2 showed Sonnet is the reliable implementation doer. V2-S3 assigns
      Sonnet 5 that role explicitly; Codex 5.3 remains independent RED author,
      Opus 5 remains independent checker, and neither model can grant human
      approval.
  red_stage_rules:
    - tests are authored and observed failing before V2-S3 implementation
    - implementation imports may be guarded only to produce a clear missing-implementation RED
    - no existing assertion, fixture meaning, skip, xfail, expected byte, or selector is weakened
    - every acceptance criterion and failure probe maps to at least one exact named test below
    - every mapped test directly invokes every production surface required for its mapped id
    - invoking an unrelated allowed function does not satisfy a mapped id
    - spec inspection, local fixture/helper assertions, and private-helper calls are supplemental only and cannot satisfy a production surface
    - expected hashes/bytes are independently recomputed from this specification, never implementation helpers
    - complete representative artifact bytes and stdout are asserted, not only selected fields
    - tests are sequential because production integrations share fixed .raptor parents and transaction roots
    - no pytest-xdist or parallel invocation is allowed for the required command sequence
  required_test_files:
    - tests/sourceops/test_drift_planning_contract.py
    - tests/sourceops/test_drift_planning_cli.py
    - tests/sourceops/test_drift_planning_safety.py
    - tests/sourceops/test_drift_planning_repository.py
  minimum_test_groups:
    - V2-S2 pair discovery, strict canonical JSON, schema, self-hash, filename, and cross-binding
    - source/content/component fact universe, explicit null, summary, ordering, and outcome recomputation
    - COMPONENT_CHECKSUM content facts with subject_type COMPONENT accepted under NOT_PROVIDED and COMPLETE projections, with forged component checksum baselines rejected
    - valid COMPLETE component projection with empty file component_ids accepted and evaluated exactly/conservatively
    - current registry/declaration/preservation/action/consumer/lineage preconditions
    - materiality policy YAML/schema/hash/binding/rule truth table and conservative default
    - no-change, non-material, material, pinned-history, and freshness context integrations
    - action dispositions, routes, ownership, targets, prerequisites, dedupe, reason ids, and reserved exclusions
    - null-predecessor and synthetic non-null rollback artifact/lineage/blocker/operation truth tables
    - algorithmic non-null READY artifact with all 12 PASS checks and all five inert operation types
    - safe-path blocker fixtures whose preceding checks pass and whose targeted check alone fails
    - two-pass mutation, symlink/reparse/special/unreadable/limit safety
    - canonical output hashes/bytes/paths/idempotency/atomicity/concurrency/collision
    - CLI JSON, empty stderr, exact exit partition, and existing-command byte compatibility
    - no-network/no-subprocess/no-domain-import and complete non-mutation guards

  production_surface_non_vacuity:
    rule: >-
      Coverage is behavioral, not nominal. For each AC/FM id, every exact test
      mapped below must directly invoke every category listed in
      per_id_required_surfaces and assert the result relevant to that id. A
      call to any other allowed production function cannot substitute.
    categories:
      INPUT:
        exact_production_surface: load_v2_s2_artifact_pair
        required_evidence: returned value or exact closed production failure is asserted
      POLICY:
        exact_production_surface: load_materiality_policy
        required_evidence: returned policy or exact closed production failure is asserted
      MATERIALITY:
        exact_production_surface: evaluate_materiality
        required_evidence: exact per-fact and aggregate production result or failure is asserted
      ROUTING:
        exact_production_surface: route_impact
        required_evidence: exact production dispositions/routes or failure is asserted
      ROLLBACK:
        exact_production_surface: rehearse_rollback
        required_evidence: exact production lineage/check/blocker/operation result is asserted
      OUTPUT:
        exact_production_surface: plan_drift
        required_evidence: exact result and, when published, complete persisted production bytes are asserted
      CLI:
        exact_production_surface: python -m raptor.sourceops.cli
        required_evidence: >-
          Invoke the criterion-relevant literal subcommand through the real
          module entry point and assert exact exit, stdout bytes, and empty
          stderr. A shared subprocess byte-runner is allowed only as that
          transport; a helper returning fabricated payloads is not.
      MUTATION:
        exact_production_surface: plan_drift
        required_evidence: >-
          Inject the criterion's mutation at an allowed public
          loader/repository boundary during the real production operation and
          assert the exact error, exit, and no mixed-input publication.
    enforcement:
      - the mapping-completeness meta-test parses this exact matrix
      - every AC01 through AC26 and FM01 through FM27 appears exactly once
      - direct calls must match the exact function for each listed category
      - CLI calls must prove the literal criterion-relevant subcommand, not merely call an arbitrary local CLI helper
      - a mapped test that reads this YAML, validates a hand-built object, calls only a local helper, imports the module, or calls a different public function is vacuous
      - load_materiality_policy is criterion-relevant only where POLICY is required; using it as setup never satisfies INPUT, MATERIALITY, ROUTING, ROLLBACK, OUTPUT, CLI, or MUTATION
      - each Opus-recheck named test below calls every listed exact function in that test body; fixtures may prepare inputs but cannot invoke a substitute surface or return a fabricated production result
      - private implementation helpers, copied algorithms, fixtures, and static AST checks may strengthen but never replace required production calls
      - all listed categories for an id are mandatory; extra relevant production calls are allowed
    opus_recheck_per_test_requirements:
      'tests/sourceops/test_drift_planning_contract.py::test_v2s3_ac04_component_checksum_content_fact_is_projection_mode_independent':
        exact_function_or_cli_calls: [load_v2_s2_artifact_pair, evaluate_materiality, plan_drift]
        required_observable: >-
          For otherwise identical valid COMPONENT_CHECKSUM content bindings,
          both NOT_PROVIDED and COMPLETE projections load and evaluate
          successfully and complete plan_drift without a fact-universe error;
          the subject remains COMPONENT, the path remains
          /content-bindings/..., and no component-projection cardinality rule
          is applied to that fact.
      'tests/sourceops/test_drift_planning_safety.py::test_v2s3_ac06_all_governing_inputs_pass_two_immutable_snapshots':
        exact_function_or_cli_calls: [plan_drift]
        required_observable: >-
          Call plan_drift directly for real on-disk byte mutations introduced
          after the first snapshot and before revalidation. Cover V2-S2
          artifacts, registry, declarations, preservation files, policy, and
          applicable rollback artifact/bound files; prove the bytes changed at
          the production boundary, assert each exact mutation error/exit and
          absence of published plan bytes, then restore the original bytes.
      'tests/sourceops/test_drift_planning_contract.py::test_v2s3_ac14_non_null_predecessor_lineage_and_record_bindings_are_exact':
        exact_function_or_cli_calls: [rehearse_rollback]
        required_observable: >-
          Assert production lineage traversal plus exact current/predecessor
          full hashes, normalized hashes, declaration sequences, chain order,
          lifecycle, and immutable-predecessor behavior.
      'tests/sourceops/test_drift_planning_contract.py::test_v2s3_ac16_non_null_rollback_artifact_schema_hash_and_complete_bindings':
        exact_function_or_cli_calls: [rehearse_rollback]
        required_observable: >-
          Assert the production rehearsal accepts the exact closed artifact,
          filename/self-hash, normalized hashes, declaration refs, file
          bindings, and every preservation binding; schema inspection alone is
          insufficient.
      'tests/sourceops/test_drift_planning_contract.py::test_v2s3_ac16_algorithmic_content_address_has_no_hash_fixpoint':
        exact_function_or_cli_calls: [rehearse_rollback]
        required_observable: >-
          Construct normalized hashes before the artifact hash and final path,
          assert path-stability, then require production rehearsal READY; a
          local self-hash assertion without rehearse_rollback is vacuous.
      'tests/sourceops/test_drift_planning_contract.py::test_v2s3_ac16_normative_cycle_free_example_constants_reproduce_independently':
        exact_function_or_cli_calls: [rehearse_rollback]
        required_observable: >-
          Independently reproduce every published normative constant and exact
          sequence without implementation helpers, materialize the resulting
          fixture, and assert production rehearsal returns all 12 PASS rows.
      'tests/sourceops/test_drift_planning_contract.py::test_v2s3_ac18_ready_rehearsal_emits_only_inert_typed_operations':
        exact_function_or_cli_calls: [rehearse_rollback]
        required_observable: >-
          Inspect the actual production operation objects and assert every
          closed field, inert constant, and forbidden execution surface.
      'tests/sourceops/test_drift_planning_contract.py::test_v2s3_ac18_algorithmic_ready_rehearsal_passes_all_checks_and_operation_types':
        exact_function_or_cli_calls: [rehearse_rollback]
        required_observable: >-
          Assert the exact 12 production PASS rows and complete ordered
          operation-type sequence from an algorithmically built READY fixture.
      'tests/sourceops/test_drift_planning_contract.py::test_v2s3_ac19_output_pair_schema_hash_path_cross_reference_and_observed_at':
        exact_function_or_cli_calls: [plan_drift]
        required_observable: >-
          Read both files actually published by plan_drift and assert their
          complete canonical bytes, schemas, self-hashes, paths,
          cross-references, source bindings, and inherited observed_at.
      'tests/sourceops/test_drift_planning_safety.py::test_v2s3_fm07_each_governing_input_mutation_maps_to_its_exact_category':
        exact_function_or_cli_calls: [plan_drift]
        required_observable: >-
          Call plan_drift directly once per governing input category and
          mutate the real selected file bytes only between its two production
          snapshots. Assert the changed bytes were presented to revalidation,
          the exact category-specific error/exit won, no mixed or partial plan
          bytes were published, and original bytes were restored.
      'tests/sourceops/test_drift_planning_contract.py::test_v2s3_fm09_policy_tamper_stale_binding_and_rule_ambiguity_exit_6':
        exact_function_or_cli_calls: [load_materiality_policy]
        required_observable: >-
          Mutate the fixed policy bytes for hash, binding, and ambiguity cases
          and assert each exact closed production policy failure; parsing a
          copied mapping or calling another public function is insufficient.
      'tests/sourceops/test_drift_planning_contract.py::test_v2s3_fm10_unknown_fact_is_invalid_and_unfamiliar_valid_role_is_material':
        exact_function_or_cli_calls: [load_v2_s2_artifact_pair, evaluate_materiality]
        required_observable: >-
          Assert the production input loader rejects the unknown fact and the
          production evaluator assigns materiality to the separately valid
          unfamiliar component role.
      'tests/sourceops/test_drift_planning_contract.py::test_v2s3_fm10_forged_component_checksum_content_baseline_is_rejected_for_both_projection_modes':
        exact_function_or_cli_calls: [load_v2_s2_artifact_pair, evaluate_materiality, plan_drift]
        required_observable: >-
          First prove a valid COMPONENT_CHECKSUM content fact loads and
          evaluates and plans successfully in each projection mode, then forge
          its baseline checksum, rehash the V2-S2 artifacts, and assert the
          production loader and plan_drift reject both before
          evaluate_materiality can consume the forged pair.
      'tests/sourceops/test_drift_planning_contract.py::test_v2s3_fm11_no_change_and_non_material_change_remain_distinct':
        exact_function_or_cli_calls: [evaluate_materiality]
        required_observable: >-
          Assert exact production per-fact evaluations, counts, aggregate
          outcomes, rule ids, and rationale ids for both cases.
      'tests/sourceops/test_drift_planning_contract.py::test_v2s3_fm12_retrieved_at_truth_table_uses_freshness_and_historical_context':
        exact_function_or_cli_calls: [evaluate_materiality]
        required_observable: >-
          Assert the production evaluator's exact three-context truth table,
          including aggregate outcome and retrieved_at rule/rationale ids.
      'tests/sourceops/test_drift_planning_contract.py::test_v2s3_fm13_action_approval_execution_and_candidate_owner_laundering_fail':
        exact_function_or_cli_calls: [route_impact, plan_drift]
        required_observable: >-
          Use a real valid material input carrying a changed candidate owner,
          assert route_impact retains current-registry owners and inert
          constants, and assert complete persisted plan_drift bytes do not
          launder candidate ownership, approval, or execution.
      'tests/sourceops/test_drift_planning_contract.py::test_v2s3_fm15_route_reason_union_dedupe_and_order_are_byte_deterministic':
        exact_function_or_cli_calls: [route_impact]
        required_observable: >-
          Feed multiple material reasons and perturbed permissible mapping
          insertion order to production routing; assert one route per dedupe
          key and exact stable route/reason canonical bytes.
      'tests/sourceops/test_drift_planning_contract.py::test_v2s3_fm16_stage_diff_is_evidenced_not_executed_or_routed':
        exact_function_or_cli_calls: [route_impact]
        required_observable: >-
          Assert the exact production stage_diff disposition and reason on
          NO_OBSERVED_CHANGE, NON_MATERIAL_CHANGE, and MATERIAL_CHANGE, with no
          route or approval/execution claim in any case.
      'tests/sourceops/test_drift_planning_contract.py::test_v2s3_fm19_unsafe_tampered_or_unavailable_rollback_inputs_select_first_blocker':
        exact_function_or_cli_calls: [rehearse_rollback]
        required_observable: >-
          Exercise every enumerated path/artifact/hash/binding/current-file/
          predecessor-file/preservation-binding blocker through production,
          assert the exact first blocker and actual-execution status vector,
          and assert zero operations.
      'tests/sourceops/test_drift_planning_contract.py::test_v2s3_fm20_preservation_overlap_blocks_every_restore_operation':
        exact_function_or_cli_calls: [rehearse_rollback]
        required_observable: >-
          Exercise equal, ancestor, and descendant preservation overlap
          through production and assert the dedicated conflict blocker wins
          before any restore operation or bypassed file/binding check.
      'tests/sourceops/test_drift_planning_contract.py::test_v2s3_fm20_preservation_conflict_reports_exact_execution_status_vector':
        exact_function_or_cli_calls: [rehearse_rollback]
        required_observable: >-
          Assert the exact 12 check names and statuses in canonical reporting
          order: PASS x7, NOT_APPLICABLE x3, FAIL, NOT_APPLICABLE.
      'tests/sourceops/test_drift_planning_contract.py::test_v2s3_fm22_explicit_null_omission_mapping_order_and_sequence_order_are_exact':
        exact_function_or_cli_calls: [load_v2_s2_artifact_pair, load_materiality_policy, rehearse_rollback, plan_drift]
        required_observable: >-
          Drive a criterion-relevant null/omission/order case through each
          named production surface and assert its real returned value, failure,
          or persisted bytes. A successful policy load used only as setup does
          not satisfy this four-surface requirement.
    per_id_required_surfaces:
      V2S3-AC01: [INPUT, CLI]
