# RAPTOR RescueScreen -- structural-rescue screening track design spec.
#
# RESEARCH ONLY. This file is a PLAN. It contains NO code, NO tests, NO
# compound, NO SMILES/InChI/CAS/catalogue identifier, NO vendor list, NO
# screening result, NO docking score and NO treatment recommendation.
# It selects nothing, screens nothing and recommends nothing.
#
# RescueScreen is a SEPARATE, DOWNSTREAM, SEPARATELY VERSIONED lane. It is not
# part of the Atlas evidence pipeline, not part of the ACMG scorer, and not part
# of either panel product. It consumes reviewed mechanism representations and
# produces experimentally testable HYPOTHESES.
#
# Authority order for BEHAVIOUR (this spec is subordinate to all of them):
#   1. docs/DECISIONS.md (ADR-0009/0010/0011/0014/0015/0016/0018)
#   2. docs/project/specs/mechanism-atlas-starter.yaml
#   3. docs/project/specs/atlas-panel-products-v1.yaml
#   4. docs/RISK_REGISTER.md, docs/EVALUATION.md Part II

