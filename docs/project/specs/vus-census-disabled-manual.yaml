    the hashes recorded inside bp4pp3_predictor_policy.json, confirming the
    on-disk configs are the approved-policy configs. Production code DERIVES
    these hashes at runtime and never hardcodes their values. NOTE ON HASH
    PROVENANCE: config/policy inputs here are verified as RAW PATH BYTES (the
    approved policy pins those exact on-disk bytes), which is DISTINCT from
    committed data-artifact identity — the historical aggregate, the certified
    masked gate, and the emitted census record — whose identity is the canonical
    Git/LF blob SHA-256 verified on every platform, never the Windows CRLF
    checkout hash.
