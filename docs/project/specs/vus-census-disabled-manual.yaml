planning_probe:
  method: >-
    The planner independently re-ran the extracted reproduce_census_strata logic
    over the immutable manifest + BIAS TSV with the CURRENT (PP3/BP4-suppressed)
    scorer/eval configs, importing only raptor.scorer + raptor.eval. All eight
    orchestrator-supplied probe values reproduced exactly. These values live in
    this spec + in Gemini's tests ONLY; production code must not contain them.
  reproduced_exactly:
    rows: 6618
    manifest_identities: 6618
    candidate_LP_review: 157
    candidate_LB_review: 7
    no_deterministic_resolution: 6424
    annotation_manual_review: 30
    lp_exact_strength_patterns: 7
    lb_exact_strength_patterns: 2

expected_real_data_measurements:
  note: >-
    Grouping-independent totals below are BINDING oracles for the opt-in
    real-data integration test. Per-consequence-group and per-gene breakdowns
    are pinned by that same test against whatever the REUSED grouping helper
    (_variant_class_for, split on ',') actually yields — never a
    planner-invented split.
  direction_totals:
    candidate_LP_review: 157
    candidate_LB_review: 7
    no_deterministic_resolution: 6424
    annotation_manual_review: 30
    total: 6618
  pattern_compression:
    lp_exact_strength_patterns: 7
    lb_exact_strength_patterns: 2
  pp3bp4_suppression_full_census:
    raw_pp3_firings: 2226
    raw_bp4_firings: 3696
    pp3_affected_variants: 2226
    bp4_affected_variants: 3696
    pp3_or_bp4_union_variants: 5474
    scored_pp3bp4_calls: 0
    method: >-
      Raw firings/affected variants are parsed from the raw BIAS rationale
      across all 6,618 rows (policy-invariant; equals the historical
      criterion_firing PP3=2,226 / BP4=3,696 cross-check). scored=0 because
      neither criterion is in automatable_criteria. Union 5,474 (=> 448 variants
      fire both) is measured fresh.
  point_distribution_expected:
    domain: >-
      Covers ALL 6,618 strata; every stratum contributes to exactly one
      signed_points band. signed_points==0 counts BOTH the 119
      no_deterministic_resolution rows that score 0 AND the 30
      annotation_manual_review rows (manual rows carry signed_points=0), so the
      0 band is 149 (=119+30), never 119. The distribution is an all-strata
      derivation, not a per-direction one.
    '-8': 1
    '-3': 6
    '0': 149
    '1': 5651
    '2': 61
    '3': 172
    '4': 395
    '5': 26
    '6': 2
    '7': 5
    '9': 143
    '11': 1
    '12': 6
    invariants:
      - all-strata coverage — sum of every band == 6618.
      - signed_points==0 band == 149 == 119 no_deterministic_resolution rows + 30 annotation_manual_review rows (=119 unresolved + 30 manual).
      - LP (points>=6) band sum == 157 == candidate_LP_review direction total.
      - LB (points<=-1) band sum == 7 == candidate_LB_review direction total.
      - 0<=points<=5 band sum == 6454 == 6424 no_deterministic_resolution + 30 annotation_manual_review; the 30 manual rows share the 0-point band but are a SEPARATE direction.
      - Direction totals (candidate_LP_review / candidate_LB_review / no_deterministic_resolution / annotation_manual_review) are derived from STRATUM routing, never from point bands; a point band is never used to source a direction count.
  historical_comparison_superseded:
    source: data/census/tsc_vus_clinvar_2026-07-07_stats.json (PP3/BP4 ACTIVE)
    candidate_LP_review: {historical: 238, disabled_manual: 157, delta: -81}
    candidate_LB_review: {historical: 1333, disabled_manual: 7, delta: -1326}
    no_deterministic_resolution: {historical: 5017, disabled_manual: 6424, delta: 1407}
    annotation_manual_review: {historical: 30, disabled_manual: 30, delta: 0}
    interpretation: >-
      Suppressing automated PP3/BP4 collapses most benign-leaning candidate
      directions (BP4-driven) and many pathogenic-leaning ones (PP3-driven) into
      no_deterministic_resolution. This result is scientifically disappointing
      and MUST NOT be tuned.

# --------------------------------------------------------------------------
# 6. Output schema (new aggregate record) — non-identifying only
# --------------------------------------------------------------------------

output_schema:
  emitted_record:
    path: data/census/tsc_vus_clinvar_2026-07-07_disabled_manual_stats.json
    schema: raptor.tsc.vus_census.disabled_manual.v1
    only_permitted_output_path: data/census/tsc_vus_clinvar_2026-07-07_disabled_manual_stats.json
    no_overwrite: >-
      The single permitted output path above is the ONLY file the census may
      write. If it already exists the CLI fails closed. NO existing artifact —
      including the historical stats (tsc_vus_clinvar_2026-07-07_stats.json), the
      certified masked gate (tsc_masked_holdout_gate_disabled_manual_2026-07-21.json),
      or any other census file — may ever be overwritten.
    canonical_bytes: >-
      Emitted bytes are UTF-8, sort_keys=True, indent=2, exactly ONE terminal
      LF, and LF-only line endings on EVERY platform. The CLI encodes the JSON
      to UTF-8 bytes and writes them explicitly in binary mode (e.g.
      open(path, 'wb').write(payload)); it never uses Path.write_text or any
      text-mode write that platform-translates LF to CRLF. Any repo-artifact
      SHA test hashes these canonical LF bytes (the Git blob), never the Windows
      CRLF checkout bytes.
    write_rule: >-
      Written ONLY by the census CLI to the hard-pinned path above via the
      census-record output boundary; a dry-run/summary mode proves no output
      precedes conservation. This record is a DOER RUNTIME OUTPUT, not part of
      this planner commit.
  required_fields:
    - schema, status, snapshot, policy_mode, non_authoritative_boundary
    - source_hashes (input_vcf, bias_tsv, manifest) + row/identity counts + exact-join/duplicate/parser checks
    - code_commit + all bound config/policy hashes (section 4)
    - corpus/gene/transcript/consequence-group counts (from reused grouping helper)
    - raw_bias_criterion_incidence
    - consumed_automated_criterion_incidence (PP3/BP4 == 0)
    - pp3bp4_suppression {raw_pp3, raw_bp4, affected_union, scored_calls: 0}
    - aggregate direction counts + shares
    - direction counts by consequence group and by gene
    - point_distribution + LP/LB exact-strength pattern compression
    - explicit comparison with the historical 238/1,333/5,017/30 record
    - limitations (see limitations)
  forbidden_fields:
    rule: >-
      No committed field may contain a variant ID, VCF key, SPDI, row locator,
      HGVS, rationale text, patient identifier, ClinVar/benchmark label, or
      packet ID. Only aggregate counts, hashes, and pattern-signature strings
      (e.g. "PM2 Supporting|PVS1 Very Strong") that carry no per-variant identity.
  limitations:
    - negative certified masked gate (legacy FAIL, v2 BLOCKED_POLICY, vus_authorized=false)
    - PM1 evaluation parity blocker (authorization_blockers: evaluation_skipped_criteria:PM1)
    - 30 TSC2-region inputs annotated as NTHL1 require manual resolution
    - BIAS emits .4 transcripts while production config pins .5 (transcript drift)
    - PS1/PM5 use ClinVar-derived comparator resources pending held-out masking
    - no expert approval; candidate directions are eval-only, non-authoritative

# --------------------------------------------------------------------------
# 7. Implementation + preservation file scopes
# --------------------------------------------------------------------------

implementation_scope:
  planner_commit_this_track:
    files: [docs/project/specs/vus-census-disabled-manual.yaml]
    count: 1
  sonnet_doer:
    files:
      - path: src/raptor/census/__init__.py
        action: create (package marker + public exports)
      - path: src/raptor/census/strata.py
        action: >-
          create by MOVING ManifestEntry, StratumEntry, STRENGTH_MAP,
          ManifestError, ConservationError, load_manifest,
          reproduce_census_strata, and the consequence-grouping helpers
          (_split_consequence_terms, _variant_class_for) out of the calibration
          script verbatim; imports only raptor.scorer + raptor.eval (NO packet).
      - path: src/raptor/census/aggregate.py
        action: >-
          create the pure aggregate builder: given strata + bias_rows + manifest
          + run pins + bound hashes, derive the non-identifying record dict
          (counts, incidences, suppression union, direction-by-group/gene, point
          distribution, pattern compression, historical delta, limitations).
          No expected-count literals; reads historical stats only for the delta.
      - path: src/raptor/census/cli.py
        action: >-
          create the deterministic CLI: verify policy status/mode + config
          hashes, load inputs, conserve identity/row/join/hash invariants BEFORE
          any write, support --dry-run/--summary, refuse any output other than
          the single hard-pinned
          data/census/tsc_vus_clinvar_2026-07-07_disabled_manual_stats.json
          target, never overwrite an existing file, and emit canonical JSON
          bytes (UTF-8, sort_keys, indent 2, one terminal LF, LF-only on every
          platform) via an explicit binary byte write, never Path.write_text.
      - path: scripts/build_tsc_calibration_batch.py
        action: >-
          REFACTOR to import the moved symbols from raptor.census.strata and
          delete the local duplicates; behavior byte-preserving. No packet,
          gate, scope-gate, or policy change.
      - path: data/census/README.md
        action: >-
          document the new census command + output path + non-authoritative
          boundary (documentation only).
    count: 6
    generated_runtime_output_not_hand_authored:
      - data/census/tsc_vus_clinvar_2026-07-07_disabled_manual_stats.json
  gemini_test_author:
    files:
      - tests/census/test_census_strata.py
      - tests/census/test_census_aggregate.py
      - tests/census/test_census_cli.py
      - tests/census/test_census_real_data_integration.py
    count: 4
    ordering: Gemini authors + RED-verifies these before Sonnet implements.
  preservation_scope_do_not_touch:
    - data/census/tsc_vus_clinvar_2026-07-07_stats.json (historical, immutable)
    - data/census/tsc_masked_holdout_gate_disabled_manual_2026-07-21.json (certified gate)
    - src/raptor/eval/gate.py, src/raptor/eval/scope_gate.py (authoritative gates)
    - src/raptor/packet/** (packet path; never imported by census)
    - configs/** (all policy/config; read-only, hash-bound)
    - the external raptor-data inputs (arm's-length, read-only)
  branch_counts: {planner: 1, sonnet: 6, gemini: 4, total_branch: 11}

# --------------------------------------------------------------------------
# 8. Gemini RED / unit / integration test matrix
# --------------------------------------------------------------------------

test_matrix:
  principles:
    - A test that merely loads the final aggregate and asserts its recorded
      values is VACUOUS and forbidden.
    - Synthetic unit tests exercise the algorithm; the real-data check recomputes
      from raw inputs through the seam.
  unit_strata:
    - 'G-VC1 PP3/BP4 suppression — a synthetic variant that would be LP with PP3 (or LB with BP4) but abstains without it routes to no_deterministic_resolution; the scored automatable set excludes PP3/BP4.'
    - 'G-VC2 NTHL1 pre-routing — an NTHL1-gene row goes to manual_review, never LP/LB.'
    - 'G-VC3 manifest duplicate variant_id/vcf_key fails loud (ManifestError).'
    - 'G-VC4 exact one-to-one join — a BIAS row with no manifest entry fails loud (ConservationError).'
    - 'G-VC5 strength_map drift raises ConservationError (no silent re-label).'
    - 'G-VC6 pattern signature is the sorted automatable-call catalog; identical patterns compress.'
  unit_aggregate:
    - 'G-VC7 all counts derived from injected inputs (change an input, count moves); no expected-count literal in production code.'
    - 'G-VC8 suppression union computed as the size of (PP3 union BP4); scored PP3/BP4 == 0.'
    - 'G-VC9 emitted record contains NO variant_id/vcf_key/SPDI/HGVS/rationale/label/packet_id (privacy schema assertion).'
    - 'G-VC10 historical comparison delta computed from the historical file, not hardcoded; the point distribution covers all 6,618 strata (sum==6618), the signed_points==0 band==149 (119 unresolved + 30 manual), and the LP(points>=6)==157 / LB(points<=-1)==7 invariants hold.'
  unit_cli:
    - 'G-VC11 output boundary — the ONLY accepted output is the hard-pinned data/census/tsc_vus_clinvar_2026-07-07_disabled_manual_stats.json. Fail closed (no write) on attempts to overwrite the historical stats (tsc_vus_clinvar_2026-07-07_stats.json) or the certified masked gate (tsc_masked_holdout_gate_disabled_manual_2026-07-21.json), on any external/raw-data directory, on any nested path under data/census/, on any non-.json or wrong-extension path, and on any already-existing artifact; no existing file is ever overwritten.'
    - 'G-VC12 --dry-run/--summary writes NO file; conservation runs before any write.'
    - 'G-VC13 canonical JSON bytes are deterministic and byte-stable: UTF-8, sort_keys, indent 2, exactly one terminal LF, LF-only on every platform, written via explicit binary byte write (not Path.write_text); the SHA test hashes these canonical LF bytes / Git blob, never CRLF checkout bytes.'
    - 'G-VC14 policy/hash verification fails closed on a drifted config hash or a non-approved/non-disabled_manual policy.'
  integration_real_data:
    cases:
      - 'G-VC15 opt-in (env-gated, e.g. RAPTOR_VUS_REAL_DATA=1) run over the immutable manifest + BIAS TSV + current configs asserts the binding oracles — 6,618 identities/rows; 157/7/6,424/30 directions; 7/2 patterns; raw PP3 2,226 / BP4 3,696 / union 5,474 / scored 0; the all-strata point distribution summing to 6,618 with the signed_points==0 band==149 (119 unresolved + 30 manual); and the reused-helper per-group/per-gene breakdowns. Skipped cleanly when inputs/env absent.'
    boundary: >-
      This is the ONLY test touching raptor-data; it recomputes through the
      seam and never reads the emitted aggregate as its own oracle.

# --------------------------------------------------------------------------
# 9. Sonnet implementation contract
# --------------------------------------------------------------------------

sonnet_contract:
  must:
    - Make Gemini's RED tests pass by implementing the extraction + aggregate +
      CLI exactly as scoped; keep the calibration script behavior byte-identical.
    - Derive every count from inputs; keep production code free of benchmark
      labels and expected-count literals.
    - Verify approved policy status/mode + config hashes before processing; fail
      closed on drift; run identity/row/join/hash conservation before any write.
    - Ensure src/raptor/census/ imports only raptor.scorer + raptor.eval.
    - Route NTHL1 to manual_review disjoint from LP/LB; both PP3 and BP4 scored 0.
  must_not:
    - Import raptor.packet from the census package or generate any packet.
    - Edit gate.py, scope_gate.py, any config, the historical stats file, or the
      certified masked gate.
    - Reuse assert_source_of_record_conservation's historical direction assertions.
    - Write anywhere other than the single hard-pinned data/census/tsc_vus_clinvar_2026-07-07_disabled_manual_stats.json target, overwrite any existing artifact, or write into raptor-data.
    - Tune, round, or "fix" the disappointing disabled-mode counts.

# --------------------------------------------------------------------------
# 10. GPT-5.4 checker probes (anti-trace-cribbing + privacy + policy)
# --------------------------------------------------------------------------

gpt_probes:
  probes:
    - 'P1 trace_cribbing — no expected-count literal (157/7/6,424/30/238/1,333/5,017/2,226/3,696/5,474/7/2) appears in src/raptor/census/; counts are derived; the spec/historical/masked-gate are never scoring inputs.'
    - 'P2 identity_leakage — the emitted aggregate and its builder expose no variant_id/vcf_key/SPDI/HGVS/rationale/label/patient/packet_id field.'
    - 'P3 stale_policy — the tool verifies CURRENT approved/disabled_manual policy + config hashes before processing and fails closed on drift.'
    - 'P4 one_sided_suppression — BOTH PP3 and BP4 are scored 0 and BOTH are counted in suppression; neither leaks into automation.'
    - 'P5 manual_routing — NTHL1 -> manual_review, disjoint from candidate LP/LB.'
    - 'P6 output_before_conservation — identity/row/join/hash conservation precedes any write; --dry-run proves no output precedes checks.'
    - 'P7 packet_non_authoritative — src/raptor/census/ has no raptor.packet import; the calibration script behavior is unchanged by the extraction.'
  posture: >-
    The measured result may be scientifically disappointing and must not be
    tuned; the checker verifies faithfulness, not favorable numbers.

# --------------------------------------------------------------------------
# 11. Deterministic CLI + output boundary
# --------------------------------------------------------------------------

cli_and_output_boundary:
  cli:
    args: [--manifest, --bias-tsv, --provenance, --scorer-config, --eval-config,
           --predictor-policy, --lineage-policy, --packet-candidate-direction,
           --historical-stats, --emit-census-record, --dry-run, --summary]
    determinism: >-
      Canonical JSON bytes: UTF-8, sort_keys=True, indent=2, exactly one
      terminal LF, LF-only on every platform, written via explicit byte encode +
      binary write (never Path.write_text / text-mode LF->CRLF translation).
  output_boundary:
    accept: >-
      ONLY the hard-pinned path
      data/census/tsc_vus_clinvar_2026-07-07_disabled_manual_stats.json (a direct
      .json child of <repo>/data/census), and only when it does not already
      exist.
    refuse:
      - any path outside the repository tree (e.g. the raptor-data inputs)
      - any external/raw-data directory
      - any in-repo path that is not the single hard-pinned data/census/*.json target
      - any nested path under data/census/ (subdirectories) or a wrong/absent .json extension
      - overwriting ANY existing artifact, explicitly including the historical
        stats (tsc_vus_clinvar_2026-07-07_stats.json) and the certified masked
        gate (tsc_masked_holdout_gate_disabled_manual_2026-07-21.json)
    enforcement: check-before-write; raised before any aggregate bytes are emitted.
  dry_run: proves the full conservation path runs and produces a summary without writing.

# --------------------------------------------------------------------------
# 12. Migration / backout + next packet-stage handoff
# --------------------------------------------------------------------------

migration_and_backout:
  migration:
    - Land planner spec (this commit) → Gemini RED tests → Sonnet extraction +
      aggregate + CLI → checker probes → run the CLI to emit the new record to
      the hard-pinned data/census/tsc_vus_clinvar_2026-07-07_disabled_manual_stats.json
      path as canonical LF bytes, failing closed if that file already exists.
    - The extraction is a pure move + import; the calibration script and its
      tests remain green (behavior-preserving).
  backout:
    - Revert the census package + script import to restore the inline seam; the
      historical stats file and gates were never touched, so no data backout is
      needed.
  next_packet_stage_handoff:
    - This track emits NO packets. A future packet/worklist stage is BLOCKED
      until leakage-safe validation and expert sign-off; the negative masked
      gate (vus_authorized=false, BLOCKED_POLICY) and PM1 parity blocker gate it.
    - The new aggregate + reused census seam are the inputs a later, separately
      approved packet stage would consume — never authorized by this census.

# --------------------------------------------------------------------------
# 13. Beat-4 self-audit (inversion / pre-mortem)
# --------------------------------------------------------------------------

beat4_self_audit:
  worst_ways_this_passes_while_wrong:
    - false_real_test: >-
        The integration test loads the emitted aggregate and asserts its own
        recorded values (vacuous). MITIGATION: G-VC15 recomputes through the
        seam from raw inputs; the emitted record is never its oracle.
    - cribbed_constants: >-
        Production code hardcodes 157/7/6,424/30 (or reads this spec). MITIGATION:
        D3 + P1 forbid literals; probe values live only in spec + tests.
    - packet_leak: >-
        The extraction accidentally drags raptor.packet into the census package.
        MITIGATION: D1 + P7 assert census imports only scorer + eval.
    - historical_oracle_misuse: >-
        The census reuses assert_source_of_record_conservation and either
        falsely fails on correct 157/7 data or the doer edits that shared guard.
        MITIGATION: D2 + R3 conserve only identity/row/join/hash; direction
        counts are measured, not asserted equal to historical.
    - one_sided_suppression: >-
        Only BP4 (or only PP3) is counted/suppressed. MITIGATION: G-VC8 + P4
        assert both scored 0 and both in the union.
    - silent_regrouping: >-
        A planner-invented consequence split replaces the historical grouping,
        shifting per-group counts. MITIGATION: reuse _variant_class_for; G-VC15
        pins per-group counts from the reused helper.
    - checkout_hash_pinned: >-
        A repo data-artifact (certified masked gate, historical aggregate, or
        the emitted record) is pinned/verified against its Windows CRLF checkout
        SHA instead of the canonical Git/LF blob SHA. MITIGATION: data-artifact
        identity is the committed LF blob (gate 7c55…, historical 389e93d5…);
        G-VC13 hashes canonical LF bytes; config inputs stay raw-path-bytes by
        design.
    - point_band_direction_conflation: >-
        A direction total is sourced from a point band (e.g. treating
        no_deterministic_resolution as the 0<=points<=5 band) or the 30 manual
        rows (signed_points=0) are dropped from the all-strata distribution.
        MITIGATION: distribution covers all 6,618 (0 band==149==119+30, sum
        6618); directions are derived from stratum routing (G-VC10/G-VC15).
    - overwrite_existing_artifact: >-
        The emitter writes over the historical stats, the certified masked gate,
        or any pre-existing file. MITIGATION: single hard-pinned output path +
        fail-closed no-overwrite; G-VC11 asserts refusal.
  empty_beats: none — every beat applied.

