# RAPTOR 6,618-VUS census recomputation under ADR-0012 — Opus planner contract (rev 1).
#
# Purpose: an implementation-ready, hash-bound, DRY plan to recompute the
# existing `clinvar_2026-07-07` internal VUS evidence census under the approved
# ADR-0012 disabled/manual PP3/BP4 policy, and to emit a NEW, versioned,
# non-identifying aggregate record while preserving the historical
# `data/census/tsc_vus_clinvar_2026-07-07_stats.json` unchanged.
#
# This file is the planner PLAN ONLY. It performs NO implementation, NO tests,
# NO runner/config/code edits, NO packet generation, NO gate/scope-gate/policy
# change, NO x64 run, NO new annotation, NO owner approval, and NO census-record
# write. It names the exact downstream implementation scope, input/output
# schemas and hash contracts, the reuse-vs-extract architecture decision, the
# Gemini RED/unit/integration matrix, the Sonnet file boundaries, the GPT-5.4
# anti-trace-cribbing and privacy probes, the deterministic CLI + output
# boundary, the migration/backout + next packet-stage handoff, and the Beat-4
# self-audit.
#
# Schema: raptor-vus-census-disabled-manual-planning-v1 (planner). The emitted
# census record uses schema raptor.tsc.vus_census.disabled_manual.v1 (defined
# in output_schema).

schema: raptor-vus-census-disabled-manual-planning-v1
status: planner_contract_ready_for_implementation
task_id: recompute-vus-census-adr-0012
title: >-
  Recompute the 6,618-VUS clinvar_2026-07-07 internal evidence census under the
  ADR-0012 disabled/manual PP3/BP4 policy — hash-bound, DRY, non-authoritative

worktree: 'D:\AIProjects\raptor-worktrees\vus-census'
branch: track/vus-census-2026-07
base_commit: 46298e4248d1d53f55b1f2561c208fd124ff0e3f

roles:
  planner: Claude Opus (this contract)
  test_author: Gemini 3.5 Flash (owns new tests before the doer)
  doer: Claude Sonnet 5 (implementation only)
  checker: GPT-5.4 (anti-trace-cribbing + privacy + policy probes)

# --------------------------------------------------------------------------
# 1. Binding decisions (ADR-0012 + certified negative gate)
# --------------------------------------------------------------------------

binding_decisions:
  adr_0012:
    reference: 'docs/DECISIONS.md#adr-0012--pp3bp4-automated-emission-disabled-for-the-current-masked-rerun'
    status: approved
    mode: disabled_manual
    invariants:
      - PP3/BP4 are absent from production `included_criteria`, evaluation
        `automatable_criteria`, and packet candidate-direction points.
      - PP3/BP4 remain in the ACMG vocabulary and BIAS can-fire lineage with
        `deferred` dispositions for manual review (never deleted).
      - Every automated PP3/BP4 call is suppressed and reported; the run must
        record ZERO scored PP3/BP4 calls.
      - Approval authorizes only the disabled/manual evidence mode. It does NOT
        authorize a VUS classification, research scope, clinical claim, public
        worklist, or ClinVar submission.
      - ADR-0011's metric-driven gate and scope gate remain authoritative and
        unchanged; corrected/REVEL-enabled PP3/BP4 remains BLOCKED_POLICY.
  certified_masked_gate_is_negative:
    record: data/census/tsc_masked_holdout_gate_disabled_manual_2026-07-21.json
    sha256: 7c55cd4e3059713d1d53886d8893a3819153375b62ce9d37187d731132c6a77f
    sha256_provenance: committed_git_lf_blob
    sha256_windows_crlf_checkout_do_not_pin: e914f65231c8004b1c7a96d2fe80bd49bac591433112699ff91cc5b027e55207
    hash_rule: >-
      Committed data-artifact identity is the canonical Git/LF blob SHA-256
      (7c55…), NOT the Windows autocrlf CRLF checkout SHA-256 (e914…). Repo
      artifacts are verified against their canonical LF blob bytes on EVERY
      platform; the CRLF checkout hash is a local-filesystem artifact and must
      never be pinned. Config/policy inputs in hash_contract are the deliberate
      exception: they are verified as RAW PATH BYTES because the approved policy
      pins those exact on-disk bytes.
    legacy_v1_gate: FAIL
    full_spectrum_status: BLOCKED_POLICY
    vus_authorized: false
    governance_state: NONE_VALIDATED
    note: >-
      This masked-holdout gate is a DIFFERENT corpus (2,577 masked held-out
      rows) from the 6,618-VUS census. Its suppression pins (BP4 1929, PP3 134,
      union 2043) are the benchmark-subset numbers and MUST NOT be copied into
      the full-census aggregate, whose own suppression totals are measured
      independently over all 6,618 rows (see expected_real_data_measurements).
  authority_boundary:
    statement: >-
      A census organizes INTERNAL, eval-only review directions. It cannot
      create a public worklist, a classification, a research authorization, or
      a clinical claim. Candidate LP/LB directions are non-authoritative
      review metadata only.

# --------------------------------------------------------------------------
# 2. Decision ledger + rejected alternatives
# --------------------------------------------------------------------------

decision_ledger:
  D1_architecture_extract_shared_seam:
    decision: >-
      Extract the pure census-selection core (ManifestEntry, StratumEntry, the
      pinned STRENGTH_MAP, load_manifest, reproduce_census_strata, and the
      consequence-grouping helpers) OUT of scripts/build_tsc_calibration_batch.py
      into a new packet-free package src/raptor/census/, and reuse it from both
      the existing calibration script and the new census tool. This is the
      smallest DRY change that (a) does not duplicate the census-selection
      algorithm, (b) keeps packet code NON-authoritative for the census (the
      census package imports only raptor.scorer + raptor.eval, never
      raptor.packet), and (c) preserves the calibration script's behavior
      byte-for-byte (pure move + import).
    rationale: >-
      The census-selection algorithm already exists and is verified against the
      historical record; the only packet coupling is at the script's module
      import. Extraction removes that coupling for the census path without a
      behavior change to the packet batch builder.
  D2_policy_invariant_conservation_only:
    decision: >-
      The census tool conserves ONLY the policy-invariant identity/row/join/
      source-hash invariants (6,618 manifest identities, 6,618 BIAS rows, exact
      one-to-one vcf_key<->SPDI join, input VCF / BIAS TSV / manifest SHA-256).
      It MUST NOT reuse assert_source_of_record_conservation's historical
      direction assertions (238 LP / 1,333 LB / 20 / 10 patterns): those are the
      PP3/BP4-ACTIVE numbers and would falsely fail (or tempt an edit) under the
      disabled/manual policy. Direction, pattern, and suppression counts are
      MEASURED fresh and compared to the historical record as a reported delta,
      never asserted equal to it.
    rationale: >-
      Reproducing a superseded census's direction totals is the wrong oracle
      for a policy change; the invariant conservation is the correct shared
      guard.
  D3_derive_counts_never_crib:
    decision: >-
      Production code in src/raptor/census/ derives every count from the
      immutable inputs + approved configs. It contains NO expected-count literal
      (157/7/6424/30/238/1,333/5,017/2,226/3,696/5,474/7/2) and never reads this
      spec, the historical stats file, or the masked gate as a scoring input.
      The historical stats file may be READ only to compute the reported
      comparison delta, never to source current-policy counts.
    rationale: STRATEGY GP anti-trace-cribbing; slot-2/slot-3 hard requirement.
  D4_new_versioned_record_preserve_historical:
    decision: >-
      Emit a NEW record at data/census/tsc_vus_clinvar_2026-07-07_disabled_manual_stats.json;
      leave data/census/tsc_vus_clinvar_2026-07-07_stats.json byte-unchanged
      (superseded, PP3/BP4-active). The new record is aggregate + non-identifying
      only.
    rationale: Historical artifacts stay immutable and clearly superseded.
  D5_hash_bind_current_approved_policy:
    decision: >-
      Verify the approved disabled/manual policy status/mode and bind the CURRENT
      raw SHA-256 of every policy/config input BEFORE processing; fail closed on
      drift. The planner-verified current hashes (see hash_contract) equal the
      hashes the approved policy records, confirming the on-disk configs are the
      approved-policy configs.
    rationale: ADR-0012 requires verifying hashes before use; no restating.
  D6_no_packets_no_gate_change_no_x64:
    decision: >-
      Generate NO review packets in this track; change NO classification, gate,
      scope-gate, packet, or predictor policy; run NO x64 worker and NO new
      annotation. Reuse the immutable committed BIAS TSV.
    rationale: slot-3 implementation constraints.

rejected_alternatives:
  - id: R1_import_calibration_script_directly
    option: >-
      Reuse reproduce_census_strata by importing scripts/build_tsc_calibration_batch.py
      from the new census tool.
    rejected_because: >-
      That module imports the entire packet path (build_packet, queue, render,
      model) at module scope, making packet code a load-time dependency of the
      census and violating "do not make packet code authoritative"; the script
      also is not an installable package under src/.
  - id: R2_duplicate_algorithm
    option: Re-implement the census-selection algorithm inside the census tool.
    rejected_because: >-
      Violates DRY and slot-2 "do not duplicate the census-selection algorithm";
      two copies would drift from the calibration oracle.
  - id: R3_reuse_historical_direction_conservation
    option: Reuse assert_source_of_record_conservation as-is for the new census.
    rejected_because: >-
      It asserts the PP3/BP4-ACTIVE historical totals (238/1,333/20/10), which
      the disabled/manual policy legitimately changes to 157/7/7/2; reusing it
      would either fail closed on correct data or invite an edit to a shared,
      calibration-critical guard.
  - id: R4_mutate_historical_record
    option: Overwrite tsc_vus_clinvar_2026-07-07_stats.json in place.
    rejected_because: Destroys the immutable superseded provenance; forbidden.
  - id: R5_emit_into_raw_data_dir
    option: Write the aggregate next to the raptor-data inputs.
    rejected_because: >-
      Output must be an explicit in-repo data/census/*.json path; writing into
      an external raw-data directory is refused by the output boundary.

