      equals_policy_field: eval_config_hash
      note: >-
        automatable_criteria = [PVS1, PS1, PM1, PM2, PM4, PM5, PP2, BA1, BS1,
        BP1, BP3, BP7]; PP3/BP4 removed 2026-07 per ADR-0012.
    bias_lineage_policy:
