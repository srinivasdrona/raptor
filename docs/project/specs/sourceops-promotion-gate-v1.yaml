      exit: 6
    - code: V2_S3_ARTIFACT_MISMATCH
      phase: artifacts
      exit: 7
    - code: SOURCE_BASELINE_MISMATCH
      phase: baseline
      exit: 8
    - code: POLICY_MISMATCH
      phase: policy
      exit: 9
    - code: CANDIDATE_CHANGED
      phase: candidate
      exit: 10
    - code: TARGET_MAPPING_INVALID
      phase: patch
      exit: 11
    - code: PROTECTED_PATH_VIOLATION
      phase: patch
      exit: 12
    - code: COMPONENT_PROMOTION_OUT_OF_SCOPE
      phase: patch
      exit: 13
    - code: PROPOSAL_COLLISION
      phase: replay
      exit: 14
    - code: REMOTE_BRANCH_PARTIAL
      phase: remote_branch
      exit: 15
    - code: DRAFT_PR_CREATION_FAILED
      phase: draft_pr
