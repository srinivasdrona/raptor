# SourceOps Promotion Gate v1 -- Sol planning contract.
#
# PLAN ONLY. This is a separate post-RAPTOR-v2 project. It is never V2-S4.
# It authorizes future RED-test authoring, implementation, and independent
# checking of a receipt-gated proposal generator. It authorizes no pilot run,
# source activation, direct write to main, route execution, rollback restore,
# evidence reinterpretation, auto-merge, or non-draft pull request.

