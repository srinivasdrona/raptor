authority:
  precedence:
    - docs/DECISIONS.md
    - docs/STRATEGY.md
    - docs/EVALUATION.md
    - docs/PROGRAM.md
    - docs/ARCHITECTURE.md
    - METHOD.md
    - docs/prd/
    - docs/project/specs/raptor-v2-kickoff.yaml
    - docs/project/specs/raptor-v2-s2-staged-snapshot.yaml
    - docs/project/specs/raptor-v2-s3-drift-gates.yaml
    - docs/project/specs/sourceops-promotion-gate-v1.yaml
  relationship_to_raptor_v2:
    classification: separate_post_v2_project
    is_v2_slice: false
    forbidden_aliases:
      - V2-S4
      - RAPTOR-v2-S4
      - automatic-promotion-slice
    dependency: >-
      The project consumes published V2-S2 and V2-S3 artifacts as immutable
      inputs. It does not amend their schemas, hash bases, semantics, code, or
      proposal-only ceilings.
    reason: >-
      V2 ends at deterministic observation, materiality evaluation, impact
      routing, and rollback rehearsal. Turning an approved observation into a
      repository branch and draft pull request introduces human-authorization,
      git, and GitHub transaction boundaries that require a new project and
      decision record.
  decision_numbering_dependency:
    this_decision: ADR-0021
    reserved_predecessor: ADR-0020
    reserved_for: ClinVar amendment on its separate worktree/branch
    merge_order: ADR-0020_then_ADR-0021
    rule: >-
      ADR-0020 is intentionally absent from this branch baseline and reserved
      for the ClinVar amendment expected to merge first. Before Promotion Gate
      merges, rebase onto that result, require ADR-0020 to be present and
      unchanged, retain this decision as ADR-0021, and stop on any numbering or
      semantic collision.
  conflict_rule: >-
    A conflict with a higher-precedence authority is a defect in this file.
    Future test authors, implementers, checkers, and operators must stop rather
    than weaken V2-S2/V2-S3, frozen evidence, branch protection, or the human
    approval boundary.
  planning_only_change_scope:
    allowed:
      - docs/project/specs/sourceops-promotion-gate-v1.yaml
      - docs/project/specs/raptor-v2-kickoff.yaml
      - docs/PROGRAM.md
      - docs/DECISIONS.md
      - docs/RISK_REGISTER.md
      - docs/project/TODOS.yaml
    forbidden:
      - src/
      - tests/
      - configs/
      - data/
      - .github/
      - dependency manifests
      - generated SourceOps artifacts
  no_current_execution:
    - no production implementation
    - no RED tests
    - no staged candidate
    - no approval receipt
    - no pilot
    - no branch generation
    - no commit
    - no push
    - no pull request

