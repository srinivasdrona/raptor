product_contract:
  user: RAPTOR source-maintenance operator
  goal: >-
    Given one still-current repository baseline, one exact V2-S2 artifact
    pair, one exact V2-S3 artifact pair, the unchanged staged candidate bytes,
    and one fresh typed human approval receipt binding all of them, construct
    one review-only git proposal, publish it only to a deterministic
    non-protected proposal branch, and open exactly one draft pull request
    against main.
  authority_ceiling: >-
    The gate proves only that a draft repository proposal matches a fresh
    signed human receipt and the exact previously validated artifacts. It does
    not prove source truth, legal permission, scientific sufficiency,
    evidentiary meaning, policy correctness, consumer readiness, route
    completion, validation, classification, or merge authorization.
  only_permitted_persistent_outputs:
    - one content-addressed local proposal record and exact patch
    - one deterministic proposal branch below refs/heads/sourceops/proposals/
    - one commit on that proposal branch
    - one draft pull request targeting main
  never_permitted_outputs_or_actions:
    - direct write, commit, update, force-push, reset, or delete of main
    - write to any protected branch or tag
    - pull-request ready-for-review transition
    - auto-merge enablement or merge
    - route dispatch or execution
    - benchmark rebuild
    - policy review outcome
    - packet invalidation
    - Atlas regrounding
    - validation rerun
    - source activation or lifecycle transition
    - rollback restoration or rollback-content write
    - evidence parsing, scoring, synthesis, reinterpretation, or classification
    - external source acquisition or access-control bypass

scope:
  exact_in:
    - strict validation of one signed approval receipt
    - exact re-validation of one V2-S2 manifest-bound pair
    - exact re-validation of one V2-S3 diff-and-policy-bound pair
    - two-pass immutability verification of staged candidate and governed inputs
    - proposal of repository declaration bytes already observed by V2-S2
    - mechanical source-record metadata projection from V2-S2 candidate facts
    - mechanical registry self-hash update
    - mechanical materiality-policy registry-binding/version/self-hash update with unchanged rules
    - immutable receipt and cycle-free attestation records included in the proposed patch
    - deterministic patch, tree, commit, proposal branch, and draft PR
    - fail-closed replay, collision, stale approval, and partial transaction handling
  exact_out:
    - source downloading, scraping, API acquisition, archive extraction, or decompression
    - promotion of unobserved files or inferred target paths
    - committing SNAPSHOT_CONTENT or AUXILIARY_METADATA staged files
    - arbitrary repository editing
    - source-specific semantic parsing beyond existing V2 validations
    - modification of V2-S1/V2-S2/V2-S3 generated artifacts
    - mutation of rollback files or restoration from rollback files
    - execution of any V2-S3 proposed route or operation
    - GitHub issue, release, tag, deployment, workflow-dispatch, or merge operations
    - non-draft pull requests
    - evidence, clinical, patient-facing, submission, procurement, or RescueScreen work

explicit_exclusions:
  august_clinvar_prospective_validation:
    excluded: true
    protected_artifact: data/census/tsc_prospective_validation_2026-08_blocked_data.json
    rules:
      - the BLOCKED_DATA outcome remains immutable
      - the frozen HTTP-404 URL is not retried by this project
      - the alternate archive-root URL is not substituted
      - no August ClinVar archive bytes, labels, rows, hashes, or scores are read
      - no prospective status or authorization flag changes
      - no pilot may use a ClinVar source, component, declaration, or candidate
  access_blocked_mave:
    excluded: true
    source_id: tsc2-mave-source-register
    protected_declaration: configs/external/mave_sources.yaml
    rules:
      - no access-blocked MAVE source or candidate is eligible for v1
      - no credential, paywall, data-use, or missing-download condition is bypassed
      - MAVE access state cannot be changed by a promotion receipt
      - no MAVE bytes or Atlas access-blocked observations are committed
      - eligibility requires a later source-specific accepted plan after lawful access is verified
  evidence_and_domain:
    - frozen R2 and tiered-v3 artifacts
    - ACMG configs and policies
    - PP3/BP4 activation
    - Atlas claim promotion or panel selection
    - RescueScreen
    - clinical or research-scope authorization

terminology:
  proposal: >-
    A hash-bound branch, commit, patch, and draft pull request that remains
    unmerged and carries no readiness or execution claim.
  promotion: >-
    In this project name only, the transition from approved staged facts to a
    reviewable repository proposal. It never means activation, merge,
    evidence use, route execution, or lifecycle advancement.
  exact_artifact_set: >-
    One V2-S2 verification/diff pair and one V2-S3 impact/rollback pair whose
    filenames, canonical bytes, self-hashes, schemas, pair bindings, and
    transitive manifest/input-tree/registry/source/policy bindings all match.
  approval_receipt: >-
    A closed canonical JSON document carrying a human signature and binding
    one exact base, source, candidate, policy set, artifact set, path mapping,
    and proposal ceiling for a bounded time.
  stale_approval: >-
    A receipt that is expired, not yet valid, signed by an unapproved key,
    bound to a moved base, changed input, changed policy, changed artifact,
    changed source, changed target mapping, or an already-used conflicting
    proposal.
  replay: >-
    A repeated invocation using the identical receipt and identical immutable
    inputs. It may return the exact existing proposal without mutation; it may
    never create a second branch or PR.

