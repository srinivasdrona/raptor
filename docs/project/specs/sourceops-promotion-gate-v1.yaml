  fixed_subject_rule: >-
    Error subjects may contain only validated source ids, receipt hashes,
    approved canonical repository paths, and fixed phase names. They never
    echo unsafe raw paths, command lines, tokens, signatures, or remote error
    bodies.

rollback_and_backout:
  before_merge:
    preferred: close the draft PR and delete the proposal branch manually after review
    gate_behavior: no close_or_delete_operation
    local_cleanup: remove only owned ignored transaction/worktree files after exact ownership checks
  after_external_human_merge:
    rule: >-
      This gate does not restore files or execute V2-S3 rollback operations.
      Backout requires a separately reviewed revert PR against the exact merged
      commit under normal branch protection.
    required_inputs_for_revert_plan:
      - merged commit hash
      - original receipt and proposal hashes
      - current main hash
      - fresh human approval
    automatic_revert: forbidden
  implementation_backout:
    - revert future promotion-only code, tests, configs, and CLI registration
    - retain immutable receipt/attestation records and already-created draft PRs for audit
    - do not change V2-S1/V2-S2/V2-S3 artifacts or behavior
    - no database or source-content restoration is required

low_risk_real_pilot:
  status: planned_not_authorized_not_run
  source_id: atlas-tsc2-catalog-template
  why_low_risk:
    - lifecycle is METADATA_ONLY
    - consumers is empty
    - committed catalog contains sources: []
    - no external content is referenced
    - no evidence, candidate, classification, panel, or validation result changes
  exact_allowed_change:
    declaration: configs/atlas/catalogs/tsc2/catalog.yaml
    field_change:
      catalog_version:
        before: 1.0.0-phase2-template
        after: 1.0.1-phase2-template
    mechanical_companions:
      - recompute catalog_content_hash
      - mirror the exact version and declaration hash in the selected registry source record
      - apply the receipt-approved registry version and recompute registry_content_hash
      - rebind an otherwise identical materiality policy to the proposed registry and recompute its hash
      - add the exact signed receipt and cycle-free attestation records
    invariants:
      - sources remains []
      - catalog_id remains tsc2
      - disease_pack_binding remains byte-semantically identical
      - content_root_policy remains byte-semantically identical
      - no Atlas candidate or source row is added
  prerequisites:
    - future Gemini RED suite complete
    - future Sonnet implementation complete
    - future GPT checker PASS on implementation
    - fresh signed receipt binding exact real V2-S2/V2-S3 artifact hashes
    - clean main at the receipt-bound base commit
    - branch protection and required CI available
  pilot_outputs_only:
    - proposal branch
    - exact patch, receipt, attestation, and local proposal record
    - draft PR
  pilot_stop_conditions:
    - any consumer appears
    - source lifecycle is no longer METADATA_ONLY
    - sources is non-empty
    - any evidence or access-controlled path enters the diff
    - any V2-S3 route is treated as completed
    - approval, base, policy, candidate, or artifact hash is stale

acceptance_criteria:
  - id: PG-AC01
    requirement: Project identity is post-V2 and no public surface calls it V2-S4.
  - id: PG-AC02
    requirement: All six candidate/source/baseline hash classes and all four exact V2 artifact hashes are independently verified.
  - id: PG-AC03
    requirement: The approval receipt is closed, canonical, self-hashed, human-signed, authority-checked, and fresh.
  - id: PG-AC04
    requirement: A moved main branch, changed candidate, changed source, changed policy, or changed artifact rejects before writes.
  - id: PG-AC05
    requirement: Only exact V2-S2 CANDIDATE_DECLARATION bytes can reach mapped declaration targets.
  - id: PG-AC06
    requirement: Registry changes are limited to the selected mechanical projection and self-hash.
  - id: PG-AC07
    requirement: Materiality-policy rules remain identical; only version, registry binding, and self-hash may change.
  - id: PG-AC08
    requirement: Changed paths equal the exact approved path set and every protected path remains unchanged.
  - id: PG-AC09
    requirement: Main, tags, other protected refs, git config, hooks, and submodules remain unchanged.
  - id: PG-AC10
    requirement: One receipt deterministically yields at most one branch, one commit, one patch, and one draft PR.
  - id: PG-AC11
    requirement: Identical replay is mutation-free; conflicting replay fails closed.
  - id: PG-AC12
    requirement: Expired approval cannot create, recreate, update, repair, or rebase a proposal.
  - id: PG-AC13
    requirement: Remote partial failure is durably recorded and never compensated by destructive mutation.
  - id: PG-AC14
    requirement: The PR is created draft, remains draft, and has no auto-merge request.
  - id: PG-AC15
    requirement: No code path can mark ready, approve, merge, dispatch a workflow, or modify branch protection.
  - id: PG-AC16
    requirement: V2-S3 routes are rendered only as inert checklist text and are never executed.
  - id: PG-AC17
    requirement: Rollback status is reported, but rollback bytes are never restored, created, copied, or changed.
  - id: PG-AC18
    requirement: No evidence or domain package is imported or invoked by promotion production code.
  - id: PG-AC19
    requirement: August ClinVar prospective validation and access-blocked MAVE inputs reject explicitly.
  - id: PG-AC20
    requirement: Secrets, credentials, and unsafe raw remote errors never leak; the approved receipt signature appears only in the receipt record.
  - id: PG-AC21
    requirement: Crash-point tests cover every local/remote transaction boundary and exact replay outcome.
  - id: PG-AC22
    requirement: Existing V2-S1/V2-S2/V2-S3 behavior and tests remain unchanged and green.
  - id: PG-AC23
    requirement: The planned metadata-only zero-source Atlas catalog pilot is the only v1 real pilot.
  - id: PG-AC24
    requirement: The pilot cannot run until the later Gemini, Sonnet, GPT, CI, and human gates all pass.
  - id: PG-AC25
    requirement: Checker PASS binds exact implementation, receipt, proposal, patch, commit, and CI hashes but does not authorize merge.
  - id: PG-AC26
    requirement: Every known and unknown source lifecycle is mechanically classified; PINNED_HISTORICAL, ACCESS_BLOCKED, RETIRED, and unknown values reject before writes.
  - id: PG-AC27
    requirement: Every receipt target intersecting an always-protected directory or exact protected artifact rejects, and no receipt field can override protection.
  - id: PG-AC28
    requirement: The approval-authority policy is closed, self-hashed, rotation-aware, and accepts exactly one signature from one enabled qualified principal/key.
  - id: PG-AC29
    requirement: receipt_content_hash alone identifies replay and proposal objects; receipt_id is signed informational metadata with no uniqueness behavior.
  - id: PG-AC30
    requirement: Commit author and committer names, emails, epoch seconds, +0000 offsets, message, parent, and tree are exact and supplied through the six pinned Git environment variables.
  - id: PG-AC31
    requirement: Each write boundary uses a fresh allowlisted GitHub Date header cross-check; the exact uncertainty calculation fails closed above 60 seconds or outside the receipt window.

inversion_and_falsifier_probes:
  - mutate one hex character in each required hash independently
  - reuse a valid receipt against a different candidate snapshot
  - reuse a valid receipt after main advances
  - set receipt expiry one second before trusted current time
  - sign with a disabled or wrong human key
  - rotate the authority policy and replay an unused receipt bound to the old policy hash
  - use a disabled principal, DISABLED key, expired ROTATING_OUT key, cyclic replacement, duplicate fingerprint, or wrong role
  - insert one unknown receipt key
  - give two different receipt hashes the same informational receipt_id and prove they do not conflict by id
  - map a staged file to an unbound target path
  - map a target equal to, below, above, or casefold-colliding with every protected path class
  - select PINNED_HISTORICAL, ACCESS_BLOCKED, RETIRED, or an unknown lifecycle
  - add a workflow, source file, test, doc, frozen artifact, rollback file, or MAVE path to the patch
  - attempt a force push or main refspec
  - inject ambient Git author/committer identity, date, offset, locale, or user config and prove the commit hash is unchanged
  - return an existing branch with a different commit
  - return two PRs for one receipt
  - make the PR non-draft or attach auto-merge
  - inject a route string that resembles a command
  - provide a rollback plan containing proposed restore operations
  - change one materiality selector while recomputing the policy hash
  - change a registry lifecycle, consumer, drift action, or rollback field
  - make the pilot catalog sources list non-empty
  - include the August ClinVar BLOCKED_DATA artifact as a candidate
  - select tsc2-mave-source-register or an access-blocked MAVE row
  - crash before local publish, after branch push, and after PR creation
  - replay an exact completed proposal after receipt expiry and assert read-only reporting only
  - omit, duplicate, malform, or redirect the GitHub Date response
  - make local UTC step relative to monotonic time or make calculated uncertainty exceed 60 seconds

migration_compatibility_and_backout:
  migrations:
    database: none
    V2_artifacts: none
    registry_schema: none
    V2_S2_schema: none
    V2_S3_schema: none
  additive_rules:
    - new receipt, promotion-policy, authority-policy, proposal, and checker schemas are versioned
    - existing V2 artifacts remain immutable and are never upgraded in place
    - schema changes require new ids and hash bases
    - existing SourceOps validate, status, verify-stage, and plan-drift behavior remains byte-compatible
  removal: >-
    Future implementation can be reverted without changing existing SourceOps
    artifacts. Existing proposal branches and draft PRs remain ordinary git
    and GitHub audit objects and are handled manually.

open_questions_resolved_by_planning:
  - question: Is this V2-S4?
    resolution: No; it is a separate post-V2 project.
  - question: Is a V2-S3 proposal enough to generate a branch?
    resolution: No; a fresh signed human receipt bound to all exact hashes is mandatory.
  - question: Can the gate select latest artifacts?
    resolution: No; all four artifact hashes plus manifest and input-tree hashes are explicit.
  - question: Can approval survive a moved main branch?
    resolution: No; moved main makes the receipt stale and requires a new full cycle.
  - question: Can the gate update an existing proposal?
    resolution: No; exact replay returns it, while any mismatch requires a new receipt.
  - question: Is receipt_id globally unique?
    resolution: No; it is signed informational metadata. receipt_content_hash is the only enforced identity.
  - question: Can a receipt waive path or lifecycle protection?
    resolution: No; protected intersection and lifecycle eligibility run mechanically before mapping admission.
  - question: Who may approve?
    resolution: One signature from one enabled qualified principal/key in the exact current approval-authority policy; no co-approval or owner exception exists.
  - question: What is trusted current time?
    resolution: A fresh allowlisted GitHub API Date header cross-checked with local UTC and monotonic RTT under the exact 60-second uncertainty calculation.
  - question: Can it execute impact or rollback routes?
    resolution: No; routes and rollback operations are inert rendered facts only.
  - question: Can it merge?
    resolution: No; it cannot mark ready, approve, enable auto-merge, or merge.
  - question: How is partial remote failure handled?
    resolution: Receipt-scoped durable saga state and non-destructive exact replay.
  - question: What is the first real pilot?
    resolution: A version-only bump of the zero-source metadata-only Atlas catalog template.
  - question: Are August ClinVar or blocked MAVE candidates eligible?
    resolution: Explicitly no.

definition_of_done:
  planner_stage:
    - this file is the sole detailed SourceOps Promotion Gate v1 authority
    - V2 kickoff identifies it as a separate post-V2 successor and never V2-S4
    - PROGRAM records the separate proposal gate after V2
    - ADR-0021 records the decision and safety ceiling
    - TODO graph contains one post-V2 implementation task after V2-S3
    - risk register records stale/replayed approval and protected-ref/PR-state failures
    - edited YAML parses in the required WSL raptor environment
    - TODO import and DAG checks pass in that environment
    - git diff --check passes
    - changed files are planning, decision, risk, and TODO documentation only
    - no pilot, commit, push, PR, or merge occurs
  later_red_stage:
    - Gemini authors every mapped RED test before production implementation
    - tests fail for missing promotion behavior rather than fixture defects
    - all V2 tests remain unchanged and green
  later_implementation_stage:
    - Sonnet 5 implements the exact narrow adapters and pure core
    - no protected path, route, rollback, evidence, or merge boundary is weakened
    - all CI and crash/replay tests pass
  later_checker_stage:
    - GPT independently verifies every acceptance criterion and falsifier
    - checker verdict binds exact hashes
  later_pilot_stage:
    - only the metadata-only zero-source catalog version proposal runs
    - output is one proposal branch, patch, and draft PR
    - human separately decides whether any later ready/merge action occurs
  stop_conditions:
    - any request to label the project V2-S4
    - inability to bind a typed human signature to every exact hash
    - inability to validate the closed approval-authority policy and current signer/key state
    - inability to obtain and cross-check trusted GitHub/local time within 60 seconds
    - any receipt target protected-path intersection or ineligible lifecycle
    - inability to prove main and protected paths remain unchanged
    - need to reinterpret evidence or execute a route to build the patch
    - need to restore rollback content
    - need to enable auto-merge, mark ready, approve, or merge
    - need to use August ClinVar prospective data or access-blocked MAVE sources
    - inability to make replay and partial failures fail closed
