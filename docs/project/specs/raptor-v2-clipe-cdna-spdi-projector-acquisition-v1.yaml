# ---------------------------------------------------------------------------
# Uncertainties requiring a full live pilot (not block-able by more design)
# ---------------------------------------------------------------------------
pilot_uncertainties:
  - id: U1
    question: Do all 208 rows return len(spdis)==1 on NM_000548.5?
    support_now: 7/7 pilot; composition is only SNV/delins
    resolution: full operator run; any !=1 → STEP1_AMBIGUOUS_SPDIS
  - id: U2
    question: Does canonical_representative always return NC_000016.10 for this set?
    support_now: 7/7 pilot returned NC_000016.10; all_equivalent also lists NC_000016.9
    resolution: hard-fail non-pinned genome; count STEP2_NON_PINNED_GENOME
  - id: U3
    question: Do any delins undergo unexpected contextual reshaping vs source HGVS span?
    support_now: pilot delins preserved equal-length del/ins with plausible coords
    resolution: freeze tx_spdi+genomic_spdi; optional local SeqRepo cross-check later
  - id: U4
    question: Can the service sustain ~416 sequential GETs without elevated error rates?
    support_now: short probe series OK at ≥1s interval; no rate headers observed
    resolution: enforce 1 rps + retries; abort if retryable failures exceed 5%
  - id: U5
    question: Will step3 hgvs for all delins be uniformly parseable for identity upgrade?
    support_now: 3 delins hgvs_g forms observed as g.START_ENDdelinsSEQ
    resolution: optional; acquisition success does not require step3
  - id: U6
    question: >-
      Does NCBI alignment version drift over time change canonical positions for
      the same input HGVS?
    support_now: unknown long-term; SPDI services use "latest alignment"
    resolution: >-
      Raw response cache + mapping freeze make a pilot reproducible offline.
      Re-acquisition requires a new run_id/bundle; never silently overwrite.

# ---------------------------------------------------------------------------
# Acceptance criteria for a future build+pilot
# ---------------------------------------------------------------------------
acceptance_criteria:
  - id: CP-01
    rule: Operator is the only network I/O entry point; library tests run offline on fixtures.
  - id: CP-02
    rule: >-
      Source bundle manifest content hash/bundle id/scores artifact identity,
      input scores CSV sha256/bytes/rows and FASTA sha256 match pins before fetch.
  - id: CP-03
    rule: Endpoint sequence is exactly step1 contextuals → step2 canonical_representative.
  - id: CP-04
    rule: Batch contextuals and direct hgvs canonical paths are not called.
  - id: CP-05
    rule: Every final_url passes host/path/resource binding to api.ncbi.nlm.nih.gov/variation/v0.
  - id: CP-06
    rule: Mapping JSONL has exactly 208 rows, source_row 1..208 contiguous, no drops.
  - id: CP-07
    rule: PROJECTED_FASTA_VERIFIED requires genomic_spdi on NC_000016.10 and FASTA del match.
  - id: CP-08
    rule: Failures use the status vocabulary; error_detail never contains secrets.
  - id: CP-09
    rule: Raw responses + mapping + manifest live outside Git; committed summary is aggregates only.
  - id: CP-10
    rule: >-
      No $PS3$/$BS3$/classification vocabulary appears in any artifact;
      boundary flags use only clinical_use=forbidden and
      evidence_strength_use=forbidden.
  - id: CP-11
    rule: Replaying frozen raw responses reproduces mapping bytes and manifest content_hash.
  - id: CP-12
    rule: Full pilot records residual pilot_uncertainties outcomes in the committed summary.
  - id: CP-13
    rule: Mapping JSONL revalidates exact row schema/invariants and rejects duplicate source_row keys.
  - id: CP-14
    rule: >-
      Bundle manifests enforce exact field sets, safe unique artifact paths and
      full row/status/shape/success/failure conservation before publication.
  - id: CP-15
    rule: >-
      Every well-typed HTTP attempt body, including failed retry attempts, is
      frozen and indexed; permanent 4xx failures are never counted as retry
      exhaustion.
  - id: CP-16
    rule: >-
      Retry backoff uses full jitter, honors Retry-After when present, and the
      operator applies distinct connect and read timeouts.

failure_cases:
  - input scores hash drift or row-count != 208
  - reference FASTA missing or checksum mismatch
  - URL allowlist or resource-binding violation
  - use of batch or direct-canonical endpoints
  - step1 invalid HGVS / ambiguous spdis / wrong seq_id
  - step2 non-NC_000016.10 canonical representative
  - FASTA deleted-allele mismatch
  - silent drop or duplicate source_row in mapping
  - library network I/O
  - overwrite of an existing external run directory
  - clinical or evidence-strength claims in outputs

# ---------------------------------------------------------------------------
# Expected pilot outputs (where empirically supportable)
# ---------------------------------------------------------------------------
expected_pilot_outputs:
  supportable_now:
    total_mapping_rows: 208
    shape_counts: {SNV: 161, DELINS: 47}
    endpoint_sequence: two_step_only
    reference_sha256: 22dc1bb93de407e0653791c36e4097fbaf64c9efa2510c83b7777f607a61e4d0
    scores_sha256: 74fef301d3b3cf6b6958161f7eaf8fa1ebab7ae35befae3879d0a9841c769717
    sample_success_genomic_spdis:
      - 'NC_000016.10:2065518:G:A'      # c.1600G>A
      - 'NC_000016.10:2065545:CCG:TGA'  # c.1627_1629delinsTGA
      - 'NC_000016.10:2065531:CC:GA'    # c.1613_1614delinsGA
