# ---------------------------------------------------------------------------
# Observed input composition (from frozen scores CSV; no network)
# ---------------------------------------------------------------------------
input_composition:
  total_rows: 208
  unique_hgvs_nt: 208
  duplicate_hgvs_nt_groups: 0
  shapes:
    snv:
      pattern: 'c.<pos><ACGT>><ACGT>'
      count: 161
      notes: missense + synonymous single-nucleotide substitutions
    delins:
      pattern: 'c.<start>_<end>delins<ACGT+>'
      count: 47
      length_pairs:
        - deleted_len: 3
          inserted_len: 3
          count: 40
        - deleted_len: 2
          inserted_len: 2
          count: 7
      notes: >-
        All 47 are equal-length delins (MNVs / codon-scale substitutions),
        matching STOP_GAINED protein annotations in the normalization pilot
        (47 stop-gained). No pure del, dup, or ins shapes are present.
  c_position_span:
    min: 1600
    max: 5390
  protein_kind_rough_counts_from_hgvs_pro:
    stopish_Ter_or_star: 47
    synonymous_equals: 30
    remainder_mostly_missense: 131
  should_all_208_project: >-
    YES under this contract's success criteria, contingent on a full live pilot
    confirming every row yields exactly one NM_000548.5 contextual SPDI, a
    canonical representative on NC_000016.10, and a FASTA deleted-allele match.
    Composition contains only projectable SNV/equal-length-delins shapes; there
    are no SV/CNV/imprecise alleles. This is an expectation, not a pre-pilot
    guarantee — see pilot_uncertainties.

# ---------------------------------------------------------------------------
# NCBI Variation Services — exact endpoint sequence
# ---------------------------------------------------------------------------
api:
  base_url: https://api.ncbi.nlm.nih.gov/variation/v0
  auth: none required for public GETs
  accept: application/json
  content_type_observed: 'application/json; charset=utf-8'

  # REQUIRED sequence. There is no single-request HGVS→canonical path.
  endpoint_sequence:
    step1_hgvs_contextuals:
      method: GET
      path_template: /hgvs/{hgvs}/contextuals
      purpose: >-
        Convert a fully qualified HGVS c. expression into one or more
        contextual SPDI alleles on the stated sequence (for cliPE inputs,
        the transcript NM_000548.5).
      hgvs_input_rule: >-
        Always send the FULL expression `NM_000548.5:` + bare `c.…` from the
        scores CSV (after stripping any accidental whitespace). Never send bare
        `c.` alone; never substitute another transcript version.
      path_binding:
        # Live probes: both fully percent-encoded and curl-auto-encoded forms
        # returned 200, but the contract REQUIRES explicit encoding so builders
        # cannot depend on client-specific auto-encoding.
        encoding: >-
          Percent-encode the entire {hgvs} path segment with no safe characters
          (urllib.parse.quote(hgvs, safe='')). At minimum ':' -> '%3A' and
          '>' -> '%3E'. Do not use '+' for spaces; HGVS inputs must not contain
          spaces.
        example_snv_url: >-
          https://api.ncbi.nlm.nih.gov/variation/v0/hgvs/NM_000548.5%3Ac.1600G%3EA/contextuals
        example_delins_url: >-
          https://api.ncbi.nlm.nih.gov/variation/v0/hgvs/NM_000548.5%3Ac.1627_1629delinsTGA/contextuals
      success_http: 200
      success_schema:
        type: object
        required: [data]
        properties:
          data:
            type: object
            required: [spdis, input_hgvs_validity]
            properties:
              input_hgvs_validity:
                const: valid
              spdis:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [seq_id, position, deleted_sequence, inserted_sequence]
                  properties:
                    seq_id: {type: string}
                    position: {type: integer, minimum: 0, description: '0-based SPDI position'}
                    deleted_sequence: {type: string, pattern: '^[ACGT]*$'}
                    inserted_sequence: {type: string, pattern: '^[ACGT]*$'}
      acceptance_invariants_step1:
        - data.input_hgvs_validity == 'valid'
        - len(data.spdis) == 1
        - data.spdis[0].seq_id == 'NM_000548.5'
        - deleted_sequence and inserted_sequence are non-empty uppercase ACGT
        - position is an integer >= 0
        - warnings are absent at envelope, data and SPDI-item levels
      spdi_string_construction: >-
        tx_spdi = f"{seq_id}:{position}:{deleted_sequence}:{inserted_sequence}"
        using the exact field values from the JSON object (not the obsolete
        documentation spellings deletion-sequence / insertion-sequence).
      observed_examples:
        - hgvs: NM_000548.5:c.1600G>A
          response_spdi: {seq_id: NM_000548.5, position: 1709, deleted_sequence: G, inserted_sequence: A}
        - hgvs: NM_000548.5:c.1627_1629delinsTGA
          response_spdi: {seq_id: NM_000548.5, position: 1736, deleted_sequence: CCG, inserted_sequence: TGA}
        - hgvs: NM_000548.5:c.1613_1614delinsGA
          response_spdi: {seq_id: NM_000548.5, position: 1722, deleted_sequence: CC, inserted_sequence: GA}

    step2_spdi_canonical_representative:
      method: GET
      path_template: /spdi/{spdi}/canonical_representative
      purpose: >-
        Remap a contextual allele to the service's canonical representative
        using the latest NCBI alignment set (same family of alignments used by
        ClinVar/dbSNP). For TSC2 NM_000548.5 alleles in the pilot set this is
        NC_000016.10 on GRCh38.
      spdi_input_rule: >-
        Use the exact tx_spdi string from step 1. Length-form SPDI
        (SEQ:POS:DEL_LEN:INS) is accepted by the service for some inputs, but
        this contract FORBIDS length-form outputs and FORBIDS feeding length-form
        as the frozen tx_spdi — always freeze explicit deleted_sequence bases.
      path_binding:
        encoding: >-
          Percent-encode the entire {spdi} path segment with quote(spdi, safe='').
          ':' -> '%3A'.
        example_snv_url: >-
          https://api.ncbi.nlm.nih.gov/variation/v0/spdi/NM_000548.5%3A1709%3AG%3AA/canonical_representative
        example_delins_url: >-
          https://api.ncbi.nlm.nih.gov/variation/v0/spdi/NM_000548.5%3A1736%3ACCG%3ATGA/canonical_representative
      success_http: 200
      success_schema:
        type: object
        required: [data]
        properties:
          data:
            type: object
            required: [seq_id, position, deleted_sequence, inserted_sequence]
            properties:
              seq_id: {type: string}
              position: {type: integer, minimum: 0}
              deleted_sequence: {type: string, pattern: '^[ACGT]*$'}
              inserted_sequence: {type: string, pattern: '^[ACGT]*$'}
      acceptance_invariants_step2:
        - data.seq_id == 'NC_000016.10'
        - position is integer >= 0
        - deleted_sequence / inserted_sequence non-empty uppercase ACGT only
        - for cliPE shapes, len(deleted_sequence) >= 1 and len(inserted_sequence) >= 1
          (no pure empty-del or empty-ins expected in this score-set)
        - warnings are absent at envelope and data levels
      genomic_spdi_string: >-
        genomic_spdi = f"{seq_id}:{position}:{deleted_sequence}:{inserted_sequence}"
      canonical_representative_semantics: >-
        Per NCBI Variation Services documentation, the canonical representative
        is a single-location representative of a contextual allele under the
        latest alignment model, chosen so that identical variants share one
        representative when remapped to the same model. It is NOT "any GRCh38
        alias" and NOT "the full set of equivalents". This contract treats
        canonical_representative as the sole machine-selected genomic identity
        candidate, then HARD-FILTERS it to NC_000016.10. If the service ever
        returns a different primary contig (including NC_000016.9 / GRCh37),
        the row fails closed — it is not rewritten by the operator.
      observed_examples:
        - tx_spdi: 'NM_000548.5:1709:G:A'
          genomic_spdi: 'NC_000016.10:2065518:G:A'
        - tx_spdi: 'NM_000548.5:1736:CCG:TGA'
          genomic_spdi: 'NC_000016.10:2065545:CCG:TGA'
        - tx_spdi: 'NM_000548.5:1722:CC:GA'
          genomic_spdi: 'NC_000016.10:2065531:CC:GA'

    step3_optional_genomic_hgvs:
      method: GET
      path_template: /spdi/{spdi}/hgvs
      purpose: >-
        Optional annotation only. Derive right-shifted genomic HGVS from the
        accepted genomic SPDI for human review and for future identity-row
        hgvs_g population. NOT required to accept a mapping row.
      when: >-
        May be fetched in the same operator run after step2 acceptance, or in a
        follow-on annotation pass over the frozen mapping. Must use the accepted
        NC_000016.10 genomic_spdi as input (never the transcript SPDI) when the
        desired output is genomic HGVS.
      observed_examples:
        - genomic_spdi: 'NC_000016.10:2065518:G:A'
          hgvs_g: 'NC_000016.10:g.2065519G>A'
        - genomic_spdi: 'NC_000016.10:2065545:CCG:TGA'
          hgvs_g: 'NC_000016.10:g.2065546_2065548delinsTGA'
        - genomic_spdi: 'NC_000016.10:2065531:CC:GA'
          hgvs_g: 'NC_000016.10:g.2065532_2065533delinsGA'
      coordinate_note: >-
        SPDI position is 0-based; HGVS g. position is 1-based. For SNVs,
        hgvs_g_pos == spdi_pos + 1. For multi-base delins,
        hgvs interval start == spdi_pos + 1 and end == spdi_pos + len(deleted).

  rejected_endpoints:
    - path: /hgvs/{hgvs}/canonical_representative
      live_result: >-
        HTTP 422 Unprocessable Entity —
        'Expected one of "/hgvs/{hgvs}/contextuals" "/hgvs/batch/contextuals"'.
      rule: FORBIDDEN — no direct HGVS→canonical path exists on this API.
    - path: /hgvs/batch/contextuals
      live_result: >-
        GET without body → 500 missing post_body; POST with a JSON array of two
        valid cliPE HGVS strings → 500 internal substr error (2026-09-11 probe).
      rule: FORBIDDEN until a future spec re-probes and freezes a stable schema.
    - path: /spdi/{spdi}/all_equivalent_contextual
      role: diagnostic only
      live_observation: >-
        Returns many aligned sequences including NM_* isoforms, NG_005895.1,
        NC_000016.10 AND NC_000016.9. The NC_000016.10 entry matched
        canonical_representative in the SNV pilot, but selecting among
        equivalents in library code would re-implement canonicalization.
      rule: >-
        Not part of the acquisition hot path. May be stored as an optional
        diagnostic artifact; must never be the sole selector of genomic SPDI.
    - path: /vcf/{chrom}/{pos}/{ref}/{alt}/contextuals
      rule: >-
        Out of scope for cDNA projection (no genomic VCF inputs in cliPE).
        Existing tests/ingest/fetch_spdi.py uses this for unrelated AC3 work.

# ---------------------------------------------------------------------------
# URL / resource binding rules (network boundary)
# ---------------------------------------------------------------------------
network_boundary:
  rule: >-
    Only a dedicated operator script performs network I/O. The library package
    is pure parsing, schema validation, FASTA checks, hashing, deterministic
    ordering, and manifest construction over injected transport results / files.
  transport_result_shape:
    required_fields: [final_url, http_status, media_type, body]
    optional_fields: [response_headers]
    http_status_success: 200
    body_type: bytes
  allowlist:
    scheme: https
    host: api.ncbi.nlm.nih.gov
    path_prefix: /variation/v0/
    allowed_exact_path_patterns:
      - /variation/v0/hgvs/{hgvs}/contextuals
      - /variation/v0/spdi/{spdi}/canonical_representative
      - /variation/v0/spdi/{spdi}/hgvs   # optional step3
  final_url_binding: >-
    final_url must retain the same scheme, host, and path pattern as
    requested_url. The decoded {hgvs} or {spdi} path resource MUST equal the
    requested resource exactly (no transcript / allele substitution via
    redirect). Query string must be empty on both requested and final URLs for
    these endpoints. Any redirect that changes host, path template, or path
    resource identity is endpoint substitution and fails the row/run.
  secret_handling: >-
    No API key is required for the baseline contract. If an NCBI API key or
    tool/email contact is later added as a query parameter, it must be redacted
    from exceptions, logs, manifests, and committed summaries (store presence
    boolean only, never the secret value).
  library_import_ban:
    - urllib.request used for real fetches inside src/raptor/**
    - requests/httpx/aiohttp inside src/raptor/**
    - any call that opens a network socket from library code

# ---------------------------------------------------------------------------
# Rate limits, retries, timeouts
# ---------------------------------------------------------------------------
rate_limits_retries:
  service_note: >-
    NCBI Variation Services have historically been documented as beta with a
    conservative ~1 request/second guidance. Successful 2026-09-11 probes did
    not return Retry-After or RateLimit headers. E-utilities' 3 rps default
    MUST NOT be assumed for this host.
  min_interval_seconds: 1.0
  max_concurrent_requests: 1
  timeout_seconds:
    connect: 10
    read: 45
  retry_policy:
    retryable_http: [408, 429, 500, 502, 503, 504]
    retryable_transport: [timeout, connection_error, tls_error]
    non_retryable_http: [400, 401, 403, 404, 422]
    max_attempts_per_request: 4
    backoff: exponential_with_full_jitter
    backoff_base_seconds: 2.0
    backoff_cap_seconds: 60.0
    honor_retry_after_header: true
    retry_after_rule: >-
      Header names are case-insensitive. Accept either delay-seconds or an
      RFC 7231 HTTP-date and compute the non-negative delay against the
      operator clock. Malformed or past values fall back to jitter without
      aborting the row.
  row_failure_vs_run_abort:
    permanent_row_failure: >-
      HTTP 400 with input_hgvs_validity=invalid, empty/ambiguous spdis,
      canonical seq_id != NC_000016.10, non-ACGT alleles, FASTA mismatch —
      record structured row error; continue to next row.
    run_abort: >-
      Allowlist/binding violation, HTTP 422 on a supposedly valid path template
      (programming error), repeated retryable failures exhausting budget on
      >5% of rows, reference FASTA missing/checksum mismatch before any row,
      input scores hash drift, or operator cancellation.
  expected_request_budget_full_pilot:
    step1: 208
    step2: 208
    step3_optional: 208
    minimum_wall_clock_at_1rps_seconds: 416  # without step3; 624 with step3
    note: >-
      Plus retries. Operator should plan ~10–20 minutes wall clock with margin.

# ---------------------------------------------------------------------------
# Deterministic ordering
# ---------------------------------------------------------------------------
deterministic_ordering:
  input_order: >-
    Read the frozen scores CSV in file order. Assign source_row = 1-based
    data-row index (header excluded), matching functional-normalization.
  request_order: ascending source_row (1..208)
  output_order: >-
    mapping JSONL and per-row raw response index emit in ascending source_row.
    Never sort by genomic position or by success/failure before write.
  tie_breakers: >-
    source_row is unique. accession suffix (#N) must equal source_row for this
    score-set; if a future freeze breaks that equality, source_row remains the
    authority and the mismatch is recorded as a verification warning.
  hash_stability: >-
    Canonical JSON objects use sorted keys, UTF-8, LF newlines, final trailing
    newline on JSONL. Re-running over identical frozen raw responses must byte-
    reproduce mapping JSONL and manifest content_hash.

# ---------------------------------------------------------------------------
# Per-row processing contract
# ---------------------------------------------------------------------------
row_pipeline:
  build_hgvs_c:
    rule: 'hgvs_c = "NM_000548.5:" + hgvs_nt.strip()'
    reject_if: >-
      hgvs_nt does not match the SNV pattern, or its DELINS interval is
      reversed/unequal-length relative to the inserted sequence
  step1: GET contextuals(hgvs_c)
  parse_tx_spdi: enforce acceptance_invariants_step1
  step2: GET canonical_representative(tx_spdi)
  parse_genomic_spdi: enforce acceptance_invariants_step2
  fasta_validate: see fasta_validation
  optional_step3: GET hgvs(genomic_spdi)
  emit_mapping_row: always emit exactly one mapping row per source_row

# ---------------------------------------------------------------------------
# FASTA validation (independent of NCBI)
# ---------------------------------------------------------------------------
fasta_validation:
  precondition: >-
    Before any row is accepted, compute sha256 of NC_000016.10.fasta and require
    exact match to inputs.genomic_reference.sha256. Mismatch aborts the run.
  algorithm: >-
    Let pos0 = genomic_spdi.position (0-based). Let del = deleted_sequence.
    Read len(del) bases from the pinned FASTA starting at pos0 (using .fai random
    access or equivalent). Uppercase observed bases. Require observed == del.
  rejects:
    - observed != deleted_sequence → status FASTA_REF_MISMATCH (row failure)
    - pos0 + len(del) > sequence_length → status FASTA_OUT_OF_RANGE (row failure)
    - any non-ACGT in observed or in SPDI alleles → status NON_ACGT_ALLELE
  does_not_validate: >-
    Inserted sequence cannot be checked against the reference (by definition).
    Transcript-level deleted alleles are NOT re-checked against a local NM
    FASTA in this slice (NCBI step1 is the transcript authority); only the
    genomic deleted allele is locally grounded.
  pilot_results_2026_09_11:
    all_checked: 7
    all_matched: true
    examples:
      - genomic_spdi: 'NC_000016.10:2065518:G:A'
        observed_del: G
      - genomic_spdi: 'NC_000016.10:2065545:CCG:TGA'
        observed_del: CCG
      - genomic_spdi: 'NC_000016.10:2088575:T:C'
        observed_del: T
      - genomic_spdi: 'NC_000016.10:2088553:GTG:TGA'
        observed_del: GTG

# ---------------------------------------------------------------------------
# Error states (structured; no silent drops)
# ---------------------------------------------------------------------------
error_states:
  conservation_rule: >-
    |input_rows| == |mapping_rows|. Every source_row appears exactly once with
    an explicit status. Success and failure both produce a mapping row.
  status_vocabulary:
    - PROJECTED_FASTA_VERIFIED
    - STEP1_HTTP_ERROR
    - STEP1_INVALID_HGVS
    - STEP1_SCHEMA_VIOLATION
    - STEP1_AMBIGUOUS_SPDIS
    - STEP1_UNEXPECTED_SEQ_ID
    - STEP2_HTTP_ERROR
    - STEP2_SCHEMA_VIOLATION
    - STEP2_NON_PINNED_GENOME  # seq_id != NC_000016.10
    - FASTA_REF_MISMATCH
    - FASTA_OUT_OF_RANGE
    - NON_ACGT_ALLELE
    - TRANSPORT_OR_BINDING_ERROR
    - OPERATOR_SKIPPED  # only if run aborted mid-way; remaining rows marked
  http_error_examples_live:
    - hgvs: NM_000548.5:c.999999G>A
      http: 400
      body: >-
        position off the end of the sequence (NM_000548.5 length 6415bp);
        input_hgvs_validity=invalid
    - hgvs: NM_000548.5:c.1600A>G
      http: 400
      body: >-
        submitted reference allele (A) does not agree with actual reference (G);
        input_hgvs_validity=invalid
  ambiguous_spdis_rule: >-
    If step1 returns spdis length != 1, fail the row as STEP1_AMBIGUOUS_SPDIS
    even if one entry looks right. Do not pick.
  duplicate_source_hgvs: >-
    Not observed (0 duplicate hgvs_nt). If a future freeze introduces duplicate
    c.HGVS strings, still emit one mapping row per source_row; identical
    genomic_spdi across rows is allowed and expected (many rows → one variant_id).
    One source_row mapping to multiple distinct genomic SPDI is impossible under
    this pipeline by construction (single canonical_representative object).

# ---------------------------------------------------------------------------
# Duplicates and equivalent representations
# ---------------------------------------------------------------------------
duplicates_and_equivalents:
  input_duplicates: none in frozen 208
  many_rows_one_spdi: >-
    Allowed. Downstream join key remains genomic SPDI; provenance retains each
    source_record_id / accession.
  equivalent_representations: >-
    all_equivalent_contextual may list GRCh37 NC_000016.9 and alternate
    transcripts. These are NOT accepted identities. Only NC_000016.10
    canonical_representative + FASTA verification yields PROJECTED_FASTA_VERIFIED.
  left_right_shift: >-
    Step1 returns contextual (precision-corrected) alleles. Step2 canonicalizes
    location. Operators must not further left-align with a second local algorithm
    before freeze; local SeqRepoGenomicNormalizer may be used in a LATER
    identity-normalization slice as an independent cross-check, not to rewrite
    the frozen NCBI mapping without a new acquisition version.

# ---------------------------------------------------------------------------
# Output artifacts — outside Git vs inside Git
# ---------------------------------------------------------------------------
outputs:
  external_bundle:
    environment_variable: RAPTOR_TSC2_CDNA_PROJECTOR_ROOT
    default_root_hint: ~/raptor-data/external/tsc2-cdna-projector
    run_name: tsc2-clipe-cdna-spdi-projector-2026-09-12
    bundle_id: tsc2-clipe-cdna-spdi-projector-2026-09-12
    create_only: true
    symlink_safe: true
    manifest_last: true
    outside_git: true
    artifacts:
      raw_responses:
        relative_dir: raw/
        per_row_files:
          - 'raw/step1/{source_row:04d}-attempt-{attempt:02d}-contextuals.json'
          - 'raw/step2/{source_row:04d}-attempt-{attempt:02d}-canonical_representative.json'
          - 'raw/step3/{source_row:04d}-attempt-{attempt:02d}-hgvs.json'  # optional
        also_allowed: >-
          A single JSONL of raw envelopes is acceptable if it preserves exact
          response body bytes (base64 or utf-8 with explicit media_type) plus
          requested_url, final_url, http_status, fetched_at, sha256.
        purpose: offline replay cache (PRD-02 R-A11 external-API rule)
      mapping_jsonl:
        relative_path: mapping/mavedb_clipe_nm000548_5_to_nc000016_10.jsonl
        schema: raptor.external.clipe_cdna_spdi_mapping_row.v1
        row_count: 208
        fields_required:
          - schema
          - source_id          # mavedb_clipe
          - source_row
          - source_record_id   # urn:mavedb:00001201-a-1#N
          - gene               # TSC2
          - transcript         # NM_000548.5
          - hgvs_c
          - hgvs_nt_source     # bare c. from CSV
          - tx_spdi            # nullable on failure
          - genomic_spdi       # nullable on failure
          - hgvs_g             # nullable
          - assembly           # GRCh38 when verified else null
          - genomic_accession  # NC_000016.10 when verified else null
          - status             # status_vocabulary
          - fasta_deleted_observed  # nullable
          - error_detail       # sanitized; no secrets
          - step1_body_sha256
          - step2_body_sha256
          - variant_shape      # SNV | DELINS
        success_requires:
          - status == PROJECTED_FASTA_VERIFIED
          - genomic_spdi matches ^NC_000016\.10:\d+:[ACGT]+:[ACGT]+$
          - fasta_deleted_observed == deleted_sequence
      request_log:
        relative_path: logs/request_index.jsonl
        fields:
          - source_row
          - step
          - attempt
          - requested_url
          - final_url
          - http_status
          - body_sha256
          - elapsed_ms
          - retry_category
          - terminal
          - retry_exhausted
        redaction: strip any api_key/tool/email query values
      bundle_manifest:
        relative_path: bundle_manifest.json
        schema: raptor.external.clipe_cdna_spdi_projector_bundle.v1
        written_last: true
        content_hash_basis: >-
          SHA-256 of UTF-8 canonical JSON with sorted keys; omit top-level
          content_hash field when hashing.
        must_include:
          - input scores sha256 + byte_length + row_count
          - reference fasta sha256
          - endpoint pins + min_interval_seconds
          - per-artifact sha256/byte_length
          - status_counts
          - shape_counts
          - success_count / failure_count
          - boundaries.network = operator_only
          - boundaries.clinical_use = forbidden

  committed_summary:
    path: data/census/tsc2_clipe_cdna_spdi_projector_pilot_2026-09-12.json
    schema: raptor.external.clipe_cdna_spdi_projector_summary.v1
    inside_git: true
    contains:
      - external bundle_id + manifest content_hash
      - input scores sha256 + reference sha256
      - endpoint sequence pin
      - total_rows, success_count, failure_count
      - status_counts, shape_counts (SNV/DELINS)
      - request_budget_observed (approx counts, wall clock)
      - pilot_uncertainties residual after run
      - boundary flags for clinical_use and evidence_strength_use
    excludes:
      - per-row genomic_spdi / hgvs_c / hgvs_g strings
      - raw NCBI JSON bodies
      - scores
      - patient information
      - clinical labels or evidence strengths

  optional_committed_canary_fixture:
    path: tests/fixtures/clipe_cdna_spdi_canary.yaml
    inside_git: true
    max_rows: 8
    purpose: >-
      Tiny independently reviewed expected mappings for offline unit tests of
      the parser/validator (AC3-style). MUST be hand-curated from the frozen
      external mapping after pilot, not generated by code under test at assert
      time. Must include ≥1 SNV and ≥1 delins.
    excludes_full_208: true

# ---------------------------------------------------------------------------
# Relationship to functional-identity normalization
# ---------------------------------------------------------------------------
downstream_identity_normalization:
  current_blocker: >-
    raptor.external.normalized_functional_row.v1 GENOMIC_SPDI_VERIFIED currently
    cross-checks spdi only against an SNV-shaped hgvs_g
    (NC_000016.10:g.<pos><base>><base>). The 47 delins require a contract
    extension (MNV/delins hgvs_g + multi-base SPDI) before those rows can flip
    from TRANSCRIPT_ONLY_PROJECTOR_REQUIRED to GENOMIC_SPDI_VERIFIED inside the
    normalized functional bundle.
  acquisition_vs_identity_split: >-
    This acquisition slice freezes NCBI mappings for ALL 208 rows (SNV+delins).
    A separate identity-normalization amendment consumes the frozen mapping
    JSONL offline (no network), attaches genomic_spdi to cliPE rows, and
    extends the SNV-only invariant as needed. Acquisition success is not gated
    on that amendment landing in the same PR.
  forbidden: >-
    Do not mutate the 2026-09-11 functional-normalization bundle in place.
    Publish a new normalization run/bundle when identity is upgraded.

# ---------------------------------------------------------------------------
# Binding implementation surfaces
# ---------------------------------------------------------------------------
implementation:
  package: src/raptor/external/tsc2_cdna_projector/
  responsibilities:
    - build percent-encoded URLs (no I/O)
    - assert_allowed_final_url for variation/v0 patterns
    - parse step1/step2/step3 JSON against schemas
    - construct SPDI strings
    - FASTA deleted-allele check via injected reference handle
    - deterministic mapping JSONL + manifest builders
    - fetch_with_transport(injected) only — same pattern as tsc2_sources.endpoint
  operator: scripts/fetch_tsc2_clipe_cdna_spdi_projector.py
  config: configs/external/tsc2_clipe_cdna_spdi_projector_v1.yaml
  tests: tests/external/test_tsc2_clipe_cdna_spdi_projector.py
  test_strategy: >-
    Offline only: replay frozen raw JSON fixtures through the library; never
    hit the network in CI. Include negative fixtures for 400 invalid HGVS,
    non-NC genome, FASTA mismatch, ambiguous spdis, and binding violations.

