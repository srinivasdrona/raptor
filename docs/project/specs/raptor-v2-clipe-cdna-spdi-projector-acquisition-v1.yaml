# RAPTOR v2 — bounded acquisition contract for projecting MaveDB TSC2 cliPE
# c.HGVS (NM_000548.5) to canonical GRCh38 genomic SPDI (NC_000016.10) via the
# NCBI Variation Services API.
#
# Status: APPROVED_BUILD / binding design authority for this bounded slice.
# This file does NOT authorize library network I/O, ACMG evidence, classification,
# PS3/BS3, packet promotion, or clinical use.
#
# Empirical grounding (operator probes, 2026-09-11T18:44Z–18:47Z UTC window):
# live GETs against api.ncbi.nlm.nih.gov/variation/v0 for SNV and delins shapes
# drawn from the frozen cliPE scores set. See `empirical_grounding` below.

schema: raptor.project.spec.v1
spec_id: raptor-v2-clipe-cdna-spdi-projector-acquisition-v1
spec_version: 1.0.5
status: APPROVED_BUILD
created_at: '2026-09-12'
owner: human-terminal-authority
branch: feature/raptor-v2-identity-crosswalk-v1
stacked_on:
  - spec_id: raptor-v2-missense-source-ingestion-v1
    role: supplies frozen mavedb_clipe scores + metadata pins
  - spec_id: raptor-v2-functional-identity-normalization-v1
    role: defines TRANSCRIPT_ONLY_PROJECTOR_REQUIRED gap this acquisition closes

objective: >-
  Define a safe, bounded, operator-only acquisition contract that projects every
  row of the frozen MaveDB TSC2 cliPE score-set (urn:mavedb:00001201-a-1; 208
  rows) from NM_000548.5 c.HGVS to a single canonical GRCh38 genomic SPDI on
  NC_000016.10 using NCBI Variation Services, then independently validates each
  returned deleted allele against the pinned NC_000016.10 FASTA. Emit a create-only
  external response cache + mapping JSONL + manifest outside Git, and a compact
  aggregate committed summary inside Git. Library code performs zero network I/O.

workflow:
  planner: GPT-5.6-Sol
  red_tests: GPT-5.3-Codex
  builder: Claude-Sonnet-5
  checker: GPT-5.6-Terra-xhigh
  integrator: GPT-5.6-Sol
  terminal_authority: human-owner

non_goals:
  - ACMG / VCEP evidence assignment (no PS3, BS3, PP3, BP4, or strength claims)
  - clinical classification, pathogenicity, or benignity inference
  - abundance / activity / cliPE score transformation or calibration
  - ClinVar, VUS, prospective-holdout, or Atlas overlap computation
  - VAMP-seq protein→nucleotide crosswalk (separate gap)
  - SGE reference-mismatch adjudication (separate gap)
  - live network calls from any raptor.* library module
  - use of the unstable /hgvs/batch/contextuals endpoint
  - guessing genomic coordinates by arithmetic without NCBI + FASTA validation
  - treating transcript SPDI or GRCh37 NC_000016.9 as the join key

why_now: >-
  Functional-identity normalization pilot 2026-09-11 left all 208 cliPE rows in
  identity_state=TRANSCRIPT_ONLY_PROJECTOR_REQUIRED / unresolved_reason=
  CDNA_PROJECTOR_REQUIRED with spdi=null. The explicit follow-on is to inject a
  real NM_000548.5 cDNA-to-genome projector. This spec freezes the acquisition
  boundary for that projector.

