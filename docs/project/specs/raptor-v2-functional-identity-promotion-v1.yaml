implementation:
  package: src/raptor/external/tsc2_identity_promotion/
  operator: scripts/promote_tsc2_functional_identities.py
  config: configs/external/tsc2_functional_identity_promotion_v1.yaml
  tests: tests/external/test_tsc2_functional_identity_promotion.py
  modified_existing:
    - src/raptor/external/tsc2_functional/model.py
  network_boundary: forbidden
  publication: reuse hardened no-clobber external bundle primitive

acceptance_criteria:
  - id: FP-01
    rule: All three input manifests and five required artifact bytes match exact pins before joins.
  - id: FP-02
    rule: No library or operator network I/O is permitted.
  - id: FP-03
    rule: Existing normalized rows and crosswalk rows are revalidated against their exact schemas.
  - id: FP-04
    rule: cliPE join is exact on source_row/source_record_id/hgvs_c and promotes 208/208 rows.
  - id: FP-05
    rule: VAMP join is exact on source_row/full protein token and conserves 9,253 rows.
  - id: FP-06
    rule: VAMP statuses map exactly to 9,050 verified, 57 length-mismatch and 146 archive-absent rows.
  - id: FP-07
    rule: SGE rows are copied without changing any semantic field.
  - id: FP-08
    rule: Verified row validation supports exact SNV and equal-length multi-base delins only.
  - id: FP-09
    rule: SPDI-to-hgvs_g conversion is deterministic and cross-validated by the row model.
  - id: FP-10
    rule: Every source row key is unique and all 9,914 rows are conserved.
  - id: FP-11
    rule: Expected state/reason/kind/source/overlap counts match before publication.
  - id: FP-12
    rule: Output JSONL and manifest hashes are deterministic and byte-sensitive.
  - id: FP-13
    rule: External publication is create-only, symlink-safe, race-safe and outside Git.
  - id: FP-14
    rule: The committed summary is aggregate-only and binds to the output manifest hash.
  - id: FP-15
    rule: No output assigns clinical status, $PS3$/$BS3$ or evidence strength.
  - id: FP-16
    rule: >-
      Every unresolved artifact-path component is checked for symlink/reparse
      status before resolution, including links whose target remains inside the
      run directory.
  - id: FP-17
    rule: >-
      Manifest artifacts are exactly the three pinned output IDs/paths and
      boundaries are exactly network/clinical/evidence-strength forbidden;
      arbitrary manifest keys cannot flow into the committed summary.
  - id: FP-18
    rule: >-
      Count dictionaries contain non-negative integers and source-overlap
      values satisfy pairwise/triple bounds plus inclusion-exclusion equality
      for verified_unique_spdi.

failure_cases:
  - any input manifest/artifact hash drift
  - schema or source-row conservation drift
  - cliPE mapping not fully successful or join mismatch
  - VAMP unknown/reference-mismatch status or join mismatch
  - verified SPDI not on NC_000016.10
  - invalid SNV/delins hgvs_g derivation
  - cross-source overlap count drift
  - attempted mutation/overwrite of a prior bundle

follow_on:
