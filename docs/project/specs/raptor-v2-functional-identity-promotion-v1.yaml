row_contract_amendment:
  schema: raptor.external.normalized_functional_row.v1
  rule: >-
    Preserve the existing exact 17-field row shape. Extend only the allowed
    state/reason vocabulary and verified hgvs_g/SPDI cross-check.
  add_identity_states:
    - GENOMIC_CROSSWALK_LENGTH_MISMATCH
    - PROTEIN_ONLY_ARCHIVE_CROSSWALK_ABSENT
  add_unresolved_reasons:
    - SOURCE_GENOMIC_INTERVAL_NOT_EQUIVALENT_TO_CDNA_REPLACEMENT
    - PROTEIN_VARIANT_NOT_IN_ARCHIVE
  state_reason_bindings:
    GENOMIC_CROSSWALK_LENGTH_MISMATCH: SOURCE_GENOMIC_INTERVAL_NOT_EQUIVALENT_TO_CDNA_REPLACEMENT
    PROTEIN_ONLY_ARCHIVE_CROSSWALK_ABSENT: PROTEIN_VARIANT_NOT_IN_ARCHIVE
  verified_spdi:
    allowed_shapes: [SNV, EQUAL_LENGTH_DELINS]
    snv_hgvs_g: 'NC_000016.10:g.<pos1><ref>><alt>'
    delins_hgvs_g: 'NC_000016.10:g.<start1>_<end1>delins<inserted>'
    invariants:
      - SPDI accession is NC_000016.10
      - SPDI deleted and inserted sequences are non-empty uppercase ACGT
      - SNV hgvs_g position equals SPDI position + 1 and ref/alt agree
      - DELINS hgvs_g start equals SPDI position + 1
      - DELINS hgvs_g end equals start + len(SPDI deleted) - 1
      - DELINS inserted sequence equals SPDI inserted sequence
      - DELINS deleted and inserted lengths are equal
  spdi_to_hgvs_g:
    rule: >-
      Derive hgvs_g deterministically from the already verified mapping SPDI;
      never call a network service. One-base substitutions use g.<pos><ref>><alt>.
      Multi-base equal-length replacements use g.<start>_<end>delins<inserted>.

join_rules:
  clipe:
    normalized_source_id: mavedb_clipe
    join_key: [source_row, source_record_id]
    mapping_requirements:
      - mapping source_row is contiguous 1..208
      - mapping source_record_id equals normalized row source_record_id
      - mapping hgvs_c equals normalized row hgvs_c
      - every mapping status is PROJECTED_FASTA_VERIFIED
    promoted_fields:
      assembly: GRCh38
      transcript: NM_000548.5
      spdi: mapping.genomic_spdi
      hgvs_g: derived from mapping.genomic_spdi
      identity_state: GENOMIC_SPDI_VERIFIED
      unresolved_reason: null
    expected:
      input_rows: 208
      promoted_rows: 208
      unresolved_rows: 0
  vamp:
    normalized_source_id: igvf_vamp_seq
    join_key: [source_row, protein_variant]
    protein_variant_rule: >-
      normalized protein_accession + ':' + normalized hgvs_p must equal the
      crosswalk protein_variant exactly.
    status_mapping:
      CROSSWALK_SPDI_VERIFIED:
        assembly: GRCh38
        transcript: NM_000548.5
        hgvs_c: "'NM_000548.5:' + crosswalk.hgvs_c"
        spdi: crosswalk.genomic_spdi
        hgvs_g: derived from crosswalk.genomic_spdi
        identity_state: GENOMIC_SPDI_VERIFIED
        unresolved_reason: null
      SOURCE_COORDINATE_CDNA_LENGTH_MISMATCH:
        assembly: null
        transcript: NM_000548.5
        hgvs_c: "'NM_000548.5:' + crosswalk.hgvs_c"
        spdi: null
        hgvs_g: null
        identity_state: GENOMIC_CROSSWALK_LENGTH_MISMATCH
        unresolved_reason: SOURCE_GENOMIC_INTERVAL_NOT_EQUIVALENT_TO_CDNA_REPLACEMENT
      ARCHIVE_CROSSWALK_ABSENT:
        assembly: null
        transcript: null
        hgvs_c: null
        spdi: null
        hgvs_g: null
        identity_state: PROTEIN_ONLY_ARCHIVE_CROSSWALK_ABSENT
        unresolved_reason: PROTEIN_VARIANT_NOT_IN_ARCHIVE
      SOURCE_COORDINATE_REFERENCE_MISMATCH:
        rule: >-
          Allowed by the source crosswalk schema but pinned to count zero.
          Any occurrence aborts this promotion run rather than being silently
          mapped onto the SGE-specific reference-mismatch state.
    expected:
      input_rows: 9253
      promoted_rows: 9050
      length_mismatch_rows: 57
      archive_absent_rows: 146
      reference_mismatch_rows: 0
  sge:
    normalized_source_id: igvf_sge
    rule: >-
      Copy every row byte-equivalently at the semantic field level. Revalidate
      the row contract; do not alter its identity state, score or source order.
    expected:
      input_rows: 453
      verified_rows: 423
      reference_mismatch_rows: 27
      reference_controls: 3

output:
  external_bundle:
    environment_variable: RAPTOR_TSC2_FUNCTIONAL_IDENTITY_PROMOTION_ROOT
    default_root: ~/raptor-data/external/tsc2-functional-identity-promotion
    run_name: tsc2-functional-identity-promotion-2026-09-14
    bundle_id: tsc2-functional-identity-promotion-2026-09-14
    manifest_schema: raptor.external.tsc2_functional_identity_promotion_bundle.v1
    artifacts:
      - normalized/mavedb_clipe.jsonl
      - normalized/igvf_vamp_seq.jsonl
      - normalized/igvf_sge.jsonl
      - bundle_manifest.json
    create_only: true
    symlink_safe: true
    manifest_last: true
  committed_summary:
    path: data/census/tsc2_functional_identity_promotion_2026-09-14.json
    schema: raptor.external.tsc2_functional_identity_promotion_summary.v1
    contains:
      - all three input manifest hashes
      - output manifest and artifact hashes
      - source row counts
      - identity state and unresolved reason counts
      - verified observations and unique-SPDI counts
      - pairwise and triple source overlap counts
      - explicit clinical/evidence-strength forbidden boundaries
    excludes:
      - per-row identities or HGVS/SPDI
      - raw scores or functional classes
      - clinical labels or evidence strengths

