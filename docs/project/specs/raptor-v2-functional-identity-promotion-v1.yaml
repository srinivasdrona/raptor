schema: raptor.project.spec.v1
spec_id: raptor-v2-functional-identity-promotion-v1
spec_version: 1.0.1
status: APPROVED_BUILD
created_at: '2026-09-14'
owner: human-terminal-authority
branch: feature/raptor-v2-functional-identity-promotion-v1
stacked_on:
  branch: feature/raptor-v2-identity-crosswalk-v1
  commit: f4e488aea5a1af8d0fa3bad1788b803e04a8b0d5

objective: >-
  Consume the frozen cliPE and VAMP crosswalk bundles into a new immutable
  $TSC2$ functional-normalization run. Upgrade only exact, bundle-verified
  mappings to $\text{GRCh38}$ genomic SPDI, extend row validation to
  reference-verified equal-length multi-base delins, preserve every unresolved
  row with an explicit state, and commit only aggregate coverage and
  cross-assay overlap counts.

non_goals:
  - mutation of any prior external bundle or committed summary
  - source score transformation, threshold reproduction or calibration
  - ClinVar, VUS, prospective-holdout or Atlas overlap
  - $PS3$/$BS3$, classification or evidence-strength assignment
  - heuristic repair of 57 VAMP cross-exon coordinate rows
  - inference for 146 VAMP rows absent from the archived crosswalk
  - adjudication of 27 SGE reference-mismatch rows
  - network access

workflow:
  planner: GPT-5.6-Sol
  red_tests: GPT-5.3-Codex
  builder: Claude-Sonnet-5
  checker: GPT-5.6-Terra-xhigh
  integrator: GPT-5.6-Sol
  terminal_authority: human-owner

