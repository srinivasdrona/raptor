schema: raptor-model-role-tournament-run-protocol-v1
protocol_id: model-role-tournament-2026-08
version: 1.0.1
status: REFROZEN_BEFORE_FIRST_VALID_CANDIDATE_RUN
corpus: CORPUS_MANIFEST.yaml
scoring: SCORING.md
phase_1:
  name: individual_role_evaluation
  rounds:
    - id: role-screen
      scenarios: [registry-bridge, snapshot-publisher, workspace-boundary]
      independent_runs_per_model_scenario: 3
      advance: top_2_or_3_per_role_after_hard_gates
    - id: role-finalist
      corpus: expanded_hidden_holdout
      independent_runs_per_model_scenario: 5
  pools:
    planner:
      - {display: Claude Opus 5, model_id: claude-opus-5}
      - {display: GPT-5.6 Sol, model_id: gpt-5.6-sol}
      - {display: GPT-5.6 Terra, model_id: gpt-5.6-terra}
      - {display: Gemini 3.7 Flash, model_id: gemini-3.7-flash}
      - {display: Grok 4.6, model_id: grok-4.6}
    test_author:
      - {display: Gemini 3.7 Flash, model_id: gemini-3.7-flash}
      - {display: MAI-Code-1.1-Flash, model_id: mai-code-1.1-flash}
      - {display: GPT-5.3-Codex, model_id: gpt-5.3-codex}
      - {display: Claude Opus 5, model_id: claude-opus-5}
    doer:
      - {display: Claude Sonnet 5, model_id: claude-sonnet-5}
      - {display: GPT-5.3-Codex, model_id: gpt-5.3-codex}
      - {display: GPT-5.6 Terra, model_id: gpt-5.6-terra}
      - {display: MAI-Code-1.1-Flash, model_id: mai-code-1.1-flash}
    checker:
      - {display: GPT-5.4, model_id: gpt-5.4}
      - {display: GPT-5.6 Sol, model_id: gpt-5.6-sol}
      - {display: Claude Opus 5, model_id: claude-opus-5}
      - {display: Grok 4.6, model_id: grok-4.6}
      - {display: Gemini 3.7 Flash, model_id: gemini-3.7-flash}
phase_2:
  name: finalist_stack_evaluation
  entry: phase_1_role_finalists_only
  constraints:
    - test_author_family_must_differ_from_doer_family
    - checker_family_must_differ_from_doer_family
    - reduced_family_diversity_requires_explicit_owner_decision
  independent_runs_per_stack_task: 5
execution:
  candidate_workspace_root: 'D:\AIProjects\raptor-benchmark-runs'
  timeout_seconds: 1800
  network_access: forbidden
  candidate_scope: assigned_workspace_only
  preserve_failed_runs: true
  candidate_prompt: CANDIDATE_PROMPT.md
  evaluator_visibility: embargoed_until_all_candidate_runs_frozen
  scoring_visibility: public_before_runs
invalidation_policy:
  - A task/evaluator ambiguity discovered before result use invalidates the
    complete paired cell, not only affected models.
  - Preserve candidate artifacts, original locks, preliminary machine output
    and the reason for invalidation.
  - Correct and refreeze the public corpus and hidden evaluator before rerun.
  - Never compare or publish invalidated scores as model performance.
telemetry:
  required:
    - model_id
    - agent_id
    - role
    - scenario
    - run_number
    - start_time
    - finish_time
    - finish_reason
    - input_tokens
    - output_tokens
    - reasoning_tokens
    - total_nano_aiu
    - duration_ms
    - human_intervention_minutes
